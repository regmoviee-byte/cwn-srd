 Main Action and your Move action to move up to twice your normal movement rate in a straight line, making a melee or thrown ranged attack at the end of it with a +2 bonus to hit. You must be able to charge at least 3 meters to build up sufficient momentum and you suffer a -2 penalty to your Armor Classes until the end of the round.\nScreen an Ally (Move Action): Move up to your normal movement rate to get adjacent to an ally. You then physically block attacks against them until the start of your next turn, provided they remain within 3 meters of you. Enemies who attack your ward must make a successful opposed combat skill check against you using either Str or Dex and the most applicable combat skill. If the enemy succeeds, their attack targets your ward normally. If you succeed, their attack instead targets you. You can screen against a number of attackers each round equal to your highest combat skill; thus, you need at least level-1 in a combat skill to successfully screen. Multiple defenders can screen the same target, in which case the opposed skill check is compared to all defenders and targets the worst-rolling successful defender. You can only screen against attacks you could feasibly physically parry or body-block; gunfire cannot be blocked without integral cyber armor.\nTotal Defense (Instant Action): Give up your Main Action to focus entirely on dodging and evading incoming perils. Your Melee and Ranged Armor Classes increase by +2 and you become immune to Shock until the start of your next turn, including the otherwise-unavoidable damage from a Swarm Attack. You cannot take this action if you have already spent your Main Action for the round.\nRun (Move Action): Move your normal movement rate in combat, which is 10 meters for an ordinary human. If you start your movement adjacent to an armed melee combatant, they get a free melee attack against you as you flee. To avoid this, you must make a Fighting Withdrawal first. Movement taken as part of a hyper-accelerated bonus action such as an Enhanced Reflexes cyberware activation does not require a Fighting Withdrawal.\nMake a Fighting Withdrawal (Main Action): Disengage from an adjacent melee attacker, allowing you to move away from them without incurring a free attack as you retreat. You do not actually leave melee range with this action alone, and your enemy can simply re-engage you next round if you don't actually take a move action to retreat.\nUse a Skill (Main Action): Perform first aid on a downed comrade, trigger a cyber hack, or otherwise use a skill that wouldn't normally take more than six seconds.\nReady or Stow an Item (Main Action): A character can Ready an item for use from their pack or stowage or Stow it, as per the encumbrance rules in section 2.9.0. Sheathing or holstering a Readied weapon without actually Stowing it does not require this action, though the GM may disallow rapid weapon swaps if they start to become implausible.\nReload a Weapon (Main Action): Reload a firearm with a Readied magazine. Modern bows and crossbows may be reloaded as an On Turn action if the shooter has at least Shoot-1 skill; otherwise it's a Move action to nock a new arrow.\nDrop an Item (Instant Action): Drop an item you are holding. This may be done at any time to free up a hand.\nPick up an Item (Move Action): Scoop up a dropped item within melee range, leaving it Readied in your hand.\nStand Up (Move Action): Rise from a prone position, picking up any dropped items as you do so.\nGo Prone (On Turn Action): Fall prone, applying a -2 penalty to ranged attacks against you and a +2 bonus to melee-range attacks against you. Your normal movement rate is halved while you remain prone.\nHold An Action (Move Action): Spend your Move action to delay acting on your side's turn. You may trigger the rest of your turn's actions as an Instant action at any point until the end of the round, after which they are lost. If your held action is taken in response to someone else's action, yours resolves first.","ru":"Перечисленные ниже действия — лишь некоторые из самых частых в бою.\n**Атаковать в ближнем бою (Основное действие):** Атаковать цель на дистанции ближнего боя безоружной атакой или оружием ближнего боя. Такое оружие использует навык Кулак или Клинок, в зависимости от типа атаки.\n**Атаковать на расстоянии (Основное действие):** Атаковать цель из огнестрельного оружия, лука или метательным оружием. Для таких атак используется навык Стрельба, хотя для метательного оружия можно по желанию взять Клинок или Атлетику. Если на дистанции ближнего боя есть нападающий враг, одноручное огнестрельное и метательное оружие получают штраф -4 к попаданию, а из винтовок и двуручного дальнобойного оружия вообще нельзя стрелять.\n**Атаковать навскидку (Мгновенное действие):** Мгновенным действием откажись от своего Основного действия и выполни Атаковать в ближнем бою или Атаковать на расстоянии со штрафом -4 к попаданию. Так как это Мгновенное действие, Атаковать навскидку можно даже не в свой ход, но ты не должен был к этому моменту потратить своё Основное действие в этом раунде. Только хорошо обученные и дисциплинированные NPC достаточно собранны, чтобы Атаковать навскидку.\n**Атаковать в свалке (Основное действие):** Выбери врага в пределах дистанции своего оружия и совершай это действие, пока по этой цели в этом раунде не выполнят Атаковать в свалке до четырёх союзников. В этот момент или в любой момент до него один из этих нападающих может выполнить по цели Атаковать в ближнем бою или Атаковать на расстоянии с бонусом +2 к попаданию и +1 к урону за каждого другого нападающего, максимум +6 к попаданию и +3 к урону. Этот дополнительный урон не добавляется к Шоку атаки и не может поднять урон выше обычного максимума. Однако любой Шок от этой атаки применяется всегда — даже если КЗщ цели слишком высок, она использует щит или у неё есть способность, делающая её невосприимчивой к Шоку; урон Атаки в свалке — это не совсем Шок, а отражение неизбежных опасностей положения, когда тебя облепила куча вооружённых врагов.\n**Рывок (Особое действие):** Потрать и Основное действие, и Действие перемещения, чтобы переместиться по прямой на удвоенную обычную скорость перемещения и в конце совершить атаку ближнего боя или метательную дальнобойную атаку с бонусом +2 к попаданию. Ты должен иметь возможность разогнаться не меньше чем на 3 метра, чтобы набрать нужный разгон, и получаешь штраф -2 к своим Классам защиты до конца раунда.\n**Прикрыть союзника (Действие перемещения):** Переместись на свою обычную скорость перемещения, чтобы встать вплотную к союзнику. После этого ты физически перекрываешь атаки по нему до начала своего следующего хода, пока он остаётся в пределах 3 метров от тебя. Враги, атакующие твоего опекаемого, должны сделать успешную встречную проверку боевого навыка против тебя, используя Сил или Лов и наиболее подходящий боевой навык. Если враг преуспел, его атака нормально бьёт по опекаемому. Если преуспел ты, его атака вместо этого нацеливается на тебя. За раунд ты можешь прикрывать от числа атакующих, равного твоему высшему боевому навыку; то есть для успешного прикрытия нужен хотя бы уровень-1 в боевом навыке. Одну цель могут прикрывать несколько защитников — тогда встречная проверка навыка сравнивается со всеми защитниками, и атака нацеливается на успешного защитника с худшим броском. Прикрывать можно только от атак, которые ты реально мог бы физически отбить или принять на себя телом; огонь из оружия нельзя перекрыть без встроенной кибер-брони.\n**Полная защита (Мгновенное действие):** Откажись от Основного действия, чтобы полностью сосредоточиться на уклонении от летящих в тебя опасностей. Твои Классы защиты ближнего и дальнего боя растут на +2, и ты становишься невосприимчив к Шоку до начала своего следующего хода — включая обычно неотвратимый урон от Атаки в свалке. Нельзя совершить это действие, если ты уже потратил своё Основное действие в этом раунде.\n**Бежать (Действие перемещения):** Переместись на свою обычную скорость перемещения в бою — для обычного человека это 10 метров. Если ты начинаешь перемещение вплотную к вооружённому бойцу ближнего боя, он получает бесплатную атаку ближнего боя по тебе, пока ты убегаешь. Чтобы этого избежать, надо сначала совершить Боевой отход. Перемещение в рамках сверхускоренного бонусного действия — например, от активации кибернетики «Улучшенные рефлексы» — Боевого отхода не требует.\n**Боевой отход (Основное действие):** Разорви сцепку с находящимся вплотную атакующим ближнего боя — это позволит тебе отойти от него, не получив бесплатной атаки при отступлении. Само это действие ещё не выводит тебя за дистанцию ближнего боя, и враг может просто снова сойтись с тобой в следующем раунде, если ты не потратишь действие перемещения на отход.\n**Применить навык (Основное действие):** Оказать первую помощь упавшему товарищу, запустить взлом кибера или иначе применить навык, на который обычно уходит не больше шести секунд.\n**Взять или уложить предмет (Основное действие):** Персонаж может перевести предмет в готовность из своего рюкзака или укладки либо уложить его — по правилам загруженности из раздела 2.9.0. Убрать оружие в готовности в ножны или в кобуру, не укладывая его при этом, можно и без этого действия, хотя Мастер может запретить быстрые смены оружия, если они начнут выглядеть неправдоподобно.\n**Перезарядить оружие (Основное действие):** Перезаряди огнестрельное оружие магазином в готовности. Современные луки и арбалеты можно перезарядить Действием в свой ход, если у стрелка есть хотя бы Стрельба-1; иначе наложить новую стрелу — это Действие перемещения.\n**Бросить предмет (Мгновенное действие):** Брось предмет, который держишь. Это можно сделать в любой момент, чтобы освободить руку.\n**Поднять предмет (Действие перемещения):** Подхвати упавший предмет в пределах дистанции ближнего боя — он оказывается в готовности у тебя в руке.\n**Встать (Действие перемещения):** Поднимись из положения лёжа, попутно подобрав любые выпавшие предметы.\n**Лечь (Действие в свой ход):** Упади на землю: дальнобойные атаки по тебе получают штраф -2, а атаки с дистанции ближнего боя — бонус +2. Пока ты лежишь, твоя обычная скорость перемещения уменьшена вдвое.\n**Отложить действие (Действие перемещения):** Потрать своё Действие перемещения, чтобы отложить действия в ход своей стороны. Ты можешь запустить остальные действия своего хода Мгновенным действием в любой момент до конца раунда, после чего они теряются. Если твоё отложенное действие совершается в ответ на действие кого-то другого, твоё разрешается первым."},
{"n":"2.4.5","l":3,"te":"Combat Attack Rolls","tr":"Броски атаки в бою","en":"When an assailant makes an attack, they roll 1d20 and add their base attack bonus, the weapon's relevant attribute modifier, and their relevant combat skill level. If they lack even level-0 in the appropriate combat skill, they apply a -2 penalty to the roll. If the total is equal or greater than the target's relevant Melee or Ranged Armor Class, they hit. If less, they miss.\nEvery weapon listed in section 3.4.0 is listed as using one or more attributes, such as either Str or Dex for a knife. The attacker may choose either attribute for modifying the weapon's attack and damage rolls.","ru":"Когда нападающий атакует, он бросает 1d20 и прибавляет свой базовый бонус атаки, модификатор подходящей для оружия характеристики и свой подходящий уровень боевого навыка. Если у него нет даже уровня-0 в нужном боевом навыке, он получает штраф -2 к броску. Если сумма равна подходящему Классу защиты цели — ближнего или дальнего боя — или больше него, это попадание. Если меньше — промах.\nДля каждого оружия из раздела 3.4.0 указана одна или несколько характеристик, например Сил или Лов для ножа. Атакующий может выбрать любую из них для модификации бросков атаки и урона этим оружием."},
{"n":"2.4.5.1","l":4,"te":"NPC Attack Rolls","tr":"Броски атаки NPC","en":"NPCs usually do not have attribute modifiers or skill levels. Instead, the attack bonus of a trained NPC combatant is usually equal to their hit dice, often with an additional bonus to reflect particularly good training or talent.","ru":"У NPC обычно нет модификаторов характеристик и уровней навыков. Вместо этого бонус атаки обученного бойца-NPC обычно равен его Костям здоровья, часто с дополнительным бонусом, отражающим особенно хорошую подготовку или талант."},
{"n":"2.4.5.2","l":4,"te":"Attack Roll Modifiers","tr":"Модификаторы броска атаки","en":"Some common situations can modify an attack roll, granting a bonus or penalty. GMs may add others depending on the situation. Attackers with the Gunlink cybersystem ignore 2 points of penalty applied by cover or concealment, and do not suffer penalties for long range firing.\n\n\nModifier        Circumstance\n-2                The target is prone and not in melee range.\n+2                The target is prone and adjacent.\n-2                Your target is past your gun's normal range, up to its maximum long range.\n-4                You are prone and trying to make a melee attack.\n-2                The target is at least half behind cover.\n-4                The target is almost complete behind cover.\n-4                You are making a thrown attack while in melee with someone.\n-4                You are shooting a one-handed gun while in melee with someone.\nN/A                You are trying to shoot a two-handed gun while in melee with someone.\n-4                You are shooting at a target you can't see but you know where they are.\nN/A                You are shooting at a target you can't see and don't know their exact position.","ru":"Некоторые типичные ситуации могут изменить бросок атаки, давая бонус или штраф. Мастер может добавить и другие, в зависимости от обстановки. Атакующие с кибер-системой «Ганлинк» игнорируют 2 пункта штрафа от укрытия или маскировки и не получают штрафов за стрельбу на дальнюю дистанцию.\n\n| Модификатор | Обстоятельство |\n|---|---|\n| -2 | Цель лежит и не на дистанции ближнего боя. |\n| +2 | Цель лежит и находится вплотную. |\n| -2 | Твоя цель дальше обычной дистанции твоего оружия, но в пределах его максимальной дальней дистанции. |\n| -4 | Ты лежишь и пытаешься атаковать в ближнем бою. |\n| -2 | Цель как минимум наполовину за укрытием. |\n| -4 | Цель почти полностью за укрытием. |\n| -4 | Ты совершаешь метательную атаку, находясь в ближнем бою с кем-то. |\n| -4 | Ты стреляешь из одноручного оружия, находясь в ближнем бою с кем-то. |\n| — (невозможно) | Ты пытаешься выстрелить из двуручного оружия, находясь в ближнем бою с кем-то. |\n| -4 | Ты стреляешь в цель, которую не видишь, но знаешь, где она. |\n| — (невозможно) | Ты стреляешь в цель, которую не видишь и не знаешь её точного положения. |"},
{"n":"2.4.6","l":3,"te":"Damage, Trauma, and Shock","tr":"Урон, травма и Шок","en":"If an attack hits, it inflicts hit point damage equal to the weapon's damage die plus the weapon's relevant attribute modifier. Special weapon mods or cyberware may increase this damage.\nSome armor provides Damage Soak. Incoming weapon damage is subtracted from this Damage Soak first before it can reach the wearer. Once this Damage Soak is depleted it can give no further protection for the rest of the fight; it refreshes after combat is over to reflect a new chance for the wearer's luck to save them.","ru":"Если атака попадает, она наносит урон пунктам здоровья, равный кости урона оружия плюс соответствующий модификатор характеристики этого оружия. Особые моды оружия или кибернетика могут увеличить этот урон.\nНекоторая броня даёт Поглощение урона. Входящий урон от оружия сначала вычитается из этого Поглощения урона и только потом доходит до носителя. Как только Поглощение урона исчерпано, до конца боя оно больше не даёт защиты; оно восстанавливается после окончания боя — носителю снова выпадает шанс на то, что его спасёт удача."},
{"n":"2.4.6.1","l":4,"te":"Non-Lethal Damage","tr":"Нелетальный урон","en":"You may attack non-lethally with an appropriate weapon or unarmed attack. If so, do not roll the Trauma Die as explained below. Your attacks will only incapacitate the target if you reduce them to zero hit points.","ru":"Ты можешь атаковать нелетально подходящим оружием или безоружной атакой. В этом случае не бросай Кость травмы, как описано ниже. Твои атаки лишь обездвижат цель, если ты сведёшь её пункты здоровья к нулю."},
{"n":"2.4.6.2","l":4,"te":"Punch Weapon Damage","tr":"Урон оружия навыка Кулак","en":"If you are making a purely unarmed attack you may add your Punch skill to the damage. You may not add the skill to the damage done by Body Blade cyber or other artificial weaponry that uses the Punch skill.","ru":"Если ты совершаешь чисто безоружную атаку, ты можешь добавить к урону свой навык Кулак. Нельзя добавлять этот навык к урону от кибера Телесные клинки или другого искусственного оружия, использующего навык Кулак."},
{"n":"2.4.6.3","l":4,"te":"Trauma","tr":"Травма","en":"When you hit with a weapon or lethally-intended unarmed attack, roll the weapon's associated Trauma Die. If it equals or exceeds the victim's Trauma Target, which is usually 6 for a normal unarmored human, you have inflicted a Traumatic Hit.\nTraumatic Hits multiply the total damage of the hit by the weapon's listed Trauma Rating. Thus, if a shotgun with a x3 Trauma Rating would normally have done 9 damage in total, it instead does 27. If this damage or any later damage in the same fight reduces the victim to zero hit points, they risk a Major Injury as described in section 2.5.6.\nSome Edges, armor, or cyberware may increase a subject's Trauma Target. Some other abilities might grant a bonus to the Trauma Die roll. To speed the process, it's generally best to roll the Trauma Die at the same time as the attack or damage roll.\nDrones, vehicles, and other inanimate objects are immune to Traumatic Hits from weapons that could not reasonably inflict catastrophic structural damage on them. A shotgun may be sufficient to wreck a backpack-portable drone, while it is unlikely to inflict ruin on a car engine. The GM decides on applicability in ambiguous cases.","ru":"Когда ты попадаешь оружием или безоружной атакой, нацеленной на убийство, брось Кость травмы этого оружия. Если её результат равен Порогу травмы жертвы или превышает его — обычно это 6 для нормального человека без брони, — ты нанёс Травматичное попадание.\nТравматичное попадание умножает общий урон попадания на указанный Множитель травмы оружия. Так, если дробовик с Множителем травмы ×3 обычно нанёс бы в сумме 9 урона, вместо этого он наносит 27. Если этот урон или любой последующий урон в том же бою сведёт пункты здоровья жертвы к нулю, ей грозит Серьёзная травма, как описано в разделе 2.5.6.\nНекоторые Козыри, броня или кибернетика могут повысить Порог травмы цели. Иные способности могут давать бонус к броску Кости травмы. Чтобы ускорить дело, обычно лучше бросать Кость травмы одновременно с атакой или броском урона.\nДроны, транспорт и прочие неодушевлённые объекты не подвержены Травматичным попаданиям от оружия, которое не может нанести им катастрофических повреждений конструкции. Дробовика может хватить, чтобы разнести переносной дрон, но двигатель машины он вряд ли погубит. В спорных случаях применимость определяет Мастер."},
{"n":"2.4.6.4","l":4,"te":"Shock","tr":"Шок","en":"Some melee weapons inflict Shock on a missed attack roll. This damage reflects the inevitable harm a poorly-armored combatant suffers when engaging in armed combat. Shock for a weapon is recorded as a point value and target Armor Class, such as \"Shock 2/15\". If the wielder misses a target with this weapon that has a Melee Armor Class equal or less than the weapon's Shock rating, they suffer the listed amount of damage anyway. Thus, if that weapon were to miss a victim with Melee AC 13, it would still do 2 points of damage.\nSome attacks apply Shock on a miss regardless of the target's Armor Class. This benefit may be granted by certain abilities, or it may be part of a dangerous NPC's talents. Such Shock ratings are recorded with \"-\" as the affected AC, such as \"Shock 5/-\". This automatic Shock is still negated by cyber or abilities that grant a subject immunity to Shock.\nThe only modifiers that add to Shock damage are the wielder's relevant attribute modifier for the weapon and any damage bonuses that explicitly add to Shock. Thus, the Killing Blow Edge adds to Shock because it specifically says so, while a weapon mod that merely says it adds +2 damage would not.\nA person using a riot shield or other barrier can ignore the first source of Shock they would normally suffer in a round. Some other Foci or special actions such as Total Defense can also render a subject immune to Shock.\nDamage inflicted by Shock cannot cause a Traumatic Hit. An attack that hits can never do less damage than the Shock that would have been inflicted on a miss.","ru":"Некоторое оружие ближнего боя наносит Шок при промахе. Этот урон отражает неизбежный вред, который получает плохо защищённый боец, влезая в схватку с оружием. Шок оружия записывается как значение урона и целевой Класс защиты, например «Шок 2/15». Если владелец промахивается этим оружием по цели, у которой КЗщ ближнего боя равен указанному в Шоке значению или ниже, цель всё равно получает указанный урон. Так, если это оружие промахнётся по жертве с КЗщ бб 13, оно всё равно нанесёт 2 пункта урона.\nНекоторые атаки применяют Шок при промахе независимо от Класса защиты цели. Это могут давать отдельные способности, а может быть частью талантов опасного NPC. Такие значения Шока записываются с «–» вместо затрагиваемого КЗщ, например «Шок 5/–». Такой автоматический Шок всё равно отменяется кибером или способностями, дающими цели неуязвимость к Шоку.\nК урону Шока добавляются только соответствующий модификатор характеристики владельца для этого оружия и те бонусы к урону, которые прямо добавляются к Шоку. Так, Козырь Смертельный удар добавляется к Шоку, потому что это прямо сказано, а мод оружия, который просто даёт +2 урона, — нет.\nТот, кто использует штурмовой щит или иное заграждение, может игнорировать первый источник Шока, который он обычно получил бы в раунде. Некоторые другие Фокусы или особые действия вроде Полной защиты тоже могут сделать цель неуязвимой к Шоку.\nУрон, нанесённый Шоком, не может вызвать Травматичное попадание. Попавшая атака никогда не наносит меньше урона, чем нанёс бы Шок при промахе."},
{"n":"2.4.7","l":3,"te":"Special Combat Maneuvers","tr":"Особые боевые приёмы","en":"There are certain special maneuvers or activities that commonly arise in combat.","ru":"Есть несколько особых приёмов и действий, которые часто возникают в бою."},
{"n":"2.4.7.1","l":4,"te":"Shoving and Grappling","tr":"Толчок и захват","en":"To shove a target the attacker must make a successful melee attack. This attack does no damage, but forces an opposed Str/Exert or Str/Punch skill check. If the attacker wins, the target is shoved back up to 3 meters or knocked prone at the attacker's discretion.\nTo grapple, the attacker must make a successful unarmed melee attack while having both hands free. This attack does no damage but forces an opposed Str/Punch skill check. If the attacker wins, the victim is grappled. A grappled victim remains so until they take a Main Action to perform a successful opposed Str/Punch skill check against their assailant.\nWhile grappled, neither the assailant or the target can move from their location, nor can they fight with anything but unarmed attacks, including Body Blades cyber or similar body-mounted weaponry. At the end of each round, a grappled victim automatically suffers damage as if hit by their assailant's unarmed attack.\nIf the attacker wishes to move the grappled target, they must spend a Main Action and make an opposed Str/Punch skill check. On a success, they move the target up to 3 meters along with them or throw them 2 meters and leave them prone. On a loss or tie, the target escapes.\nAn attacker can grapple only one target at a time, but a defender can be grappled by multiple assailants, within reason. Any skill checks forced on a multiply-grappled target are compared against all assailants, and win only if all assailant rolls are beaten.\nThese rules assume both assailant and target are relatively human-sized. Grappling or shoving humanoid but substantially larger targets is done with a -2 penalty on all skill checks, while trying to handle quadrupeds or those only barely plausible to wrestle is done at a -4 penalty.","ru":"Чтобы толкнуть цель, атакующий должен успешно атаковать в ближнем бою. Эта атака не наносит урона, но вызывает встречную проверку Сил/Атлетика или Сил/Кулак. Если атакующий побеждает, цель отброшена назад на расстояние до 3 метров или сбита с ног — на выбор атакующего.\nЧтобы взять в захват, атакующий должен успешно провести безоружную атаку в ближнем бою, имея обе руки свободными. Эта атака не наносит урона, но вызывает встречную проверку Сил/Кулак. Если атакующий побеждает, жертва в захвате. Жертва остаётся в захвате, пока не потратит Основное действие на успешную встречную проверку Сил/Кулак против своего противника.\nПока держится захват, ни нападающий, ни цель не могут сдвинуться с места и не могут драться ничем, кроме безоружных атак, включая кибер Телесные клинки и подобное вживлённое в тело оружие. В конце каждого раунда жертва в захвате автоматически получает урон, как будто по ней попали безоружной атакой нападающего.\nЕсли нападающий хочет переместить цель в захвате, он должен потратить Основное действие и сделать встречную проверку Сил/Кулак. При успехе он перемещает цель вместе с собой на расстояние до 3 метров или бросает её на 2 метра, оставляя лежать. При проигрыше или ничьей цель освобождается.\nНападающий может держать в захвате только одну цель за раз, но защищающегося могут захватить несколько противников — в разумных пределах. Любые проверки навыка, навязанные цели в многократном захвате, сравниваются со всеми нападающими, и цель выигрывает только если превзошла броски всех нападающих.\nЭти правила предполагают, что и нападающий, и цель примерно человеческого размера. Захват или толчок гуманоидных, но существенно более крупных целей делается со штрафом -2 ко всем проверкам навыка, а попытки справиться с четвероногими или с теми, кого вообще едва можно борцовски ухватить, — со штрафом -4."},
{"n":"2.4.7.2","l":4,"te":"Dual-Wielding Weapons","tr":"Бой двумя оружиями","en":"Some attackers prefer to use two weapons at once. PCs who wish to do so must have at least level-1 in the relevant weapon skills, such as Stab-1 and Shoot-1 for dual-wielding a knife and pistol.\nWhen making an attack while dual-wielding, the attacker chooses which weapon they wish to use, rolling the attack roll accordingly. On a hit, the weapon does +2 damage so long as the target is within range of both wielded weapons. This bonus does not add to Shock.\nManaging two weapons at once is difficult, and applies a -1 penalty to all hit rolls.","ru":"Некоторые бойцы предпочитают использовать два оружия сразу. ПИ, которые хотят так делать, должны иметь хотя бы уровень-1 в соответствующих оружейных навыках — например, Клинок-1 и Стрельба-1 для боя ножом и пистолетом.\nАтакуя двумя оружиями, атакующий выбирает, какое оружие хочет применить, и делает бросок атаки соответственно. При попадании оружие наносит +2 урона, если цель находится в пределах дистанции обоих используемых оружий. Этот бонус не добавляется к Шоку.\nУправляться с двумя оружиями сразу трудно, поэтому ко всем броскам атаки применяется штраф -1."},
{"n":"2.4.7.3","l":4,"te":"Execution Attacks","tr":"Казнящие атаки","en":"A target that is entirely unsuspecting of damage is subject to execution attacks. A subject that is expecting danger or alert to potential harm cannot be targeted by an execution attack.\nA ranged execution attack requires one full minute of aiming, waiting, and adjusting on the part of the would-be sniper. Any disturbance during this time will spoil the shot. After spending this time, the assassin may make a Dex/Shoot skill check. The difficulty is 6 for an attack within two meters, 8 for an attack within the weapon's normal range, or 10 for one at the weapon's long range. On a success, the attack hits; the victim's Armor Class is ignored.\nA melee execution attack requires one full minute of near proximity to the target, watching for just the right opening and getting to within melee range of the victim. If this time is granted, the assassin may make a melee attack, automatically hitting.\nWhen a target is hit with an execution attack they must make a Physical saving throw at a penalty equal to the assailant's combat skill. On a failure, they are immediately reduced to zero hit points and Mortally Wounded, or knocked unconscious if the weapon was non-lethal.\nIf they succeed on the save, they still take damage normally. Successful execution attacks always count as Traumatic Hits, so the ensuing multiplied damage or Major Injury may be enough to kill the victim anyway.","ru":"Цель, совершенно не подозревающая об угрозе, уязвима для казнящих атак. Цель, которая ожидает опасности или настороже из-за возможного вреда, не может стать объектом казнящей атаки.\nКазнящая атака на расстоянии требует целой минуты прицеливания, ожидания и подстройки со стороны будущего снайпера. Любая помеха за это время испортит выстрел. Потратив это время, убийца может сделать проверку Лов/Стрельба. Сложность — 6 для атаки в пределах двух метров, 8 для атаки в пределах обычной дистанции оружия и 10 для атаки на дальней дистанции оружия. При успехе атака попадает; Класс защиты жертвы игнорируется.\nКазнящая атака в ближнем бою требует целой минуты вблизи цели: убийца выжидает нужный момент и подбирается на дистанцию ближнего боя. Если это время есть, убийца может атаковать в ближнем бою, попадая автоматически.\nКогда по цели попадают казнящей атакой, она должна сделать Физический спасброск со штрафом, равным боевому навыку нападающего. При провале её пункты здоровья немедленно сводятся к нулю и она смертельно раненная — или сбита без сознания, если оружие было нелетальным.\nЕсли спасброск удался, цель всё равно получает урон как обычно. Успешные казнящие атаки всегда считаются Травматичными попаданиями, так что умноженный урон или Серьёзная травма могут всё-таки её убить."},
{"n":"2.4.8","l":3,"te":"Vehicle Combat","tr":"Бой транспорта","en":"Combat between vehicles works much as combat between people does. Each vehicle counts as its own side for rolling initiative and all passengers act on its turn. The driver must spend a Main Action each round maintaining control of the vehicle. If they can't and no one can grab the wheel, the driver must make a Luck save or crash. A successful save results in a safe halt.\nEach vehicle requires a gunner for each mounted weapon, and firing them requires a Main Action from the gunner. Firing personal weapons out the window is done at a -4 hit penalty while the vehicle is moving.\nVehicles have their own Armor Class applied to both melee and ranged attacks against it. A stationary vehicle takes a -4 penalty, while a moving one adds its driver's Drive skill to its AC. Vehicles may also have an Armor rating, which is subtracted from all damage done to it. A GM may rule that some weapons have no feasible way of harming some vehicles.\nVehicles reduced to zero hit points are destroyed, and any passengers take crash damage.\nVehicle movement is abstracted, and it's assumed that all vehicles participating in a fray are close enough to shoot at each other. If one or more wishes to flee and the others try to follow, the pursuit rules from section 2.6.2 are used.","ru":"Бой между машинами устроен во многом так же, как бой между людьми. Каждая машина считается отдельной стороной при броске инициативы, и все пассажиры действуют в её ход. Водитель должен каждый раунд тратить Основное действие на удержание контроля над машиной. Если он не может, а руль подхватить некому, водитель должен сделать спасброск Удачи или разбиться. Успешный спасброск означает безопасную остановку.\nКаждой машине нужен стрелок на каждое установленное оружие, и выстрел из него требует Основного действия стрелка. Стрельба из личного оружия в окно на ходу идёт со штрафом -4 к попаданию.\nУ транспорта свой Класс защиты, который применяется и к ближним, и к дальним атакам по нему. Стоящая машина получает штраф -4, а движущаяся добавляет к своему КЗщ навык Вождение своего водителя. У транспорта также может быть значение Брони, которое вычитается из всего наносимого ему урона. Мастер может решить, что некоторое оружие в принципе не способно повредить некоторым машинам.\nТранспорт, сведённый к нулю пунктов здоровья, уничтожен, а все пассажиры получают урон от аварии.\nПеремещение транспорта абстрактно: считается, что все машины, участвующие в схватке, достаточно близко, чтобы стрелять друг в друга. Если одна или несколько хотят убежать, а остальные пытаются догнать, используются правила погони из раздела 2.6.2."},
{"n":"2.4.8.1","l":4,"te":"Vehicle Destruction","tr":"Уничтожение транспорта","en":"A vehicle that crashes or is reduced to zero hit points is destroyed. Any occupants take damage as if they were also hit by whatever took out the vehicle, with a Luck save for half. Thus, if a rocket launcher inflicted 18 points of damage on a car and blew it to pieces, the passengers would also take 18 points of damage, with a Luck save to halve it.","ru":"Машина, которая разбилась или сведена к нулю пунктов здоровья, уничтожена. Все, кто был внутри, получают урон, как будто по ним тоже попало то, что вывело машину из строя, со спасброском Удачи на половину. Так, если ракетная установка нанесла машине 18 пунктов урона и разнесла её на куски, пассажиры тоже получают 18 пунктов урона со спасброском Удачи, чтобы уполовинить его."},
{"n":"2.4.8.2","l":4,"te":"Vehicle Crashes","tr":"Аварии транспорта","en":"If the vehicle was moving at combat speeds at the time it was destroyed or goes out of control, the passengers also take crash damage. Each passenger rolls both a Physical save and a Luck save. If they make both, they survive largely unscathed. If they fail one, they take half their maximum hit points in damage, which may leave them Mortally Wounded. If they fail both, they are Mortally Wounded and will suffer a Major Injury if they survive.","ru":"Если в момент уничтожения или потери управления машина двигалась на боевых скоростях, пассажиры вдобавок получают урон от аварии. Каждый пассажир бросает и Физический спасброск, и спасброск Удачи. Если прошёл оба — уцелел практически без вреда. Если провалил один — получает урон, равный половине своего максимума пунктов здоровья, из-за чего может стать смертельно раненным. Если провалил оба — он смертельно раненный и получит Серьёзную травму, если выживет."},
{"n":"2.4.8.3","l":4,"te":"Vehicles and Traumatic Hits","tr":"Транспорт и Травматичные попадания","en":"Some weapons can reasonably inflict Traumatic Hits on a given vehicle, at the GM's discretion. Each vehicle type has its own Trauma Target, never less than 6 and often much higher.\nA vehicle that takes a Traumatic Hit from such weapons takes the multiplied damage as usual. If the damage is enough to destroy the vehicle, the unlucky passengers are also subject to this multiplied damage when making their Luck saves.","ru":"Некоторое оружие может обоснованно наносить Травматичные попадания той или иной машине — на усмотрение Мастера. У каждого типа транспорта свой Порог травмы, никогда не ниже 6 и часто гораздо выше.\nМашина, получившая Травматичное попадание от такого оружия, получает умноженный урон как обычно. Если урона хватает, чтобы уничтожить машину, невезучие пассажиры тоже подпадают под этот умноженный урон, когда делают свои спасброски Удачи."},
{"n":"2.4.8.4","l":4,"te":"Vehicle Maneuvers and Ramming","tr":"Манёвры транспорта и таран","en":"A driver who wants to accomplish a stunt can do so as part of the Main Action they spend controlling the vehicle for the round. These maneuvers may be an attempt to open up a route of escape, to get cover from enemy fire, to cut off a specific enemy vehicle, or to jump Snake River Canyon. This is normally resolved with a skill check at a difficulty set by the GM. Checks made against a driver, such as an attempt to skid out of a vehicle’s line of fire, may be made as opposed checks.\nRamming a human-sized target is generally only possible in confined areas such as narrow streets. The driver and target make opposed Dex/Drive and Dex/Exert skill checks. If the driver wins, the target must make an Evasion save or take the vehicle’s maximum HP in damage, with a Trauma Die of 1d12/x3. Ramming a vehicle also takes an opposed check, albeit with no Evasion save allowed. The ramming vehicle also takes damage as if the target vehicle rammed it in turn.","ru":"Водитель, который хочет исполнить трюк, может сделать это в рамках того же Основного действия, которое он тратит на управление машиной в этом раунде. Такие манёвры могут быть попыткой пробить путь к отходу, укрыться от вражеского огня, отрезать конкретную машину противника или перепрыгнуть каньон Снейк-Ривер. Обычно это решается проверкой навыка со сложностью, которую задаёт Мастер. Проверки, направленные против водителя, — например, попытка ускользнуть с линии огня машины, — могут делаться как встречные.\nТаранить цель человеческого размера обычно можно только в тесноте — например, на узких улицах. Водитель и цель делают встречные проверки Лов/Вождение и Лов/Атлетика. Если водитель побеждает, цель должна сделать спасброск Уклонения или получить урон, равный максимуму пунктов здоровья машины, с Костью травмы 1d12/×3. Таран другой машины тоже требует встречной проверки, но спасброск Уклонения при этом не допускается. Таранящая машина также получает урон, как будто целевая машина в ответ таранила её."},
{"n":"2.5.0","l":2,"te":"Injury, Healing, and System Strain","tr":"Травмы, лечение и Системная нагрузка","en":"Injury is almost inevitable in an operator's career. Some forms of it can be longer-lasting than others.","ru":"Травмы почти неизбежны в карьере оператора. Некоторые из них держатся дольше других."},
{"n":"2.5.1","l":3,"te":"Mortal Injury and Stabilization","tr":"Смертельные ранения и стабилизация","en":"When a PC is reduced to zero hit points by a lethal attack, they are Mortally Injured. They will die at the end of the sixth round after their incapacitation unless stabilized by an ally or some special ability or cyber. A Mortally Wounded character is helpless, and can take no actions and do nothing useful.\nStabilizing an ally is usually a Main Action that requires a Dex/Heal or Int/Heal skill check. The difficulty is 8 plus the number of full rounds since the target fell. If the medic lacks a medkit or other tools, this difficulty is increased by 2. Only one ally can try to stabilize a victim per round, though others can attempt to aid their check, but attempts may be retried each round for as long as hope lasts.\nOnce stabilized the victim remains incapacitated for ten minutes before recovering with 1 hit point and the Frail condition. They may act normally after they recover, but if they are reduced to zero hit points again while still Frail, they die instantly. Frailty is removed by a week of bed rest and medical care. A physician can also make one attempt to remove Frailty with a medkit and an hour of work, rolling a Dex/Heal or Int/Heal skill check against difficulty 10.","ru":"Когда пункты здоровья ПИ сведены к нулю летальной атакой, он смертельно раненный. Он умрёт в конце шестого раунда после того, как был обездвижен, если его не стабилизирует союзник, особая способность или кибер. Смертельно раненный персонаж беспомощен: он не может совершать действия и делать что-либо полезное.\nСтабилизация союзника обычно требует Основного действия и проверки Лов/Медицина или Инт/Медицина. Сложность — 8 плюс число полных раундов с момента падения цели. Если у медика нет медицинского набора или других инструментов, эта сложность повышается на 2. Стабилизировать жертву за раунд может пытаться только один союзник, хотя остальные могут помогать его проверке; но попытки можно повторять каждый раунд, пока есть надежда.\nПосле стабилизации жертва остаётся обездвиженной десять минут, после чего приходит в себя с 1 пунктом здоровья и состоянием Хилость. Дальше она может действовать нормально, но если её пункты здоровья снова сведут к нулю, пока она Хилая, она умирает мгновенно. Хилость снимается неделей постельного режима и медицинского ухода. Врач также может сделать одну попытку снять Хилость, потратив медицинский набор и час работы: проверка Лов/Медицина или Инт/Медицина против сложности 10."},
{"n":"2.5.1.1","l":4,"te":"NPCs and Mortal Injury","tr":"NPC и смертельные ранения","en":"NPCs who aren't important enough to merit a name usually die instantly when reduced to zero hit points.","ru":"NPC, которые недостаточно важны, чтобы иметь имя, обычно умирают мгновенно, когда их пункты здоровья сведены к нулю."},
{"n":"2.5.1.2","l":4,"te":"Catastrophic Damage","tr":"Катастрофический урон","en":"Targets reduced to zero hit points by some injury or cause that could not be reasonably survivable are instantly killed. A gunshot might be patched; a direct hit with a rocket-propelled grenade is less survivable. What counts as \"not be reasonably survivable\" may vary if the target is heavily cyber-armored.","ru":"Цели, чьи пункты здоровья сведены к нулю раной или причиной, которую нельзя разумно пережить, погибают мгновенно. Огнестрельное ранение можно залатать; прямое попадание реактивной гранаты переживается хуже. Что считать «нельзя разумно пережить», может меняться, если цель тяжело закована в кибер-броню."},
{"n":"2.5.1.3","l":4,"te":"Non-Lethal Incapacitation","tr":"Нелетальное обездвиживание","en":"If a target is brought to zero hit points by a non-lethal attack, they are incapacitated for ten minutes before regaining 1 hit point. They do not become Frail.","ru":"Если цель сведена к нулю пунктов здоровья нелетальной атакой, она обездвижена на десять минут, после чего восстанавливает 1 пункт здоровья. Хилой она не становится."},
{"n":"2.5.2","l":3,"te":"System Strain","tr":"Системная нагрузка","en":"Non-natural forms of healing or intense cyberware activation takes a toll on a user's physiology. Their System Strain total reflects the total amount of stress their body has undergone.\nA healthy character normally starts at zero System Strain and has their Constitution score as their allowed maximum. A character cannot accumulate more than this maximum in System Strain.\nCyberware installation generally adds a certain amount of permanent System Strain to the target. This permanent Strain may be fractional, but a character's body cannot ever support more than their maximum System Strain. Removing the cyber allows this permanent System Strain to be lost.\nPharmaceutical healing and cyberware activation often add to a subject's System Strain. If this addition would put them over their maximum they cannot activate the cyber, benefit from the drugs, or otherwise gain any use from the ability. If they are forced over the maximum by some unavoidable effect, they are instead knocked unconscious for at least an hour.\nCharacters lose one point of accumulated System Strain after each night's rest, assuming they are warm, fed, and comfortable and can get at least eight uninterrupted hours of sleep.","ru":"Неестественные способы лечения и интенсивная активация кибернетики бьют по физиологии носителя. Его суммарная Системная нагрузка отражает общий объём стресса, перенесённого телом.\nЗдоровый персонаж обычно начинает с нулевой Системной нагрузкой, а её допустимый максимум равен его значению Телосложения. Персонаж не может накопить Системной нагрузки больше этого максимума.\nУстановка кибернетики обычно добавляет цели некоторое количество постоянной Системной нагрузки. Эта постоянная нагрузка может быть дробной, но тело персонажа никогда не может выдержать больше его максимума Системной нагрузки. Удаление кибера позволяет избавиться от этой постоянной Системной нагрузки.\nФармацевтическое лечение и активация кибернетики часто добавляют цели Системную нагрузку. Если такая добавка вывела бы её за максимум, она не может активировать кибер, получить пользу от препаратов или как-то иначе воспользоваться способностью. Если её выводит за максимум каким-то неизбежным эффектом, вместо этого она падает без сознания минимум на час.\nПерсонажи теряют один пункт накопленной Системной нагрузки после каждой ночи отдыха — при условии, что им тепло, они сыты, им удобно и они могут проспать не меньше восьми часов без помех."},
{"n":"2.5.3","l":3,"te":"Natural Healing","tr":"Естественное исцеление","en":"A wounded creature can recover hit points by getting a good night's rest and adequate food. Provided they are warm, fed, and comfortable, they regain hit points each morning equal to their experience level, or equal to their hit dice if they are NPCs.\nFrail creatures do not recover hit points through natural healing. They must cure their Frail condition first or rely on medical pharmaceuticals. Removing the Frail condition requires a full week of bed rest and the medical attention of someone with at least Heal-0 skill and a medkit. Frail victims without this level of medical care must make a Physical save after a week; on a failure they die sometime in the next week, while success means they lose their Frailty after another month of rest.","ru":"Раненое существо может восстановить пункты здоровья, хорошо выспавшись и нормально поев. Если ему тепло, оно сыто и ему удобно, каждое утро оно восстанавливает пункты здоровья в количестве, равном своему уровню опыта, или равном своим Костям здоровья, если это NPC.\nХилые существа не восстанавливают пункты здоровья естественным исцелением. Сначала им нужно излечить состояние Хилость или полагаться на медицинскую фармацевтику. Снятие Хилости требует полной недели постельного режима и медицинского ухода от того, у кого есть хотя бы навык Медицина-0 и медицинский набор. Хилые жертвы без такого уровня медицинской помощи должны через неделю сделать Физический спасброск: при провале они умрут в течение следующей недели, а при успехе теряют Хилость ещё через месяц отдыха."},
{"n":"2.5.4","l":3,"te":"First Aid","tr":"Первая помощь","en":"Modern combat medicine can patch up victims in a hurry, albeit at a cost to their physical resilience. By spending one minute patching up an ally with a medkit, a healer can heal 1d6 points of damage plus their Heal skill. If they lack any Heal skill at all, they restore 1d6-1 points. Each such application of first aid adds one System Strain to the target. First aid can restore hit points to a Frail target, but it cannot remove their Frailty.\nFive minutes is enough time for a medic to apply as much first aid as is wanted to the rest of their team.","ru":"Современная боевая медицина умеет быстро латать пострадавших — за счёт их физической выносливости. Потратив минуту на перевязку союзника с медицинским набором, целитель лечит 1d6 урона плюс свой навык Медицина. Если навыка Медицина у него нет вообще, он восстанавливает 1d6-1. Каждое такое применение первой помощи добавляет цели одну Системную нагрузку. Первая помощь может восстановить пункты здоровья Хилой цели, но не может снять её Хилость.\nПяти минут медику хватает, чтобы оказать остальной команде столько первой помощи, сколько нужно."},
{"n":"2.5.5","l":3,"te":"Poisons and Diseases","tr":"Яды и болезни","en":"Most toxins force a victim to make a Physical saving throw to resist their effects or mitigate their harm. Weak perils might grant as much as a +4 to the saving throw, while dire threats might apply a -4 penalty.\nIf the save is failed, the poison or disease takes hold. Most poisons act quickly, inflicting hit point damage, adding System Strain to the target, or applying long-lasting penalties. Diseases can have a slower onset but often apply the same sort of harms.\nA medic who gets to a poisoned person within a minute of the poisoning can use a medkit to give them a better chance to resist. They may add twice their Heal skill level to the victim’s saving throw roll, or +1 if they have only Heal-0 skill. Specialized antitoxins may be able to neutralize such poisons entirely.","ru":"Большинство токсинов заставляет жертву сделать Физический спасброск, чтобы сопротивляться их действию или уменьшить вред. Слабые угрозы могут давать до +4 к спасброску, а смертельно опасные — штраф -4.\nЕсли спасброск провален, яд или болезнь берёт своё. Большинство ядов действует быстро: наносит урон пунктам здоровья, добавляет цели Системную нагрузку или накладывает долгие штрафы. У болезней начало может быть медленнее, но вредят они часто так же.\nМедик, который добрался до отравленного в течение минуты после отравления, может медицинским набором дать ему больше шансов устоять. Он добавляет к броску спасброска жертвы удвоенный уровень своего навыка Медицина, или +1, если у него только Медицина-0. Специализированные антитоксины могут полностью нейтрализовать такие яды."},
{"n":"2.5.6","l":3,"te":"Major Injuries","tr":"Серьёзные травмы","en":"If a subject is reduced to zero hit points by lethal damage during the same scene in which they suffered a Traumatic Hit, they run the risk of suffering a Major Injury. The damage that brings them down doesn't need to have come from the Traumatic Hit; they remain vulnerable until the end of the scene.\nOn reaching zero hit points they must make a Physical save. If they pass, they are still Mortally Wounded but may be stabilized and recover normally. If they fail the save, they suffer a Major Injury. The victim rolls 1d12 and compares it to the table below. Some special effects or situations may modify the roll, but a roll less than 1 still counts as 1, and one more than 12 still counts as 12.\nA victim with a Major Injury may still be stabilized by ordinary medical help to prevent them from bleeding out, but dealing with the actual injury will generally require serious work by a properly-equipped street doc.\n\n\nd12\n\tMajor Injury\n\t1\n\tInstant Death: Wrong place, wrong time. You're not coming back from this.\n\t2\n\tInternal Damage: You're dead in an hour if you don’t get to a street doc's clinic. You're in a coma until you install a Prosthetic Cyber implant. Any Body or Nerves location cyber you have is critically damaged.\n\t3\n\tBrain Damage: You're in a coma until you install a Prosthetic Cyber implant. Any Head or Nerves location cyber you have is critically damaged.\n\t4\n\tEye Damage: You're blind until you get a pair of cybereyes. If you already have cybereyes, they and any implants in them are critically damaged.\n\t5\n\tGut Wound: If you don't get to a street doc's clinic in an hour, you suffer a -1 penalty to your Con modifier until you get a Prosthetic Cyber implant.\n\t6\n\tRight Leg Ruined*: You can crawl at best once stabilized.\n\t7\n\tLeft Leg Ruined*: As above, but for your left leg.\n\t8\n\tRight Arm Ruined*: You've only got one functional hand.\n\t9\n\tLeft Arm Ruined*: As above, but for your left arm.\n\t10\n\tSystem Damage: Your most System Strain-expensive implant has been critically damaged. If several tie, the GM picks one.\n\t11-12\n\tJust a Flesh Wound: It's not that bad of a hit after all.\n\t\n\n\t*: Any Limb cyber exclusively and entirely located in the ruined limb, such as a Cyberarm system, is also damaged by the injury. Limb systems split over multiple limbs are not disabled.","ru":"Если пункты здоровья цели сведены к нулю летальным уроном в той же сцене, в которой она получила Травматичное попадание, ей грозит Серьёзная травма. Урон, который её свалил, не обязан быть тем самым Травматичным попаданием: цель остаётся уязвимой до конца сцены.\nДостигнув нуля пунктов здоровья, она должна сделать Физический спасброск. Если прошла — она всё равно смертельно раненная, но может быть стабилизирована и восстановиться как обычно. Если провалила спасброск — получает Серьёзную травму. Жертва бросает 1d12 и сверяется с таблицей ниже. Некоторые особые эффекты или обстоятельства могут изменять бросок, но результат меньше 1 всё равно считается 1, а больше 12 — всё равно 12.\nЖертву с Серьёзной травмой всё равно можно стабилизировать обычной медицинской помощью, чтобы она не истекла кровью, но разбираться с самой травмой обычно придётся серьёзной работой хорошо оснащённого уличного доктора.\n\n\n| d12 | Серьёзная травма |\n|---|---|\n| 1 | **Мгновенная смерть:** Не то место, не то время. Отсюда ты уже не вернёшься. |\n| 2 | **Внутренние повреждения:** Через час ты мёртв, если не попадёшь в клинику уличного доктора. Ты в коме, пока не установишь имплант Протезного кибера. Весь твой кибер с расположением Тело или Нервы критически повреждён. |\n| 3 | **Повреждение мозга:** Ты в коме, пока не установишь имплант Протезного кибера. Весь твой кибер с расположением Голова или Нервы критически повреждён. |\n| 4 | **Повреждение глаз:** Ты слеп, пока не получишь пару киберглаз. Если киберглаза уже есть, они и любые импланты в них критически повреждены. |\n| 5 | **Ранение в живот:** Если не попадёшь в клинику уличного доктора в течение часа, получаешь штраф -1 к своему модификатору Тел, пока не установишь имплант Протезного кибера. |\n| 6 | **Правая нога уничтожена\\*:** После стабилизации ты в лучшем случае можешь ползать. |\n| 7 | **Левая нога уничтожена\\*:** Как выше, но для левой ноги. |\n| 8 | **Правая рука уничтожена\\*:** У тебя осталась только одна рабочая рука. |\n| 9 | **Левая рука уничтожена\\*:** Как выше, но для левой руки. |\n| 10 | **Повреждение системы:** Твой самый дорогой по Системной нагрузке имплант критически повреждён. Если несколько равны, Мастер выбирает один. |\n| 11-12 | **Просто царапина:** Попадание оказалось не таким уж и страшным. |\n\n\n*: Любой кибер Конечности, полностью и исключительно расположенный в уничтоженной конечности, — например, система Кибер-рука, — тоже повреждён этой травмой. Системы конечностей, разделённые между несколькими конечностями, из строя не выводятся."},
{"n":"2.5.6.1","l":4,"te":"Prosthetic Cyber","tr":"Протезный кибер","en":"Some Major Injuries force the installation of Prosthetic Cyber systems as listed in section 3.6.7.6. If a limb is destroyed, an appropriate Cyberarm or Cyberleg is needed, while brain damage, internal damage, and gut wounds require Prosthetic Cyber.\nWealthy characters can instead have custom-grown clone organs and limbs used to replace damaged tissue, but such measures require extensive medical contacts with top-end facilities and at least $100,000 in costs.\nCharacters in magically-active campaigns who are unable to safely use cyberware, such as PCs with the magical Edges, may use makeshift enchantments in place of cyberlimbs, cybereyes, or Prosthetic Cyber. These enchantments do not damage their maximum Effort scores, but they add 2 System Strain each and grant no benefits beyond minimal functionality. They have the same cost as the cyber.","ru":"Некоторые Серьёзные травмы вынуждают установить системы Протезного кибера, перечисленные в разделе 3.6.7.6. Если конечность уничтожена, нужна соответствующая Кибер-рука или Кибер-нога, а повреждение мозга, внутренние повреждения и ранения в живот требуют Протезного кибера.\nБогатые персонажи могут вместо этого заказать выращенные на заказ клонированные органы и конечности, чтобы заменить повреждённые ткани, но такие меры требуют обширных медицинских связей с заведениями высшего класса и не меньше $100 000 расходов.\nПерсонажи в кампаниях с активной магией, которые не могут безопасно пользоваться кибернетикой — например, ПИ с магическими Козырями, — могут применять кустарные чары вместо кибер-конечностей, киберглаз или Протезного кибера. Эти чары не портят их максимум Усилия, но каждые добавляют по 2 Системной нагрузки и не дают никаких преимуществ помимо минимальной работоспособности. Стоят они столько же, сколько кибер."},
{"n":"2.5.6.2","l":4,"te":"Cyberware Damage","tr":"Повреждение кибернетики","en":"Many major injuries damage cyberware located in the body part that was crippled by the blow. Such damaged cyberware is useless until it has been repaired by someone with at least Fix-0 and Heal-0 skills. If the cyberware is necessary to preserve the user’s life somehow, it functions just enough to avoid death, but not well enough to do any good.\nRepairing damaged cyberware takes one day per damaged system and costs 20% of the systems’ original cost in maintenance parts. A cyberdoc kit at a minimum is necessary to perform the repairs. Paired cyber implants such as cybereyes or synthears are treated as a single system and repaired as a single system.","ru":"Многие серьёзные травмы повреждают кибернетику, расположенную в той части тела, которую покалечил удар. Такая повреждённая кибернетика бесполезна, пока её не отремонтирует кто-нибудь с навыками не ниже Ремонт-0 и Медицина-0. Если кибернетика как-то нужна, чтобы сохранить носителю жизнь, она работает ровно настолько, чтобы избежать смерти, но недостаточно хорошо, чтобы приносить пользу.\nРемонт повреждённой кибернетики занимает один день на каждую повреждённую систему и стоит 20% исходной цены систем в запчастях на обслуживание. Для ремонта нужен как минимум набор кибердока. Парные кибер-импланты вроде киберглаз или синтушей считаются одной системой и ремонтируются как одна система."},
{"n":"2.6.0","l":2,"te":"Chases and Pursuit","tr":"Погони и преследование","en":"Operators have a habit of chasing after others and being chased in turn. The specific rules used vary depending on whether it's a foot chase or vehicle pursuit.","ru":"Операторы вечно кого-то догоняют — и вечно бегают сами. Конкретные правила зависят от того, пешая это погоня или транспортная."},
{"n":"2.6.1","l":3,"te":"Foot Chases","tr":"Пешие погони","en":"The group member in the fleeing party with the best Dex/Exert or Con/Exert total rolls a skill check. Their result is the fleeing group's pace, as they help and encourage the slower members.\nOther fleeing group members then hinder pursuit in whatever ways they think are helpful. Sometimes a skill check is needed, while other times a GM will simply decide it works. Each successful effort adds a +1 bonus to the pace, up to +3 maximum. Botched efforts are either unhelpful or apply a -1 penalty if they’re actively harmful. If the fleeing group is made up of NPCs, it’s the GM’s judgment as to whether any of them try to do something clever to stall the PCs.\nThe pursuing group then makes a single Dex/Exert or Con/Exert skill check, modified by the table below. If they beat the fleeing group's total they catch up to them, and if they tie or roll less the fleeing party has escaped immediate pursuit.\n\n\nSituation                                        Mod\nThere are more pursuers than pursued        -1\nThe pursued have no head start at all        +2\n “ have one round’s head start                +1\n “ have less than a minute’s head start        +0\n “ have more than a minute’s head start        -2\nWho knows the local terrain better?                -2 to +2\nThe pursuit is half-hearted or obligatory        -1\nThe pursuers are enraged or vengeful        +1","ru":"Тот из убегающих, у кого лучший суммарный показатель Лов/Атлетика или Тел/Атлетика, делает проверку навыка. Её результат — темп убегающей группы: этот персонаж помогает более медленным и подгоняет их.\nОстальные убегающие мешают преследованию так, как считают полезным. Иногда для этого нужна проверка навыка, иногда Мастер просто решает, что приём сработал. Каждая удачная попытка добавляет к темпу бонус +1, максимум до +3. Провальные попытки либо бесполезны, либо дают штраф -1, если они реально вредят своим. Если убегает группа NPC, Мастер сам решает, попробует ли кто-то из них выкинуть что-нибудь хитрое, чтобы задержать ПИ.\nЗатем преследователи делают одну проверку Лов/Атлетика или Тел/Атлетика с модификаторами из таблицы ниже. Если их результат превосходит итог убегающей группы — они догнали; при равенстве или меньшем результате убегающие ушли от немедленного преследования.\n\n\n| Ситуация | Мод |\n|---|---|\n| Преследователей больше, чем убегающих | -1 |\n| У убегающих вообще нет форы | +2 |\n| То же — фора в один раунд | +1 |\n| То же — фора меньше минуты | +0 |\n| То же — фора больше минуты | -2 |\n| Кто лучше знает местность? | от -2 до +2 |\n| Преследование вялое или «для галочки» | -1 |\n| Преследователи в ярости или жаждут мести | +1 |"},
{"n":"2.6.2","l":3,"te":"Vehicle Chases","tr":"Транспортные погони","en":"For vehicle chases, the fleeing driver makes a Drive skill check, usually modified by Dexterity. This is the fleeing vehicle's pace. The vehicle's passengers may think of something useful to do to hinder pursuit, just as with a foot chase.\nEach pursuing vehicle then makes its own Dex/Drive skill check to catch up with the quarry, modified by the table below. Any of them who don't equal or exceed the fleeing vehicle's pace fall behind and are lost from the pursuit. Any of them who do make the roll catch up to the vehicle, and it usually becomes a matter of vehicle combat until the quarry can make another escape attempt or win the ensuing battle.\n\n\nSituation                                        Modifier\nThe pursuer can’t directly see the pursued        -2\nThe pursuer is flying but the pursued isn’t        +3\nThe pursued is flying but the pursuer isn’t        -3\nA spotter is relaying the target’s position        +1\nWho knows the local terrain better?                -2 to +2\nThe pursuit is half-hearted or obligatory        -1\nThe pursuers are enraged or vengeful        +1","ru":"В транспортной погоне убегающий водитель делает проверку навыка Вождение, обычно с модификатором Ловкости. Это темп убегающей машины. Пассажиры могут придумать что-нибудь полезное, чтобы помешать преследованию, — так же, как в пешей погоне.\nЗатем каждая преследующая машина делает свою проверку Лов/Вождение, чтобы догнать добычу, с модификаторами из таблицы ниже. Все, кто не сравнялся с темпом убегающей машины и не превзошёл его, отстают и выпадают из погони. Все, кто прошёл проверку, догоняют машину, и дальше дело обычно доходит до транспортного боя — пока добыча не предпримет новую попытку сбежать или не победит в схватке.\n\n\n| Ситуация | Модификатор |\n|---|---|\n| Преследователь не видит убегающего напрямую | -2 |\n| Преследователь летит, а убегающий нет | +3 |\n| Убегающий летит, а преследователь нет | -3 |\n| Наводчик передаёт положение цели | +1 |\n| Кто лучше знает местность? | от -2 до +2 |\n| Преследование вялое или «для галочки» | -1 |\n| Преследователи в ярости или жаждут мести | +1 |"},
{"n":"2.7.0","l":2,"te":"Character Advancement","tr":"Развитие персонажа","en":"Characters accumulate experience points through successful mission completion or other activities appropriate to the campaign's focus. By default, PCs gain three experience points for an average successful mission. When enough experience points have been accumulated, they advance an experience level. New characters begin at first level and can rise to a maximum of tenth under the default rules.\nThe requirements listed below are for \"fast\" campaigns, where PCs advance in level relatively rapidly, and \"slow\" campaigns, where the advancement is more measured. Individual GMs may alter these rates to suit their table's needs. Experience points do not reset on leveling up; the totals listed are total points accumulated.\n\n\nExperience Point Requirements\nLevel        Fast        Slow\n1        0        0\n2        3        6\n3        6        15\n4        12        24\n5        18        36\n6        27        51\n7        39        69\n8        54        87\n9        72        105\n10        93        139","ru":"Персонажи набирают пункты опыта за успешно выполненные миссии или иную деятельность, отвечающую тематике кампании. По умолчанию ПИ получают три пункта опыта за средне успешную миссию. Когда пунктов опыта накопилось достаточно, персонаж поднимается на уровень опыта. Новые персонажи начинают с первого уровня и по стандартным правилам могут дорасти максимум до десятого.\nПриведённые ниже требования даны для «быстрых» кампаний, где ПИ растут в уровнях сравнительно скоро, и для «медленных», где развитие идёт размеренно. Каждый Мастер может изменить эти темпы под нужды своего стола. Пункты опыта не сбрасываются при повышении уровня; в таблице указаны суммарно накопленные пункты.\n\n\n**Требования по пунктам опыта**\n\n| Уровень | Быстро | Медленно |\n|---|---|---|\n| 1 | 0 | 0 |\n| 2 | 3 | 6 |\n| 3 | 6 | 15 |\n| 4 | 12 | 24 |\n| 5 | 18 | 36 |\n| 6 | 27 | 51 |\n| 7 | 39 | 69 |\n| 8 | 54 | 87 |\n| 9 | 72 | 105 |\n| 10 | 93 | 139 |"},
{"n":"2.7.1","l":3,"te":"Advancement Benefits","tr":"Преимущества развития","en":"Whenever a character advances a level, they obtain certain benefits.","ru":"Каждый раз, поднимая уровень, персонаж получает определённые преимущества."},
{"n":"2.7.1.1","l":4,"te":"Additional Hit Points","tr":"Дополнительные пункты здоровья","en":"To determine their new maximum hit points, they roll 1d6 for each character level they possess. If they have the Hard to Kill Edge, they roll 1d6+2 for each. To each of these dice, they add their Constitution modifier, whether a bonus or a penalty. No individual die can be reduced below 1 point, even with a Constitution penalty. If the total roll is greater than their current maximum hit points, they take the roll. If less or equal, their maximum hit points increase by one.","ru":"Чтобы определить новый максимум пунктов здоровья, брось 1d6 за каждый имеющийся уровень персонажа. С Козырем Живучий бросай за каждый 1d6+2. К каждой из этих костей прибавь свой модификатор Телосложения — и бонус, и штраф. Ни одна отдельная кость не может быть снижена ниже 1 пункта, даже штрафом Телосложения. Если итог броска больше текущего максимума пунктов здоровья, возьми результат броска. Если меньше или равен — максимум пунктов здоровья повышается на единицу."},
{"n":"2.7.1.2","l":4,"te":"Improved Saving Throw","tr":"Улучшенный спасброск","en":"Their saving throw scores decrease by one, making it easier to succeed on saving throws by rolling equal or over it. As a first level character has saving throw scores of 15, reaching second level would lower them to 14, modified by their appropriate attributes.","ru":"Пороги его спасбросков снижаются на единицу, и пройти спасброск, выбросив результат не ниже порога, становится легче. У персонажа первого уровня пороги спасбросков равны 15, так что при достижении второго уровня они опустятся до 14 — с учётом модификаторов соответствующих характеристик."},
{"n":"2.7.1.3","l":4,"te":"Improved Attack Bonus","tr":"Улучшенный бонус атаки","en":"A PC’s base attack bonus improves according to their level. Most characters have a basic attack bonus equal to half their character level, rounded down. If they have the On Target Edge, their bonus is equal to their full character level.","ru":"Базовый бонус атаки ПИ растёт с уровнем. У большинства персонажей базовый бонус атаки равен половине уровня персонажа с округлением вниз. С Козырем В цель бонус равен полному уровню персонажа."},
{"n":"2.7.1.4","l":4,"te":"Gaining and Spending Skill Points","tr":"Получение и траты пунктов навыков","en":"A PC who advances a level gains three skill points they can spend on improving their skills or save to spend later. Operators with the Educated Edge gain an extra bonus skill point to spend, giving them four points each time they advance.\nSkills that are gained or improved immediately on gaining a level are assumed to have been perfected over the past level and require no training time or teaching. If they save their skill points to spend them later then they’ll need to find some teacher or other explanation for developing them in the meanwhile. \nThe cost for improving a skill is listed below. Every skill level must be purchased in order; to gain level-1 in a skill you need to pay one point for level-0 and then two points for level-1. A PC must be the requisite minimum level to increase a skill to certain levels. Less hardened operators simply don’t have the focus and real-life experience to attain such a pitch of mastery.\nA PC cannot “partially buy” a skill level. If they don’t have enough skill points to buy a new level, they need to save them up until they can. A PC cannot develop skills beyond level-4.\n\n\nSkill                Point                Min.\nLevel                Cost                Character Level\n0                1                1\n1                2                1\n2                3                3\n3                4                6\n4                5                9","ru":"ПИ, поднявший уровень, получает три пункта навыков, которые может потратить на улучшение своих навыков или отложить на будущее. Операторы с Козырем Образованный получают дополнительный бонусный пункт навыка, то есть по четыре пункта при каждом повышении.\nНавыки, полученные или улучшенные сразу при повышении уровня, считаются отточенными за прошедший уровень и не требуют ни времени на обучение, ни учителя. Если же ПИ откладывает пункты навыков на будущее, ему понадобится найти учителя или другое объяснение того, где он их за это время развил.\nСтоимость улучшения навыка указана ниже. Каждый уровень навыка покупается по порядку: чтобы получить уровень-1 в навыке, надо заплатить один пункт за уровень-0, а затем два пункта за уровень-1. Чтобы поднять навык до определённых уровней, ПИ должен быть не ниже требуемого уровня персонажа. У менее закалённых операторов просто нет сосредоточенности и жизненного опыта, чтобы взять такую высоту мастерства.\nПИ не может «частично купить» уровень навыка. Если пунктов навыков не хватает на новый уровень, придётся копить, пока не наберётся. Развивать навыки выше уровня-4 ПИ не может.\n\n\n| Уровень навыка | Стоимость в пунктах | Мин. уровень персонажа |\n|---|---|---|\n| 0 | 1 | 1 |\n| 1 | 2 | 1 |\n| 2 | 3 | 3 |\n| 3 | 4 | 6 |\n| 4 | 5 | 9 |"},
{"n":"2.7.1.5","l":4,"te":"Improving Attributes","tr":"Улучшение характеристик","en":"A PC may optionally choose to use their new skill points to improve their attribute scores, assuming they haven't taken the Underdog Rule option in character creation.\nThe first time a PC improves an attribute, it costs 1 skill point and adds +1 to an attribute of their choice. The second improvement to their attributes costs 2 skill points, the third 3, and so forth. Each improvement adds +1 to the attribute, potentially improving its modifier. A PC can only ever make five such improvements total; not five per attribute.\nPCs must be third level before buying their third boost, sixth level before buying their fourth boost, and ninth level before buying their fifth boost. No more than five attribute boosts can ever be purchased by a PC.","ru":"ПИ может по желанию потратить новые пункты навыков на повышение значений своих характеристик — если только при создании персонажа он не выбрал вариант с Правилом неудачника.\nПервое повышение характеристики стоит 1 пункт навыка и даёт +1 к характеристике на выбор. Второе повышение стоит 2 пункта навыков, третье — 3, и так далее. Каждое повышение даёт +1 к характеристике и может улучшить её модификатор. Всего ПИ может сделать не более пяти таких повышений — не по пять на каждую характеристику.\nТретье повышение ПИ может купить не раньше третьего уровня, четвёртое — не раньше шестого, пятое — не раньше девятого. Больше пяти повышений характеристик ПИ не может купить никогда."},
{"n":"2.7.1.6","l":4,"te":"Choosing a new Focus or Edge","tr":"Выбор нового Фокуса или Козыря","en":"Finally, the PC might be eligible to pick an additional level in a Focus. At levels 2, 5, 7, and 10 a PC can add a level to an existing Focus or pick up the first level in a new Focus.\nIf this is the first level they’ve taken in the Focus, they might be granted a skill as a free bonus pick, depending on the Focus’ benefits. During character creation, this bonus skill pick is treated like any other skill pick. If the Focus is taken as part of advancement, however, it instead counts as three skill points spent toward increasing the skill. This is enough to raise a nonexistent skill to level-1, or boost a level-1 skill to level-2. They may do this even if they aren’t high-enough level to normally qualify for a skill level that high.\nIf the skill points aren’t quite enough to raise the skill to a new level, they remain as credit toward future advances. If applied to a skill that is already at level-4, the PC can spend the three skill points on any other skill of their choice.\nIn addition, upon reaching fifth level, an operator can pick a third Edge to add to their existing two. Any benefits this Edge grants are retroactive to first level, such as the bonus skill points from Educated or the hit point bonus of Hard to Kill. For campaigns that involve magical Edges, some may not be allowed for purchase after first level. Spellcaster, Summoner, and Graced can only be taken by new characters.","ru":"Наконец, ПИ может получить право взять дополнительный уровень в Фокусе. На уровнях 2, 5, 7 и 10 ПИ может добавить уровень к уже имеющемуся Фокусу или взять первый уровень в новом Фокусе.\nЕсли это первый взятый им уровень в этом Фокусе, персонаж может получить навык как бесплатный бонусный выбор — в зависимости от преимуществ Фокуса. При создании персонажа такой бонусный выбор навыка работает как любой другой. Но если Фокус берётся в порядке развития, он вместо этого считается за три пункта навыков, вложенные в этот навык. Этого хватает, чтобы поднять отсутствующий навык до уровня-1 или навык уровня-1 до уровня-2. Сделать это можно даже если уровень персонажа обычно не позволяет иметь навык такого уровня.\nЕсли пунктов навыков не хватает, чтобы поднять навык на новый уровень, они остаются в зачёт будущих повышений. Если бонус пришёлся на навык, уже имеющий уровень-4, ПИ может потратить эти три пункта навыков на любой другой навык по своему выбору.\nКроме того, по достижении пятого уровня оператор может выбрать третий Козырь в дополнение к двум имеющимся. Все преимущества этого Козыря действуют задним числом с первого уровня — например, бонусные пункты навыков от Образованного или бонус пунктов здоровья от Живучего. В кампаниях с магическими Козырями некоторые из них могут быть недоступны для покупки после первого уровня. Заклинатель, Призыватель и Благословённый доступны только новым персонажам."},
{"n":"2.8.0","l":2,"te":"Crafting and Modifying Gear","tr":"Изготовление и модификация снаряжения","en":"PCs with the right skills can build or modify their own gear or that of their teammates. The specific mods available for weapons, armor, vehicles, and cyberware are listed in the sections dedicated to those forms of gear.","ru":"ПИ с подходящими навыками могут собирать или переделывать своё снаряжение и снаряжение товарищей. Конкретные моды, доступные для оружия, брони, транспорта и кибернетики, перечислены в разделах, посвящённых этим видам снаряжения."},
{"n":"2.8.1","l":3,"te":"Crafting Gear","tr":"Изготовление снаряжения","en":"A tech requires a workshop that could plausibly build the gear in question. This may be nothing more than a toolkit for a simple device, or a full-fledged pharmaceutical lab for others. They also require a plausible source of parts for the device. This is usually a given if in a city or other salvage-rich area, but it may not be practical in a wilderness. Prudent techs can choose to buy a certain dollar amount of spare parts in the city and pack them along in a vehicle.\nBuilding gear takes a month for a vehicle or a week for a weapon, suit of armor, or other portable complex device. Very simple devices may be built faster at the GM's discretion.\nCrafted tech is made at three levels of quality. Jury-rigged tech takes one-half the time to build and costs one-quarter the market cost in parts. If scrap salvage is available it can be built at no cost but normal build times. As an improvised device, it counts as a mod requiring Fix-0 to keep functional, as explained below in the mod maintenance rules. If it goes 24 hours without maintenance, it stops functioning. Jury-rigged devices cannot be further modded.\nNormal devices cost the same amount in parts as the market cost and take the normal amount of time to build. They cannot be built with salvaged parts unless the GM decides the salvage is perfectly suited for it. Drugs, explosives, and other consumables must be crafted as normal devices rather than jury-rigged or mastercrafted ones.\nMastercrafted devices cost ten times as much in parts as the usual market cost and take twice as long to build. They are ideal platforms for a tech's mods, however, and the first mod their creator installs in them requires no maintenance.","ru":"Технику нужна мастерская, в которой в принципе можно собрать нужную вещь. Для простого устройства хватит и набора инструментов, а для чего-то другого понадобится полноценная фармацевтическая лаборатория. Также нужен разумный источник запчастей. В городе или другом богатом на хлам месте это само собой, но в глуши может оказаться нереально. Предусмотрительный техник может купить в городе запчастей на определённую сумму и везти их с собой в машине.\nСборка занимает месяц для машины и неделю для оружия, комплекта брони или другого сложного носимого устройства. Совсем простые устройства Мастер по своему решению может разрешить собрать быстрее.\nИзготовленная техника бывает трёх уровней качества. Собранная на скорую руку требует вдвое меньше времени на сборку и четверти рыночной цены в запчастях. Если есть годный хлам, её можно собрать вообще бесплатно, но за обычное время сборки. Как самоделка, она считается модом, требующим Ремонт-0 для поддержания работы, — по правилам Обслуживания модов, изложенным ниже. Если она сутки остаётся без Обслуживания, она перестаёт работать. Собранные на скорую руку устройства нельзя модифицировать дальше.\nОбычные устройства стоят в запчастях столько же, сколько на рынке, и собираются за обычное время. Их нельзя собрать из хлама, если только Мастер не решит, что найденный хлам идеально для этого подходит. Наркотики, взрывчатку и другие расходники можно изготавливать только как обычные устройства — не на скорую руку и не мастерски.\nМастерски изготовленные устройства стоят в запчастях в десять раз дороже обычной рыночной цены и собираются вдвое дольше. Зато это идеальная основа для модов техника: первый мод, который в них поставит их создатель, не требует Обслуживания."},
