{"n":"4.3.3.1","l":4,"te":"Specialized Subjects","tr":"Специализированные Объекты","en":"The Subject elements for sale in most underworld circles are intentionally generic in nature. They’re packed with basic intrusion profiles for dozens or hundreds of different targets of that type, with a host of generic exploits and cracks stored in their database. Even if the specific target model isn’t on their list, there are enough generic resources to give the hacker a chance.\nA specialized Subject is more focused, however. Instead of being a Cyber Subject, for example, it might be a Nerve Cyber Subject. These specialized Subjects are useless against more generic systems, but against their specific target, they grant a +1 bonus to any skill checks the program may require. Thus, the Nerve Cyber Subject would be worthless against a cyberleg, but could affect an Enhanced Reflexes I system.\nA unique Subject is focused on a single system, device model, or specific make of target. Instead of being a Nerve Cyber Subject, it might be an Enhanced Reflexes I Subject, or instead of a Flying Drone Target, it might be a Xiaowen Phoenix Subject. It’s useless against anything but that specific target, but grants a +2 bonus to any relevant skill checks.\nSpecialized Subjects are sometimes available on the black market. Unique Subjects are almost never to be found for casual purchase, and either require hand-development by the hacker who might need them or a specific Contact who can get them.","ru":"Элементы-Объекты, что продаются в большинстве кругов подполья, намеренно сделаны общими. В них набиты базовые профили проникновения для десятков и сотен разных целей своего типа, и в их базе лежит куча универсальных эксплойтов и взломов. Даже если конкретной модели цели в списке нет, универсальных ресурсов хватит, чтобы дать хакеру шанс.\nСпециализированный Объект, напротив, сфокусирован уже. Вместо Объекта *Кибер*, например, это может быть Объект *Нервный кибер*. Такие специализированные Объекты бесполезны против более общих систем, но против своей конкретной цели дают +1 на любые проверки навыка, которые может потребовать программа. Так, Объект *Нервный кибер* будет бесполезен против киберноги, но подействует на систему Улучшенные рефлексы I.\nУникальный Объект сфокусирован на одной системе, модели устройства или конкретной марке цели. Вместо Объекта *Нервный кибер* это может быть Объект *Улучшенные рефлексы I*, а вместо Объекта *Летающий дрон* — Объект *Xiaowen Phoenix*. Он бесполезен против чего угодно, кроме этой конкретной цели, но даёт +2 на любые соответствующие проверки навыка.\nСпециализированные Объекты иногда можно найти на чёрном рынке. Уникальные Объекты почти никогда не встречаются в свободной продаже — их либо разрабатывает своими руками хакер, которому они нужны, либо добывает конкретный Контакт, способный их достать."},
{"n":"4.3.4","l":3,"te":"Program Verbs","tr":"Глаголы программ","en":"The Verbs listed here are simply the most common ones available on the black market. Specialized alternatives do exist to produce non-standard effects in their targets, but these bespoke Verbs are usually custom-coded by those who need them.\nVerbs are listed with the valid Subject types they function against. A Verb cannot be run with an invalid target; you can’t Blind a data file or Delude an avatar\n\n\nVerb                Cost                Target                Access         Cost        Skill Check Mod\nActivate        $1,000                Device/Cyber        1*                +1\nAnalyze        $500                Device/Data        0*                +1\nAppend        $500                Data                1*                +0\nBlind                $2,000                Device/Cyber        1                +0\nDeactivate        $2,000                Device/Cyber        1*                +1\nDecrypt        $1,000                Data                1*                +0\nDefend                $1.000                Device/Cyber        0                N/A\nDelude                $5,000                Device                1                -1\nErase                $500                Data                1*                +1\nFrisk                $500                Cyber                0*                +1\nGhost                $2,000                Avatar                1                +0\nGlitch                $1,000                Device/Cyber        0                +2\nHijack                $5,000                Device                1                -1\nKill                $5,000                Avatar                1*                +0\nLock                $1,000                Device/Data        1                +1\nParalyze        $2,000                Avatar                1                -1\nReplace        $1,000                Data                1*                +0\nSabotage        $2,000                Device/Cyber        1*                -1\nSense                $1,000                Device/Cyber        0                +0\nSiege                $2,500                Device                1                -2\nSilence        $1,000                Avatar                1                +1\nStun                $1,000                Avatar                0*                +1\nTerminate        $500                Program        1*                +0\nUnlock                $500                Device/Data        1*                +1\n\n\nActivate: Turn a device or piece of cyberware on. You can’t control it or direct its function, but if it’s programmed to do something when activated, such as grant a bonus action in exchange for System Strain, it does it for one round or one action. The spasmodic activation of cyber outside of the wearer’s turn is unlikely to do anything useful, but it eats System Strain as usual if relevant.\nAnalyze: Identify the specific functionality of a device or the general topics of local datafiles. Hackers get a general idea of what kind of device a cyberspace node represents, but Analyze is needed to give specific details of where a device is in reality.\nAppend: Add a new entry or new data into a file. These new entries can’t overwrite or erase any existing data, however.\nBlind: Deactivate a device’s sensory input or make cyberware temporarily unable to get any input from anything but the wearer’s nervous system. Cybereyes are blind, cameras sense nothing, and laser tripwires don’t register the beam. Blind characters can’t effectively attack at range, their movement rate is halved, and they suffer a -4 penalty to both AC and melee hit rolls.\nDeactivate: Turn a device or piece of cyberware off. Most devices and cyber can be rebooted by the network or the user, but it’ll take a Main Action and a round to do so. If a network alert hasn’t been issued, the network may not notice a deactivated device until someone spots the problem.\nDecrypt: Decrypt a data file or radio transmission. This is often automatic for civilian encoding, though some files take Int/Program checks.\nDefend: A special Verb that can only be targeted at a friendly device or allied cyberware user within range, and costs no Access to use. While the program remains running, any hostile hacking attempts aimed at that device or any of the target’s cyber systems must first beat the user in an opposed Int/Program skill check before they can attempt their hack. This Verb cannot negate programs that are already running on the target.\nDelude: Spoof a device with false sensor input. A camera can be made to record nonexistent scenes, a minefield can be made to see phantom intrusions, a drone can feed the operator false visuals, and a turret can be made to mistake friends for foes. This Verb can’t control a device directly, however, and must rely on feeding it false sensor data.\nErase: Erase a data file. This Verb is extremely thorough, and any on-site backups can be expected to be nuked as well, either immediately or as soon as the automatic backup protocols expose them.\nFrisk: A Frisk Cyber program can give a list of all the cyber implanted in a specific human target within 30 meters, assuming the hacker’s skill check beats the cyber user’s security difficulty.\nGhost: Renders the targeted friendly avatar or Demon “invisible” until they take some cyberspace action other than Move Nodes. Observers in a node get an automatic opposed Int/Program check to detect a ghosted avatar’s presence, ending the program.\nGlitch: Temporarily deactivate a device or cyberware system while the program remains running, for no more than one round per Program skill level plus two. A device can be targeted by a particular hacker’s Glitch only once a day, successful or not.\nHijack: Seize control of a device, operating it as you wish within the limits of its functionality for as long as the program remains running. One command is free with the program’s successful execution; others take a Main Action to issue.\nKill: Through forced autonomic feedback and out-of-bounds electrical current parameters, inflict lethal damage to an enemy avatar equal to 1d10 per Program skill level, to a minimum of 1d10 on a successful opposed Int/Program skill check. This damage has a Trauma Die of 1d8 and a x3 Trauma Rating. The victim’s Trauma Target is not modified by armor, but it is by cyber or other modifiers. Unconscious hackers cannot resist this Verb and will be instantly killed by it. This Verb has no effect on Demons.\nLock: Lock a physical device that has some sort of electronic locking mechanism or a currently-unlocked cyberspace node barrier.\nParalyze: On a successful opposed Int/Program skill check against the target, render a Demon or avatar incapable of moving out of a node or using the Alert the Network or Send Message actions while the program is running. Other cyberspace actions can be taken normally. Human hackers are also physically paralyzed while the program runs, incapable of moving in meatspace until the connection is cut or the program ends.\nReplace: Edit a data file, changing one piece of data in it into another of the hacker’s choice. It cannot erase or add data outright, only alter it.\nSabotage: Cause a physical device or cyberware system to damage itself through violent movement or self-destructive current surges. Devices smaller than a car will usually be disabled until repaired. Cyberware users do not take damage, but must make two Physical saves to resist the effect; if they fail both, the targeted system is disabled until the next maintenance, and if they fail one, it’s frozen for one round. A device or cyber can be targeted by this Verb only once per scene.\nSense: Piggyback on the sensory feed of a device or piece of cyber. Anything the device senses or records, the hacker can sense. Swapping focus from cyberspace to reality is an On Turn action.\nSiege: If a Device is successfully Sieged, its network connections are severed for everyone but the hacker, blocking transit, data, or drone control. Defenders can run Terminate Program against it from any adjacent node.\nSilence: The affected avatar or Demon is unable to use the Send Message cyberspace action while this program runs. Alert the Network can still be done.\nStun: Disrupt an avatar or Demon with sensory glitching, non-lethal current surges, and code corruption. Make an Int/Program skill check; beat an opposed Int/Program check for a human target, or a static 8+skill bonus target for a Demon. The target takes 1d10 non-lethal damage per Program level, to a minimum of 1d10. \nTerminate: Prematurely end an undesired program. Any damage or changes the program already inflicted are unaffected.\nUnlock: Unlock a physical device with an electronic lock or a network’s cyberspace node barrier.","ru":"Перечисленные здесь Глаголы — просто самые распространённые на чёрном рынке. Специализированные аналоги для нестандартных эффектов существуют, но такие штучные Глаголы обычно пишут под себя те, кому они нужны.\nГлаголы указаны вместе с типами Объектов, против которых они работают. Глагол нельзя запустить по неподходящей цели: нельзя Ослепить файл данных или Обмануть аватар\n\n\n| Глагол | Цена | Цель | Доступ | Мод проверки | Применение |\n|---|---|---|---|---|---|\n| Активировать | $1 000 | Устройство/Кибер | 1* | +1 | Включить устройство или кибернетику |\n| Анализировать | $500 | Устройство/Данные | 0* | +1 | Определить устройство или тему файла |\n| Дописать | $500 | Данные | 1* | +0 | Добавить в файл запись или данные |\n| Ослепить | $2 000 | Устройство/Кибер | 1 | +0 | Отключить сенсорный вход устройства или кибера |\n| Деактивировать | $2 000 | Устройство/Кибер | 1* | +1 | Выключить цель хотя бы на раунд |\n| Расшифровать | $1 000 | Данные | 1* | +0 | Расшифровать файл или радиопередачу |\n| Защитить | $1 000 | Устройство/Кибер | 0 | Н/П | Прикрыть дружественное устройство или кибер-систему |\n| Обмануть | $5 000 | Устройство | 1 | -1 | Подсунуть устройству ложные данные сенсоров |\n| Стереть | $500 | Данные | 1* | +1 | Стереть файл и испортить резервные копии |\n| Обыскать | $500 | Кибер | 0* | +1 | Получить список кибернетики цели |\n| Скрыть | $2 000 | Аватар | 1 | +0 | Стать «невидимым», пока только перемещаешься |\n| Сглючить | $1 000 | Устройство/Кибер | 0 | +2 | Кратко отключить устройство или кибер |\n| Захватить | $5 000 | Устройство | 1 | -1 | Взять устройство под дистанционный контроль |\n| Убить | $5 000 | Аватар | 1* | +0 | Летальная отдача по человеческому аватару |\n| Запереть | $1 000 | Устройство/Данные | 1 | +1 | Запереть электронный замок или барьер узла |\n| Парализовать | $2 000 | Аватар | 1 | -1 | Парализовать владельца аватара через сеть |\n| Заменить | $1 000 | Данные | 1* | +0 | Подменить данные в файле |\n| Саботировать | $2 000 | Устройство/Кибер | 1* | -1 | Заставить цель повредить саму себя |\n| Ощутить | $1 000 | Устройство/Кибер | 0 | +0 | Подключиться к потоку сенсора или кибера |\n| Осадить | $2 500 | Устройство | 1 | -2 | Отрезать узел устройства от сети |\n| Заглушить | $1 000 | Аватар | 1 | +1 | Заблокировать действие Отправить сообщение |\n| Оглушить | $1 000 | Аватар | 0* | +1 | Нанести аватару нелетальный урон |\n| Завершить | $500 | Программа | 1* | +0 | Принудительно закрыть чужую программу |\n| Отпереть | $500 | Устройство/Данные | 1* | +1 | Отпереть электронный замок или барьер узла |\n\n\n**Активировать:** Включить устройство или кибернетический имплант. Управлять им или задавать его работу ты не можешь, но если он запрограммирован что-то делать при включении — например, давать бонусное действие в обмен на Системную нагрузку, — он это делает на один раунд или одно действие. Судорожное срабатывание кибера вне хода носителя вряд ли принесёт пользу, но Системную нагрузку жрёт как обычно, если она тут применима.\n**Анализировать:** Определить конкретную функциональность устройства или общие темы локальных файлов данных. Хакеры и так примерно понимают, какого рода устройство представляет узел киберпространства, но чтобы узнать точно, где это устройство находится в реальности, нужен Анализировать.\n**Дописать:** Добавить в файл новую запись или новые данные. Правда, эти новые записи не могут перезаписать или стереть уже существующие данные.\n**Ослепить:** Отключить сенсорный вход устройства или лишить кибернетику способности временно получать любой сигнал, кроме сигналов нервной системы носителя. Киберглаза слепнут, камеры ничего не видят, лазерные растяжки не регистрируют луч. Ослеплённые персонажи не могут толком атаковать на расстоянии, их скорость перемещения уменьшается вдвое, и они получают штраф -4 к КЗщ и к броскам атаки в ближнем бою.\n**Деактивировать:** Выключить устройство или кибернетический имплант. Большинство устройств и кибера можно перезагрузить силами сети или пользователя, но это займёт Основное действие и раунд. Если тревога в сети не поднята, сеть может не замечать отключённое устройство, пока кто-нибудь не увидит проблему.\n**Расшифровать:** Расшифровать файл данных или радиопередачу. Для гражданского кодирования это часто происходит автоматически, но некоторые файлы требуют проверок Инт/Программирование.\n**Защитить:** Особый Глагол, который можно нацелить только на дружественное устройство или на союзника с кибернетикой в пределах дистанции, и он не стоит Доступа. Пока программа работает, любые враждебные попытки хакинга, направленные на это устройство или на любую из кибер-систем цели, должны сначала побить пользователя во встречной проверке Инт/Программирование, и только потом они могут пробовать свой взлом. Этот Глагол не может отменить программы, которые уже работают на цели.\n**Обмануть:** Подсунуть устройству ложные данные сенсоров. Камеру можно заставить записывать несуществующие сцены, минное поле — видеть фантомные вторжения, дрон — гнать оператору ложную картинку, а турель — принимать своих за врагов. Однако напрямую управлять устройством этот Глагол не может и работает только за счёт подачи ложных сенсорных данных.\n**Стереть:** Стереть файл данных. Этот Глагол крайне тщателен: все локальные резервные копии тоже можно считать уничтоженными — либо сразу, либо как только их вскроют автоматические протоколы резервного копирования.\n**Обыскать:** Программа Обыскать Кибер выдаёт список всей кибернетики, вживлённой в конкретную человеческую цель в пределах 30 м, если проверка навыка хакера побила сложность защиты пользователя кибера.\n**Скрыть:** Делает выбранный дружественный аватар или Демона «невидимым», пока тот не совершит в киберпространстве какое-либо действие, кроме Смены узла. Наблюдатели в узле получают автоматическую встречную проверку Инт/Программирование, чтобы заметить присутствие скрытого аватара, и это завершает программу.\n**Сглючить:** Временно отключить устройство или кибер-систему, пока программа работает, но не больше чем на один раунд за уровень навыка Программирование плюс два. Конкретный хакер может нацелить Сглючить на одно устройство только раз в день, успешно или нет.\n**Захватить:** Взять устройство под контроль и управлять им как хочешь в пределах его функциональности, пока программа работает. Одна команда даётся бесплатно при успешном запуске программы; остальные требуют Основного действия.\n**Убить:** Через принудительную автономную обратную связь и запредельные параметры электрического тока нанести враждебному аватару летальный урон, равный 1d10 за уровень навыка Программирование, но минимум 1d10, при успешной встречной проверке Инт/Программирование. У этого урона Кость травмы 1d8 и Множитель травмы ×3. Порог травмы жертвы не изменяется бронёй, но изменяется кибером и другими модификаторами. Хакеры без сознания не могут сопротивляться этому Глаголу и будут им мгновенно убиты. На Демонов этот Глагол не действует.\n**Запереть:** Запереть физическое устройство с каким-либо электронным запирающим механизмом или сейчас отпертый барьер узла киберпространства.\n**Парализовать:** При успешной встречной проверке Инт/Программирование против цели Демон или аватар лишается возможности выходить из узла и использовать действия Поднять тревогу в сети или Отправить сообщение, пока работает программа. Остальные действия в киберпространстве можно совершать как обычно. Хакеры-люди при этом ещё и физически парализованы, пока работает программа: они не могут двигаться в реале, пока связь не оборвётся или программа не завершится.\n**Заменить:** Отредактировать файл данных, превратив один фрагмент данных в нём в другой на выбор хакера. Стирать или добавлять данные напрямую он не может, только изменять.\n**Саботировать:** Заставить физическое устройство или кибер-систему повредить себя резкими движениями или самоубийственными скачками тока. Устройства меньше машины обычно выходят из строя до ремонта. Пользователи кибернетики урона не получают, но должны сделать два Физических спасброска, чтобы устоять против эффекта; если провалят оба, целевая система выведена из строя до следующего обслуживания, а если провалят один — она застынет на один раунд. Устройство или кибер можно нацелить этим Глаголом только раз за сцену.\n**Ощутить:** Подсесть на сенсорный поток устройства или кибера. Всё, что устройство чувствует или записывает, чувствует и хакер. Переключение внимания с киберпространства на реальность — Действие в свой ход.\n**Осадить:** Если Устройство успешно Осаждено, его сетевые подключения обрублены для всех, кроме хакера, что блокирует транзит, данные или управление дронами. Защитники могут запустить против неё Завершить Программу из любого соседнего узла.\n**Заглушить:** Затронутый аватар или Демон не может использовать действие Отправить сообщение, пока работает эта программа. Поднять тревогу в сети по-прежнему возможно.\n**Оглушить:** Расстроить аватар или Демона сенсорным глюком, нелетальными скачками тока и порчей кода. Сделай проверку Инт/Программирование; побей встречную проверку Инт/Программирование для человеческой цели или фиксированный порог 8 + бонус навыка для Демона. Цель получает 1d10 нелетального урона за уровень Программирования, но минимум 1d10.\n**Завершить:** Досрочно прекратить нежелательную программу. Любой урон или изменения, которые программа уже нанесла, при этом не отменяются.\n**Отпереть:** Отпереть физическое устройство с электронным замком или барьер узла киберпространства в сети."},
{"n":"4.4.0","l":2,"te":"Demons and Watchdogs","tr":"Демоны и Сторожа","en":"Corporate systems almost always have some sort of active defenses. Without a vigilant Demon or two in the system to alert security guards, occupants of a facility might never realize that their network is under attack. In the same fashion, human watchdog hackers are often plugged into the more important networks, maintaining a 24/7 human presence within it.","ru":"У корпоративных систем почти всегда есть какая-то активная защита. Без бдительного Демона-двух в системе, который поднимет охрану, обитатели объекта могут вообще не узнать, что их сеть атакуют. Точно так же к более важным сетям часто подключены хакеры-сторожа из плоти и крови, поддерживающие в сети живое присутствие 24/7."},
{"n":"4.4.1","l":3,"te":"Demons","tr":"Демоны","en":"Demons are autonomous programs supported by a network’s server hardware. Demons have avatars much as human hackers do, but operate based on a list of prioritized command lines, carrying out their duties according to their programmed behavior.\nDemons are smart enough to prioritize commands intelligently; they won’t try to perform an obviously-impossible task in preference to an action that actually is possible. They are not intelligent, however, and can’t make choices unrelated to their program.\nDemon programming is expressed in command lines, each line representing one action or purpose. Demons prioritize their command list from top to bottom, skipping commands that aren’t applicable. Every demon has a limit in the number of command lines they can process. Lists more lengthy than this are too complicated for the program’s logic to handle effectively.\nDemon programs can use the Verbs and Subjects loaded into the network server they are operating on.\nDemons have hit points which are depleted by the Stun Avatar program or other effects that damage code integrity. When HP reach zero, the Demon is fragged, and can do nothing until it reboots itself in an hour. It still counts for maximum-demons-per-node, however.\nDemons also have a skill bonus. This bonus is applied to any cyberspace-related skill checks they may need to make, and counts as their skill level for the damage done by Stun or Kill Avatar.\nDemons are located in a network based on the owner’s preferences. Sensitive nodes are often guarded by a Demon, as are network chokepoints. Some Demons are set to patrol the network, either in a regular pattern or as a random walk through connected nodes. Demons can ignore network barriers and do not need to spend Access to run programs, as they are assumed to have admin privileges.\nA given network can support only so many Demons, based on the power of the network server. The network server lists both the maximum number of Demons that the network can support and the maximum number of Demons that can effectively act in the same node. If more than this number of Demons are crowded into the same node, the newest arrivals can do nothing but Move Nodes.\n\n\nDemon                Cost                Lines        HP        Skill\nTripwire        $5,000                2        3        +1\nMastiff                $10,000        4        5        +2\nSiren                $15,000        2        8        +3\nCataphract        $25,000        3        20        +3\nOgre                $50,000        4        25        +2\nHeadsman        $100,000        4        30        +3\nHydra                $200,000        7        40        +4\nNemesis        $500,000        5        50        +5","ru":"Демоны — автономные программы, работающие на серверном железе сети. У Демонов есть аватары, как и у хакеров-людей, но действуют они по списку приоритетных командных строк, выполняя свои обязанности согласно заложенному поведению.\nДемоны достаточно умны, чтобы расставлять приоритеты команд разумно: они не станут пытаться выполнить очевидно невозможную задачу вместо действия, которое реально возможно. Однако разумными они не являются и не могут делать выбор, не связанный с их программой.\nПрограмма Демона выражается в командных строках, каждая строка — одно действие или назначение. Демоны выполняют свой список команд сверху вниз, пропуская неприменимые. У каждого демона есть предел числа командных строк, которые он способен обработать. Списки длиннее этого предела слишком сложны для логики программы, чтобы работать эффективно.\nПрограммы-демоны могут использовать Глаголы и Объекты, загруженные в сетевой сервер, на котором они работают.\nУ Демонов есть пункты здоровья, которые расходуются программой Оглушить Аватар и другими эффектами, повреждающими целостность кода. Когда ПЗ падают до нуля, Демон фрагнут и ничего не может делать, пока не перезагрузится через час. Однако он всё равно считается в лимите демонов-на-узел.\nУ Демонов также есть бонус навыка. Этот бонус применяется к любым проверкам навыков, связанным с киберпространством, которые им придётся делать, и считается их уровнем навыка при расчёте урона от Оглушить или Убить Аватар.\nДемоны размещаются в сети по предпочтениям владельца. Чувствительные узлы часто охраняет Демон, как и узкие места сети. Некоторых Демонов ставят патрулировать сеть — по регулярному маршруту или случайным блужданием по связанным узлам. Демоны могут игнорировать сетевые барьеры и не тратят Доступ на запуск программ, поскольку считается, что у них есть админ-права.\nДанная сеть способна поддерживать лишь определённое число Демонов, в зависимости от мощности сетевого сервера. У сетевого сервера указано и максимальное число Демонов, которое сеть может поддерживать, и максимальное число Демонов, которые могут эффективно действовать в одном узле. Если в одном узле набьётся больше этого числа Демонов, вновь прибывшие не могут делать ничего, кроме Смены узла.\n\n\n| Демон | Цена | Строк | ПЗ | Навык |\n|---|---|---|---|---|\n| Растяжка | $5 000 | 2 | 3 | +1 |\n| Мастиф | $10 000 | 4 | 5 | +2 |\n| Сирена | $15 000 | 2 | 8 | +3 |\n| Катафракт | $25 000 | 3 | 20 | +3 |\n| Огр | $50 000 | 4 | 25 | +2 |\n| Палач | $100 000 | 4 | 30 | +3 |\n| Гидра | $200 000 | 7 | 40 | +4 |\n| Немезида | $500 000 | 5 | 50 | +5 |"},
{"n":"4.4.1.1","l":4,"te":"Demon Command Lines","tr":"Командные строки Демонов","en":"The following command lines are examples of some of the instructions that can be given to a Demon. A given Demon can be programmed with as many of these lines as their capabilities allow, and will follow them in order of priority from top to bottom. Demons are intelligent enough not to waste time trying to do impossible things.\n\n\nExample Command Lines\nPerform the Alert the Network action when an intruder is sighted, if it isn’t already alerted.\nReboot deactivated devices on the node and message any watchdogs who may be on duty.\nRun Stun Avatar against any intruders until they have been knocked unconscious or offline.\nRun Lock Barrier on an unlocked node barriers you encounter and message any watchdogs who may be on duty.\nMove through the network in a specific patrol or random wander.\nRun Kill Avatar against any unconscious intruders until they are dead.\nPursue intruders through the network, choosing randomly if multiple intruders are encountered.\nRun Erase Program against an intruder’s Stun Verb if they have used it in your presence before.\nRun Terminate Program against any active Hijack programs currently running in your presence.\nRun Paralyze Avatar against an intruder to physically lock them down before further countermeasures.\nMessage security with the Send Message action whenever you execute a line action in response to some anomaly.\nReserve a Main Action to run Defend Device in response to any attempts to hack devices in the node you’re in.","ru":"Приведённые ниже командные строки — примеры инструкций, которые можно дать Демону. Конкретного Демона можно запрограммировать таким количеством этих строк, какое позволяют его возможности, и он будет выполнять их в порядке приоритета сверху вниз. Демоны достаточно умны, чтобы не тратить время на попытки сделать невозможное.\n\n\n**Примеры командных строк**\nВыполнить действие Поднять тревогу в сети при обнаружении нарушителя, если тревога ещё не поднята.\nПерезагружать отключённые устройства в узле и сообщать любым сторожам, которые могут быть на дежурстве.\nЗапускать Оглушить Аватар против любых нарушителей, пока их не выключит без сознания или не отрубит от сети.\nЗапускать Запереть Барьер на встреченных отпертых барьерах узлов и сообщать любым сторожам, которые могут быть на дежурстве.\nПеремещаться по сети по определённому маршруту патрулирования или случайным блужданием.\nЗапускать Убить Аватар против любых нарушителей без сознания, пока те не погибнут.\nПреследовать нарушителей по сети, выбирая случайно, если встречено несколько нарушителей.\nЗапускать Стереть Программу против Глагола Оглушить нарушителя, если он уже применял его в твоём присутствии.\nЗапускать Завершить Программу против любых активных программ Захватить, работающих в твоём присутствии.\nЗапускать Парализовать Аватар против нарушителя, чтобы физически обездвижить его до дальнейших контрмер.\nСообщать охране действием Отправить сообщение всякий раз, когда выполняешь действие по строке в ответ на какую-либо аномалию.\nДержать Основное действие в резерве, чтобы запустить Защитить Устройство в ответ на любые попытки взломать устройства в узле, где ты находишься."},
{"n":"4.4.2","l":3,"te":"Watchdogs","tr":"Сторожа","en":"Demons are tireless, vigilant, and require no wages. Human hackers, despite being deficient in these regards, are substantially more flexible and intelligent. Watchdog hackers are usually hired in 24/7 shifts in order to maintain round-the-clock observation of important networks that can afford their considerable expense, though some poorer facilities hire them only during working hours.\nWatchdogs use the same hacking rules as PCs do, albeit they can ignore network barriers and do not need to pay Access to run their programs. To avoid a single point of failure, the vast majority use personal cyberdecks and their own programs rather than relying on the facility’s server computing power.\nAs watchdogs are intelligent, they can and will maintain full communications with the facility’s physical security staff. PCs who alert them to their presence can expect local security to come running to the physical location of any compromised device nodes.\nBelow are statistics for some of the common types of watchdogs encountered by PC hackers. Minor corps or gangs might be able to hire only minimally-competent hackers, but major black sites and important corporate facilities will have the best talent money can buy, with hacking cyber and decks to match.\n\n\nWatchdog                        Program Skill        Int Mod.        Monthly Salary\nCode Drone (1 HD)                Level-0        +1                $2,000\nVeteran Tech (2 HD)                Level-1        +1                $5,000\nTalented Pro (4 HD)                Level-2        +1                $10,000\nBig Name (6 HD)                Level-3        +2                $50,000\nDire Legend (9 HD)                Level-4        +2                N/A","ru":"Демоны неутомимы, бдительны и не требуют зарплаты. Хакеры-люди, при всей своей недостаточности по этим пунктам, существенно гибче и умнее. Хакеров-сторожей обычно нанимают сменами 24/7, чтобы обеспечить круглосуточное наблюдение за важными сетями, которые могут позволить себе такие немалые расходы, хотя объекты победнее нанимают их только на рабочие часы.\nСторожа используют те же правила хакинга, что и ПИ, но при этом могут игнорировать сетевые барьеры и не платят Доступ за запуск своих программ. Чтобы избежать единой точки отказа, огромное большинство пользуется личными кибердеками и своими программами, а не полагается на вычислительные мощности сервера объекта.\nПоскольку сторожа разумны, они могут и будут поддерживать полную связь с физической охраной объекта. ПИ, которые выдали им своё присутствие, могут ожидать, что местная охрана прибежит к физическому местоположению любого скомпрометированного узла-устройства.\nНиже приведены статы некоторых распространённых типов сторожей, с которыми сталкиваются хакеры-ПИ. Мелкие корпы или банды могут позволить себе только минимально годных хакеров, но у чёрных объектов и важных корпоративных комплексов будут лучшие таланты, какие можно купить за деньги, с хакерским кибером и деками под стать.\n\n\n| Сторож | Программирование | Мод. Инт | Месячный оклад |\n|---|---|---|---|\n| Кодовый дрон (1 КЗд) | уровень-0 | +1 | $2 000 |\n| Опытный техник (2 КЗд) | уровень-1 | +1 | $5 000 |\n| Талантливый профи (4 КЗд) | уровень-2 | +1 | $10 000 |\n| Большое имя (6 КЗд) | уровень-3 | +2 | $50 000 |\n| Грозная легенда (9 КЗд) | уровень-4 | +2 | Н/П |"},
{"n":"4.5.0","l":2,"te":"Network Servers and Architecture","tr":"Сетевые серверы и архитектура","en":"The server classes listed here are some of the most common, and a corporation can be relied upon to use the smallest iron they can get away with. There can only be one primary server on a single network; others might be connected to it, but only the primary server counts for determining node connection limits, barriers, or active demons.\nServers have node connection limits. This is the maximum number of nodes that can be connected to the server. If you want to connect 4 cameras, 3 doors, a security panel, and the server itself, you need to have at least 9 connections available.\nHackable devices without a connection to the server can’t communicate with it, but still function normally. An electronically-locked door with no connection can still be hacked, and PCs can still jack in to its cyberspace node, but there’s no way for the server to monitor the door or control its status.\nServers have barrier limits. This is the maximum number of barriers that the network can support. Barriers can be bidirectional or only work one-way as the network architect desires.\nServers have Demon limits. A given server can only support so many Demons, and only so many of those can be active in one node at a time. The table adjacent lists both maximum total Demons and, parenthetically, how many can act in one node at a time.\nServers have effectively unlimited Memory. Even the smallest, simplest server can contain as many Verbs, Subjects, or datafiles as a user needs. Any Demons supported by the server can use its Verbs and Subjects. As a result, prudent network architects try to keep invading hackers out of the primary server node; a well placed Erase Datafile execution can erase critical Verbs from the server and defang the network’s Demons. Human watchdogs use their own cyberdecks, so are not subject to this risk.\n\n\nServer                Cost                Max. Nodes        Max. Barriers        Max Demons\nDatabank        $2,000                0                0                0\nAlpha                $10,000        10                1                2 (1)\nBeta                $50,000        15                2                3 (2)\nGamma        $100K                20                4                5 (2)\nDelta                $500K                25                6                8 (2)\nEpsilon        $1M                30                10                12 (3)","ru":"Перечисленные здесь классы серверов — одни из самых распространённых, и можно смело рассчитывать, что корпорация возьмёт самое мелкое железо, на каком сумеет выехать. В одной сети может быть только один основной сервер; другие могут быть к нему подключены, но только основной сервер учитывается при определении лимитов подключения узлов, барьеров и активных демонов.\nУ серверов есть лимиты подключения узлов. Это максимальное число узлов, которые можно подключить к серверу. Если хочешь подключить 4 камеры, 3 двери, панель охраны и сам сервер, тебе нужно как минимум 9 доступных подключений.\nВзламываемые устройства без подключения к серверу не могут с ним связываться, но работают как обычно. Дверь с электронным замком без подключения по-прежнему можно взломать, и ПИ по-прежнему могут подключиться к её узлу киберпространства, но у сервера нет никакой возможности следить за дверью или управлять её состоянием.\nУ серверов есть лимиты барьеров. Это максимальное число барьеров, которые может поддерживать сеть. Барьеры могут быть двунаправленными или работать только в одну сторону — как захочет архитектор сети.\nУ серверов есть лимиты Демонов. Данный сервер может поддерживать лишь определённое число Демонов, и лишь определённое их число может быть активно в одном узле одновременно. В таблице рядом указано и максимальное общее число Демонов, и, в скобках, сколько из них могут действовать в одном узле одновременно.\nУ серверов фактически неограниченная Память. Даже самый мелкий и простой сервер может содержать столько Глаголов, Объектов или файлов данных, сколько нужно пользователю. Любые поддерживаемые сервером Демоны могут использовать его Глаголы и Объекты. Поэтому предусмотрительные архитекторы сетей стараются не подпускать хакеров-вторженцев к узлу основного сервера: удачно поставленный запуск Стереть Файл данных может стереть с сервера критически важные Глаголы и обезвредить Демонов сети. Сторожа-люди пользуются своими кибердеками, так что этому риску не подвержены.\n\n\n| Сервер | Цена | Макс. узлов | Макс. барьеров | Макс. Демонов |\n|---|---|---|---|---|\n| Датабанк | $2 000 | 0 | 0 | 0 |\n| Альфа | $10 000 | 10 | 1 | 2 (1) |\n| Бета | $50 000 | 15 | 2 | 3 (2) |\n| Гамма | $100 тыс. | 20 | 4 | 5 (2) |\n| Дельта | $500 тыс. | 25 | 6 | 8 (2) |\n| Эпсилон | $1 млн | 30 | 10 | 12 (3) |"},
{"n":"5.0.0","l":1,"te":"Antagonists and NPCs","tr":"Противники и NPC","en":"This section gives rules for creating NPC statistics and handling common encounters. Each of the NPCs and creatures listed in the following sections are given a default stat block. These blocks are meant to represent a typical person of their type; individuals will doubtless vary as the situation recommends. Each of the stat lines are described below.\nHD: The hit dice of the NPC, along with their average hit points. If they’re wearing armor that has Damage Soak, these bonus hit points are noted as well, such as “5 HP+2” for someone wearing armor with 2 points of Damage Soak.\nAC: Both ranged and melee AC are noted here, accounting for any cyber or armor they may have.\nTT: The NPC’s Trauma Target is given here, modified for any cyber, armor, or Edges they have.\nSkill: The default total skill bonus applied to any skill check the NPC would reasonably be good at. Thus, if a burglar with a Skill of +2 had to make a Sneak check, they’d roll 2d6+2.\nSave: An NPC only has one saving throw, rolled for all types of saves. By default, it’s equal to their hit dice divided by two, rounded down, and subtracted from 15.\nAtk: The NPC’s ranged and melee attack bonuses, taking into account any cyber or Foci they may have. An NPC’s base attack bonus is usually equal to their hit dice plus a plausible level of combat skill. Some wild beasts may get more than one attack from a single Main Action. This multiattack is represented by a “x2” or “x3” notation.\nDmg: For creatures, this is the damage their natural fangs or claws may do. NPCs use damage of the weapon they’re currently wielding, as noted in their gear entry.\nShock: The Shock damage the NPC’s usual melee attack does. Shock that applies to “Any” AC pierces anything short of Shock immunity from shields, Foci, or some cyber systems.\nMove: The number of meters the NPC can move in a single Move action.\nML: The Morale score of the NPC. When a Morale check is forced by events, they must roll 2d6. If they roll over their Morale score, they break and begin to retreat, surrender, or otherwise flee.\nDanger Value: A rough estimate of the NPC’s lethality in personal combat, as per page 193.\nGear: The armor and weaponry the NPC carries on a regular basis. Powerful or well-connected NPCs may use modded gear as explained in section 2.8.2. Incidental equipment is not listed; corp cops will have radios, first aid kits, handcuffs, and other minor items that fit their job role. NPCs may switch out armor or weapons if they expect trouble or are preparing for a major fight.\n\n\nGMs should add in the effects of any cyber the NPCs are using to their stat line, and make a brief note of its effects for reference during play.","ru":"Этот раздел даёт правила для создания статистик NPC и разрешения типовых встреч. Каждому из NPC и существ, перечисленных в следующих разделах, дан стандартный статблок. Эти блоки представляют типичного представителя своего типа; отдельные особи, разумеется, будут отличаться так, как того требует ситуация. Каждая строка статов описана ниже.\n\n**КЗд:** Кости здоровья NPC вместе со средним значением пунктов здоровья. Если на нём броня с Поглощением урона, эти бонусные пункты здоровья тоже указаны — например, «5 ПЗ+2» для того, кто носит броню с 2 пунктами Поглощения урона.\n\n**КЗщ:** Здесь указаны и дальний, и ближний КЗщ, с учётом любого кибера и брони, что у него есть.\n\n**ПТ:** Здесь дан Порог травмы NPC, изменённый с учётом любого кибера, брони или Козырей, которые у него есть.\n\n**Нав:** Стандартный суммарный бонус навыка, применяемый к любой проверке навыка, в которой NPC разумно ожидать хорошим. Так, если взломщик с Нав +2 должен сделать проверку Скрытности, он бросает 2d6+2.\n\n**Спас:** У NPC только один спасброск, который бросается для всех типов спасбросков. По умолчанию он равен его костям здоровья, поделённым на два с округлением вниз и вычтенным из 15.\n\n**Атк:** Бонусы атаки NPC на расстоянии и в ближнем бою, с учётом любого кибера или Фокусов, что у него есть. Базовый бонус атаки NPC обычно равен его костям здоровья плюс правдоподобный уровень боевого навыка. Некоторые дикие звери могут получить больше одной атаки от одного Основного действия. Такая мультиатака обозначается пометкой «×2» или «×3».\n\n**Урон:** Для существ это урон, который наносят их природные клыки или когти. NPC используют урон того оружия, которым в данный момент вооружены, как указано в записи их снаряжения.\n\n**Шок:** Урон Шока, который наносит обычная атака NPC в ближнем бою. Шок, применяющийся к «Любому» КЗщ, пробивает всё, кроме иммунитета к Шоку от щитов, Фокусов или некоторых кибер-систем.\n\n**Скор.:** Число метров, которое NPC может пройти одним Действием перемещения.\n\n**Дух:** Показатель боевого духа NPC. Когда события вынуждают проверку боевого духа, он должен бросить 2d6. Если результат больше его показателя боевого духа, он ломается и начинает отступать, сдаваться или иначе спасаться.\n\n**Уровень опасности:** Приблизительная оценка убойности NPC в личном бою, см. стр. 193.\n\n**Снаряжение:** Броня и оружие, которое NPC носит с собой постоянно. Могущественные или хорошо связанные NPC могут использовать модданое снаряжение, как объяснено в разделе 2.8.2. Мелочёвка не перечисляется; корп-копы будут иметь рации, аптечки, наручники и прочие мелкие предметы, положенные их работе. NPC могут сменить броню или оружие, если ждут проблем или готовятся к серьёзной драке.\n\n\nМастерам следует добавить в строку статов эффекты любого кибера, который используют NPC, и коротко записать его эффекты для справки во время игры."},
{"n":"5.1.0","l":2,"te":"Reaction Rolls","tr":"Проверки реакции","en":"When the PCs encounter someone, the GM should make a reaction roll. This roll is 2d6 modified by the Charisma modifier of the PC spokesman or face.\n\n\n2d6        Reaction\n2-        As hostile and violent as is plausible\n3-5        Hostile and unfriendly to the PCs\n6-8        A neutral or expected reaction from them\n9-11        Unusually friendly or cooperative\n12+        As friendly and helpful as is plausible\n\n\nThe reaction will be keyed to the situation. A socialite braced at a nightclub who rolls a low reaction won’t physically attack the PCs, but they can’t expect much courtesy from her. An assassin with a good reaction might still be hired to kill the PC, but could offer to accept a counter-bid from them instead. It’s up to the GM to decide why the reaction worked out the way it did.","ru":"Когда ПИ кого-то встречают, Мастеру следует сделать проверку реакции. Это бросок 2d6, изменённый модификатором Харизмы того ПИ, кто говорит за группу или работает лицом.\n\n\n| 2d6 | Реакция |\n|---|---|\n| 2- | Настолько враждебно и жестоко, насколько это правдоподобно |\n| 3-5 | Враждебно и недружелюбно к ПИ |\n| 6-8 | Нейтральная или ожидаемая реакция |\n| 9-11 | Необычно дружелюбно или готово к сотрудничеству |\n| 12+ | Настолько дружелюбно и полезно, насколько это правдоподобно |\n\n\nРеакция привязана к ситуации. Светская дама, которую зажали в ночном клубе, при низком результате реакции не станет физически атаковать ПИ, но и особой вежливости от неё ждать не стоит. Наёмный убийца с хорошей реакцией всё равно может быть нанят убить ПИ, но вместо этого может предложить принять от них встречную ставку. Мастер решает, почему реакция вышла именно такой."},
{"n":"5.2.0","l":2,"te":"Morale Checks","tr":"Проверки боевого духа","en":"Every NPC combatant has a Morale score ranging from 2 to 12. The higher the score, the calmer and more determined the fighter is while under enemy fire. An NPC with a Morale score of 2 will flee at the slightest threat to their lives, while one with a Morale of 12 will fight until the last flicker of hope is gone, or to the death if their cause is important enough.\nSome combat events will force a Morale check on NPCs. To make this check, the GM rolls 2d6 and compares it to their Morale scores; if the roll is equal or higher than their score, they break. What that means will depend on the situation and their level of training, but it always means that they want to get away from the fight as rapidly as possible.\nPCs do not have Morale scores and do not ever need to make Morale checks. They fight or flee as the players decide, regardless of the situation.","ru":"У каждого NPC-бойца есть показатель боевого духа в диапазоне от 2 до 12. Чем выше показатель, тем спокойнее и упорнее боец под огнём противника. NPC с боевым духом 2 сбежит при малейшей угрозе жизни, а с боевым духом 12 будет драться, пока не погаснет последний огонёк надежды, — или до смерти, если его дело того стоит.\n\nНекоторые боевые события вынуждают NPC делать проверку боевого духа. Для этой проверки Мастер бросает 2d6 и сравнивает с их показателями боевого духа; если результат равен показателю или выше, они ломаются. Что это значит, зависит от ситуации и уровня их подготовки, но всегда означает, что они хотят убраться из боя как можно быстрее.\n\nУ ПИ нет показателей боевого духа, и им никогда не нужно делать проверки боевого духа. Они сражаются или бегут так, как решат игроки, независимо от ситуации."},
{"n":"5.2.1","l":3,"te":"Morale Check Situations","tr":"Ситуации проверки боевого духа","en":"A group of NPCs usually needs to make a Morale check under the following circumstances. Other situations might force one as well at the GM’s discretion.\n* One of their allies just died. The first blood of an encounter can crack the resolve of a group, even if they’re otherwise stronger or more numerous.\n* More than half of their allies are dead or down. Most groups will have rationally retreated long before this level of casualties, but even desperate or oblivious fighters might crack at this point.\n* They seem likely to lose. Even if they haven’t suffered crippling casualties yet, if a rational fighter doesn’t expect to win a fight, they may well choose to leave it.\n* Some dramatic reverse just happened. If a CASRA suddenly swoops down and starts blasting a gang mob or their target wheels around to rip the head off their boss, the first instinct of the gangers is going to be flight. If some shocking loss is suffered the group will need to check Morale.\nUsually these Morale checks will be rolled with an unmodified 2d6. A GM can tweak this slightly, with a 1 or 2 point bonus or penalty for exceptionally dramatic displays or ambiguous situations, but any modifier larger than that is likely to result in pre-ordained success or failure.","ru":"Группе NPC обычно нужно сделать проверку боевого духа в следующих обстоятельствах. По усмотрению Мастера её могут вынудить и другие ситуации.\n\n* Только что погиб один из их союзников. Первая кровь в стычке может надломить решимость группы, даже если она в остальном сильнее или многочисленнее.\n* Больше половины их союзников мертвы или выведены из строя. Большинство групп разумно отступило бы задолго до такого уровня потерь, но даже отчаянные или невнимательные бойцы могут сломаться на этом этапе.\n* Похоже, что они проигрывают. Даже если они ещё не понесли калечащих потерь, разумный боец, не ожидающий победы в схватке, вполне может решить из неё выйти.\n* Только что случился драматичный перелом. Если CASRA внезапно спикировал и начал разносить банду, или их цель развернулась и оторвала голову их главарю, первый инстинкт бандитов — бежать. Если группа несёт какую-то шокирующую потерю, ей нужно проверить боевой дух.\n\nОбычно эти проверки боевого духа бросаются на немодифицированном 2d6. Мастер может слегка это подправить бонусом или штрафом в 1-2 пункта за исключительно драматичные проявления или неоднозначные ситуации, но любой модификатор больше этого, скорее всего, приведёт к заранее предопределённому успеху или провалу."},
{"n":"5.3.0","l":2,"te":"Animals","tr":"Звери","en":"These are some example animals the PCs might encounter.\n\n\nVicious Guard Dog\nHD:        2 (10 HP)        Atk:        +3m\nAC:        13r/13m        Dmg:        1d6+1\nTT:        6+                Shock:        None\nSkill:        +2                Move:        15m\nSave:        14+                ML:        9\nBite (1d6+1 dmg, Trauma 1d6/x2)\n\n\nCybered Attack Beast\nHD:        5 (25 HP)        Atk:        +8m x 2\nAC:        13r/13m        Dmg:        1d8+4\nTT:        7+                Shock:        4/-\nSkill:        +3                Move:        20m\nSave:        13+                ML:        10\nCybernetic Claws (1d8+4, Tr 1d8/x3, Shock 4/-)\n\n\nExperimental Bioweapon\nHD:        8 (50 HP)        Atk:        +12m x 3\nAC:        13r/13m        Dmg:        2d6+8\nTT:        9+                Shock:        8/-\nSkill:        +4                Move:        20m\nSave:        11+                ML:        12\nBody Weaponry (2d6+8, Tr 1d10+1/x3, Shock 8/-)\nVeteran’s Luck (Edge): The beast can use Veteran’s Luck\nKilling Blow (Edge): +4 dmg to each hit and +1 to Trauma","ru":"Это несколько примеров зверей, с которыми могут столкнуться ПИ.\n\n\n### Злобный сторожевой пёс\n\n**КЗд:** 2 (10 ПЗ) · **КЗщ:** 13дб/13бб · **ПТ:** 6+ · **Нав:** +2 · **Спас:** 14+ · **Атк:** +3бб · **Урон:** 1d6+1 · **Шок:** нет · **Скор.:** 15 м · **Дух:** 9\n\nУкус (урон 1d6+1, Травма 1d6/×2)\n\n\n### Кибернетизированный боевой зверь\n\n**КЗд:** 5 (25 ПЗ) · **КЗщ:** 13дб/13бб · **ПТ:** 7+ · **Нав:** +3 · **Спас:** 13+ · **Атк:** +8бб ×2 · **Урон:** 1d8+4 · **Шок:** 4/– · **Скор.:** 20 м · **Дух:** 10\n\nКибернетические когти (1d8+4, Тр 1d8/×3, Шок 4/–)\n\n\n### Экспериментальное биооружие\n\n**КЗд:** 8 (50 ПЗ) · **КЗщ:** 13дб/13бб · **ПТ:** 9+ · **Нав:** +4 · **Спас:** 11+ · **Атк:** +12бб ×3 · **Урон:** 2d6+8 · **Шок:** 8/– · **Скор.:** 20 м · **Дух:** 12\n\nТелесное оружие (2d6+8, Тр 1d10+1/×3, Шок 8/–)\n**Везение ветерана (Козырь):** зверь может использовать Везение ветерана\n**Смертельный удар (Козырь):** +4 к урону каждого попадания и +1 к Травме"},
{"n":"5.4.0","l":2,"te":"Corp Guards and Law Enforcement","tr":"Корп-охрана и правоохранители","en":"The muscle described in this section represents the usual run of guards and hired protection that the PCs might encounter. Small businesses or other marginal concerns will usually hire minimally-capable gunmen or street muscle to watch their property, while even the smallest megacorp subsidiary will normally have cybered guards on-site, with veterans looking after black sites and other sensitive locations.\nIf the PCs cause chaos, they can expect to encounter city SWAT teams or corp fast-response groups dispatched to the site of their rampage. Truly unlucky operators might face elite breaching teams charged with violently terminating the most dangerous and troublesome lawbreakers. At the top end, the only limit to megacorp elite guards is their capacity to endure massive amounts of implanted chrome.\n\n\nLow-End Private Security and Street Muscle\nHD:        1 (5 HP+2)        Atk:        +1r/+1m\nAC:        13r/10m        Dmg:        Wpn\nTT:        6+                Shock:        1/18 non-leth\nSkill:        +1                Move:        10m\nSave:        15+                ML:        7\nReinforced Clothing\nHeavy Pistol (1d8, Trauma 1d6/x3, 8 mag)\nClub (1d4, Shock 1/18, non-lethal)\n\n\nBasic Corp Guard or City Cop\nHD:        2 (10 HP+5)        Atk:        +3r/+3m\nAC:        16r/13m        Dmg:        Wpn\nTT:        8+                Shock:        2/18 non-leth\nSkill:        +1                Move:        10m\nSave:        14+                ML:        8\nLight Armored Suit\nHeavy Pistol (1d8, Trauma 1d6/x3, 8 mag)\nAdvanced Club (1d8, Shock 2/18, non-lethal)\nCybereyes (Sensory): Integral flash protection\nGunlink (Sensory): Ignore range penalties and up to -2 of cover or concealment. Once/scene, reroll a missed shot.\n\n\nVeteran Corp Guard/City Cop or SWAT Team\nHD:        3 (15 HP+5)        Atk:        +5r/+4m\nAC:        17r/14m        Dmg:        Wpn\nTT:        8+                Shock:        2/18 non-leth\nSkill:        +2                Move:        10m\nSave:        14+                ML:        9\nLight Armored Suit\nHeavy Pistol (1d8+1, Trauma 1d6/x3, 8 mag)\nAdvanced Club (1d8, Shock 2/18, non-lethal)\nCoordination Augment I (Nerve): +1 Dex mod to AC/hit/damage/Shock related rolls\nCybereyes (Sensory): Integral flash protection\nGunlink (Sensory): Ignore range penalties and up to -2 of cover or concealment. Once/scene, reroll a missed shot.\n\n\nResponse Team Commander or SWAT Captain\nHD:        4 (20 HP+10)        Atk:        +7r/+6m\nAC:        19r/15m        Dmg:        Wpn\nTT:        8+                Shock:        3/15\nSkill:        +2                Move:        10m\nSave:        13+                ML:        10\nMedium Armored Suit\nCombat Rifle (1d12+1, Tr. 1d8/x3, 30 mag, burst)\nAdvanced Knife (1d6+1, Shock 3/15, Tr. 1d8/x3)\nCoordination Augment I (Nerve): +1 Dex mod to AC/hit/damage/Shock related rolls\nCybereyes (Sensory): Integral flash protection\nEnhanced Reflexes I (Nerve): Once/scene as an On Turn, gain a bonus Main action.\nGunlink (Sensory): Ignore range penalties and up to -2 of cover or concealment. Once/scene, reroll a missed shot.\n\n\nBreaching Team Member\nHD:        3 (15 HP+15)        Atk:        +5r/+6m\nAC:        21r/19m        Dmg:        Wpn\nTT:        9+                Shock:        5/15\nSkill:        +2                Move:        10m\nSave:        14+                ML:        9\nHeavy Armored Suit\nCombat Shotgun (3d4, Tr. 1d10/x3, 12 mag, burst)\n3 flash grenades/3 frag (2d6, Trauma 1d8/x3)\nBody Blades II (Limb): 2d6+1 melee, Shock 5/15, Trauma 1d10/x3\nCybereyes (Sensory): Integral flash protection\nEye Mod/Low Light Vision (Sensory): Sees in low light\nEnhanced Reflexes I (Nerve): Once/scene as an On Turn action gain a bonus Main action\nMuscle Fiber Replacement I (Limb): Effective +1 Str mod for hit/damage/Shock\nStick Pads (Limb): Climb sheer surfaces at Move rate.\n\n\nBreaching Team Commander\nHD:        5 (25 HP+15)        Atk:        +8r/+10m\nAC:        21r/19m        Dmg:        Wpn\nTT:        9+                Shock:        8/Any\nSkill:        +2                Move:        10m\nSave:        13+                ML:        10\nHeavy Armored Suit\nCombat Shotgun (3d4, Tr. 1d10/x3, 12 mag, burst)\n3 flash grenades/3 frag (2d6, Trauma 1d8/x3)\nBody Blades II (Limb): Base 2d6+4 melee, Shock 8/Any, Trauma 1d10/x3\nCybereyes (Sensory): Integral flash protection\nEye Mod/Low Light Vision (Sensory): Sees in low light\nEnhanced Reflexes II (Nerve): Once/scene as an Instant action gain a bonus Main and Move action\nMuscle Fiber Replacement II (Limb): Effective +2 Str mod for hit/damage/Shock and feats of great strength\nStick Pads (Limb): Climb sheer surfaces at Move rate.\nVeteran’s Luck (Edge): Can use the Veteran’s Luck Edge\nArmsmaster (Focus): Armsmaster-2 Focus benefits.\n\n\nCorp or LEO Elite Sniper\nHD:        6 (30 HP+10)        Atk:        +11r/+8m\nAC:        21r/19m        Dmg:        Wpn\nTT:        8+                Shock:        4/15\nSkill:        +3                Move:        10m\nSave:        12+                ML:        10\nMedium Armored Suit\nModded Sniper Rifle (2d8+7, Tr. 1d10/x4, 1 mag)\nModded Heavy Pistol (1d8+7, Tr. 1d6/x3, 8 mag)\nAdvanced Knife (1d6+2, Shock 4/15, Tr. 1d8/x3)\nCoordination Augment II (Nerve): +2 Dex mod to AC/hit/damage/Shock related rolls, +10m Move\nCybereyes (Sensory): Integral flash protection\nEnhanced Reflexes II (Nerve): Once/scene as an Instant, gain a bonus Main and Move action.\nEye Mod/Infrared Vision: Can see in infrared\nGunlink (Sensory): Ignore range penalties and up to -2 of cover or concealment. Once/scene, reroll a missed shot.\nStick Pads (Limb): Climb sheer surfaces at Move rate.\nVeteran’s Luck (Edge): Can use the Veteran’s Luck Edge\nDeadeye (Focus): Deadeye-2 Focus benefits\n\n\nMegacorp CEO’s Personal Guard\nHD:        10 (80 HP)        Atk:        +17r/+19m\nAC:        22r/22m        Dmg:        Wpn\nTT:        8+                Shock:        15/Any\nSkill:        +4                Move:        20m\nSave:        10+                ML:        12\nRidiculously Expensive Suit \nModded Light Pistol (1d6+10, Tr. 1d8+1/x2, 15 mag), 3 flash grenades/3 frag (2d6+5, Trauma 1d8+1/x3)\nBody Blades II (Limb): Base 2d6+11 melee, Shock 15/Any, Trauma 1d10+1/x3\nCoordination Augment II (Nerve): +2 Dex mod to AC/hit/damage/Shock related rolls, +10m Move\nCyberears/eyes (Sensory): Integral noise and flash protect\nDermal Armor III (Skin): AC 20, ignore first Shock/round\nEar Mod/Positional Detection (Sensory): Map sounds\nEye Mod/Low Light Vision (Sensory): Sees in low light\nEnhanced Reflexes III (Nerve): Twice/scene as an Instant action gain a bonus Main and Move action\nIron Hand Aegis (Limb): Once/scene, deflect a ranged hit\nMuscle Fiber Replacement II (Limb): Effective +2 Str mod for hit/damage/Shock and feats of great strength\nReaction Booster II (Nerve): Automatically win initiative\nStick Pads (Limb): Climb sheer surfaces at Move rate.\nKilling Blow (Edge): +1 to Trauma Dice, +5 to all damage\nVeteran’s Luck (Edge): Can use the Veteran’s Luck Edge\nArmsmaster (Focus): Armsmaster-2 Focus benefits.","ru":"Мускулы, описанные в этом разделе, представляют обычный набор охранников и наёмной защиты, с которыми могут столкнуться ПИ. Мелкие лавочники и прочие сомнительные конторы обычно наймут для присмотра за имуществом едва пригодных стрелков или уличных громил, тогда как даже самая мелкая дочка мегакорпорации обычно держит на объекте кибернетизированную охрану, а за чёрными площадками и другими чувствительными местами присматривают ветераны.\n\nЕсли ПИ устроят хаос, они могут ожидать встречи с городскими командами SWAT или корп-группами быстрого реагирования, отправленными на место их буйства. Совсем уж неудачливые операторы могут столкнуться с элитными штурмовыми группами, которым поручено насильственно устранять самых опасных и хлопотных нарушителей закона. На верхнем пределе единственное ограничение для элитной охраны мегакорпораций — их способность вынести чудовищные объёмы вживлённого хрома.\n\n\n### Дешёвая частная охрана и уличные громилы\n\n**КЗд:** 1 (5 ПЗ+2) · **КЗщ:** 13дб/10бб · **ПТ:** 6+ · **Нав:** +1 · **Спас:** 15+ · **Атк:** +1дб/+1бб · **Урон:** оружие · **Шок:** 1/18 нелет. · **Скор.:** 10 м · **Дух:** 7\n\nУкреплённая одежда\nТяжёлый пистолет (1d8, Травма 1d6/×3, магазин 8)\nДубинка (1d4, Шок 1/18, нелетальный)\n\n\n### Рядовой корп-охранник или городской коп\n\n**КЗд:** 2 (10 ПЗ+5) · **КЗщ:** 16дб/13бб · **ПТ:** 8+ · **Нав:** +1 · **Спас:** 14+ · **Атк:** +3дб/+3бб · **Урон:** оружие · **Шок:** 2/18 нелет. · **Скор.:** 10 м · **Дух:** 8\n\nЛёгкий бронекостюм\nТяжёлый пистолет (1d8, Травма 1d6/×3, магазин 8)\nПродвинутая дубинка (1d8, Шок 2/18, нелетальный)\n**Киберглаза (Сенсорика):** встроенная защита от вспышек\n**Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену перебрасывает промах.\n\n\n### Опытный корп-охранник/городской коп или боец SWAT\n\n**КЗд:** 3 (15 ПЗ+5) · **КЗщ:** 17дб/14бб · **ПТ:** 8+ · **Нав:** +2 · **Спас:** 14+ · **Атк:** +5дб/+4бб · **Урон:** оружие · **Шок:** 2/18 нелет. · **Скор.:** 10 м · **Дух:** 9\n\nЛёгкий бронекостюм\nТяжёлый пистолет (1d8+1, Травма 1d6/×3, магазин 8)\nПродвинутая дубинка (1d8, Шок 2/18, нелетальный)\n**Аугментация координации I (Нервы):** +1 к мод. Лов для бросков, связанных с КЗщ/попаданием/уроном/Шоком\n**Киберглаза (Сенсорика):** встроенная защита от вспышек\n**Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену перебрасывает промах.\n\n\n### Командир группы реагирования или капитан SWAT\n\n**КЗд:** 4 (20 ПЗ+10) · **КЗщ:** 19дб/15бб · **ПТ:** 8+ · **Нав:** +2 · **Спас:** 13+ · **Атк:** +7дб/+6бб · **Урон:** оружие · **Шок:** 3/15 · **Скор.:** 10 м · **Дух:** 10\n\nСредний бронекостюм\nБоевая винтовка (1d12+1, Тр. 1d8/×3, магазин 30, очередь)\nПродвинутый нож (1d6+1, Шок 3/15, Тр. 1d8/×3)\n**Аугментация координации I (Нервы):** +1 к мод. Лов для бросков, связанных с КЗщ/попаданием/уроном/Шоком\n**Киберглаза (Сенсорика):** встроенная защита от вспышек\n**Улучшенные рефлексы I (Нервы):** раз за сцену Действием в свой ход получает бонусное Основное действие.\n**Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену перебрасывает промах.\n\n\n### Боец штурмовой группы\n\n**КЗд:** 3 (15 ПЗ+15) · **КЗщ:** 21дб/19бб · **ПТ:** 9+ · **Нав:** +2 · **Спас:** 14+ · **Атк:** +5дб/+6бб · **Урон:** оружие · **Шок:** 5/15 · **Скор.:** 10 м · **Дух:** 9\n\nТяжёлый бронекостюм\nБоевой дробовик (3d4, Тр. 1d10/×3, магазин 12, очередь)\n3 светошумовые гранаты/3 осколочные (2d6, Травма 1d8/×3)\n**Телесные клинки II (Конечность):** 2d6+1 в ближнем бою, Шок 5/15, Травма 1d10/×3\n**Киберглаза (Сенсорика):** встроенная защита от вспышек\n**Мод глаза/Зрение при слабом свете (Сенсорика):** видит при слабом освещении\n**Улучшенные рефлексы I (Нервы):** раз за сцену Действием в свой ход получает бонусное Основное действие\n**Замена мышечных волокон I (Конечность):** эффективный мод. Сил +1 для попадания/урона/Шока\n**Липкие подушечки (Конечность):** лазает по отвесным поверхностям со скоростью перемещения.\n\n\n### Командир штурмовой группы\n\n**КЗд:** 5 (25 ПЗ+15) · **КЗщ:** 21дб/19бб · **ПТ:** 9+ · **Нав:** +2 · **Спас:** 13+ · **Атк:** +8дб/+10бб · **Урон:** оружие · **Шок:** 8/Любой · **Скор.:** 10 м · **Дух:** 10\n\nТяжёлый бронекостюм\nБоевой дробовик (3d4, Тр. 1d10/×3, магазин 12, очередь)\n3 светошумовые гранаты/3 осколочные (2d6, Травма 1d8/×3)\n**Телесные клинки II (Конечность):** базово 2d6+4 в ближнем бою, Шок 8/Любой, Травма 1d10/×3\n**Киберглаза (Сенсорика):** встроенная защита от вспышек\n**Мод глаза/Зрение при слабом свете (Сенсорика):** видит при слабом освещении\n**Улучшенные рефлексы II (Нервы):** раз за сцену Мгновенным действием получает бону nus Main and Move action\nEye Mod/Flechette Launcher (Head): Surprise Light Pistol attack that does double dmg on hit, regular on miss\nEye Mod/Impostor (Sensory): Fake a retinal pattern\nEye Mod/Infrared Vision (Sensory): Has IR vision\nEye Mod/Zoom (Sensory): Can see clearly up to 500m\nReaction Booster II (Nerve): Automatically win initiative\nStick Pads (Limb): Climb sheer surfaces at Move rate.\nHard to Kill (Edge): +2 HP/HD, +1 Trauma Target\nKilling Blow (Edge): +1 to Trauma Dice, +5 to all damage\nVeteran’s Luck (Edge): Can use the Veteran’s Luck Edge\nDeadeye (Focus): Deadeye-2 Focus benefits","ru":"Уличные банды финансируются хуже корпоративных силовиков или городских правоохранителей, но берут числом то, чего им не хватает в деньгах. Самые нищие шайки обходятся самодельными ножами и самопалами, а князья города оплачивают целые производственные партии оружия высшего класса, чтобы решить свои разногласия. Корпы охотно им продают — пока те не мешают их бизнесу.\n\nКроме бойцов из банд, ПИ могут наткнуться на убийц и прочих наёмных ликвидаторов. Рядовые киллеры почти ничем не отличаются от любого другого бандита с пистолетом, но от тех, кто успел заработать имя, стоит ждать целой горы новейшего хрома под кожей. Величайшие из них кончают тем, что в них больше металла, чем плоти, — и всё ради более совершенного убийства.\n\n\n### Уличный хулиган без банды\n\n**КЗд:** 1 (5 ПЗ) · **Атк:** +1дб/+1бб · **КЗщ:** 10дб/10бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** 1/15 · **Нав:** +1 · **Скор.:** 10 м · **Спас:** 15+ · **Дух:** 7\n\n- Обычная одежда\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- Нож (1d4, Шок 1/15, травма 1d6/×3)\n\n\n### Член банды\n\n**КЗд:** 1 (5 ПЗ+3) · **Атк:** +1дб/+1бб · **КЗщ:** 13дб/12бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** 1/15 · **Нав:** +1 · **Скор.:** 10 м · **Спас:** 15+ · **Дух:** 8\n\n- Уличная кожа\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- Нож (1d4, Шок 1/15, травма 1d6/×3)\n\nОдна из следующих кибер-систем:\n\n- **Телесные клинки I (Конечность):** урон 1d8, Шок 2/15, травма 1d8/×3\n- **Киберглаза и Мод глаза/Инфракрасное (Сенсорика):** защита от вспышек и способность видеть в инфракрасном\n- **Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену — переброс промаха.\n- **Шок-кулаки (Конечность):** +1d8 к безоружному урону\n\n\n### Ветеран-стрелок банды\n\n**КЗд:** 3 (15 ПЗ+3) · **Атк:** +6дб/+6бб · **КЗщ:** 14дб/13бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** 2/15 · **Нав:** +2 · **Скор.:** 10 м · **Спас:** 14+ · **Дух:** 8\n\n- Уличная кожа\n- Боевая винтовка (1d12+1, тр. 1d8/×3, 30 маг, очередь)\n- Нож (1d4+1, Шок 2/15, травма 1d6/×3)\n- **Аугментация координации I (Нервы):** +1 к модификатору Лов для КЗщ/попаданий/урона/бросков, связанных с Шоком\n- **Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену — переброс промаха.\n\n\n### Ветеран-громила банды\n\n**КЗд:** 3 (15 ПЗ+5) · **Атк:** +4дб/+6бб · **КЗщ:** 13дб/14бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** 3/15 · **Нав:** +2 · **Скор.:** 10 м · **Спас:** 14+ · **Дух:** 8\n\n- Боевая сбруя\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- **Телесные клинки I (Конечность):** урон 1d8+1, Шок 3/15, травма 1d8/×3\n- **Замена мышечных волокон I (Конечность):** фактически +1 к модификатору Сил для попаданий/урона/Шока\n\n\n### Лейтенант банды или мелкий босс\n\n**КЗд:** 6 (30 ПЗ+5) · **Атк:** +9дб/+10бб · **КЗщ:** 16дб/14бб · **Урон:** оружие · **ПТ:** 7+ · **Шок:** 8/Любой · **Нав:** +3 · **Скор.:** 10 м · **Спас:** 12+ · **Дух:** 10\n\n- Бронированная одежда\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- **Телесные клинки II (Конечность):** 2d6+4 в ближнем бою, Шок 8/Любой, травма 1d10/×3\n- **Улучшенные рефлексы I (Нервы):** раз за сцену Действием в свой ход получает бонусное Основное действие\n- **Замена мышечных волокон I (Конечность):** фактически +1 к модификатору Сил для попаданий/урона/Шока\n- **Везение ветерана (Козырь):** может использовать Козырь «Везение ветерана»\n- **Оружейный мастер (Фокус):** преимущества Фокуса «Оружейный мастер-2».\n\n\n### Крупный босс банды\n\n**КЗд:** 8 (40 ПЗ+10) · **Атк:** +13дб/+11бб · **КЗщ:** 21дб/19бб · **Урон:** оружие · **ПТ:** 7+ · **Шок:** 7/15 · **Нав:** +3 · **Скор.:** 20 м · **Спас:** 11+ · **Дух:** 11\n\n- Бронированная одежда с модами\n- Тяжёлый пистолет с модами (1d8+8, тр. 1d6+1/×3, 8 маг)\n- Продвинутый нож (1d6+3, травма 1d8+1/×3)\n- **Аугментация координации II (Нервы):** +2 к модификатору Лов для КЗщ/попаданий/урона/бросков, связанных с Шоком, +10 м к Скор.\n- **Улучшенные рефлексы II (Нервы):** раз за сцену Мгновенным действием получает бонусные Основное действие и Действие перемещения.\n- **Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену — переброс промаха.\n- **Ускоритель реакции II (Нервы):** автоматически побеждает в инициативе\n- **Везение ветерана (Козырь):** может использовать Козырь «Везение ветерана»\n- **Верный глаз (Фокус):** преимущества Фокуса «Верный глаз-2».\n\n\n### Профессиональный убийца среднего уровня\n\n**КЗд:** 6 (30 ПЗ+5) · **Атк:** +11дб/+9бб · **КЗщ:** 18дб/16бб · **Урон:** оружие · **ПТ:** 7+ · **Шок:** 4/15 · **Нав:** +3 · **Скор.:** 10 м · **Спас:** 12+ · **Дух:** 10\n\n- Бронированная одежда\n- Лёгкий пистолет с модами (1d6+8, тр. 1d8+1/×2, 15 маг)\n- Продвинутый нож (1d6+2, Шок 4/15, тр. 1d8/×3)\n- **Аугментация координации II (Нервы):** +2 к модификатору Лов для КЗщ/попаданий/урона/бросков, связанных с Шоком, +10 м к Скор.\n- **Киберглаза (Сенсорика):** встроенная защита от вспышек\n- **Улучшенные рефлексы II (Нервы):** раз за сцену Мгновенным действием получает бонусные Основное действие и Действие перемещения.\n- **Мод глаза/Инфракрасное зрение:** видит в инфракрасном\n- **Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену — переброс промаха.\n- **Липкие подушечки (Конечность):** лазает по гладким поверхностям со скоростью перемещения.\n- **Везение ветерана (Козырь):** может использовать Козырь «Везение ветерана»\n- **Верный глаз (Фокус):** преимущества Фокуса «Верный глаз-2»\n\n\n### Легендарный наёмный убийца\n\n**КЗд:** 10 (80 ПЗ) · **Атк:** +17дб/+15бб · **КЗщ:** 21дб/19бб · **Урон:** оружие · **ПТ:** 8+ · **Шок:** 9/15 · **Нав:** +4 · **Скор.:** 20 м · **Спас:** 10+ · **Дух:** 12\n\n- Бронированная одежда с модами\n- Лёгкий пистолет с модами (1d6+14, тр. 1d8+1/×2, 15 маг)\n- Продвинутый нож (1d6+2, Шок 9/15, тр. 1d8/×3)\n- **Аугментация координации II (Нервы):** +2 к модификатору Лов для КЗщ/попаданий/урона/бросков, связанных с Шоком, +10 м к Скор.\n- **Киберглаза/уши (Сенсорика):** встроенная защита от вспышек/шума\n- **Улучшенные рефлексы III (Нервы):** дважды за сцену Мгновенным действием получает бонусные Основное действие и Действие перемещения\n- **Мод глаза/Пускатель флешетт (Голова):** внезапная атака как Лёгким пистолетом, при попадании двойной урон, при промахе обычный\n- **Мод глаза/Самозванец (Сенсорика):** подделывает рисунок сетчатки\n- **Мод глаза/Инфракрасное зрение (Сенсорика):** обладает ИК-зрением\n- **Мод глаза/Увеличение (Сенсорика):** чётко видит на дистанции до 500 м\n- **Ускоритель реакции II (Нервы):** автоматически побеждает в инициативе\n- **Липкие подушечки (Конечность):** лазает по гладким поверхностям со скоростью перемещения.\n- **Живучий (Козырь):** +2 ПЗ за КЗд, +1 к Порогу травмы\n- **Смертельный удар (Козырь):** +1 к Костям травмы, +5 ко всему урону\n- **Везение ветерана (Козырь):** может использовать Козырь «Везение ветерана»\n- **Верный глаз (Фокус):** преимущества Фокуса «Верный глаз-2»"},
{"n":"5.6.0","l":2,"te":"Hackers and Pilots","tr":"Хакеры и пилоты","en":"Infiltration jobs sometimes require facing corporate watchdog hackers, whether in cyberspace or in the living flesh. The statistics here are for a general range of watchdogs and their usual hardware.\nMost hackers are terrible meatspace combatants, though the anti-cyber specialists of corporate breaching teams can be a nasty surprise for heavily chromed PCs.\nThe watchdogs are listed with their usual cyberdecks and program loadouts. Larcenous PCs should know that corporate decks are so raddled with spy hardware that there’s almost never any profit in looting them. Freelancers might have something worth stealing, however.\nAlong with the selection of hackers, a number of example drone pilots are included for encounters.\n\n\nSmall-Time Corper Code Drone\nHD:        1 (5 HP)        Atk:        +0r/+0m\nAC:        10r/10m        Dmg:        Wpn\nTT:        6+                Shock:        None\nSkill:        +1                Move:        10m\nSave:        15+                ML:        7\nOrdinary Clothing\nHeavy Pistol (1d8, Trauma 1d6/x3, 8 mag)\nCranial Jack: Links to jack-equipped gear\nCyberdeck: Memory 10, Shielding 10, CPU 3 with verbs Defend, Paralyze, Stun, Lock, Terminate and subjects Avatar, Barrier, Camera, Door, Program\n\n\nExperienced Corporate Watchdog\nHD:        2 (10 HP)        Atk:        +1r/+1m\nAC:        10r/10m        Dmg:        Wpn\nTT:        6+                Shock:        None\nSkill:        +2                Move:        10m\nSave:        14+                ML:        8\nOrdinary Clothing\nHeavy Pistol (1d8, Trauma 1d6/x3, 8 mag)\nCranial Jack: Links to jack-equipped gear\nCyberdeck: Memory 14, Shielding 10, CPU 3 with verbs Defend, Paralyze, Sense, Silence, Stun, Lock, Terminate and subjects Avatar, Barrier, Camera, Door, Program\n\n\nVeteran Corporate IT Security\nHD:        4 (20 HP)        Atk:        +2r/+2m\nAC:        10r/10m        Dmg:        Wpn\nTT:        6+                Shock:        None\nSkill:        +2                Move:        10m\nSave:        13+                ML:        8\nOrdinary Clothing\nHeavy Pistol (1d8, Trauma 1d6/x3, 8 mag)\nCranial Jack: Links to jack-equipped gear\nCybereyes (Sensory): Integral flash protection\nEye Mod/Low Light Vision (Sensory): Sees in low light\nEnhanced Reflexes I (Nerve): Once/scene as an On Turn action gain a bonus Main action\nStick Pads (Limb): Climb sheer surfaces at Move rate.\nCyberdeck: Memory 15, Shielding 0, CPU 5 with verbs Blind, Deactivate, Frisk, Glitch, Sabotage, Sense and subjects Cyber, Body Cyber, Nerve Cyber, Limb Cyber, Sensory Cyber, Skin Cyber, Enhanced Reflexes I, Enhanced Reflexes II, Enhanced Reflexes III\n\n\nHigh-End Corporate IT Talent\nHD:        6 (30 HP)        Atk:        +2r/+2m\nAC:        10r/10m        Dmg:        Wpn\nTT:        6+                Shock:        None\nSkill:        +5                Move:        10m\nSave:        12+                ML:        8\nOrdinary Clothing\nHeavy Pistol (1d8, Trauma 1d6/x3, 8 mag)\nCranial Jack: Links to jack-equipped gear\nNeural Buffer: Adds +18 HP vs. cyberspace damage\nReaction Booster II (Nerve): Automatically win initiative\nCyberdeck: Memory 17, Shielding 10, CPU 4 with verbs Defend, Glitch, Kill, Paralyze, Sense, Sabotage, Silence, Stun, Lock, Terminate and subjects Avatar, Barrier, Cyber, Camera, Door, Program\nHacker (Edge): Can use the Hacker Edge\n\n\nDire Legend of the Net\nHD:        9 (63 HP)        Atk:        +12r/+12m\nAC:        20r/18m        Dmg:        Wpn\nTT:        8+                Shock:        2/15\nSkill:        +6                Move:        10m\nSave:        11+                ML:        10\nModded Armored Clothing\nModded Light Pistol (1d6+4, Tr. 1d8/x2, 15 mag)\nAdvanced Knife (1d6+4, Shock 2/15, Tr. 1d8/x3)\nCranial Jack: Links to jack-equipped gear\nEnhanced Reflexes III (Nerve): Twice/scene as an Instant action gain a bonus Main and Move action\nNeural Buffer: Adds +27 HP vs. cyberspace damage\nReaction Booster II (Nerve): Automatically win initiative\nCyberdeck: Memory 17, Shielding 20, CPU 7 with verbs Defend, Glitch, Kill, Paralyze, Sense, Sabotage, Silence, Stun, Lock, Terminate and subjects Avatar, Barrier, Cyber, Camera, Door, Nerve Cyber, Program\nHacker (Edge): Can use the Hacker Edge\nHard to Kill (Edge): +2 HP/HD, +1 Trauma Target\n\n\nGang Drone Pilot\nHD:        3 (15 HP+3)        Atk:        +5r/+5m\nAC:        14r/13m        Dmg:        Wpn\nTT:        6+                Shock:        2/15\nSkill:        +2                Move:        10m\nSave:        14+                ML:        8\nStreet Leathers\nCombat Rifle (1d12+1, Tr. 1d8/x3, 30 mag, burst)\nKnife (1d4+1, Shock 2/15, Trauma 1d6/x3)\nCoordination Augment I (Nerve): +1 Dex mod to AC/hit/damage/Shock related rolls\nGunlink (Sensory): Ignore range penalties and up to -2 of cover or concealment. Once/scene, reroll a missed shot.\nHeadcomm (Sensory): Built-in radio comms\nRemote Control Unit (Nerve): Controls drones/vehicles\n\n\nVeteran Corporate Drone Jockey\nHD:        4 (20 HP+10)        Atk:        +7r/+6m\nAC:        19r/15m        Dmg:        Wpn\nTT:        8+                Shock:        3/15\nSkill:        +3                Move:        10m\nSave:        13+                ML:        10\nMedium Armored Suit\nCombat Rifle (1d12+1, Tr. 1d8/x3, 30 mag, burst)\nAdvanced Knife (1d6+1, Shock 3/15, Tr. 1d8/x3)\nCoordination Augment I (Nerve): +1 Dex mod to AC/hit/damage/Shock related rolls\nCybereyes (Sensory): Integral flash protection\nEnhanced Reflexes I (Nerve): Once/scene as an On Turn, gain a bonus Main action.\nGunlink (Sensory): Ignore range penalties and up to -2 of cover or concealment. Once/scene, reroll a missed shot.\nRemote Control Unit (Nerve): Controls drones/vehicles","ru":"На заданиях по проникновению иногда приходится сходиться с корпоративными хакерами-Сторожами — в киберпространстве или в живой плоти. Здесь приведены статы для типич
