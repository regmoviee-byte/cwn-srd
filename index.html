<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Города без числа — SRD 1.0</title>
<style>
:root{
  --bg:#F4F5F7; --paper:#FFFFFF; --ink:#1A1E26; --ink-soft:#39424F;
  --muted:#66707E; --faint:#8C96A3;
  --rule:#DCE1E8; --rule-soft:#EAEEF3;
  --accent:#0D6E70; --accent-deep:#084D50; --accent-wash:#E6F1F1;
  --mark:#FFF0BF; --mark-ink:#6B4E00;
  --serif:Charter,"Bitstream Charter",Cambria,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"DejaVu Sans Mono",Menlo,monospace;
  --rail:312px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ── шапка ── */
.top{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:16px; padding:10px 20px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:1px; margin-right:auto; min-width:0}
.brand b{font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-.01em}
.brand span{font-size:11.5px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase}
.search{position:relative; flex:0 1 320px; min-width:170px}
.search input{width:100%; font:inherit; font-size:14px; padding:8px 30px 8px 11px;
  border:1px solid var(--rule); border-radius:6px; background:var(--bg); color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search kbd{position:absolute; right:8px; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:11px; color:var(--faint); pointer-events:none}
.langsw{display:inline-flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:var(--bg)}
.langsw button{font:inherit; font-size:13px; font-weight:600; letter-spacing:.04em; padding:7px 15px;
  background:none; border:none; cursor:pointer; color:var(--muted)}
.langsw button+button{border-left:1px solid var(--rule)}
.langsw button[aria-pressed="true"]{background:var(--accent); color:#fff}

/* ── каркас ── */
.wrap{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); align-items:start}
/* Без этого колонка сетки не может стать уже своего содержимого */
main{min-width:0}
.sheet{min-width:0; max-width:100%}
.rail{position:sticky; top:57px; height:calc(100vh - 57px); overflow-y:auto;
  border-right:1px solid var(--rule); background:var(--paper); padding:12px 0 40px}
.rail h4{margin:16px 18px 7px; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--faint)}
.nav-ch{margin-top:6px; padding:8px 18px 4px; font-family:var(--serif); font-size:12px; letter-spacing:.02em;
  color:var(--faint); text-transform:uppercase; font-weight:700}
.nav-item{display:grid; grid-template-columns:44px minmax(0,1fr); gap:9px; align-items:baseline; width:100%;
  text-align:left; font:inherit; background:none; border:none; cursor:pointer; padding:6px 18px;
  color:var(--ink-soft); border-left:3px solid transparent}
.nav-item:hover{background:var(--rule-soft)}
.nav-item[aria-current="true"]{background:var(--accent-wash); border-left-color:var(--accent); color:var(--ink); font-weight:600}
.nav-item .num{font-family:var(--mono); font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums}
.nav-item[aria-current="true"] .num{color:var(--accent-deep)}
.nav-item .lbl{font-size:14px; line-height:1.35}
.nav-item.ch .lbl{font-family:var(--serif); font-size:15.5px; font-weight:700}
.snip{grid-column:2; font-size:12px; color:var(--muted); line-height:1.42; margin-top:2px}
.snip mark, .lbl mark{background:var(--mark); color:var(--mark-ink); padding:0 1px; border-radius:2px}
.empty{padding:18px; font-size:13.5px; color:var(--muted); line-height:1.5}

/* ── страница ── */
main{padding:32px 40px 130px}
.sheet{background:var(--paper); border:1px solid var(--rule); border-radius:8px; max-width:1020px}
.sheet-in{padding:32px 46px 46px}
.sec-num{font-family:var(--mono); font-size:12.5px; color:var(--accent-deep); letter-spacing:.05em;
  font-variant-numeric:tabular-nums; margin-bottom:6px}
h1.t{font-family:var(--serif); font-size:32px; line-height:1.16; font-weight:600; margin:0 0 5px;
  text-wrap:balance; letter-spacing:-.015em}
.alt-t{font-size:13.5px; color:var(--faint); font-style:italic; margin:0 0 4px}
.hr{height:1px; background:var(--rule); border:0; margin:24px 0}

.toc{margin:22px 0 4px; padding:15px 18px; background:var(--bg); border:1px solid var(--rule-soft); border-radius:7px}
.toc-h{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:9px}
.toc ol{margin:0; padding:0; list-style:none; display:grid; gap:2px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.toc a{display:grid; grid-template-columns:52px minmax(0,1fr); gap:8px; align-items:baseline;
  text-decoration:none; color:var(--ink-soft); padding:4px 6px; border-radius:4px; font-size:13.5px; line-height:1.35}
.toc a:hover{background:var(--accent-wash); color:var(--accent-deep)}
.toc .n{font-family:var(--mono); font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums}

.sub{padding-top:6px; margin-top:30px; border-top:1px solid var(--rule)}
.sub:first-of-type{border-top:none}
h2.sh{font-family:var(--serif); font-size:23px; font-weight:600; line-height:1.22; margin:14px 0 3px; letter-spacing:-.012em}
h3.sh{font-family:var(--serif); font-size:18.5px; font-weight:600; line-height:1.25; margin:22px 0 3px}
.sh-n{font-family:var(--mono); font-size:11.5px; color:var(--accent-deep); font-variant-numeric:tabular-nums; letter-spacing:.05em}
.sh-alt{font-size:12.5px; color:var(--faint); font-style:italic; margin:0 0 12px}

/* ── текст правил ── */
/* Длинные ссылки без пробелов рвём принудительно, иначе они распирают колонку */
.prose{font-family:var(--serif); font-size:16.5px; line-height:1.6; max-width:70ch;
  overflow-wrap:anywhere; word-break:break-word}
.snip, .nav-item .lbl, #tip .td, .toc a{overflow-wrap:anywhere}
.prose>p{margin:0 0 11px}
.prose p.def{margin:0 0 9px; padding-left:17px; text-indent:-17px}
.prose p.def>strong:first-child{color:var(--accent-deep)}
.prose h4,.prose h5,.prose h6{font-family:var(--serif); line-height:1.25; letter-spacing:-.008em}
.prose h4{font-size:17.5px; font-weight:600; margin:22px 0 7px; color:var(--accent-deep)}
.prose h5{font-size:16px; font-weight:600; margin:18px 0 6px}
.prose h6{font-size:15px; font-weight:600; margin:16px 0 5px; color:var(--ink-soft)}
.prose ul{margin:0 0 12px; padding-left:21px}
.prose li{margin-bottom:4px}
.prose em{font-style:italic}
.prose code{font-family:var(--mono); font-size:.9em; background:var(--bg); padding:1px 4px; border-radius:3px}
.prose mark{background:var(--mark); color:var(--mark-ink); padding:0 2px; border-radius:2px}
.tw{overflow-x:auto; margin:14px 0 18px; border:1px solid var(--rule); border-radius:6px; max-width:100%}
.prose table{border-collapse:collapse; width:100%; font-family:var(--sans); font-size:13.5px; line-height:1.4}
.prose th,.prose td{padding:7px 11px; text-align:left; border-bottom:1px solid var(--rule-soft); vertical-align:top}
.prose th{background:var(--bg); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); white-space:nowrap}
.prose tbody tr:last-child td{border-bottom:none}
.prose td{font-variant-numeric:tabular-nums}
.prose td:first-child{font-weight:600; color:var(--ink)}
.raw{font-family:var(--mono); font-size:12.5px; line-height:1.55; white-space:pre; overflow-x:auto;
  background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; margin:14px 0 18px; color:var(--ink-soft)}
.note{font-family:var(--sans); font-size:14px; line-height:1.55; color:var(--muted); margin:0 0 14px}

/* ── термины ── */
.term{border-bottom:1px dashed rgba(13,110,112,.6); cursor:pointer; color:inherit}
.term:hover{background:var(--accent-wash)}
#tip{position:absolute; z-index:60; max-width:430px; background:var(--paper); color:var(--ink);
  border:1px solid var(--rule); border-radius:8px; box-shadow:0 8px 28px rgba(20,28,40,.16);
  padding:13px 15px; font-family:var(--sans); font-size:13.5px; line-height:1.5; display:none}
#tip.on{display:block}
#tip .tt{font-family:var(--serif); font-size:16px; font-weight:600; margin-bottom:3px}
#tip .ts{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:7px}
#tip .td{color:var(--ink-soft); max-height:230px; overflow-y:auto}
#tip .td p{margin:0 0 7px}
#tip .go{margin-top:10px; font:inherit; font-size:12.5px; font-weight:600; color:#fff; background:var(--accent);
  border:none; border-radius:5px; padding:6px 11px; cursor:pointer}
#tip .go:hover{background:var(--accent-deep)}

.pager{display:flex; gap:10px; justify-content:space-between; margin:26px 0 0; max-width:1020px}
.pager button{font:inherit; font-size:13.5px; padding:10px 15px; background:var(--paper); border:1px solid var(--rule);
  border-radius:6px; cursor:pointer; color:var(--ink-soft); max-width:47%; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; text-align:left}
.pager button:hover:not(:disabled){border-color:var(--accent); color:var(--accent-deep)}
.pager button:disabled{opacity:.34; cursor:default}
.pager .r{text-align:right}
footer{max-width:1020px; margin:34px 0 0; padding-top:18px; border-top:1px solid var(--rule);
  font-size:12.5px; color:var(--faint); line-height:1.6}

/* ── режим встраивания в чужую страницу ──
   Рамка растёт под содержимое, своей прокрутки у неё нет, поэтому липкие
   элементы отключаем: липнуть тут не к чему, прокручивается внешняя страница. */
body.embed{background:transparent}
body.embed .top{position:static}
body.embed .rail{position:static; height:auto; overflow:visible; padding-bottom:22px}
body.embed main{padding:26px 30px 40px}
body.embed .sheet{max-width:none}
@media (max-width:1040px){:root{--rail:252px} main{padding:24px 20px 90px} .sheet-in{padding:26px 24px 34px}}
/* Кнопка «Разделы» — только на узких экранах */
.navbtn{display:none; align-items:center; gap:6px; font:inherit; font-size:13px; font-weight:600;
  padding:8px 13px; border:1px solid var(--rule); border-radius:6px; background:var(--bg);
  color:var(--ink-soft); cursor:pointer}
.navbtn[aria-expanded="true"]{background:var(--accent); border-color:var(--accent-deep); color:#fff}

@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .navbtn{display:inline-flex; order:2; padding:7px 11px}
  .top{gap:8px; padding:7px 12px}
  .brand{order:1; margin-right:auto}
  .brand b{font-size:15px; line-height:1.2}
  .brand span{display:none}
  .langsw{order:3}
  .langsw button{padding:6px 10px; font-size:12px}
  .search{order:4; flex:1 1 100%; min-width:0}
  .search input{padding:6px 28px 6px 10px; font-size:13px}
  .search kbd{display:none}
  /* Панель разделов накрывает текст, но НЕ шапку: иначе до кнопки «Закрыть» не добраться.
     Отступ сверху равен высоте шапки и выставляется скриптом — она переносится по строкам. */
  .rail{display:none; position:fixed; left:0; right:0; top:0; bottom:0; z-index:25;
    height:auto; max-height:none; overflow-y:auto; border-right:none; padding:6px 0 40px;
    box-shadow:0 -1px 0 var(--rule) inset}
  .rail.open{display:block}
  body.nav-open{overflow:hidden}
  /* Во встроенном режиме фиксировать нечего: страницу прокручивает хозяин */
  body.embed .rail{position:static; z-index:auto; padding-bottom:16px;
    border-bottom:1px solid var(--rule)}
  main{padding:16px 12px 70px}
  .sheet{border-radius:0; border-left:0; border-right:0; margin:0 -12px}
  .sheet-in{padding:20px 16px 30px}
  h1.t{font-size:24px} h2.sh{font-size:19px} h3.sh{font-size:16.5px}
  .prose{font-size:16px; max-width:none}
  .toc ol{grid-template-columns:1fr}
  .nav-item{padding:10px 16px}
  #tip{max-width:calc(100vw - 24px)}
  .pager{flex-direction:column; gap:8px}
  .pager button{max-width:none; text-align:left}
  .pager .r{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="bTitle"></b><span id="bSub"></span></div>
  <button class="navbtn" id="navBtn" type="button" aria-expanded="false" aria-controls="rail"></button>
  <div class="search"><input id="q" type="search" autocomplete="off" aria-label="search"><kbd>/</kbd></div>
  <div class="langsw" role="group" aria-label="language">
    <button id="lRu" type="button" aria-pressed="true">Русский</button>
    <button id="lEn" type="button" aria-pressed="false">English</button>
  </div>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="nav"></nav>
  <main>
    <div class="sheet"><div class="sheet-in" id="view"></div></div>
    <div class="pager"><button id="prev" type="button"></button><button id="next" type="button" class="r"></button></div>
    <footer id="foot"></footer>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script id="srd-data" type="application/json">{
"sections":[
{"n":"intro","l":1,"te":"An Introduction","tr":"Вступление","en":"\u000cAn Introduction\nThe document that follows is intended as a reference for game designers who wish to produce role-playing games using the mechanics of the Cities Without Number cyberpunk RPG. It is not intended to substitute for the free PDF version of the game as a player resource or other reference, so the text included here is largely devoid of examples or other instructional text and it is not written to be convenient as a table reference.\nInstead, it is meant to give other RPG designers an explicit document showing exactly what I consider to be freely-usable game mechanics or trivially implemented descriptive text.\nRegarding this document, its copyright and related rights are waived via CC0, with a summary of the waiver at https://creativecommons.org/publicdomain/zero/1.0/ and the legal text itself at https://creativecommons.org/publicdomain/zero/1.0/ legalcode.\nWhile I cannot offer legal advice to the reader, I am providing this introduction as a plain English description of my position.\nThe Reason for the Document\nTo my understanding, the only right that the following document confers that a user did not already have is the right to use its text verbatim in a commercial product. As game mechanics cannot be copyrighted, I have always felt it fair and reasonable for other designers to duplicate the mechanics of my games for their own ends, and the following document simply specifies clearly what I consider to be those unprotected mechanics.\nAlong with these mechanics, trivially-derived ideas such as the damage dice of weapons, the particular layout of tables, and other details of implementation are laid out so as to make clear that I claim no legal or moral right to restrict their use.\nUnlike many other designers, I have been made prosperous by indie RPG publishing. I feel a certain degree of obligation derived from that success, and so I wish to provide the following document to assist others in producing profitable new creations for their own benefit. The reader is invited to copy, derive, change, or expand whatever they wish from the following document, and may rest assured of my encouragement and good wishes for their commercial success.\nA Note On Approvals\nAs the following document is affirmed under CC0 terms, I have absolutely no right to edit, approve, police, or restrict materials created with it. While I might have personal opinions regarding products derived from the document, their existence may in no way be represented as official or approved Sine Nomine Publishing products, nor should my endorsement be assumed for anything created. Designers may create what they wish, and I neither have nor desire any ability to control that.\nWhat You Can Do\nWhile certain uses are implicit in a CC0 affirmation, I list some of them out here in plain English for the sake of clarity. These uses apply to both personal and commercial uses of the following document, whether for tabletop RPGs, VTTs, online utilities, computer games, or any other work.\n- You may copy verbatim any text in the following document for your own products, including tables and their contents.\n- You may copy, derive, modify, or expand any content in the following document in your own products.\n- You may publish products derived from the following document without crediting either me or this document, as I waive all moral rights to it to the extent permissible by law.\n- You do not need to release your products under a CC0 affirmation or any other license.\n- You may explicitly advertise your products as being compatible with Cities Without Number or other Sine Nomine RPGs if, in your opinion, the product is compatible.\n- You may not represent your products as “official” Sine\nNomine offerings or as otherwise licensed, produced, associated with, or approved by Sine Nomine Publishing.\n- You may not replicate text or setting material included in the Cities Without Number free or deluxe game but not included in the following document. Setting details such as the default setting, the specific megacorps, or particular NPCs, places, or events are reserved as intellectual property and have been intentionally omitted from the following text, as have the bulk of the GM tools and other non-trivial creative content. These elements are actual creative works, and so I do not consider them free for common public use.\nNote that this does not apply to the basic concepts involved in the\nGM tools; while I keep my world tag text to myself, for example,\nI have no objection to someone else writing their own tags with the same enemy/friend/complication/thing/place structure, or creating one-roll tables with their own text.\nKevin Crawford\n9/8/23","ru":"# Вступление\n\nДокумент, который следует далее, предназначен как справочник для разработчиков игр, желающих выпускать ролевые игры на механиках киберпанк-НРИ Cities Without Number. Он не призван заменить бесплатную PDF-версию игры как источник для игроков или иной справочник, поэтому включённый здесь текст почти лишён примеров и прочего пояснительного текста и написан без расчёта на удобство обращения к таблицам.\n\nВместо этого он должен дать другим разработчикам НРИ прямой документ, показывающий в точности то, что я считаю свободно используемыми игровыми механиками или тривиально реализуемым описательным текстом.\n\nВ отношении этого документа авторское право и связанные с ним права отменены посредством CC0; краткое изложение этого отказа от прав — по адресу https://creativecommons.org/publicdomain/zero/1.0/, а сам юридический текст — по адресу https://creativecommons.org/publicdomain/zero/1.0/legalcode.\n\nЯ не могу давать читателю юридических советов, но привожу это вступление как изложение моей позиции простым языком.\n\n## Зачем нужен этот документ\n\nНасколько я понимаю, единственное право, которое даёт нижеследующий документ и которого у пользователя ещё не было, — это право дословно использовать его текст в коммерческом продукте. Поскольку игровые механики не могут быть защищены авторским правом, я всегда считал справедливым и разумным, чтобы другие разработчики воспроизводили механики моих игр в своих целях, и нижеследующий документ просто ясно определяет, что именно я считаю такими незащищёнными механиками.\n\nВместе с этими механиками здесь изложены тривиально производные идеи — кости урона оружия, конкретная компоновка таблиц и прочие детали реализации, — чтобы было ясно: я не претендую ни на какое юридическое или моральное право ограничивать их использование.\n\nВ отличие от многих других разработчиков, независимое издание НРИ принесло мне достаток. Я чувствую определённую долю обязательств, вытекающих из этого успеха, и потому хочу предоставить нижеследующий документ, чтобы помочь другим создавать новые прибыльные произведения себе на пользу. Читатель приглашается копировать, перерабатывать, изменять или расширять из нижеследующего документа всё, что пожелает, и может быть уверен в моём одобрении и добрых пожеланиях его коммерческому успеху.\n\n## Замечание об одобрении\n\nПоскольку нижеследующий документ заявлен на условиях CC0, у меня нет совершенно никакого права редактировать, одобрять, надзирать или ограничивать материалы, созданные на его основе. Хотя у меня могут быть личные мнения о продуктах, производных от этого документа, их существование ни в каком виде не может представляться как официальные или одобренные продукты Sine Nomine Publishing, и не следует предполагать мою поддержку чего-либо созданного. Разработчики могут создавать что хотят, и я не имею и не желаю иметь никакой возможности это контролировать.\n\n## Что вам разрешено\n\nХотя часть способов использования подразумевается самим заявлением CC0, я перечисляю некоторые из них здесь простым языком — ради ясности. Эти способы использования относятся как к личному, так и к коммерческому использованию нижеследующего документа, будь то настольные НРИ, VTT, онлайн-утилиты, компьютерные игры или любая другая работа.\n\n- Вы можете дословно копировать любой текст из нижеследующего документа для своих продуктов, включая таблицы и их содержимое.\n\n- Вы можете копировать, перерабатывать, изменять или расширять любое содержимое нижеследующего документа в своих продуктах.\n\n- Вы можете публиковать продукты, производные от нижеследующего документа, не указывая ни меня, ни этот документ, поскольку я отказываюсь от всех моральных прав на него в той мере, в какой это допускается законом.\n\n- Вам не нужно выпускать свои продукты по заявлению CC0 или по какой-либо другой лицензии.\n\n- Вы можете прямо заявлять в рекламе, что ваши продукты совместимы с Cities Without Number или другими НРИ Sine Nomine, если, по вашему мнению, продукт совместим.\n\n- Вы *не можете* представлять свои продукты как «официальные» предложения Sine Nomine или как иным образом лицензированные, произведённые, связанные с Sine Nomine Publishing или одобренные ею.\n\n- Вы *не можете* воспроизводить текст или материал сеттинга, включённый в бесплатную или делюкс-версию игры Cities Without Number, но не включённый в нижеследующий документ. Детали сеттинга — такие как сеттинг по умолчанию, конкретные мегакорпорации или отдельные NPC, места или события — сохраняются как интеллектуальная собственность и намеренно не включены в нижеследующий текст, как и большая часть инструментов Мастера и прочего нетривиального творческого содержимого. Эти элементы — настоящие творческие произведения, и потому я не считаю их свободными для общего публичного использования. Обратите внимание: это не относится к базовым концепциям, лежащим в основе инструментов Мастера; например, хотя текст моих мировых тегов я оставляю за собой, я не возражаю, чтобы кто-то другой написал свои собственные теги с той же структурой «враг/друг/осложнение/вещь/место» или создал таблицы одного броска со своим текстом.\n\nКевин Кроуфорд, 8 сентября 2023"},
{"n":"0.0.0","l":1,"te":"Cities Without Number Systems Reference Document v1.0","tr":"Cities Without Number — Справочный документ по системе, v1.0","en":"This document format is provided as a convenience for copying and pasting large blocks of text from the CWN SRD. A full explanation of the document's purpose is available in the Cities Without Number SRD v1.0 PDF.\nAs the author, I waive the copyright and related rights in this document under CC0. A summary of the waiver can be found at https://creativecommons.org/publicdomain/zero/1.0/ and the legal text itself at https://creativecommons.org/publicdomain/zero/1.0/legalcode.\n* Kevin Crawford, 9/8/23","ru":"Этот формат документа сделан для удобства копирования и вставки больших блоков текста из SRD CWN. Полное объяснение назначения документа приведено в PDF-файле Cities Without Number SRD v1.0.\n\nКак автор, я отказываюсь от авторского права и связанных с ним прав на этот документ в соответствии с CC0. Краткое изложение отказа можно найти по адресу https://creativecommons.org/publicdomain/zero/1.0/, а сам юридический текст — по адресу https://creativecommons.org/publicdomain/zero/1.0/legalcode.\n\n\\* Kevin Crawford, 9/8/23"},

{"n":"1.1.0","l":2,"te":"Attributes","tr":"Характеристики","en":"A character has six attributes ranging from 3 to 18, reflecting a range from the minimum viable capacity for a playable character to the maximum normal human level.\nThree of these attributes are physical.\nStrength, reflecting physical prowess, melee combat, carrying gear, and brute force.\nDexterity, reflecting speed, evasion, manual dexterity, reaction time, and combat initiative.\nConstitution, reflecting hardiness, enduring injury, and tolerating large amounts of cyberware.\nThree are mental attributes.\nIntelligence, reflecting memory, reasoning, technical skills, and general education.\nWisdom, reflecting noticing things, making judgments, reading situations, and intuition.\nCharisma, reflecting commanding, charming, attracting attention, and being taken seriously.\nNPCs do not normally have attributes. If necessary, the GM can choose them as appropriate, but usually they are assumed to have average scores if it's ever relevant.","ru":"У персонажа шесть характеристик со значениями от 3 до 18 — от минимума, при котором персонаж ещё пригоден для игры, до максимума для обычного человека.\n\nТри из этих характеристик — физические.\n\nСила — физическая мощь, ближний бой, переноска снаряжения и грубая сила.\n\nЛовкость — быстрота, уклонение, ловкость рук, скорость реакции и боевая инициатива.\n\nТелосложение — крепость, стойкость к ранам и терпимость к большому количеству кибернетики.\n\nТри характеристики — ментальные.\n\nИнтеллект — память, рассуждение, технические навыки и общая образованность.\n\nМудрость — умение замечать, судить, читать обстановку и интуиция.\n\nХаризма — умение командовать, очаровывать, привлекать внимание и заставлять относиться к себе серьёзно.\n\nУ NPC обычно нет характеристик. Если они нужны, Мастер может назначить их по своему усмотрению, но обычно считается, что у NPC средние значения, если это вообще важно."},
{"n":"1.1.1","l":3,"te":"Generating Attributes","tr":"Генерация характеристик","en":"To generate their six attributes, the player rolls 3d6 in order, once for each attribute. At any point before section 1.5.0 in character creation the player may substitute a score of 14 for one rolled score.\nOptionally, a player may choose to assign their stats from the following array of numbers: 14, 12, 11, 10, 9, and 7, divided up as desired among the attributes. If an array is used a score may not be substituted with a 14 later.","ru":"Чтобы получить шесть характеристик, игрок бросает 3d6 по порядку, по разу на каждую характеристику. В любой момент до раздела 1.5.0 создания персонажа игрок может заменить одно выпавшее значение на 14.\n\nПо желанию игрок может вместо броска распределить характеристики из готового набора значений: 14, 12, 11, 10, 9 и 7 — как ему угодно. Если использован набор, заменить значение на 14 позже нельзя."},
{"n":"1.1.2","l":3,"te":"Attribute Modifiers","tr":"Модификаторы характеристик","en":"Each attribute has a modifier, usually ranging from -2 to +2. This modifier is added to skill checks, attack rolls, damage rolls, Shock damage, and the relevant saving throw targets.\nAn attribute score of 3 has a modifier of -2. A score of 4-7 has a modifier of -1. A score of 8-13 has a modifier of +0. A score of 14-17 has a modifier of +1. A score of 18 has a modifier of +2.\nSome Foci and cyberware may add bonuses or penalties to an attribute's base modifier. Such bonuses or penalties cannot increase the modifier above +2 or below -2 unless explicitly indicated. Some injuries or character advancements may alter an attribute score; this new score may change the attribute's modifier.","ru":"У каждой характеристики есть модификатор, обычно от -2 до +2. Этот модификатор прибавляется к проверкам навыков, броскам атаки, броскам урона, урону Шока и к соответствующим порогам спасбросков.\n\nЗначение характеристики 3 даёт модификатор -2. Значение 4-7 даёт модификатор -1. Значение 8-13 даёт модификатор +0. Значение 14-17 даёт модификатор +1. Значение 18 даёт модификатор +2.\n\nНекоторые Фокусы и кибернетика могут давать бонусы или штрафы к базовому модификатору характеристики. Такие бонусы и штрафы не могут поднять модификатор выше +2 или опустить ниже -2, если явно не указано иное. Некоторые травмы или элементы развития персонажа могут изменить значение характеристики; новое значение может изменить и её модификатор."},
{"n":"1.2.0","l":2,"te":"Skills","tr":"Навыки","en":"A character's skills are the PC's learned abilities. A newly-created character starts with a few relevant skills and may acquire more as they advance in level. NPCs do not have individual skills, instead relying on their combat stat line's skill bonus when relevant. See section 2.3.0 for the rules for making skill checks.","ru":"Навыки персонажа — это то, чему ПИ научился. Только что созданный персонаж начинает с нескольких подходящих навыков и может получить больше по мере роста уровня. У NPC нет отдельных навыков — вместо них, когда это нужно, используется бонус навыка из их боевой строки статов. Правила проверок навыков — см. раздел 2.3.0."},
{"n":"1.2.1","l":3,"te":"Skill Levels","tr":"Уровни навыков","en":"Skills are rated on a scale between level-0 and level-4. A character must reach a certain minimum experience level to develop a skill to level-2 or beyond.\nSkill Level\n\t\n\nCapability\n\tMin.\nLevel\n\tNo skill\n\tNo training. Skill checks are made at a -1 penalty, if it's plausible to even try.\n\t1\n\tLevel-0\n\tBasic professional competence in a skill.\n\t1\n\tLevel-1\n\tExperienced professional or clearly superior practitioner.\n\t1\n\tLevel-2\n\tVeteran expert, one respected even by capable practitioners.\n\t3\n\tLevel-3\n\tMaster of the skill, likely one of the best in the city.\n\t6\n\tLevel-4\n\tMaximum feasible human competence in the skill.\n\t9","ru":"Навыки оцениваются по шкале от уровня-0 до уровня-4. Чтобы развить навык до уровня-2 и выше, персонаж должен достичь определённого минимального уровня опыта.\n\n| Уровень навыка | Возможности | Мин. уровень |\n|---|---|---|\n| Нет навыка | Никакой подготовки. Проверки навыка делаются со штрафом -1, если вообще есть смысл пробовать. | 1 |\n| Уровень-0 | Базовая профессиональная компетентность в навыке. | 1 |\n| Уровень-1 | Опытный профессионал или явно превосходящий других практик. | 1 |\n| Уровень-2 | Матёрый эксперт, которого уважают даже способные практики. | 3 |\n| Уровень-3 | Мастер навыка, вероятно, один из лучших в городе. | 6 |\n| Уровень-4 | Максимум достижимой человеческой компетентности в навыке. | 9 |"},
{"n":"1.2.2","l":3,"te":"Gaining Skills in Character Creation","tr":"Получение навыков при создании персонажа","en":"Characters gain skills from their Backgrounds as described below and from a single free pick as noted in section 1.7.4. Some Foci also grant particular skills. The first time a skill is picked or given, a character obtains it at level-0. The second time it is picked or given, the skill becomes level-1. The third and further times a skill is picked or given during character creation, the player instead picks any other skill that is not already level-1. No character can begin play with skills above level-1.","ru":"Персонажи получают навыки от своих Происхождений, как описано ниже, и один бесплатный выбор, как указано в разделе 1.7.4. Некоторые Фокусы тоже дают определённые навыки. В первый раз, когда навык выбран или дан, персонаж получает его на уровне-0. Во второй раз, когда он выбран или дан, навык становится уровнем-1. В третий и последующие разы, когда навык выбирается или даётся при создании персонажа, игрок вместо него выбирает любой другой навык, который ещё не уровня-1. Ни один персонаж не может начать игру с навыками выше уровня-1."},
{"n":"1.2.3","l":3,"te":"The Skill List","tr":"Список навыков","en":"The following skills are standard to most cyberpunk campaigns. GMs may add or subtract from this list for specialized settings. Some skills may overlap at points in their application; the character may use either skill at their discretion.\nAdminister: Manage an organization, handle paperwork, analyze records, and keep an institution functioning on a daily basis. Roll it for bureaucratic expertise, organizational management, legal knowledge, dealing with government agencies, and understanding how corps really work.\nConnect: Find people who can be helpful to your purposes and get them to cooperate with you. Roll it to make useful connections with others, find people you know, know where to get illicit goods and services, and be familiar with foreign cultures and languages. You can use it in place of Talk for persuading people you find via this skill. Note that the people you meet via Connect are not necessarily inclined to work with you without a good reason; if you want reliably cooperative allies, you need Contacts as described on page 11.\nDrive: Drive vehicles, sail ships, fly planes, pilot drones, and perform maintenance and basic repairs on such devices. A PC’s background may incline them to a particular kind of driving, but with some practice this skill can be applied generally.\nExert: Apply trained speed, strength, or stamina in some feat of physical exertion. Roll it to run, jump, lift, swim, climb, throw, and so forth. You can use it as a combat skill when throwing things, though it doesn’t qualify as a combat skill for other uses.\nFix: Create and repair devices both simple and complex. Your PC may be specialized in some field depending on their background, but this skill can be applied generally by most operators. Roll it to fix things, build things, and identify what something is supposed to do.\nHeal: Employ medical and psychological treatment for the injured or disturbed. Roll it to cure diseases, stabilize the critically injured, treat psychological disorders, or diagnose illnesses. It’s also an important skill for implanting and maintaining cyberware.\nKnow: Know facts about academic or scientific fields. Roll it to understand academic topics, remember relevant history, solve science mysteries, and know the basic facts about rare or esoteric topics.\nLead: Convince others to also do whatever it is you’re trying to do. Talk might persuade them that following you is smart, but Lead can make them do it even when they think it’s a bad idea. Roll it to lead troops in combat, convince others to follow you, inspire employee loyalty, or maintain morale and discipline.\nNotice: Spot anomalies or interesting facts about your environment. Roll it for searching places, detecting ambushes, spotting things, and reading the emotional state of other people.\nPerform: Exhibit some performance skill. Roll it to dance, sing, orate, act, or otherwise put on a convincing or emotionally moving performance.\nProgram: Operating or hacking computing and communications hardware. Roll it to program or hack computers, control computer-operated hardware, operate communications tech, or decrypt things. Hacker PCs rely heavily on this skill.\nPunch: Use it as a combat skill when fighting unarmed. If your PC means to make a habit of this rather than as a recourse of desperation, you should take the Unarmed Combatant Focus described later.\nShoot: Use it as a combat skill when using ranged weaponry, whether thrown weapons, bows, gunlinked pistols, combat rifles, or heavy artillery.\nSneak: Move without drawing notice. Roll it for stealth, disguise, infiltration, manual legerdemain, pickpocketing, and the physical defeating of security measures such as electronic locks. \nStab: Use it as a combat skill when wielding melee weapons, whether primitive or complex. It can also be used when throwing weapons.\nSurvive: Depending on the character’s background, this might be more a matter of street smarts and urban survival or it might be directed towards outlands bushcraft and wilderness living. Regardless of the original focus, some time and practice can allow it to be generalized by a PC.\nTalk: Convince other people of the facts you want them to believe. What they do with that conviction may not be completely predictable. Roll it to persuade, charm, or deceive others in conversation.\nTrade: Find what you need on the market and sell what you have. Roll it to sell or buy things, figure out where to purchase hard-to-get or illicit goods, deal with customs agents, or run a business.\nWork: This is a catch-all skill for professions not represented by other skills. When you take it, pick a particular profession, such as lawyering, stevedore work, painting, or some other career. The skill then applies to performing that work or making contacts with people in its sphere.\nTwo further skills exist for campaigns that involve magic. Any character may develop these skills as an intellectual exercise, but only those with the Spellcaster Edge or Summoner Edge may actually use them to create magical effects.\nCast: Cast spells, know about magic, know about important magical events.\nSummon: Summon spirits, know about magic, know about spirits and supernatural beings.","ru":"Эти навыки стандартны для большинства киберпанковых кампаний. Мастер может что-то добавить или убрать под особый сеттинг. Некоторые навыки местами перекрываются в применении; персонаж может использовать любой из них на своё усмотрение.\n\n**Управление:** Руководить организацией, вести бумаги, анализировать записи и обеспечивать повседневную работу учреждения. Бросай его для бюрократической сноровки, организационного управления, знания законов, общения с госорганами и понимания того, как корпы работают на самом деле.\n\n**Связи:** Находить людей, полезных для твоих целей, и добиваться их сотрудничества. Бросай его, чтобы завязать полезные знакомства, найти тех, кого ты знаешь, знать, где взять нелегальные товары и услуги, и разбираться в чужих культурах и языках. Его можно использовать вместо Убеждения, когда уговариваешь людей, найденных через этот навык. Учти: те, кого ты встречаешь через Связи, вовсе не обязательно склонны работать с тобой без веской причины; если тебе нужны надёжно сотрудничающие союзники, тебе нужны Контакты, описанные на стр. 11.\n\n**Вождение:** Водить машины, ходить под парусом, летать на самолётах, пилотировать дронов и выполнять обслуживание и простой ремонт таких устройств. Происхождение ПИ может склонять его к определённому виду вождения, но с некоторой практикой этот навык применяется широко.\n\n**Атлетика:** Применять натренированную быстроту, силу или выносливость в каком-то физическом усилии. Бросай его, чтобы бежать, прыгать, поднимать, плавать, лазать, метать и так далее. Его можно использовать как боевой навык при метании предметов, хотя в остальных случаях он боевым навыком не считается.\n\n**Ремонт:** Создавать и ремонтировать устройства, простые и сложные. Твой ПИ может быть специалистом в какой-то области в зависимости от Происхождения, но большинство операторов применяют этот навык широко. Бросай его, чтобы починить, собрать или определить, для чего вообще предназначена вещь.\n\n**Медицина:** Применять медицинское и психологическое лечение к раненым и к тем, у кого не в порядке с головой. Бросай его, чтобы вылечить болезнь, стабилизировать тяжелораненого, лечить психические расстройства или ставить диагноз. Это также важный навык для установки и обслуживания кибернетики.\n\n**Знание:** Знать факты из академических или научных областей. Бросай его, чтобы разбираться в академических темах, вспомнить нужную историю, разгадать научную загадку и знать основные факты о редких или заумных вещах.\n\n**Лидерство:** Убеждать других делать то же, что пытаешься сделать ты. Убеждение может доказать им, что идти за тобой умно, а Лидерство заставит их пойти, даже когда они считают это плохой идеей. Бросай его, чтобы вести бойцов в бою, убеждать других следовать за тобой, воспитывать преданность сотрудников или поддерживать боевой дух и дисциплину.\n\n**Внимание:** Замечать аномалии или интересные детали окружения. Бросай его для обыска помещений, обнаружения засад, замечания мелочей и чтения эмоционального состояния других людей.\n\n**Выступление:** Демонстрировать какое-то исполнительское мастерство. Бросай его, чтобы танцевать, петь, произносить речи, играть роль или иначе давать убедительное или трогающее выступление.\n\n**Программирование:** Работа с вычислительной и связной техникой или её взлом. Бросай его, чтобы программировать или взламывать компьютеры, управлять компьютеризированной техникой, работать со средствами связи или расшифровывать. Хакеры-ПИ сильно полагаются на этот навык.\n\n**Кулак:** Используется как боевой навык в драке без оружия. Если твой ПИ собирается сделать это привычкой, а не средством от отчаяния, тебе стоит взять Фокус Рукопашник, описанный далее.\n\n**Стрельба:** Используется как боевой навык при работе с дальнобойным оружием — метательным, луками, пистолетами с ганлинком, боевыми винтовками или тяжёлой артиллерией.\n\n**Скрытность:** Двигаться, не привлекая внимания. Бросай его для незаметности, маскировки, проникновения, ловкости рук, карманных краж и физического обхода мер защиты вроде электронных замков.\n\n**Клинок:** Используется как боевой навык при владении оружием ближнего боя, примитивным или сложным. Также применяется при метании оружия.\n\n**Выживание:** В зависимости от Происхождения персонажа это может быть скорее уличная смекалка и городское выживание, а может быть направлено на жизнь в пустошах и дикой природе. Независимо от изначального уклона, время и практика позволяют ПИ применять его широко.\n\n**Убеждение:** Убеждать людей в тех фактах, в которые ты хочешь, чтобы они поверили. Что они сделают с этой убеждённостью, предсказать сложнее. Бросай его, чтобы уговорить, очаровать или обмануть кого-то в разговоре.\n\n**Торговля:** Находить на рынке то, что тебе нужно, и продавать то, что у тебя есть. Бросай его, чтобы продать или купить, выяснить, где достать труднодоступные или нелегальные товары, договориться с таможней или вести дело.\n\n**Работа:** Универсальный навык для профессий, не охваченных другими навыками. Когда берёшь его, выбери конкретную профессию — юрист, грузчик, маляр или другая карьера. Дальше навык применяется к выполнению этой работы и к знакомствам с людьми из этой сферы.\n\nЕщё два навыка существуют для кампаний с магией. Любой персонаж может развивать эти навыки как интеллектуальное упражнение, но только те, у кого есть Козырь Заклинатель или Козырь Призыватель, могут действительно создавать с их помощью магические эффекты.\n\n**Колдовство:** Читать заклинания, знать о магии, знать о важных магических событиях.\n\n**Призыв:** Призывать духов, знать о магии, знать о духах и сверхъестественных существах."},
{"n":"1.3.0","l":2,"te":"Backgrounds","tr":"Происхождения","en":"Every character has a Background, a past reflecting their career before they took up adventuring. A background may be chosen from the list below or a new one made up with GM permission.","ru":"У каждого персонажа есть Происхождение — прошлое, отражающее его занятие до того, как он пустился в авантюры. Происхождение можно выбрать из списка ниже или придумать новое с разрешения Мастера."},
{"n":"1.3.1","l":3,"te":"Background Skills","tr":"Навыки Происхождения","en":"When a Background is chosen, a PC immediately gets its free skill at level-0. At that point, the player decides whether to gain further skills randomly or to pick specific choices.\nIf they choose randomly, they may make three rolls divided between the Growth and Learning tables of their background in any way they wish, including taking all three from just one table. If they pick specific choices they can pick any two skills from the Learning table, including picking the same one twice to raise it to level-1. They may not pick the \"Any Skill\" option, if it exists.\nA skill pick of \"Any Combat\" means the player can pick Shoot, Stab, or Punch. A skill roll of \"Any Skill\" means they can pick any skill from the list above. Some campaigns may involve special magical or psychic skills; these cannot be chose with the Any Skill pick.\nIf an attribute bonus is rolled, such as \"+2 Physical\", the player may apply it to any physical attribute or split the bonus between two physical attributes. The same principle applies to Mental attribute increases. \"Any Stat\" increases may be applied to either physical or mental attributes. No attribute can be raised above 18.","ru":"Когда Происхождение выбрано, ПИ сразу получает его бесплатный навык на уровне-0. После этого игрок решает, получать ли дальнейшие навыки случайно или брать конкретные.\n\nЕсли он выбирает случайный путь, он делает три броска, распределяя их между таблицами Развития и Обучения своего Происхождения как угодно, вплоть до всех трёх по одной таблице. Если он берёт конкретные, то может выбрать любые два навыка из таблицы Обучения, в том числе один и тот же дважды, чтобы поднять его до уровня-1. Вариант «Любой навык» брать нельзя, если он в таблице есть.\n\nВыбор навыка «Любой боевой» означает, что игрок может взять Стрельбу, Клинок или Кулак. Результат броска «Любой навык» означает, что он может взять любой навык из списка выше. В некоторых кампаниях есть особые магические или псионические навыки; их нельзя взять по выбору «Любой навык».\n\nЕсли выпал бонус к характеристике, например «+2 Физические», игрок может применить его к любой физической характеристике или разделить бонус между двумя физическими. Тот же принцип действует для повышения Ментальных характеристик. Прибавки «Любая характеристика» можно применить и к физическим, и к ментальным. Ни одну характеристику нельзя поднять выше 18."},
{"n":"1.3.2","l":3,"te":"New Backgrounds","tr":"Новые Происхождения","en":"To create a new background, the player describes it to the GM and picks an existing background table that best fits the concept. Assuming the GM approves it, they may then roll or pick as usual. If no existing background table fits, they may make a new one with the GM's permission.","ru":"Чтобы создать новое Происхождение, игрок описывает его Мастеру и выбирает существующую таблицу Происхождения, которая лучше всего подходит к концепции. Если Мастер одобрил, дальше он бросает или выбирает как обычно. Если ни одна из существующих таблиц Происхождений не подходит, с разрешения Мастера можно составить новую."},
{"n":"1.3.3","l":3,"te":"Background List","tr":"Список Происхождений","en":"The following backgrounds are examples of those possible for a player. The free granted skill is listed after each background's name.\n\n\nBum                Survive\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Any Combat\n2        +2 Physical        2        Survive\n3        +2 Physical        3        Connect\n4        +2 Mental        4        Sneak\n5        Survive        5        Notice\n6        Any Skill        6        Talk\n                7        Fix\n                        8        Trade\n\n\nBureaucrat        Administer\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Administer\n2        +2 Mental        2        Know\n3        +2 Mental        3        Talk\n4        +2 Mental        4        Program\n5        Administer        5        Lead\n6        Any Skill        6        Trade\n                7        Notice\n                        8        Any Skill\n\n\nClergy                Lead\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Lead\n2        +2 Mental        2        Talk\n3        +2 Mental        3        Connect\n4        +2 Mental        4        Perform\n5        Connect        5        Know\n6        Any Skill        6        Heal\n                        7        Notice\n                        8        Any Skill\n\n\nCoder                Program\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Program\n2        +2 Mental        2        Administer\n3        +2 Mental        3        Fix\n4        +2 Mental        4        Talk\n5        Program        5        Connect\n6        Any Skill        6        Know\n                        7        Notice\n                        8        Any Skill\n\n\nCorp Security        Any Combat\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Any Combat\n2        +2 Physical        2        Administer\n3        +2 Physical        3        Connect\n4        +2 Physical        4        Notice\n5        Any Combat        5        Exert\n6        Any Skill        6        Heal\n                        7        Sneak\n                        8        Lead\n\n\nCorper                Work\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Work\n2        +1 Any Stat        2        Talk\n3        +2 Physical        3        Connect\n4        +2 Mental        4        Any Combat\n5        Any Skill        5        Notice\n6        Any Skill        6        Sneak\n                7        Fix\n                        8        Any Skill\n\n\nCriminal        Sneak\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Any Combat\n2        +1 Any Stat        2        Sneak\n3        +2 Physical        3        Notice\n4        +2 Mental        4        Connect\n5        Sneak                5        Talk\n6        Any Skill        6        Survive\n                        7        Exert\n                        8        Lead\n\n\nDoctor                Heal\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Heal\n2        +2 Physical        2        Notice\n3        +2 Mental        3        Know\n4        +2 Mental        4        Talk\n5        Heal                5        Administer\n6        Any Skill        6        Connect\n                        7        Fix\n                        8        Any Skill\n\n\nDrone Jockey                Drive\nd6        Growth        d8        Learning\n1        +1 Any Stat        1        Drive\n2        +2 Physical        2        Fix\n3        +2 Physical        3        Shoot\n4        +2 Mental        4        Notice\n5        Drive                5        Sneak\n6        Any Skill        6        Exert\n                7        Program\n                        8        Any Skill\n\n\nGanger        Any Combat\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Any Combat\n2        +2 Physical        2        Connect\n3        +2 Physical        3        Survive\n4        +2 Mental        4        Notice\n5        Any Combat        5        Sneak\n6        Any Skill        6        Talk\n                        7        Fix\n                        8        Any Skill\n\n\nLaborer        Exert\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Exert\n2        +2 Physical        2        Work\n3        +2 Physical        3        Sneak\n4        +2 Physical        4        Trade\n5        Exert                5        Survive\n6        Any Skill        6        Fix\n                        7        Any Combat\n                        8        Any Skill\n\n\nLaw Enforcement        Administer\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Administer\n2        +2 Physical        2        Any Combat\n3        +2 Physical        3        Notice\n4        +2 Mental        4        Sneak\n5        Administer        5        Talk\n6        Any Skill        6        Connect\n                        7        Heal\n                        8        Any Skill\n\n\nManager        Administer\nd6        Growth        d8        Learning\n1        +1 Any Stat        1        Administer\n2        +2 Mental        2        Talk\n3        +2 Mental        3        Trade\n4        +2 Mental        4        Connect\n5        Administer        5        Notice\n6        Any Skill        6        Lead\n                7        Program\n                        8        Any Skill\n\n\nOutlander        Survive\nd6        Growth                d8        Learning\n1        +1 Any Stat        1        Survive\n2        +2 Mental        2        Drive\n3        +2 Physical        3        Fix\n4        +2 Physical        1        Talk\n2        +1 Any Stat        2        Perform\n3        +2 Physical        3        Connect\n4        +2 Mental        4        Trade\n5        Talk                5        Sneak\n6        Any Skill        6        Notice\n                        7        Heal\n                        8        Any Skill\n\n\nTechnician        Fix\nd6        Growth        d8        Learning\n1        +1 Any Stat        1        Fix\n2        +2 Physical        2        Program\n3        +2 Mental        3        Exert\n4        +2 Mental        4        Trade\n5        Fix                5        Notice\n6        Any Skill        6        Connect\n                7        Drive\n                        8        Any Skill","ru":"Ниже приведены примеры Происхождений, возможных для игрока. Бесплатный полученный навык указан после названия каждого Происхождения.\n\n**Бродяга** — Выживание\n\n| d6 | Развитие | d8 | Обучение |\n|---|---|---|---|\n| 1 | +1 Любая характеристика | 1 | Любой боевой |\n| 2 | +2 Физические | 2 | Выживание |\n| 3 | +2 Физические | 3 | Связи |\n| 4 | +2 Ментальные | 4 | Скрытность |\n| 5 | Выживание | 5 | Внимание |\n| 6 | Любой навык | 6 | Убеждение |\n|  |  | 7 | Ремонт |\n|  |  | 8 | Торговля |\n\n**Бюрократ** — Управление\n\n| d6 | Развитие | d8 | Обучение |\n|---|---|---|---|\n| 1 | +1 Любая характеристика | 1 | Управление |\n| 2 | +2 Ментальные | 2 | Знание |\n| 3 | +2 Ментальные | 3 | Убеждение |\n| 4 | +2 Ментальные | 4 | Программирование |\n| 5 | Управление | 5 | Лидерство |\n| 6 | Любой навык | 6 | Торговля |\n|  |  | 7 | Внимание |\n|  |  | 8 | Любой навык |\n\n**Клирик** — Лидерство\n\n| d6 | Развитие | d8 | Обучение |\n|---|---|---|---|\n| 1 | +1 Любая характеристика | 1 | Лидерство |\n| 2 | +2 Ментальные | 2 | Убеждение |\n| 3 | +2 Ментальные | 3 | Связи |\n| 4 | +2 Ментальные | 4 | Выступление |\n| 5 | Связи | 5 | Знание |\n| 6 | Любой навык | 6 | Медицина |\n|  |  | 7 | Внимание |\n|  |  | 8 | Любой навык |\n\n**Кодер** — Прогр {"n":"1.4.0","l":2,"te":"Contacts","tr":"Контакты","en":"Contacts are associates the PC has acquired in their past life or potential new acquaintances they make during play. Contacts come in two levels: acquaintances and friends. Acquaintances will deal honestly with the PC, do favors for them that don't put them at risk or significant expense, and perform their professional skills on the PC's behalf. Friends will also do as much, but will undertake favors that cause them considerable risk or significant expense. Contacts will not normally go on missions with the PCs.","ru":"Контакты — это знакомства, которые ПИ завёл в прошлой жизни, или новые связи, которые он может завести в игре. Контакты бывают двух уровней: знакомые и друзья. Знакомый будет вести дела с ПИ честно, окажет услуги, которые не ставят его под удар и не стоят ему серьёзных расходов, и применит свои профессиональные навыки в интересах ПИ. Друг сделает всё то же, но возьмётся и за услуги, связанные для него с изрядным риском или крупными затратами. Обычно Контакты не отправляются с ПИ на миссии."},
{"n":"1.4.1","l":3,"te":"Initial Contacts","tr":"Начальные Контакты","en":"A new PC begins play with either two acquaintances or one friend of their choice. The player should give a name to each, a brief description of their profession, and a sentence or two about how they developed the relationship. Starting Contacts should not be elite figures or major players in the setting, but capable mid-level NPCs who can provide services and favors. Some examples would include a local cyberdoc, a black-market arms dealer, a popular club owner, an HR officer at a local megacorp branch, or similar sorts.","ru":"Новый ПИ начинает игру либо с двумя знакомыми, либо с одним другом на свой выбор. Игрок должен дать каждому имя, коротко описать его профессию и в одном-двух предложениях рассказать, как сложились эти отношения. Стартовые Контакты не должны быть элитными фигурами или крупными игроками сеттинга — это дельные NPC среднего уровня, способные оказывать услуги и предоставлять свои сервисы. Например: местный кибердок, торговец оружием с чёрного рынка, владелец популярного клуба, кадровик в местном филиале мегакорпорации и тому подобные типы."},
{"n":"1.4.2","l":3,"te":"Gaining and Losing Contacts","tr":"Приобретение и потеря Контактов","en":"Contacts can be gained and lost during play. When a PC acts in such a way as would reasonably earn a particular NPC's friendship and trust, the GM may tell the player to note that NPC down as an acquaintance or friend. In the same fashion, if the PC burns or abuses a relationship, it may downgrade a friend to an acquaintance or cost them the connection entirely. Contacts exposed to danger by a request or favor may also be killed if events turn out poorly.","ru":"Контакты можно приобретать и терять во время игры. Когда ПИ поступает так, что это резонно заслуживает дружбы и доверия конкретного NPC, Мастер может велеть игроку записать этого NPC как знакомого или друга. Точно так же, если ПИ сжигает отношения или пользуется ими во зло, друг может понизиться до знакомого, а связь — оборваться совсем. Контакты, которых просьба или услуга подставила под опасность, могут и погибнуть, если дело обернётся плохо."},
{"n":"1.5.0","l":2,"te":"Edges","tr":"Козыри","en":"Edges define the main talents that make a PC a viable operator. They are major capabilities, aptitudes, or professional functions. An Edge can only be selected once unless indicated otherwise. A beginning PC chooses two, and may choose a third once they reach the fifth level of experience.","ru":"Козыри задают главные таланты, которые делают ПИ дельным оператором. Это крупные способности, склонности или профессиональные функции. Козырь можно взять только один раз, если не указано иное. Начинающий ПИ выбирает два и может выбрать третий, когда достигнет пятого уровня опыта."},
{"n":"1.5.1","l":3,"te":"The Underdog Rule","tr":"Правило неудачника","en":"A PC who ends character generation with a attribute modifier total of -1 or less may pick a bonus Edge to reflect the fact that they must have some sort of special talent to have become an operator despite their manifest shortcomings. Their total attribute modifiers must still sum to -1 or less by the end of character creation to claim this bonus; that means that the Prodigy Edge is unlikely to be permissible, as it would probably increase their modifier total above -1.\nIn campaigns that involve magical Edges or other special powers as Edges, the Underdog Rule bonus may not be used to pick such Edges.\nCharacters who take advantage of the Underdog Rule may not increase their attribute scores later by spending skill points during character advancement as indicated in section 2.7.1.5. Attribute or modifier enhancements from other sources, such as cyberware or newly-picked Foci, do not disqualify a PC.","ru":"ПИ, который заканчивает создание персонажа с суммой модификаторов характеристик -1 или меньше, может выбрать бонусный Козырь: раз он стал оператором несмотря на явные недостатки, у него должен быть какой-то особый талант. Чтобы получить этот бонус, сумма его модификаторов характеристик к концу создания персонажа всё равно должна быть -1 или меньше; это значит, что Козырь Одарённый вряд ли допустим, ведь он, скорее всего, поднимет сумму модификаторов выше -1.\n\nВ кампаниях, где есть магические Козыри или другие особые силы в виде Козырей, бонус Правила неудачника нельзя тратить на такие Козыри.\n\nПерсонажи, воспользовавшиеся Правилом неудачника, не могут потом повышать значения характеристик, тратя пункты навыков при развитии персонажа, как указано в разделе 2.7.1.5. Прибавки к характеристикам или модификаторам из других источников — например, от кибернетики или новых взятых Фокусов — этого права не лишают."},
{"n":"1.5.2","l":3,"te":"Common Edge List","tr":"Список обычных Козырей","en":"The Edges below are normal for most cyberpunk campaigns. GMs may add additional options to support certain character concepts that are unique or specific to their setting.\nEducated: You may pick a bonus skill of your choice. Whenever you gain skill points from character level advancement, you get a bonus skill point.\nFace: Gain Connect as a bonus skill. Once per game week, whenever it’s convenient, gain one temporary Acquaintance Contact of your choice, describing them in any way the GM finds acceptable. You lose touch with this Contact after you use this Edge again, but you can use this Edge to connect with them again at a different time. You may also provide favors or payment sufficient to cement the relationship at the GM’s discretion.\nFocused: You begin play with an extra Focus pick. You may choose this Edge more than once.\nGhost: You are uncannily elusive. Gain Sneak as a bonus skill and the Fighting Withdrawal combat action is an On Turn action for you. Once per scene, reroll a failed Sneak check related to sneaking or going unseen. Once per game day, as a Move action, move up to 10 meters without anyone around you seeing you move. If you use this movement to get behind cover, you might seem to vanish outright to onlookers.\nHacker: Gain Program as a bonus skill. You may begin play with an installed Cranial Jack cybersystem, a scrap deck from page 75, and eight program elements of your choice among available Verbs and Subjects. Each round, you gain a bonus Main Action that can only be used to perform hacking or cyberspace-related mental actions. This does not include drone piloting or vehicle driving.\nHard To Kill: Instead of rolling 1d6 per level for your hit points, you roll 1d6+2. Your base Trauma Target increases by +1, turning the base 6 into 7.\nKilling Blow: Gain a combat skill as a bonus skill. Whenever you inflict hit point damage on something, whether by weapon, Shock, special ability, or any other source, the damage is increased by 1 point per two character levels, rounded up. Any Trauma Die you roll gains a +1 bonus.\nMasterful Expertise: Once per scene, as an Instant action, reroll a failed check for a non-combat skill.\nOn Target: Gain a combat skill as a bonus skill. Your basic attack bonus is equal to your character level, instead of the usual half level, rounded down.\nProdigy: Pick an attribute other than Constitution; its score becomes 18 and it grants a +3 modifier instead of +2. Characters benefiting from the Underdog Rule can’t take this Edge.\nOperator’s Fortune: You may or may not be good, but you are undeniably lucky. Once per game session as an Instant action, when something bad happens to you such as an injury, a failed save, or a botched skill check, test your luck and roll 1d6. On a 1, the bad event is unaffected. On a 2-5, you somehow avert the consequences by blind chance. On a 6, it actually lands on an enemy or rival of the GM’s choice, if that’s possible. Only events that happened in this same round can be averted.\nVeteran’s Luck: Once per scene, as an Instant action, trigger this ability to gain one of two effects: an attack roll that just hit you is instead treated as a miss, or an attack roll you just made that missed is instead treated as a hit. This ability can be applied to vehicle weapons used by the operator, but it cannot protect against environmental damage, vehicle crashes, falls, or other harm that doesn’t involve an attack roll.\nVoice of the People: You are a rocker, graffiti artist, poet, demagogue, or other rabble-rouser with a considerable reputation. You gain both levels of the Pop Idol Focus and an additional Friend Contact related to your art.\nWired: You may begin play with up to $200,000 worth of new or secondhand cyber. If secondhand, you roll once per system for its defect and may end up with unusable junk. You don’t need to pay for installation and its maintenance is covered for the next two months. You can redeem this Edge later in your career by paying double the cost of the cyber you selected; if so, you can trade this Edge in for a different one with the GM’s approval. See page 27 for example packages of cyber you might pick to suit your character’s concept.","ru":"Приведённые ниже Козыри нормальны для большинства киберпанковых кампаний. Мастер может добавить дополнительные варианты, чтобы поддержать концепции персонажей, уникальные или специфичные для его сеттинга.\n\n**Образованный:** Ты можешь взять бонусный навык на свой выбор. Всякий раз, когда ты получаешь пункты навыков за повышение уровня персонажа, ты получаешь один бонусный пункт навыка.\n\n**Лицо:** Получи Связи как бонусный навык. Раз в игровую неделю, в любой удобный момент, получи одного временного Контакта-знакомого на свой выбор, описав его как угодно — лишь бы Мастер согласился. Ты теряешь связь с этим Контактом, когда используешь этот Козырь снова, но можешь тем же Козырем связаться с ним заново в другой раз. Ты также можешь оказать услуги или заплатить, чтобы закрепить отношения, — на усмотрение Мастера.\n\n**Сосредоточенный:** Ты начинаешь игру с дополнительным выбором Фокуса. Этот Козырь можно взять больше одного раза.\n\n**Призрак:** Ты неуловим до жути. Получи Скрытность как бонусный навык, и боевое действие Боевой отход становится для тебя Действием в свой ход. Раз за сцену перебрось неудачную проверку Скрытности, связанную с тем, чтобы прокрасться или остаться незамеченным. Раз в игровой день, Действием перемещения, пройди до 10 метров так, что никто вокруг не увидит твоего движения. Если ты используешь это перемещение, чтобы уйти за укрытие, для наблюдателей ты можешь просто исчезнуть.\n\n**Хакер:** Получи Программирование как бонусный навык. Ты можешь начать игру с установленной кибер-системой Черепной разъём, хламовой декой со стр. 75 и восемью элементами программ на свой выбор из доступных Глаголов и Объектов. Каждый раунд ты получаешь бонусное Основное действие, которое можно потратить только на хакинг или другие мыслительные действия, связанные с киберпространством. Пилотирование дронов и вождение транспорта сюда не входят.\n\n**Живучий:** Вместо 1d6 за уровень на пункты здоровья ты бросаешь 1d6+2. Твой базовый Порог травмы повышается на +1, превращая базовую 6 в 7.\n\n**Смертельный удар:** Получи боевой навык как бонусный. Всякий раз, когда ты наносишь урон пунктам здоровья — оружием, Шоком, особой способностью или из любого другого источника, — урон увеличивается на 1 пункт за каждые два уровня персонажа, с округлением вверх. Любая Кость травмы, которую ты бросаешь, получает бонус +1.\n\n**Виртуозное мастерство:** Раз за сцену, Мгновенным действием, перебрось неудачную проверку небоевого навыка.\n\n**В цель:** Получи боевой навык как бонусный. Твой базовый бонус атаки равен уровню персонажа, а не половине уровня с округлением вниз, как обычно.\n\n**Одарённый:** Выбери характеристику, кроме Телосложения; её значение становится 18 и она даёт модификатор +3 вместо +2. Персонажи, пользующиеся Правилом неудачника, не могут взять этот Козырь.\n\n**Фортуна оператора:** Может, ты и не хорош, но удачлив ты несомненно. Раз за игровую сессию, Мгновенным действием, когда с тобой случается что-то плохое — травма, проваленный спасброск, запоротая проверка навыка, — испытай удачу и брось 1d6. На 1 плохое событие остаётся как есть. На 2–5 ты слепым случаем как-то отводишь от себя последствия. На 6 оно вообще падает на врага или соперника по выбору Мастера, если такое возможно. Отвести можно только события, которые произошли в этом же раунде.\n\n**Везение ветерана:** Раз за сцену, Мгновенным действием, включи эту способность и получи один из двух эффектов: атака, которая только что попала по тебе, считается промахом, либо твоя атака, которая только что промахнулась, считается попаданием. Эту способность можно применять к транспортному оружию, которым пользуется оператор, но она не защищает от урона от окружения, аварий транспорта, падений и другого вреда, не связанного с броском атаки.\n\n**Голос народа:** Ты рокер, уличный художник, поэт, демагог или иной подстрекатель с изрядной репутацией. Ты получаешь оба уровня Фокуса Поп-идол и дополнительного Контакта-друга, связанного с твоим искусством.\n\n**Прошитый:** Ты можешь начать игру с новым или подержанным кибером на сумму до $200 000. Если он подержанный, то на каждую систему ты бросаешь дефект и можешь получить нерабочий хлам. Тебе не нужно платить за установку, а обслуживание этого кибера покрыто на два месяца вперёд. Ты можешь выкупить этот Козырь позже, заплатив двойную цену выбранного кибера; тогда с одобрения Мастера ты можешь обменять этот Козырь на другой. Примеры наборов кибера, которые можно взять под концепцию твоего персонажа, см. на стр. 27."},
{"n":"1.5.3","l":3,"te":"Magical Edge List","tr":"Список магических Козырей","en":"The Edges below are appropriate only to those campaigns that involve magic or supernatural abilities. They are meant for use with the optional magic rules in section 6.0.0. Characters who are taking advantage of the Underdog Rule cannot use their bonus Edge to pick one of these.\nGraced: You have innate magical abilities that enhance your physical or mental prowess. You gain the Graced powers and hindrances described in section 6.3.0.\nSpellcaster: You are a mage, capable of casting spells as described in section 6.1.0and suffering a mage's limits in using cyberware.\nSummoner: You are a summoner, capable of calling up spirit servants as described in page 6.2.0, though you also have limits in using cyberware.","ru":"Приведённые ниже Козыри годятся только для тех кампаний, где есть магия или сверхъестественные способности. Они предназначены для использования с опциональными правилами магии из раздела 6.0.0. Персонажи, пользующиеся Правилом неудачника, не могут взять один из них своим бонусным Козырем.\n\n**Благословённый:** У тебя есть врождённые магические способности, усиливающие твои физические или умственные возможности. Ты получаешь силы и помехи Благословённых, описанные в разделе 6.3.0.\n\n**Заклинатель:** Ты маг, способный читать заклинания, как описано в разделе 6.1.0, и подчиняющийся ограничениям мага на использование кибернетики.\n\n**Призыватель:** Ты призыватель, способный вызывать духов-слуг, как описано на стр. 6.2.0, но у тебя тоже есть ограничения на использование кибернетики."},
{"n":"1.6.0","l":2,"te":"Foci","tr":"Фокусы","en":"Foci are special talents that a PC can possess. They aren't as powerful as Edges, but a PC will develop more of them over time. Any PC can select any Focus, barring a few with specific requirements; they do not need to fit the Edges they select. So long as the player can explain how or why they acquired the talent they can have it.\nFoci usually come in two levels, though some have only one. The first time a Focus is chosen, the benefits of the first level are gained. The second time it's chosen, the benefits of the second level are added to those of the first.\nA new character may choose one Focus, plus one more if they have the Focused Edge.","ru":"Фокусы — особые таланты, которыми может обладать ПИ. Они не так мощны, как Козыри, но со временем ПИ наберёт их больше. Любой ПИ может взять любой Фокус, кроме нескольких, у которых есть особые требования; Фокусы не обязаны соответствовать выбранным Козырям. Пока игрок способен объяснить, как или почему персонаж приобрёл этот талант, он может его иметь.\n\nОбычно у Фокусов два уровня, хотя у некоторых только один. Когда Фокус выбирают впервые, персонаж получает выгоды первого уровня. Когда его выбирают во второй раз, выгоды второго уровня добавляются к выгодам первого.\n\nНовый персонаж может выбрать один Фокус — и ещё один, если у него есть Козырь Сосредоточенный."},
{"n":"1.6.1","l":3,"te":"Focus List","tr":"Список Фокусов","en":"Ace Driver\nIf it’s got wheels or wings, you can drive it. Your background may lend itself to a particular type of transport, but your natural talent lets you operate any vehicle with an almost instinctive aptitude. These Focus benefits do not apply to drone piloting, however.\nLevel 1: Gain Drive as a bonus skill. You have “acquired” vehicles worth no more than the budget given in section 1.6.2, and can replace lost or destroyed gear at a rate of $10,000 per week. Once per scene, as an Instant action, reroll a failed skill check related to driving or vehicle maintenance and repair.\nLevel 2: Gain Fix as a bonus skill. The Speed of a vehicle you drive is increased by 1 point. Once per vehicle, you can add a mod to it for free, ignoring money and experimental component costs. Only you can effectively operate this mod, but it requires no Maintenance. You can change this free mod with a week of downtime.\nAlert\nYou are keenly aware of your surroundings and virtually impossible to take unaware. You have an instinctive alacrity of response that helps you act before less wary persons can think to move.\nLevel 1: Gain Notice as a bonus skill. You cannot be surprised, nor can others use the Execution Attack option on you. When your group rolls initiative, your vigilance allows them to roll twice and take the higher roll.\nLevel 2: In addition to the benefits of level 1, you always act first in a combat round unless someone else involved is also this Alert. \nAll Natural\nYour mind and body are superbly gifted, but this very excellence leaves you profoundly incompatible with most cyber. You cannot accept implants except for minor cosmetic ones with an unmodified System Strain cost of zero. If a GM is mixing rules from multiple Without Number games, this Focus should not be allowed unless cyberware is expected equipment for all PCs. If you’re using the deluxe version rules for magic, PCs with magical or psychic Edges such as Spellcaster, Summoner, or Graced cannot take this Focus.\nLevel 1: Gain any skill as a bonus skill. Pick an attribute; its modifier increases by +1, up to a maximum of +3. You can make another such attribute pick at levels 3, 5, 7, and 10, choosing the same attribute or a different one. While you can still suffer Traumatic Hits, you never suffer major injuries as described on page 41.\nArmsmaster\nYou have an unusual competence with thrown weapons and melee attacks. This Focus’ benefits do not apply to unarmed attacks or non-thrown projectile weapons. This Focus’ bonuses also don’t stack with Deadeye or other Foci that add a skill’s level to your damage or Shock.\nLevel 1: Gain Stab as a bonus skill. You can Ready a Stowed melee or thrown weapon as an Instant action. You may add your Stab skill level to a melee or thrown weapon’s damage roll or Shock damage, assuming it has any to begin with.\nLevel 2: The Shock from your melee attacks always treats the target as if they have AC 10. Gain a +1 bonus to hit with all thrown or melee attacks.\nAssassin\nYou are practiced at sudden murder, and have certain advantages in carrying out an Execution Attack as described in the rules in section 2.4.7.3. \nLevel 1: Gain Sneak as a bonus skill. You can conceal an object no larger than a knife or pistol from anything less invasive than a strip search, including normal weapon detection devices. You can draw or produce this object as an On Turn action, and your point-blank ranged attacks made from surprise with it cannot miss the target.\nLevel 2: You can take a Move action on the same round as you make an Execution Attack, closing rapidly with a target before you attack. You may split this Move action when making an Execution Attack, taking part of it before you murder your target and part of it afterwards. This movement happens too quickly to alert a victim or to be hindered by bodyguards not directly in your path.\nAuthority\nYou have an uncanny kind of charisma about you, one that makes others instinctively follow your instructions and further your causes. Where this Focus refers to followers, it means NPCs who have voluntarily chosen to be in your service. PCs never count as followers.\nLevel 1: Gain Lead as a bonus skill. Once per day, you can make a request from an NPC who is not openly hostile to you, rolling a Cha/Lead skill check at a difficulty of the NPC’s Morale score. If you succeed, they will comply with the request, provided it is not harmful or very uncharacteristic.\nLevel 2: Those who follow you are fired with confidence. Any NPC being directly led by you gains a Morale and hit roll bonus equal to your Lead skill and a +1 bonus on all skill checks. Your followers will not act against your interests unless under extreme pressure.\nClose Combatant\nYou’ve had all too much practice at close-in fighting and desperate struggles with pistol or blade. You’re extremely skilled at avoiding injury in melee combat, and at level 2 you can dodge through a melee scrum without fear of being knifed in passing.\nLevel 1: Gain any combat skill as a bonus skill. You can use pistol-sized ranged weapons in melee without suffering penalties for the proximity of melee attackers. You ignore Shock damage from melee assailants, even if you’re unarmored at the time.\nLevel 2: The Shock damage from your melee attacks treats all targets as if they were AC 10. The Fighting Withdrawal combat action is treated as an On Turn action for you and can be performed freely.\nCyberdoc\nAny skilled medic can implant and maintain cyber systems, but you have a special aptitude for the work.\nLevel 1: Gain Fix and Heal as bonus skills. You start play with a cyberdoc kit, and you can implant cyberware even if your Heal skill is level-0. You gain a +2 bonus on all cyber implant surgery skill checks. If you perform cyber maintenance for a person, the delicacy of your adjustments decreases the total System Strain cost of their implants by one point until t
