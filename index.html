n-lethal damage with its attacks, however, and will resist commands to spare downed opponents.\nSpirit Whispers: As a Main Action, the spirit can make a suggestion to a listener that isn’t longer than one sentence. If the suggestion is not deeply contrary to the target’s nature or interests, they must make a Mental save or else carry it out for at least one round. If not given a reason to desist, the target may carry out the suggestion until it is complete or an hour has passed. A target can be subject to Spirit Whispers only once per scene.\nSpirit’s Eye: The spirit is capable of seeing clearly in the dark, hearing whispers at twenty meters, and identifying people by the scent they leave on objects they have recently touched. All Notice skill checks are made at +2.\nSwift Pursuit: The spirit’s Move rating is increased by 10m. It gains a +2 bonus on all skill checks related to chasing down a target.\nViolent Will: A Physical Form spirit gains a base attack bonus equal to its hit dice +1 and does 1d10 damage on a melee hit plus one-half its hit dice, rounded down, with a melee Shock rating equal to half its hit dice, rounded down, against AC 15. At 5th level this attack can be used at range, up to 100 meters distant. If used lethally, the attack has a Trauma Rating of 1d8/x3. The spirit acts independently on its summoner’s initiative in combat. Spirit Forms cannot take this power, and cannot directly harm creatures.","ru":"Перечисленные здесь силы — просто самые частые среди призванных духов. Одну и ту же силу конкретный дух может взять лишь один раз. Говорят, некоторые сущности обладают более редкими способностями, а иные магические традиции, как считается, обучают своих посвящённых знанию особых искусств.\n\n\n**Обычные Силы духов**\n\n| Сила | Мин. уровень | Эффект |\n|---|---|---|\n| Воздушный шаг | 3 | Дух может летать со своей обычной Скоростью. Физические духи могут нести груз |\n| Знаток техники | 1 | Дух может пользоваться обычной современной техникой, но не оружием и не бронёй |\n| Аура разрушения | 5 | Получает бонус к урону, равный половине его Костей здоровья, и вредит атакующим в ближнем бою |\n| Проклятие | 1 | Наложить на врага -1 на проверки навыков и -2 к попаданию/урону. Растёт с уровнями |\n| Ловушка | 1 | Цель не может сдвинуться с места, пока её не освободят |\n| Милость | 1 | Дать союзнику бонус к проверкам или боевым броскам в определённом занятии |\n| Звериный договор | 1 | Говорить с животными того же типа, что и дух-зверь, и командовать ими |\n| Плавниковая быстрота | 1 | Плавать с двойной обычной Скоростью духа |\n| Плоть из глины | 1 | Дух не подвержен Травматичным попаданиям |\n| Призрачное присутствие | 5 | Дух невидим, пока не совершит насильственное действие или не привлечёт внимание |\n| Жуткие когти | 3 | Бонус к боевым показателям, даруемым Яростной волей |\n| Железный эйдолон | 10 | Физическая форма неуязвима для немагического оружия, но не для рукопашных попаданий |\n| Милосердные руки | 1 | Принять урон на духа, чтобы вылечить раненого союзника |\n| Могучая форма | 1 | Обрести огромную физическую силу, хотя она слишком медленная для боя |\n| Сбить с пути | 3 | Заставить движущуюся цель двигаться в любую сторону, какую пожелает дух |\n| Туманная форма | 1 | Дух может протекать через любую преграду, не являющуюся водонепроницаемой |\n| Смертная личина | 1 | Дух выглядит обычным человеком, кроме случаев внимательного осмотра |\n| Щит мирмидона | 3 | Когда твой призыватель получает Травматичное попадание, принять его вместо него |\n| Носитель имени | 1 | Обрести личность, сохраняющуюся через множество призывов |\n| Природная неуязвимость | 1 | Стать неуязвимым к субстанции или источнику вреда, подходящему его природе |\n| Полтергейст | 1 | Телекинетически манипулировать предметами на расстоянии со слабой силой |\n| Умелый | 1 | Выбери навык или роль и добавь +2 к связанным с ними проверкам навыков духа |\n| Паучьи лапы | 1 | Ходить по вертикальным или нависающим поверхностям, как по ровной земле |\n| Дух войны | 1 | Усиливает боевые способности Яростной воли, но дух становится безжалостным в бою |\n| Шёпот духов | 3 | Подать слушателю внушение, которое тот не находит глубоко неприемлемым |\n| Око духа | 1 | Обостряет чувства духа и даёт ему бонус +2 к проверкам Внимания |\n| Стремительная погоня | 1 | Скорость духа растёт на 10 метров, и он получает +2 на преследование |\n| Яростная воля | 1 | Дух способен драться, но не будет пользоваться смертным оружием или бронёй |\n\n**Воздушный шаг:** Дух может летать со своей обычной скоростью перемещения, но не может атаковать в полёте. Физические духи могут нести до 25 килограммов, а с Могучей формой — до 500.\n**Знаток техники:** Дух способен пользоваться повседневной человеческой техникой — телефонами, машинами и прочими обычными устройствами — на обычном человеческом уровне умения. Однако он по-прежнему не может применять человеческое оружие или броню, включая гранаты, и не может работать хакером, техником или в иной профессии, требующей технических навыков, какими бы ни были его прочие силы.\n**Аура разрушения:** Дух окутан токсичными газами, лютым холодом, рвущимся пламенем, давящей тоской или иной аурой, вредящей тем, кто подошёл слишком близко. Если дух может атаковать в ближнем бою, он получает бонус к урону, равный половине его Костей здоровья с округлением вверх. Если кто-то атакует его в ближнем бою, он должен сделать подходящий спасброск или получить урон, равный Костям здоровья духа +2, прежде чем атака состоится. Тип спасброска зависит от природы ауры. Нелетальные ауры могут лишить жертву сознания, но не убьют её. «Отключить» эту ауру дух не может.\n**Проклятие:** Основным действием дух может подпортить удачу видимого существа, накладывая -1 на все проверки навыков и -2 на все броски атаки и урона до конца сцены. На 7-м уровне эти штрафы удваиваются. Существо может нести только одно проклятие за раз, и дух не может проклясть за день больше людей, чем его Кости здоровья.\n**Ловушка:** Дух может поймать цель человеческого размера Основным действием, если она находится в пределах 30 м и провалит спасброск Уклонения. Пойманного союзник освобождает за два Основных действия или одной успешной проверкой Сил/Атлетика против сложности 10. Пойманные враги всё ещё могут действовать, но не могут сдвинуться с места, пока ловушка не рассеется через пять минут. Дух не может держать в ловушке больше целей одновременно, чем его Кости здоровья. Эту силу могут взять только духи в физической форме.\n**Милость:** Основным действием дух благословляет удачу цели в определённом занятии, связанном с его природой, давая +1 на все относящиеся к нему проверки навыков на сцену. Если дано боевое благословение, получатель получает +2 к броскам атаки и урона. На 7-м уровне эти бонусы удваиваются. Мастер решает, связано ли данное занятие с духом. Существо может нести только одну милость за раз, и дух не может одарить за день больше людей, чем его Кости здоровья.\n**Звериный договор:** Животные того же общего типа, что и дух, подчиняются его приказам, если те не противоречат их природе. Для духов без звериной природы эта сила бесполезна.\n**Плавниковая быстрота:** Дух получает скорость плавания, равную двойной обычной Скор.\n**Плоть из глины:** Дух не подвержен Травматичным попаданиям — вместо обычного Порога травмы 6.\n**Призрачное присутствие:** Дух невидим для зрения, включая ИК и подобные экзотические чувства, пока не совершит насильственное действие, не устроит переполох или не применит на цель силу, дающую спасброск. Утраченную невидимость нельзя вернуть в течение десяти минут.\n**Жуткие когти:** Атака ближнего боя от Яростной воли улучшена. Её Шок теперь действует на любой КЗщ, а урон и Шок увеличены на +2. Эти бонусы не распространяются на дальние атаки, которые дух может делать. Духи, призванные с этой силой, всегда выглядят опасно или злобно, и их нельзя замаскировать под что-то безобидное.\n**Железный эйдолон:** Дух в Физической форме теперь неуязвим для немагического оружия, не являющегося Тяжёлым. Однако психическая сила, заложенная в рукопашных атаках, всё ещё может ему повредить — даже если нападающий не одарён магией.\n**Милосердные руки:** Дух может истратить свою силу, чтобы вылечить раненого. Основным действием он лечит 1d8 ПЗ союзнику вплотную. Каждое применение этой силы наносит духу 1d8 урона и добавляет цели одну Системную нагрузку. Дух с этой силой охотно применит её, даже если ему грозит уничтожение.\n**Могучая форма:** Требуя физической формы, эта сила усиливает мощь духа. Хотя эта сила разворачивается слишком медленно, чтобы пригодиться в бою, Основным действием дух может проломить внутреннюю стену или обычную наружную дверь, поднять и нести до пятисот килограммов или совершить подобный подвиг грубой силы. Чтобы применить её против беспомощной или неподвижной цели, у духа должна быть сила Яростная воля. Тогда атаки духа в ближнем бою против беспомощных автоматически являются Травматичным попаданием и могут вредить даже транспорту.\n**Сбить с пути:** Раз в раунд Мгновенным действием дух может выбрать целью движущегося человека. Если цель провалит Ментальный спасброск, дух управляет её задуманным перемещением, направляя его в любую сторону, которая не является очевидно опасной, на всю дальность её обычного Действия перемещения. Если жертва не знает о вмешательстве духа, она будет думать, что выбрала маршрут сама, и попытается объяснить себе, почему так поступила.\n**Туманная форма:** Дух может протекать через любую преграду, не являющуюся водонепроницаемой, без потери скорости перемещения. Даже сущности в Духовной форме могут так просачиваться через отверстия в барьерах, куда их воплощённый облик иначе не пролез бы.\n**Смертная личина:** При небрежном осмотре дух выглядит обычным человеком — с той внешностью и одеждой, какие пожелает призыватель. Конкретных людей эта сила скопировать не может, а близкий внимательный осмотр выдаст жутковатую природу духа.\n**Щит мирмидона:** Мгновенным действием, когда призыватель духа получает Травматичное попадание, а дух находится в пределах 10 м, дух может превратить это попадание в обычное. Но тогда Травматичное попадание получает сам дух. Этот урон действует на духа, даже если тот иначе неуязвим для этого оружия или для Травматичных попаданий. Дух с этой силой охотно применит её, даже если ему грозит уничтожение.\n**Носитель имени:** Призыватель даёт духу имя. Даже уничтоженный, этот конкретный дух может быть призван снова со всеми знаниями и опытом, которые у него были до уничтожения. Это сохраняет его личность и опыт, но также означает, что призывать его нужно с тем же физическим или духовным воплощением и что силы ему можно только добавлять: наделив его, к примеру, Жуткими когтями, каждый последующий призыв обязан включать и эту силу. Носители имени немного крепче: +2 пункта здоровья за Кость здоровья. Они также более своевольны — +2 к сложности навязать им противоестественный приказ.\n**Природная неуязвимость:** Дух невосприимчив к некой субстанции, подходящей его природе: дух огня может быть неуязвим для огня, дух бури — для электричества, и так далее. Эта невосприимчивость не может дать неуязвимость к обычному оружию или атакам; спорные случаи решает Мастер.\n**Полтергейст:** Основным действием дух может телекинетически манипулировать бесхозными предметами в пределах 20 м, как двумя невидимыми руками. Такая манипуляция поднимает не более 20 килограммов и слишком неточна, чтобы наносить действенные атаки или мешать сопротивляющемуся. Действия этой силой не срывают Призрачное присутствие, даже если устраивают переполох.\n**Умелый:** Дух талантлив в определённом небоевом навыке, получая дополнительный бонус +2 на все броски, связанные с его применением. \n**Паучьи лапы:** Дух может стоять и ходить по крутым или нависающим поверхностям, как по ровной земле.\n**Дух войны:** У духа с Яростной волей эта сила усилена, даруя ему неистовое рвение к кровопролитию. Он получает бонус к броску атаки, равный твоему уровню навыка Призыв, и больше не сопротивляется приказам вступать в самоубийственные схватки. Однако он не способен наносить своими атаками нелетальный урон и будет сопротивляться приказам щадить поверженных противников.\n**Шёпот духов:** Основным действием дух может подать слушателю внушение длиной не более одного предложения. Если внушение не идёт глубоко вразрез с природой или интересами цели, та должна сделать Ментальный спасброск, иначе выполняет его как минимум один раунд. Если у цели не появится причины остановиться, она может выполнять внушение, пока не закончит его или пока не пройдёт час. Одна цель может подпасть под Шёпот духов только раз за сцену.\n**Око духа:** Дух способен ясно видеть в темноте, слышать шёпот на двадцати метрах и узнавать людей по запаху, который те оставляют на недавно тронутых предметах. Все проверки навыка Внимание делаются с +2.\n**Стремительная погоня:** Показатель Скор. духа увеличивается на 10 м. Он получает бонус +2 на все проверки навыков, связанные с преследованием цели.\n**Яростная воля:** Дух в Физической форме получает базовый бонус атаки, равный его Костям здоровья +1, и наносит 1d10 урона при попадании в ближнем бою плюс половину своих Костей здоровья с округлением вниз, с Шоком ближнего боя, равным половине его Костей здоровья с округлением вниз, против КЗщ 15. На 5-м уровне эту атаку можно применять на расстоянии, до 100 метров. При летальном применении атака имеет Множитель травмы 1d8/×3. В бою дух действует самостоятельно на инициативе своего призывателя. Духовные формы не могут взять эту силу и не могут напрямую вредить существам."},
{"n":"6.3.0","l":2,"te":"The Graced","tr":"Благословённые","en":"The Graced are those whose innate magical powers manifest in the form of enhanced physical, mental, or supernatural abilities. In order to gain these magical abilities, a PC must pick the Graced Edge during character creation. Like other magical Edges, PCs cannot become Graced later in their career.\nGraced characters cannot take the Spellcaster or Summoner Edges; their magical abilities are manifesting through their physical prowess already, and the game balance value of their cyberware prohibition is minimal when their other knack has no use for it.","ru":"Благословённые — те, чья врождённая магическая сила проявляется как усиленные физические, умственные или сверхъестественные способности. Чтобы получить эти магические способности, ПИ должен взять Козырь Благословённый при создании персонажа. Как и другие магические Козыри, этот нельзя взять позже: ПИ не может стать Благословённым в середине карьеры.\nБлагословённые персонажи не могут брать Козыри Заклинатель или Призыватель; их магия и так проявляется через физическую мощь, а ценность запрета на кибернетику для игрового баланса у них минимальна, ведь их иному дару кибер всё равно не нужен."},
{"n":"6.3.1","l":3,"te":"Graced and Arts","tr":"Благословённые и Искусства","en":"A Graced gets a certain number of art points with which to buy their special abilities. At first level, they get 2 points, which they can use to buy a single two-point art such as Basic Alacrity, or two one-point arts. As they increase in level, they get additional points. They can save these points for later purchases if they wish, but it takes a week or so to master an art once the PC decides to buy it.\nOnce an art is purchased, it’s permanent, and cannot be traded in for another. The exception is the Alacrity series of arts; lower-level versions of those can be upgraded later.\nLevel        Art Points Gained\n1        2\n2        1\n3        1\n4        2\n5        0\n6        1\n7        0\n8        2\n9        1\n10        1","ru":"Благословённый получает определённое число пунктов искусств, на которые покупает свои особые способности. На первом уровне он получает 2 пункта: их можно потратить на одно Искусство за два пункта, например Проворство, базовое, либо на два Искусства по одному пункту. С ростом уровня он получает дополнительные пункты. Пункты можно откладывать на будущие покупки, но, когда ПИ решит купить Искусство, на его освоение уйдёт около недели.\nКупленное Искусство остаётся навсегда, и обменять его на другое нельзя. Исключение — серия Искусств Проворство: их младшие версии можно позже улучшить.\n\n| Уровень | Получено пунктов искусств |\n|---|---|\n| 1 | 2 |\n| 2 | 1 |\n| 3 | 1 |\n| 4 | 2 |\n| 5 | 0 |\n| 6 | 1 |\n| 7 | 0 |\n| 8 | 2 |\n| 9 | 1 |\n| 10 | 1 |"},
{"n":"6.3.1.1","l":4,"te":"Graced Art List","tr":"Список Искусств Благословённых","en":"Graced arts are listed with their art point cost in parentheses. Once an art is selected, it cannot be changed. Some arts improve the modifiers for physical statistics; such bonuses can’t increase the total above +3.\nGraced arts can be used at will, and are not hindered by injury, jostling, heavy armor, or other obstacles to spellcasting.\nAlacrity, Basic (2): Your supernatural reflexes function in the same way as the Enhanced Reflexes I cyberware. You may later upgrade any level of Alacrity to its higher levels by paying the difference in point cost.\nAlacrity, Improved (3): Your reflexes have been honed to be equivalent to Enhanced Reflexes II cyberware, with the same System Strain costs.\nAlacrity, Sublime (4): Your blinding haste functions as if it were Enhanced Reflexes III cyberware, with the same System Strain costs.\nArcane Senses (1): You can see clearly in complete darkness, hear whispered conversations at twenty meters, and identify people and their belongings by scent. For any skill checks involving the acuity of your senses, you get a +1 bonus.\nArcane Skill (1): Pick a skill you have at level-0 or better that isn’t a combat skill, Magic, or Program. Gain a +1 bonus to the skill’s checks. If it requires human-portable tools or implements to function, such as a medkit or a toolbox, your art magically substitutes for the need.\nBlades of Will (1): You can manifest arcane melee weapons of your choice as an On Turn action, using the statistics of any normally-available melee weapon. You can throw these weapons to attack, but they vanish if you merely drop them or fall unconscious. The weapons gain a bonus to hit, damage, and Shock equal to your character level divided by three, rounded down.\nBrazen Thews (1): Your muscles are supernaturally reinforced, granting a +1 bonus to your Strength modifier, up to a maximum of +3.\nFaultless Grace (1): Supernatural grace infuses your motions, and you gain a +1 bonus to your Dexterity modifier, up to a maximum of +3.\nFlying Steps (1): When you move, you can leap horizontal or vertical distances up to your normal Move rating. You subtract your Move rating from any falling damage distance.\nHand of Doom (1): Your hands and feet have the hardness and durability of steel, and are impervious to most forms of damage. Your unarmed attacks now do 1d10 damage and Shock 2/15. They get a hit, damage, and Shock bonus equal to your level divided by three, rounded down. You may use unarmed attacks to inflict lethal damage with a 1d8 Trauma Die and a x3 Trauma Rating. The Unarmed Combatant Focus doesn’t stack with this.\nHundred Faces (2): As a Main Action, shift your physical appearance to be that of any other humanoid between 1.5 and 2 meters in height. You can perfectly mimic people you’ve met personally, including retinal and fingerprint patterns, but not DNA. Your clothing alters its appearance as well, but armor subtlety can’t be changed. Changes revert when you die or change back as an Instant action.\nInexhaustible Vigor (1): Your physical stamina and hardiness is enhanced, granting a +1 bonus to your Constitution modifier, up to +3.\nMartial Instinct (1): You have a number of bonus combat rolls equal to your highest combat skill, to a minimum of one. As an On Turn action, you may choose to use one of these rolls to make an additional hit roll or damage roll, rolling multiple dice for the same attack. Only the best die is used, however, so if you spend a bonus roll to make a d20 hit roll twice or a 2d8 weapon damage twice, you use only the better of your results. As this is an On Turn action, you must choose to use this bonus before you make the roll. Your rolls refresh after a night’s good sleep.\nOccult Pavis (2): You are unusually resistant to hostile magic. You may roll all saves versus spells or magical effects twice, and take the better result. This cannot help against effects without a save.\nPersonal Void (1): You are linked with a personal extradimensional space that can contain up to 20 items of encumbrance or 50 kilos of bulk matter. Storing or retrieving one or more items takes a Main Action, and you must be holding an unattached, uncontested item to store it. Retrieved items such as weapons or armor can be Readied as part of the action if you have the strength for it. Living creatures can’t be stored, and time passes normally within the space. If you die, your stored items spill out around you.\nRefulgent Vitality (1): You automatically stabilize when brought to zero hit points, unless instantly killed by the damage, and you can regenerate Major Injuries with a week’s rest. You heal twice your level in hit points with each night’s rest, instead of your level alone.\nSkin of Steel (2): Your flesh is highly resilient against harm. You gain a base armor class equal to fifteen plus half your level, rounded up, and a +1 bonus to your Trauma Target that increases to +2 at 5th level. This art does not stack with armor.\nSorcerous Sight (1): By examining an object, area, or person as a Main Action, you can see any active magic or enchantments and gain a one-sentence description of their effect.\nSpiritbane (1): You add your level to all damage inflicted on spirits or magical constructs, including Shock. Once per round, as an Instant action, gain one System Strain to reroll a missed attack against such creatures.","ru":"Искусства Благословённых перечислены со стоимостью в пунктах искусств в скобках. Выбранное Искусство сменить нельзя. Некоторые Искусства повышают модификаторы физических характеристик; такие бонусы не могут поднять итог выше +3.\nИскусства Благословённых применяются по желанию, и им не мешают ранения, толчея, тяжёлая броня и прочие препятствия для чтения заклинаний.\n**Проворство, базовое (2):** Твои сверхъестественные рефлексы работают так же, как кибернетика Улучшенные рефлексы I. Позже ты можешь улучшить любой уровень Проворства до старших, доплатив разницу в стоимости пунктов.\n**Проворство, улучшенное (3):** Твои рефлексы отточены до эквивалента кибернетики Улучшенные рефлексы II, с той же стоимостью в Системной нагрузке.\n**Проворство, совершенное (4):** Твоя слепящая быстрота работает как кибернетика Улучшенные рефлексы III, с той же стоимостью в Системной нагрузке.\n**Тайные чувства (1):** Ты ясно видишь в полной темноте, слышишь шёпот на двадцати метрах и опознаёшь людей и их вещи по запаху. Ко всем проверкам навыков, где важна острота твоих чувств, ты получаешь +1.\n**Тайное умение (1):** Выбери навык, который у тебя есть на уровне-0 или выше и который не является боевым навыком, Магией или Программированием. Получи +1 к проверкам этого навыка. Если для работы навыку нужны переносимые человеком инструменты или приспособления — медицинский набор, ящик с инструментами и тому подобное, — твоё Искусство магически заменяет их.\n**Клинки воли (1):** Действием в свой ход ты можешь создать тайное оружие ближнего боя на свой выбор, используя характеристики любого обычно доступного оружия ближнего боя. Эти клинки можно метать для атаки, но они исчезают, если ты просто бросишь их или потеряешь сознание. Оружие получает бонус к попаданию, урону и Шоку, равный уровню твоего персонажа, делённому на три с округлением вниз.\n**Медные жилы (1):** Твои мышцы сверхъестественно укреплены, что даёт +1 к модификатору Силы, но не выше +3.\n**Безупречная грация (1):** Сверхъестественная грация пронизывает твои движения, и ты получаешь +1 к модификатору Ловкости, но не выше +3.\n**Летящий шаг (1):** Перемещаясь, ты можешь прыгать по горизонтали или вертикали на расстояние до своей обычной скорости перемещения. Из дистанции падения при подсчёте урона ты вычитаешь свою скорость перемещения.\n**Рука погибели (1):** Твои руки и ноги обладают твёрдостью и прочностью стали и невосприимчивы к большинству видов урона. Твои рукопашные атаки теперь наносят 1d10 урона и Шок 2/15. Они получают бонус к попаданию, урону и Шоку, равный твоему уровню, делённому на три с округлением вниз. Ты можешь наносить рукопашными атаками летальный урон с Костью травмы 1d8 и Множителем травмы ×3. Фокус Рукопашник с этим не складывается.\n**Сто лиц (2):** Основным действием измени свою внешность на облик любого другого гуманоида ростом от 1,5 до 2 метров. Ты можешь идеально копировать людей, которых встречал лично, включая рисунок радужки и отпечатки пальцев, но не ДНК. Твоя одежда меняет вид вместе с тобой, но Заметность брони изменить нельзя. Изменения откатываются, когда ты умираешь, либо ты возвращаешь себе прежний облик Мгновенным действием.\n**Неистощимая мощь (1):** Твоя физическая выносливость и стойкость усилены, что даёт +1 к модификатору Телосложения, но не выше +3.\n**Боевой инстинкт (1):** У тебя есть бонусные боевые броски в количестве, равном твоему высшему боевому навыку, но не меньше одного. Действием в свой ход ты можешь потратить один такой бросок, чтобы сделать дополнительный бросок атаки или урона, бросив кости для той же атаки ещё раз. Однако в счёт идёт только лучшая кость: если ты тратишь бонусный бросок, чтобы бросить d20 на попадание дважды или 2d8 урона оружия дважды, ты берёшь только лучший из результатов. Поскольку это Действие в свой ход, решать об использовании бонуса нужно до броска. Броски восстанавливаются после ночного крепкого сна.\n**Оккультный павис (2):** Ты необычно устойчив к враждебной магии. Все спасброски против заклинаний и магических эффектов ты можешь бросать дважды и брать лучший результат. Против эффектов, не допускающих спасброска, это не помогает.\n**Личная пустота (1):** Ты связан с личным внепространственным хранилищем, вмещающим до 20 единиц загруженности предметов или 50 кг вещества по объёму. Убрать туда или достать один или несколько предметов — Основное действие; чтобы убрать предмет, ты должен держать его в руках, и он не должен быть ни к чему прикреплён или кем-то оспорен. Извлечённые предметы вроде оружия или брони можно перевести в готовность в рамках этого же действия, если тебе хватает силы. Живых существ хранить нельзя, а время внутри идёт как обычно. Если ты умрёшь, сложенные вещи высыпятся вокруг тебя.\n**Сияющая жизненная сила (1):** Ты автоматически стабилизируешься, когда тебя сводят до нуля пунктов здоровья, если урон не убил тебя мгновенно, и можешь восстанавливать Серьёзные травмы за неделю отдыха. За каждую ночь отдыха ты лечишь удвоенный свой уровень в пунктах здоровья вместо одного уровня.\n**Стальная кожа (2):** Твоя плоть крайне устойчива к повреждениям. Ты получаешь базовый класс защиты, равный пятнадцати плюс половина твоего уровня с округлением вверх, и +1 к Порогу травмы, который на 5-м уровне растёт до +2. Это Искусство не складывается с бронёй.\n**Колдовской взор (1):** Осматривая предмет, область или человека Основным действием, ты видишь любую действующую магию или чары и получаешь описание их эффекта в одно предложение.\n**Гроза духов (1):** Ты добавляешь свой уровень ко всему урону, наносимому духам и магическим конструктам, включая Шок. Раз в раунд Мгновенным действием получи одну Системную нагрузку, чтобы перебросить промах по такому существу."},
{"n":"6.3.2","l":3,"te":"Graced and Cyberware","tr":"Благословённые и кибернетика","en":"Graced arts rely on a finely-balanced flow of magical energy within the user, a flow that cyberware badly disrupts. Each cyber system implanted in a Graced lowers their available art points by the cyber’s System Strain cost, to a minimum of a one point penalty even for minor or cosmetic cyber. This may cost the Graced the use of one or more arts until the cyber is removed. If necessary, Graced can use magical prosthetics to overcome Major Injuries much as mages and summoners can.","ru":"Искусства Благословённых опираются на тонко выверенный поток магической энергии внутри владельца — поток, который кибернетика грубо ломает. Каждая кибер-система, вживлённая Благословённому, снижает его запас пунктов искусств на величину Системной нагрузки этого кибера, но не меньше чем на один пункт, даже для мелкого или косметического кибера. Из-за этого Благословённый может лишиться одного или нескольких Искусств, пока кибер не удалят. При необходимости Благословённые могут преодолевать Серьёзные травмы магическими протезами — так же, как маги и призыватели."},
{"n":"6.4.0","l":2,"te":"Magical Items","tr":"Магические предметы","en":"At the GM's discretion, a campaign involving magic may also involve magical items. The specifics of such items are left for the GM's devising, but a few basic mechanics can be helpful in managing them.","ru":"На усмотрение Мастера в кампании с магией могут появиться и магические предметы. Конкретику таких предметов Мастер придумывает сам, но несколько базовых механик помогут с ними управляться."},
{"n":"6.4.1","l":3,"te":"Magic Item Identification","tr":"Опознание магических предметов","en":"Magic items do not necessarily appear wondrous at first glance. While all of them are exquisitely crafted, some appear to be no more than a well-forged knife or slender wand of carved wood to a mundane eye. Magically-active observers, whether Graced, mage, or summoner, can identify the presence of magic in an object by touch alone, though not its exact effects.\nDiscerning the nature of the magical effect within an object requires time and expertise. If the item has a minimum magic skill level required for its use, that level of skill is necessary to identify its abilities. If not, anyone with Cast-0 or Summon-0 skill can identify the object’s powers with a day’s study.","ru":"Магические предметы не обязательно выглядят чудесно на первый взгляд. Все они сделаны изысканно, но некоторые для непосвящённого глаза кажутся не более чем хорошо откованным ножом или тонкой палочкой из резного дерева. Магически активный наблюдатель — Благословённый, маг или призыватель — способен распознать наличие магии в предмете одним касанием, но не её точные эффекты.\nПонять природу магического эффекта внутри предмета — дело времени и знаний. Если для использования предмета нужен минимальный уровень магического навыка, то и для опознания его способностей нужен такой же уровень навыка. Если нет, то любой с навыком Колдовство-0 или Призыв-0 опознает силы предмета за день изучения."},
{"n":"6.4.2","l":3,"te":"Linking With Magic Items","tr":"Связывание с магическими предметами","en":"Most magic items require that a user mystically link with them before they will function.\nLinkage requires a Main Action and inflicts one permanent point of System Strain on the wielder that cannot be lost so long as the item remains linked to them. This effect is particularly pronounced for mages and summoners, as the foreign magical currents disrupt their own carefully-controlled energies; such arcanists must also permanently Commit one point of Mage Effort or Summoner Effort while the item is linked, recovering the point the morning after the linkage is ended.\nLinking or unlinking from an item requires a certain minimal amount of magical expertise. Anyone with a magical Edge knows enough to do it or guide a teammate through the process, but those without such a helper who do not have Cast or Summon skills of their own cannot perform the process unaided. A purely intellectual knowledge of the process is sufficient; it is not necessary to actually be a spellcaster or summoner.\nAn item can be linked to only one user at a time. Linkages end when a new user imprints on the object or the existing owner spends an hour in careful meditation, unraveling their spiritual energies from the item. They need not have the item present to unlink from it.","ru":"Большинство магических предметов требуют, чтобы пользователь мистически связался с ними, прежде чем они заработают.\nСвязывание требует Основного действия и наносит владельцу один постоянный пункт Системной нагрузки, которое нельзя снять, пока предмет связан с ним. Особенно сильно это бьёт по магам и призывателям: чужие магические течения сбивают их собственные, тщательно выверенные потоки. Такие чародеи должны ещё и постоянно задействовать один пункт Усилия мага или Усилия призывателя, пока предмет связан, и возвращают его утром после разрыва связи.\nДля связывания и разрыва связи нужен минимум магических познаний. Любой с магическим Козырем знает достаточно, чтобы сделать это сам или провести через процедуру товарища, но тот, у кого нет такого помощника и нет собственных навыков Колдовство или Призыв, в одиночку не справится. Достаточно чисто теоретического знания процесса; быть настоящим заклинателем или призывателем не обязательно.\nПредмет может быть связан только с одним пользователем одновременно. Связь прерывается, когда на предмете отпечатывается новый пользователь или когда прежний владелец проводит час в сосредоточенной медитации, распутывая свои духовные энергии, сплетённые с предметом. Держать предмет при себе для разрыва связи не нужно."},
{"n":"6.4.3","l":3,"te":"Using Magic Items","tr":"Использование магических предметов","en":"employment, such as magic weapons which are used as part of an attack. No special action is required to trigger their benefits. The same applies to certain arcane devices that are designed to protect the wearer or grant an automatic special benefit.\nOther items, such as magic wands, require a Main Action to trigger their effects. This action is not disrupted by damage or physical jostling and can be performed by any user who is holding the object.\nThe effects of a magic item are generally obvious and connected with the item. Onlookers will be able to tell that something supernatural has happened, and will be able to connect it to the wand or device that launched the effect. Many such devices make loud noises, display brilliant lights, or otherwise make their use extremely obvious.","ru":"…применения, например магическое оружие, которое используют в рамках атаки. Особое действие для срабатывания их свойств не требуется. То же относится к некоторым тайным устройствам, созданным для защиты носителя или для автоматического особого преимущества.\nДругие предметы, например магические палочки, требуют Основного действия, чтобы сработать. Это действие не сбивается уроном или физической толчеёй, и выполнить его может любой пользователь, держащий предмет.\nЭффекты магического предмета обычно очевидны и связаны с самим предметом. Свидетели поймут, что произошло нечто сверхъестественное, и сумеют связать это с палочкой или устройством, запустившим эффект. Многие такие устройства громко шумят, ярко вспыхивают или иначе делают своё применение предельно заметным."}
]}</script>
<script>
"use strict";
/* Документ открыт внутри рамки на чужой странице? Тогда высотой и прокруткой
   управляет внешняя страница, а не мы. */
const EMBED = (window.parent !== window);
if(EMBED) document.body.classList.add("embed");

const DATA = JSON.parse(document.getElementById("srd-data").textContent);
const SECS = DATA.sections;
const byNum = new Map(SECS.map(s => [s.n, s]));

const UI = {
  ru:{ title:"Города без числа", sub:"Справочный документ по системе 1.0",
    search:"Поиск по документу…", contents:"Разделы", inThis:"В этом разделе",
    navOpen:"Разделы", navClose:"Закрыть",
    found:"Найдено", nothing:"Ничего не найдено. Поиск идёт и по русскому, и по английскому тексту.",
    orig:"В оригинале", prev:"Назад", next:"Дальше", goto:"Открыть раздел",
    noText:"В этом разделе нет своего текста — это заголовок главы.",
    foot:"Оригинал: Cities Without Number Systems Reference Document v1.0, Kevin Crawford, 8 сентября 2023. Автор передал документ в общественное достояние по лицензии CC0. Русский перевод распространяется свободно." },
  en:{ title:"Cities Without Number", sub:"Systems Reference Document 1.0",
    search:"Search the document…", contents:"Contents", inThis:"In this section",
    navOpen:"Contents", navClose:"Close",
    found:"Found", nothing:"No matches. Search covers both the English and the Russian text.",
    orig:"In Russian", prev:"Back", next:"Next", goto:"Open section",
    noText:"This section has no body text of its own — it is a chapter heading.",
    foot:"Source: Cities Without Number Systems Reference Document v1.0, Kevin Crawford, 8 September 2023. The author waived copyright and related rights under CC0. The Russian translation is freely distributable." }
};

/* ── страницы: главы (X.0.0) и разделы (X.Y.0); подразделы живут внутри ── */
const PAGES = SECS.filter(s => s.n === "intro" || s.l === 1 || s.l === 2);
const pageIdx = new Map(PAGES.map((s, i) => [s.n, i]));
function childrenOf(num){
  if(num === "intro") return [];
  const p = num.split(".");
  if(p[2] === "0" && p[1] !== "0")            // раздел X.Y.0 → его X.Y.Z и X.Y.Z.W
    return SECS.filter(s => s.n.startsWith(p[0] + "." + p[1] + ".") && s.n !== num);
  return [];
}
function chapterSections(num){               // глава X.0.0 → её разделы X.Y.0
  const p = num.split(".");
  return SECS.filter(s => s.l === 2 && s.n.startsWith(p[0] + "."));
}
/* какая страница показывает данный раздел */
function pageFor(num){
  if(pageIdx.has(num)) return num;
  const p = num.split(".");
  const cand = p[0] + "." + p[1] + ".0";
  return pageIdx.has(cand) ? cand : (p[0] + ".0.0");
}

let lang = (localStorage.getItem("cwn-lang") === "en") ? "en" : "ru";
let cur = "intro", query = "";

const t = () => UI[lang];
const sTitle = s => (lang === "ru" ? (s.tr || s.te) : (s.te || s.tr));
const sAlt   = s => (lang === "ru" ? s.te : s.tr);
const sBody  = s => (lang === "ru" ? s.ru : s.en);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ═══════════ разметка ═══════════ */
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(«„\-])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
const isSep = l => /^\|[\s|:—–-]+\|?\s*$/.test(l);
const cells = l => l.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());

function tableHtml(rows){
  const hasHead = rows[1] && isSep(rows[1]);
  let h = "<div class=\"tw\"><table>";
  if(hasHead) h += "<thead><tr>" + cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead>";
  h += "<tbody>";
  for(const r of rows.slice(hasHead ? 2 : 0)){
    if(isSep(r)) continue;
    h += "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
  }
  return h + "</tbody></table></div>";
}

/* Каждая непустая строка — самостоятельный абзац: так устроены и исходник, и перевод. */
function renderRu(txt){
  const L = txt.split("\n"); let out = "", seenText = false;
  for(let i = 0; i < L.length; i++){
    const tl = L[i].trim();
    if(!tl) continue;
    let m;
    if((m = tl.match(/^(#{1,6})\s+(.*)$/))){
      /* Первый заголовок первого уровня дублирует название страницы — опускаем его. */
      if(m[1].length === 1 && !seenText){ seenText = true; continue; }
      seenText = true;
      const h = m[1].length <= 2 ? 4 : Math.min(m[1].length + 1, 6);
      out += `<h${h}>${inline(m[2])}</h${h}>`;
      continue;
    }
    seenText = true;
    if(tl.startsWith("|")){
      const rows = []; let j = i;
      while(j < L.length && L[j].trim().startsWith("|")){ rows.push(L[j].trim()); j++; }
      i = j - 1; out += tableHtml(rows); continue;
    }
    if(/^[-*•]\s+/.test(tl)){
      const items = []; let j = i;
      while(j < L.length && /^[-*•]\s+/.test(L[j].trim())){ items.push(L[j].trim().replace(/^[-*•]\s+/, "")); j++; }
      i = j - 1;
      out += "<ul>" + items.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>"; continue;
    }
    if(tl === "---"){ out += "<hr class=\"hr\">"; continue; }
    if((m = tl.match(/^\*\*([^*]{1,72}?):\*\*\s*(.*)$/))){
      out += `<p class="def"><strong>${inline(m[1])}:</strong> ${inline(m[2])}</p>`; continue;
    }
    out += `<p>${inline(tl)}</p>`;
  }
  return out;
}

function renderEn(txt){
  const L = txt.split("\n"); let out = "";
  for(let i = 0; i < L.length; i++){
    const ln = L[i];
    if(!ln.trim()) continue;
    if(ln.includes("\t")){
      const rows = []; let j = i;
      while(j < L.length && (L[j].includes("\t") || !L[j].trim())){
        if(L[j].trim()) rows.push(L[j].replace(/^\t+/, "").replace(/\t+/g, "\t"));
        j++;
      }
      i = j - 1;
      out += "<div class=\"raw\">" + rows.map(r => esc(r.split("\t").join("   "))).join("\n") + "</div>";
      continue;
    }
    const tl = ln.trim();
    if(/^[•·]\s*/.test(tl)){
      const items = []; let j = i;
      while(j < L.length && /^\s*[•·*]\s*/.test(L[j])){ items.push(L[j].trim().replace(/^[•·*]\s*/, "")); j++; }
      i = j - 1;
      out += "<ul>" + items.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>"; continue;
    }
    const m = tl.match(/^([A-Z][A-Za-z0-9’'&/,()– -]{1,60}):\s+(\S.*)$/);
    if(m && m[1].split(/\s+/).length <= 8){
      out += `<p class="def"><strong>${esc(m[1])}:</strong> ${inline(m[2])}</p>`; continue;
    }
    out += `<p>${inline(tl)}</p>`;
  }
  return out;
}
const bodyHtml = s => {
  const b = sBody(s);
  if(!b || !b.trim()) return `<p class="note">${esc(t().noText)}</p>`;
  return lang === "ru" ? renderRu(b) : renderEn(b);
};

let TERMS = new Map();   // ключ в нижнем регистре → {name, sec, def}
function buildTerms(){
  TERMS = new Map();
  const abbrKeys = new Set(Object.keys(ABBR[lang]).map(x => x.toLowerCase()));
  const add = (name, sec, def) => {
    if(!name) return;
    name = name.replace(/\s+/g, " ").trim();
    const k = name.toLowerCase();
    const isAbbr = abbrKeys.has(k);
    if(TERMS.has(k)) return;
    if(!isAbbr && (name.length < 3 || STOP.has(k))) return;
    if(/^[0-9(]/.test(name)) return;
    TERMS.set(k, { name, sec, def });
  };
  const reDefRu = /^\*\*([^*]{3,60}?):\*\*\s*(\S.{15,})$/;
  const reDefEn = /^([A-Z][A-Za-z0-9’'&/,()– -]{2,58}):\s+(\S.{15,})$/;
  const reHead  = /^#{3,6}\s+(\S.{2,58})$/;

  for(const s of SECS){
    const body = sBody(s); if(!body) continue;
    const L = body.split("\n");
    for(let i = 0; i < L.length; i++){
      const tl = L[i].trim(); if(!tl) continue;
      let m;
      if(lang === "ru" && (m = tl.match(reDefRu))){ add(m[1].trim(), s.n, m[2].trim()); continue; }
      if(lang === "en" && (m = tl.match(reDefEn)) && m[1].split(/\s+/).length <= 6){ add(m[1].trim(), s.n, m[2].trim()); continue; }
      if((m = tl.match(reHead))){
        const name = m[1].replace(/\*\*/g, "").trim();
        const acc = [];
        for(let j = i + 1; j < L.length && acc.length < 3; j++){
          const nx = L[j].trim();
          if(!nx) continue;
          if(/^#{3,6}\s/.test(nx) || nx.startsWith("|")) break;
          acc.push(nx.replace(/\*\*/g, "").replace(/^[-*]\s+/, ""));
        }
        if(acc.length) add(name, s.n, acc.join(" "));
      }
    }
  }
  /* базовые механические термины: описание — начало их собственного раздела */
  for(const [name, sec] of Object.entries(CORE[lang])){
    const s = byNum.get(sec) || byNum.get(pageFor(sec));
    if(!s) continue;
    let def = "";
    const own = sBody(s);
    if(own && own.trim()){
      def = own.split("\n").map(x => x.trim())
              .filter(x => x && !x.startsWith("|") && !/^#{3,6}\s/.test(x))
              .slice(0, 2).join(" ");
    }
    if(!def){
      for(const c of childrenOf(s.n)){
        const cb = sBody(c);
        if(cb && cb.trim()){
          def = cb.split("\n").map(x => x.trim())
                  .filter(x => x && !x.startsWith("|") && !/^#{3,6}\s/.test(x))
                  .slice(0, 2).join(" ");
          if(def) break;
        }
      }
    }
    const k = name.toLowerCase();
    if(def) TERMS.set(k, { name, sec, def: def.replace(/\*\*/g, "") });
  }
  /* сокращения: подставляем полное название, определение берём из их раздела */
  const opening = num => {
    const s = byNum.get(num) || byNum.get(pageFor(num));
    if(!s) return "";
    const pick = sec => {
      const b = sBody(sec);
      if(!b || !b.trim()) return "";
      return b.split("\n").map(x => x.trim())
              .filter(x => x && !x.startsWith("|") && !/^#{1,6}\s/.test(x))
              .slice(0, 2).join(" ").replace(/\*\*/g, "");
    };
    let d = pick(s);
    if(!d) for(const c of childrenOf(s.n)){ d = pick(c); if(d) break; }
    return d;
  };
  for(const [ab, [full, sec]] of Object.entries(ABBR[lang])){
    const k = ab.toLowerCase();
    const had = TERMS.get(k);
    const def = (had && had.def) ? had.def : opening(sec);
    if(!def) continue;
    TERMS.set(k, { name:ab, full, sec:(had ? had.sec : sec), def });
  }
  buildTermRe();
}

let TERM_RE = null, TERM_KEYS = [];
function stemPat(w){
  const cyr = /[А-Яа-яЁё]/.test(w);
  const e = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if(cyr && w.length >= 6) return w.slice(0, w.length - 2).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[а-яё]{0,3}";
  if(!cyr && w.length >= 5) return e + "(?:s|es)?";
  return e;
}
function buildTermRe(){
  TERM_KEYS = [...TERMS.keys()].sort((a, b) => b.length - a.length);
  const parts = TERM_KEYS.map(k => {
    const words = TERMS.get(k).name.split(/\s+/).map(stemPat);
    return "(" + words.join("\\s+") + ")";
  });
  try{
    TERM_RE = new RegExp("(?<![\\p{L}\\p{N}])(?:" + parts.join("|") + ")(?![\\p{L}\\p{N}])", "giu");
  }catch(e){ TERM_RE = null; }
}

/* Обходим готовый DOM: так разметка гарантированно не ломается. */
function linkTerms(root, homeNums){
  if(!TERM_RE) return;
  const nodes = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while((n = w.nextNode())){
    if(!n.nodeValue || n.nodeValue.length < 2) continue;
    const p = n.parentElement;
    /* Таблицы не размечаем: там те же термины стоят плотно и пунктир превращается в шум. */
    if(!p || p.closest(".term,code,.raw,th,td,h1,h2,h3,.sh-alt,.alt-t,.toc,.sec-num,.sh-n")) continue;
    nodes.push(n);
  }
  for(const node of nodes){
    const txt = node.nodeValue;
    TERM_RE.lastIndex = 0;
    let m, last = 0, frag = null;
    while((m = TERM_RE.exec(txt))){
      let gi = -1;
      for(let i = 1; i < m.length; i++) if(m[i] !== undefined){ gi = i - 1; break; }
      if(gi < 0) continue;
      const key = TERM_KEYS[gi], rec = TERMS.get(key);
      if(!rec || homeNums.has(rec.sec)) continue;
      /* Игровые термины в переводе пишутся с заглавной — это отсекает
         совпадения с обычными словами («Ловушка» ≠ «ловушки в полу»). */
      const nameUp = rec.name[0] !== rec.name[0].toLowerCase();
      if(nameUp && m[0][0] === m[0][0].toLowerCase()) continue;
      frag = frag || document.createDocumentFragment();
      if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const sp = document.createElement("span");
      sp.className = "term"; sp.dataset.term = key; sp.tabIndex = 0;
      sp.textContent = m[0];
      frag.appendChild(sp);
      last = m.index + m[0].length;
    }
    if(frag){
      if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }
}

/* ── подсказка ── */
const tip = document.getElementById("tip");
let tipFor = null;
function showTip(el){
  /* На узком экране наведения нет: по термину просто переходят касанием. */
  if(window.innerWidth <= 760) return;
  const rec = TERMS.get(el.dataset.term); if(!rec) return;
  const s = byNum.get(rec.sec);
  const head = rec.full || rec.name;
  const meta = (rec.full ? esc(rec.name) + " · " : "") + esc(rec.sec) + " · " + esc(s ? sTitle(s) : "");
  tip.innerHTML = `<div class="tt">${esc(head)}</div>
    <div class="ts">${meta}</div>
    <div class="td"><p>${esc(rec.def.length > 1400 ? rec.def.slice(0, 1400) + "…" : rec.def)}</p></div>
    <button class="go" type="button" data-go="${esc(rec.sec)}">${esc(t().goto)} →</button>`;
  tip.classList.add("on");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = window.scrollX + r.left;
  left = Math.min(left, window.scrollX + document.documentElement.clientWidth - tw - 14);
  left = Math.max(left, window.scrollX + 10);
  let top = window.scrollY + r.bottom + 7;
  if(r.bottom + th + 20 > window.innerHeight && r.top - th - 7 > 0) top = window.scrollY + r.top - th - 7;
  tip.style.left = left + "px"; tip.style.top = top + "px";
  tipFor = el;
}
function hideTip(){ tip.classList.remove("on"); tipFor = null; }
/* Подсказка гаснет не сразу и живёт, пока курсор над ней самой —
   иначе до кнопки «Открыть раздел» не дойти. */
let hideT = null;
const holdTip = () => { clearTimeout(hideT); };
const dropTip = () => { clearTimeout(hideT); hideT = setTimeout(hideTip, 320); };
tip.addEventListener("mouseenter", holdTip);
tip.addEventListener("mouseleave", dropTip);
document.addEventListener("mouseover", e => {
  const el = e.target.closest(".term");
  if(el){ holdTip(); if(el !== tipFor) showTip(el); return; }
  if(e.target.closest("#tip")){ holdTip(); return; }
  dropTip();
});
document.addEventListener("focusin", e => { const el = e.target.closest(".term"); if(el){ holdTip(); showTip(el); } });
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  hideTip();
  const r = document.getElementById("rail");
  if(r && r.classList.contains("open")) setNav(false);
});

/* ═══════════ поиск ═══════════ */
function search(q){
  const n = q.trim().toLowerCase();
  if(n.length < 2) return null;
  const res = [];
  for(const s of SECS){
    const own = (sTitle(s) + "\n" + (sBody(s) || ""));
    let src = own, k = own.toLowerCase().indexOf(n);
    if(k < 0){
      const alt = [s.n, s.te, s.tr, s.en, s.ru].join("\n");
      k = alt.toLowerCase().indexOf(n);
      if(k < 0) continue;
      src = alt;
    }
    const from = Math.max(0, k - 40);
    const snip = src.slice(from, k + n.length + 70).replace(/\s+/g, " ").trim();
    const rel = k - from - (from ? 0 : 0);
    res.push({ s, snip, k:Math.max(0, rel), len:n.length, cut:from > 0 });
  }
  return res;
}
function snipHtml(r){
  const a = esc(r.snip.slice(0, r.k)), b = esc(r.snip.slice(r.k, r.k + r.len)), c = esc(r.snip.slice(r.k + r.len));
  return (r.cut ? "…" : "") + a + "<mark>" + b + "</mark>" + c + "…";
}

/* ═══════════ панель ═══════════ */
function drawRail(){
  const el = document.getElementById("rail");
  const hits = search(query);
  if(hits){
    if(!hits.length){ el.innerHTML = `<p class="empty">${esc(t().nothing)}</p>`; return; }
    let h = `<h4>${esc(t().found)}: ${hits.length}</h4>`;
    for(const r of hits.slice(0, 120)){
      h += `<button class="nav-item" data-sec="${esc(r.s.n)}" type="button" aria-current="${r.s.n === cur}">
        <span class="num">${esc(r.s.n === "intro" ? "§" : r.s.n)}</span>
        <span class="lbl">${esc(sTitle(r.s))}</span><span class="snip">${snipHtml(r)}</span></button>`;
    }
    el.innerHTML = h; return;
  }
  let h = `<h4>${esc(t().contents)}</h4>`;
  for(const s of PAGES){
    if(s.l === 1 || s.n === "intro"){
      h += `<button class="nav-item ch" data-sec="${esc(s.n)}" type="button" aria-current="${s.n === cur}">
        <span class="num">${esc(s.n === "intro" ? "§" : s.n.split(".")[0])}</span>
        <span class="lbl">${esc(sTitle(s))}</span></button>`;
    } else {
      h += `<button class="nav-item" data-sec="${esc(s.n)}" type="button" aria-current="${s.n === cur}">
        <span class="num">${esc(s.n)}</span><span class="lbl">${esc(sTitle(s))}</span></button>`;
    }
  }
  el.innerHTML = h;
}

/* ═══════════ страница ═══════════ */
function drawPage(){
  const s = byNum.get(cur);
  if(!s){ cur = "intro"; return drawPage(); }
  const kids = childrenOf(cur);
  const home = new Set([cur, ...kids.map(k => k.n)]);
  let h = `<div class="sec-num">${esc(cur === "intro" ? "§" : cur)}</div>`;
  h += `<h1 class="t">${esc(sTitle(s))}</h1>`;
  const alt = sAlt(s);
  if(alt) h += `<p class="alt-t">${esc(t().orig)}: ${esc(alt)}</p>`;

  if(s.l === 1 && cur !== "intro"){
    const list = chapterSections(cur);
    if(list.length){
      h += `<div class="toc"><div class="toc-h">${esc(t().contents)}</div><ol>`;
      for(const c of list) h += `<li><a href="#s=${esc(c.n)}"><span class="n">${esc(c.n)}</span><span>${esc(sTitle(c))}</span></a></li>`;
      h += "</ol></div>";
    }
    const own = sBody(s);
    if(own && own.trim()) h += `<hr class="hr"><div class="prose">${bodyHtml(s)}</div>`;
  } else {
    if(kids.length){
      h += `<div class="toc"><div class="toc-h">${esc(t().inThis)}</div><ol>`;
      for(const c of kids) h += `<li><a href="#s=${esc(c.n)}"><span class="n">${esc(c.n)}</span><span>${esc(sTitle(c))}</span></a></li>`;
      h += "</ol></div>";
    }
    h += `<hr class="hr">`;
    const own = sBody(s);
    if(own && own.trim()) h += `<div class="prose">${bodyHtml(s)}</div>`;
    for(const c of kids){
      const lvl = c.n.split(".").length === 4 ? 3 : 2;
      const ca = sAlt(c);
      h += `<section class="sub" id="sub-${esc(c.n)}">
        <div class="sh-n">${esc(c.n)}</div>
        <h${lvl} class="sh">${esc(sTitle(c))}</h${lvl}>
        ${ca ? `<p class="sh-alt">${esc(ca)}</p>` : ""}
        <div class="prose">${bodyHtml(c)}</div></section>`;
    }
  }
  const v = document.getElementById("view");
  v.innerHTML = h;
  linkTerms(v, home);
}

function draw(scrollTo){
  document.getElementById("bTitle").textContent = t().title;
  document.getElementById("bSub").textContent = t().sub;
  document.getElementById("q").placeholder = t().search;
  document.getElementById("foot").textContent = t().foot;
  document.getElementById("lRu").setAttribute("aria-pressed", lang === "ru");
  document.getElementById("lEn").setAttribute("aria-pressed", lang === "en");
  const navB = document.getElementById("navBtn");
  if(navB) navB.textContent = document.getElementById("rail").classList.contains("open") ? t().navClose : t().navOpen;
  hideTip();
  drawPage();
  drawRail();

  const i = pageIdx.get(cur);
  const pv = i > 0 ? PAGES[i - 1] : null, nx = i < PAGES.length - 1 ? PAGES[i + 1] : null;
  const pb = document.getElementById("prev"), nb = document.getElementById("next");
  pb.disabled = !pv; nb.disabled = !nx;
  pb.textContent = pv ? "← " + sTitle(pv) : t().prev;
  nb.textContent = nx ? sTitle(nx) + " →" : t().next;
  pb.onclick = () => { if(pv) go(pv.n); };
  nb.onclick = () => { if(nx) go(nx.n); };

  /* Заголовок и язык документа во встроенном режиме не трогаем: это чужая страница. */
  if(!EMBED){
    document.documentElement.lang = lang;
    document.title = sTitle(byNum.get(cur)) + " · " + t().title;
  }

  const anchor = scrollTo ? document.getElementById("sub-" + scrollTo) : null;
  if(EMBED){
    /* Прокрутку делает внешняя страница — сообщаем ей, куда встать. */
    const off = anchor ? Math.max(0, anchor.getBoundingClientRect().top + window.scrollY - 8) : 0;
    postSize();
    try{ window.parent.postMessage({ cwn:"scroll", offset:off }, "*"); }catch(e){}
    return;
  }
  if(anchor){ anchor.scrollIntoView({ block:"start", behavior:"instant" }); return; }
  window.scrollTo({ top:0, behavior:"instant" });
}

/* Сообщаем внешней странице нужную высоту рамки, чтобы у неё не появлялась
   вторая полоса прокрутки. */
function postSize(){
  if(!EMBED) return;
  const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
  try{ window.parent.postMessage({ cwn:"height", height:h }, "*"); }catch(e){}
}
if(EMBED){
  window.addEventListener("load", postSize);
  if(window.ResizeObserver) new ResizeObserver(postSize).observe(document.body);
  else window.addEventListener("resize", postSize);
}

function go(num){
  const page = pageFor(num);
  const anchor = page === num ? null : num;
  cur = page;
  location.hash = "s=" + num;
  draw(anchor);
}

/* ── события ── */
function setLang(l){
  if(l === lang) return;
  lang = l; localStorage.setItem("cwn-lang", l);
  buildTerms(); draw();
}
document.getElementById("lRu").onclick = () => setLang("ru");
document.getElementById("lEn").onclick = () => setLang("en");

/* ── список разделов на узком экране ── */
const navBtn = document.getElementById("navBtn");
const railEl = document.getElementById("rail");
function setNav(open){
  railEl.classList.toggle("open", open);
  document.body.classList.toggle("nav-open", open && !EMBED);
  navBtn.setAttribute("aria-expanded", open ? "true" : "false");
  navBtn.textContent = open ? t().navClose : t().navOpen;
  if(open){
    /* Шапка переносится по строкам, поэтому её высоту берём каждый раз заново. */
    const h = document.querySelector(".top").offsetHeight;
    railEl.style.top = h + "px";
    railEl.scrollTop = 0;
  } else {
    railEl.style.top = "";
  }
}
navBtn.onclick = () => setNav(!railEl.classList.contains("open"));
window.addEventListener("resize", () => {
  if(window.innerWidth > 760) setNav(false);
  else if(railEl.classList.contains("open")) railEl.style.top = document.querySelector(".top").offsetHeight + "px";
});

const qEl = document.getElementById("q");
qEl.oninput = () => { query = qEl.value; drawRail(); };
qEl.onkeydown = e => { if(e.key === "Escape"){ qEl.value = ""; query = ""; qEl.blur(); drawRail(); } };
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g){ hideTip(); go(g.dataset.go); return; }
  const tm = e.target.closest(".term");
  if(tm){
    const rec = TERMS.get(tm.dataset.term);
    if(rec){ hideTip(); go(rec.sec); return; }
  }
  const b = e.target.closest("[data-sec]");
  if(b){ setNav(false); go(b.dataset.sec); return; }
  const a = e.target.closest(".toc a");
  if(a){ e.preventDefault(); setNav(false); go(a.getAttribute("href").replace("#s=", "")); return; }
});

function fromHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const m = h.match(/^s=(.+)$/);
  if(m && byNum.has(m[1])){
    const page = pageFor(m[1]);
    cur = page;
    return page === m[1] ? null : m[1];
  }
  return undefined;
}
window.addEventListener("hashchange", () => { const a = fromHash(); if(a !== undefined) draw(a); });

buildTerms();
const a0 = fromHash();
draw(a0 === undefined ? null : a0);
</script>
</body>
