овые гармонизаторы, триггеры социальных сигналов и абсолютно нечеловеческое визуальное совершенство. Носитель получает Харизму 14 или бонус +2 к значению, если она уже 14 или выше, но не более 18.\n**Система вспомогательного планирования:** Убирающиеся нанофибровые крылья и встроенные ускорительные сопла дают носителю ограниченную способность к полёту. Прыгнув с высоты, он получает скорость полёта 30 м и может пролететь до двух километров, после чего вынужден сесть. Набор высоты требует проверки Лов/Атлетика против сложности 10, и при провале приходится садиться, а крылья не поднимут носителя более чем на двойную высоту точки прыжка. Выпустив ускорительные сопла и крылья Мгновенным действием, носитель может проигнорировать до ста метров урона от падения.\n**Модуль «Банши»:** В торсе носителя формируют резонирующие полости и ставят продвинутую систему усиления. Он может воспроизвести любой звук или голос, который слышал раньше, а на максимальной громкости его отчётливо слышно на пятьсот метров. Раз в день Основным действием этот звук можно использовать, чтобы разбить обычное стекло в линии длиной десять метров перед носителем; существа без защиты слуха в этой области должны пройти Физический спасброск или получить 2d6 нелетального урона.\n**Базовая кибернетическая инфраструктура:** Набор стандартизированных вспомогательных имплантов обеспечивает носителю базовую кибер-совместимость. Он может игнорировать Системную нагрузку от кибер-имплантов, равную 12 минус его Телосложение, — так, ПИ с Телосложением 9 может игнорировать три пункта Системной нагрузки от кибер-имплантов. ПИ с Тел 12 и выше эта система бесполезна.\n**Контур мертвеца:** Распространённый корпоративный имплант, отбивающий охоту похищать людей и торговать левым кибером. Любая попытка снять кибернетику носителя без нужных кодов доступа сожжёт это железо, если не пройдена проверка Инт/Медицина сложности 13.\n**Дермальная броня/Травматическое экранирование:** Систему можно установить только тому, у кого есть хотя бы один уровень Дермальной брони; травматическое экранирование добавляет +1 к Порогу травмы носителя. Этот бонус складывается с любым уже имеющимся бонусом Дермальной брони к броску.\n**Фактор экстренной стабилизации:** Когда носителя сводят до нуля пунктов здоровья травмой, которая не убивает его мгновенно, он автоматически стабилизируется, получает один пункт Системной нагрузки и приходит в себя в конце сцены с 1 пунктом здоровья. Если он уже на максимуме нагрузки, эта кибернетика не работает.\n**Мод плоти:** Аккуратная операция и вспомогательные импланты позволяют полностью перелепить тело в рамках общей гуманоидности: сменить пол, рост и вес, добавить косметические конечности вроде хвостов или декоративных ушей. Способность к размножению не даётся, но слухи об экспериментальных модах, дающих даже это, не умирают.\n**Полная конверсия тела:** Мозг и центральную нервную систему носителя пересаживают в новейшую синтетическую оболочку, причём цена и сложность считаются так, будто эта кибернетика забирает 4 пункта Системной нагрузки. После конверсии субъект имеет эффективное Телосложение 20 для целей Системной нагрузки, но его нельзя лечить обычной первой помощью или медицинскими препаратами: чтобы восстановить любое количество урона, нужно десять минут ремонтных работ с набором инструментов и $250 запчастей за каждый восстанавливаемый пункт здоровья. Борг полной конверсии больше не нуждается в еде, воде, воздухе и сне, но каждый день без последнего добавляет один пункт Системной нагрузки из-за психического стресса. Конверсия требует двенадцати часов обслуживания каждые две недели, и его пропуск приведёт к смерти носителя через 2d6 дней, если пропущенное обслуживание не будет проведено. Нынешняя технология полной конверсии нестабильна: через 1d4 года у субъекта появляется накапливающийся шанс смерти 5% каждый год. Борги не получают Серьёзных травм и получают бонус +6 к Порогу травмы, складывающийся с имеющимися бонусами.\n**Гемосинтетическая система фильтрации:** Широкоспектральный набор скрубберов крови, входных фильтров и микробных барьеров даёт носителю фактическую неуязвимость к большинству природных болезней и несинтетических токсинов. Боевые токсины и некоторые экзотические природные напасти всё ещё могут действовать на носителя, но он получает бонус +2 ко всем спасброскам против них. Система автоматически предупреждает носителя, если он подвергся воздействию известной болезни или токсина, независимо от того, действуют они на него или нет.\n**Тайная полость:** Выращенный в торсе карман позволяет герметично и с климат-контролем спрятать внутри тела предметы на 2 Загруженности и легко достать их Основным действием. Ни один спрятанный предмет не может быть больше пистолета или плотно сложенного комплекта одежды, а содержимое кармана не учитывается в лимите Загруженности носителя. Сигнатура кармана замаскирована от обычных сканирующих технологий, и обнаружить его нельзя без ручного личного досмотра, проведённого умелым досмотрщиком.\n**Медицинский диагностический монитор:** Диагностическая система подключена к биологическим процессам носителя и в реальном времени анализирует его состояние и все значимые травмы. Помимо того что она немедленно предупреждает носителя об отравлении, болезни или ране, она даёт бонус +2 к любой проверке навыка на лечение или медицинскую поддержку благодаря диагностическим данным и увеличивает лечение первой помощью или препаратами на +2 ПЗ за применение.\n**Блок поддержки восстановления:** Устанавливается ряд вспомогательных систем и фильтров очистки крови. Носитель может поглотить до четырёх пунктов Системной нагрузки, полученной от лечения или стабилизации ран; это отдельный резерв, восстанавливающий один пункт каждую ночь, одновременно с обычным восстановлением Системной нагрузки носителя.\n**Дублирующие системы:** Несколько протезных вспомогательных кибер-узлов ставят заранее, чтобы смягчить будущие травмы. Когда носитель получает Серьёзную травму, он может вместо этого выбрать критическое повреждение Дублирующих систем и не применять результат броска серьёзной травмы. Дублирующие системы можно установить не один раз, но наносимая Системная нагрузка каждый раз растёт на один пункт.\n**Щит расплаты:** Под синтетической кожей вживлено множество маленьких метателей снарядов. Когда система срабатывает Действием в свой ход, носитель получает один пункт Системной нагрузки и выпускает вокруг себя облако шрапнели, действующее как эпицентр взрыва осколочной гранаты. Носитель управляет наводкой достаточно точно, чтобы не задеть союзников в радиусе. Если в этот момент он держит кого-то в захвате или сам в захвате, его противник автоматически получает максимальный урон. Перезарядка Щита расплаты занимает пять минут, и система не работает, если носитель носит броню класса бронекостюма. Более простую броню обычно можно подогнать так, чтобы обнажить достаточно кожи.\n**Терапевтические демпферы контроля:** Набор индивидуально подобранных медицинских и терапевтических имплантов служит для контроля побочных эффектов частично удачной установки кибернетики. За каждую установку этой системы носитель может выбрать один побочный эффект имплантов, которым он страдает, и игнорировать его. Проверка навыка на установку этой системы может провалиться, но сама она никогда не вызывает побочных эффектов.\n**Оружейная система «Титан»:** Доступна только боргам полной конверсии или субъектам с Силой 18. Этот подвес позволяет установить любое переносимое Тяжёлое оружие, в том числе из раздела оружия. Носитель считается устойчивым упором для стрельбы, а у оружия есть два встроенных магазина патронов, хотя его можно заряжать и вручную. Конкретное установленное оружие можно поменять во время обслуживания.\n**Жало гадюки:** Инструмент убийц. Жало гадюки — это клык, игла в ногте, ладонный инъектор или более экзотическое приспособление, чтобы впрыснуть ничего не подозревающей цели препарат на выбор носителя. В Жало гадюки можно зарядить до четырёх доз фармацевтики, которые расходуются по желанию носителя. Если заряжен токсин, оно наносит 1d12 урона с Костью травмы 1d10/×3. Если применён транквилизатор, урон тот же, но результатом будет потеря сознания, а не смерть. Жало гадюки эффективно только в составе Казнящей атаки — настороженный противник легко его избежит. Эта кибернетика даёт штраф -2 на любую проверку обнаружения её наличия."},
{"n":"3.6.7.2","l":4,"te":"Head Cyberware","tr":"Кибернетика головы","en":"Cyberware                                Cost        Type        Conc.                SysStr\nCourier Memory                        $10K        Head        Medical        0.25\nCranial Jack                                $1K        Head        Touch                0.25\nDiscretion Insurance Unit                $10K        Head        Medical        0.5\nEye Mod/Dazzler                        $15K        Head        Medical        0.5\nEye Mod/Flechette Launcher                $20K        Head        Medical        0.5\nFunes Complex                        $40K        Head        Medical        1\nMedusa Implant                        $20K        Head        Obvious        .5\nNeural Buffer                                $40K        Head        Medical        1\nSkull Citadel                                $100K        Head        Medical        2\n\n\nCourier Memory: One unit of cranial Memory is installed with a subdermal upload pad. The person uploading the data can set a passphrase; while the implant user can erase the data, they can’t download it again without the passphrase, which is usually told only to the data’s intended recipient. Courier memory is exceptionally well-hidden and even medical scans take a -2 penalty to find it.\nCranial Jack: A discreetly-placed plug socket in the user’s head or neck allows interfacing with cyberdecks and gear equipped with a jack line. Cranial jacks can be modded with cyberdeck mods.\nDiscretion Insurance Unit: A small cranial bomb that can be keyed go off when it receives- or does not receive- certain codes or transmissions. Its unfortunate tendency to misfire its anti-removal protocols makes it an unpopular choice for use in anyone but the most disposable subjects. Removing this cyber is done at a +2 difficulty, and failure causes the death of the subject and a Physical save to avoid the death of the physician, with 5d6 damage taken on success.\nEye Mod/Dazzler: This mod can emit a dazzling strobe of intense light, dazing and disorienting those standing up to five meters in front of the user. The strobe is triggered up to once per round as an On Turn action and adds one System Strain. Victims without eye protection must make a Physical saving throw or take a -4 penalty to their AC and hit rolls for the next 1d6 rounds. A victim can be targeted by this dazzling only once per scene.\nEye Mod/Flechette Launcher: A holdout weapon designed for surprise short-ranged attacks, this eye has been loaded with a small explosive flechette. It has the statistics of a light pistol, has a range of 10 meters, and requires a Main Action to reload its single-round magazine. If used against a target in melee range who does not suspect its existence, a normal hit roll is made; on a miss, it does full normal damage anyway, and on a hit, the damage is doubled. It can be used for Execution Attacks.\nFunes Complex: A synthetic eidetic memory is granted by this implant, with formalized bodies of knowledge easily cross-referenced and recollected. Once per day, as an Instant action, reroll any failed Int-based skill check. This memory can be difficult to control, however, and unwanted allusions can overwhelm the desired datum. If the user rolls a natural 2 on any Int skill check, it automatically fails and cannot be recovered by any rerolling ability.\nMedusa Implant: These prehensile cranial tendrils take multiple forms, from thick armored cables to bundles of brightly-colored articulated polymer fibers not unlike normal hair. The tendrils are shoulder-length under most circumstances, but can extend to manipulate objects up to three meters distant with the agility of a human hand. The bundles are not very strong, however, and cannot lift more than ten kilograms. Like other extra limbs, they do not grant extra actions, but can hold and use items as any other limb could.\nNeural Buffer: A system favored by hackers, a Neural Buffer rearranges the user’s brain topography, making it more difficult to harm the user with neural feedback. The user gains an additional 3 hit points per level that can only absorb cyberspace damage from Stun or Kill Verbs. These phantom hit points refresh completely each hour.\nSkull Citadel: The user’s head is augmented with independent blood oxygenation pumps, armor plating, and trauma buffers designed to keep the brain intact even after the rest of the body is critically damaged. Barring dismemberment or the use of high-powered ammunition directly on the target’s head, the subject ignores head-affecting Major Injuries and can be stabilized even as long as ten minutes after their technical “death”. Each such delayed revivification permanently reduces a randomly-chosen attribute by 2 points, however. This ability damage cannot be undone.","ru":"| Кибернетика | Цена | Тип | Скр. | СН | Эффект |\n|---|---|---|---|---|---|\n| Курьерская память | $10 тыс. | Голова | Медосмотр | 0,25 | Носит запароленные данные в Памяти |\n| Черепной разъём | $1 тыс. | Голова | Касание | 0,25 | Подключение к снаряжению с разъёмом |\n| Блок гарантии неразглашения | $10 тыс. | Голова | Медосмотр | 0,5 | Черепная бомба с дистанционным ключом |\n| Мод глаза/Ослепитель | $15 тыс. | Голова | Медосмотр | 0,5 | Ослепляет врагов в пределах 5 м |\n| Мод глаза/Пускатель флешетт | $20 тыс. | Голова | Медосмотр | 0,5 | Внезапная атака как лёгким пистолетом |\n| Комплекс «Фунес» | $40 тыс. | Голова | Медосмотр | 1 | Даёт эйдетическую память |\n| Имплант «Медуза» | $20 тыс. | Голова | Явная | 0,5 | Хватательные импланты-волосы |\n| Нейробуфер | $40 тыс. | Голова | Медосмотр | 1 | 3 ПЗ за уровень против урона хакеров |\n| Черепная цитадель | $100 тыс. | Голова | Медосмотр | 2 | Бронирует мозг от повреждений |\n\n\n**Курьерская память:** Устанавливается один блок черепной Памяти с подкожной площадкой загрузки. Тот, кто загружает данные, может задать пароль; носитель импланта может стереть данные, но не может скачать их снова без пароля, который обычно сообщают только предполагаемому получателю данных. Курьерская память спрятана исключительно хорошо: даже медицинское сканирование получает штраф -2 на её обнаружение.\n**Черепной разъём:** Скрытно размещённое гнездо в голове или шее носителя позволяет подключаться к кибердекам и снаряжению с кабелем-джеком. Черепные разъёмы можно улучшать модами кибердек.\n**Блок гарантии неразглашения:** Небольшая черепная бомба, которую можно настроить на срабатывание при получении — или неполучении — определённых кодов или передач. Досадная склонность ошибочно запускать протоколы защиты от снятия делает её непопулярным выбором для всех, кроме самых расходных субъектов. Снятие этой кибернетики идёт со сложностью +2, а провал вызывает смерть субъекта и требует от врача Физического спасброска, чтобы не погибнуть, с 5d6 урона при успехе.\n**Мод глаза/Ослепитель:** Этот мод способен выдать слепящую вспышку интенсивного света, ошеломляя и дезориентируя тех, кто стоит в пределах пяти метров перед носителем. Вспышка срабатывает не чаще раза в раунд Действием в свой ход и добавляет один пункт Системной нагрузки. Жертвы без защиты для глаз должны пройти Физический спасброск или получить штраф -4 к КЗщ и броскам атаки на следующие 1d6 раундов. Одну жертву можно ослепить так только один раз за сцену.\n**Мод глаза/Пускатель флешетт:** Тайное оружие для внезапных атак на короткой дистанции: в этот глаз заряжена небольшая разрывная флешетта. Он имеет статы лёгкого пистолета, дистанцию 10 метров и требует Основного действия, чтобы перезарядить свой однозарядный магазин. Если применён против цели на дистанции ближнего боя, которая не подозревает о его существовании, делается обычный бросок атаки; при промахе он всё равно наносит полный обычный урон, а при попадании урон удваивается. Его можно применять для Казнящих атак.\n**Комплекс «Фунес»:** Имплант даёт синтетическую эйдетическую память, где формализованные массивы знаний легко перекрёстно сверяются и вспоминаются. Раз в день Мгновенным действием перебрось любую проваленную проверку навыка на Инт. Такой памятью, однако, бывает трудно управлять, и непрошеные ассоциации могут заслонить нужный факт. Если носитель выбросил натуральную 2 на любой проверке навыка на Инт, она автоматически проваливается и не может быть исправлена никакой способностью переброса.\n**Имплант «Медуза»:** Эти хватательные черепные щупальца принимают разные формы — от толстых бронированных кабелей до пучков ярко окрашенных шарнирных полимерных волокон, мало отличимых от обычных волос. Обычно щупальца длиной до плеч, но могут вытягиваться и манипулировать предметами на расстоянии до трёх метров с ловкостью человеческой руки. Пучки, впрочем, не очень сильны и не поднимут больше десяти килограммов. Как и другие дополнительные конечности, они не дают дополнительных действий, но могут держать и использовать предметы, как любая другая конечность.\n**Нейробуфер:** Система, любимая хакерами. Нейробуфер перестраивает топографию мозга носителя, затрудняя причинение ему вреда нейронной обратной связью. Носитель получает дополнительные 3 пункта здоровья за уровень, которые могут поглощать только урон в киберпространстве от Глаголов *Оглушить* и *Убить*. Эти фантомные пункты здоровья полностью восстанавливаются каждый час.\n**Черепная цитадель:** Голову носителя дополняют независимыми насосами оксигенации крови, бронеплитами и травматическими буферами, призванными сохранить мозг целым даже после критического повреждения остального тела. Если не считать расчленения или применения высокомощных боеприпасов прямо в голову цели, субъект игнорирует Серьёзные травмы, затрагивающие голову, и может быть стабилизирован даже спустя десять минут после своей формальной «смерти». Каждое такое отложенное оживление, однако, навсегда снижает случайно выбранную характеристику на 2 пункта. Этот урон характеристикам нельзя отменить."},
{"n":"3.6.7.3","l":4,"te":"Skin Cyberware","tr":"Кибернетика кожи","en":"Cyberware                                Cost        Type        Conc.                SysStr\nDermal Armor I                        $40K        Skin        Medical        1\nDermal Armor II                        $80K        Skin        Touch                2\nDermal Armor III                        $200K        Skin        Sight                3\nPoseidon Implants                        $30K        Skin        Touch                1\nSealed Systems Implant                $15K        Skin        Medical        1\nSharkskin Electrodes                        $20K        Skin        Touch                1\nSkinmod                                $250        Skin        Sight                0\nSkyborn Shielding                        $40K        Skin        Sight                2\n\n\nDermal Armor I: Subtle dermal weave reinforcement grants a base ranged and melee AC of 16 and a +1 bonus to the user’s Trauma Target.\nDermal Armor II: Heavier subcutaneous plating acts as Dermal Armor I with a base ranged and melee AC of 18. In addition, the user can ignore the first instance of Shock in a round.\nDermal Armor III: Overt ceramic body plating and double-mesh joint reinforcement acts as Dermal Armor II, but with a base ranged and melee AC of 20 and +2 to the user’s Trauma Target.\nPoseidon Implants: These implants allow the user to function normally while submerged for an indefinite period, drawing any necessary oxygen or drinking water from the surrounding salt or freshwater. Normal temperature extremes are managed without difficulty, and pressure can be handled down to depths of one kilometer. Visual augments and pressure gradient sensors allow the equivalent of normal sight up to 30 meters even in lightless water, and miniaturized support jets allow three-dimensional movement at twice the user’s normal Move rating.\nSealed Systems Implant: When triggered as an Instant action, implanted shields deploy and skinweaves energize to seal the user off from hostile external environments. For the next six hours, the user can operate as if wearing a vacuum suit, ignoring vacuum, contact poisons, non-immediately-lethal levels of radiation, toxic gases, low or high-pressure atmospheres, and environmental temperature hazards short of open flame. After deployment, the implant needs an equal time of recovery before it can be deployed again.\nSharkskin Electrodes: An implanted mesh of electrodes beneath the user’s skin allows them to deliver debilitating shocks while grappling a target, even if both are heavily clothed. At the end of each round of grappling, the user inflicts 2d6 non-lethal electrical damage on anyone they grapple or who is grappling them. The shielding built into the cyber automatically negates non-lethal electrical damage for the user and halves lethal shocks.\nSkinmod: Various neon tattoos, skin texture and color changes, and other superficial physical mods can be performed with no real systemic burden beyond the usual need for regular maintenance.\nSkyborn Shielding: A set of implants and skin treatments meant for those who spend extended periods in hard vacuum, this implant can be triggered as an Instant action. When deployed, the user gains the benefits of a Sealed Systems Implant and low-G microjets that allow 30m/round flight in microgravity conditions. Skyborn Shielding can operate for up to 72 hours before needing an hour of downtime to regenerate.","ru":"| Кибернетика | Цена | Тип | Скр. | СН | Эффект |\n|---|---|---|---|---|---|\n| Дермальная броня I | $40 тыс. | Кожа | Медосмотр | 1 | КЗщ 16, +1 к Порогу травмы |\n| Дермальная броня II | $80 тыс. | Кожа | Касание | 2 | Как I, но КЗщ 18 и стойкость к Шоку |\n| Дермальная броня III | $200 тыс. | Кожа | Взгляд | 3 | Как II, но КЗщ 20 и +2 к ПТ |\n| Импланты «Посейдон» | $30 тыс. | Кожа | Касание | 1 | Моды водной адаптации |\n| Имплант герметизации | $15 тыс. | Кожа | Медосмотр | 1 | Разворачивает временный скафандр |\n| Электроды «Акулья кожа» | $20 тыс. | Кожа | Касание | 1 | Бьёт током тех, кто в захвате |\n| Мод кожи | $250 | Кожа | Взгляд | 0 | Косметические моды тела |\n| Небесное экранирование | $40 тыс. | Кожа | Взгляд | 2 | Моды для жизни на орбите |\n\n\n**Дермальная броня I:** Незаметное усиление дермального плетения даёт базовые КЗщ дб и КЗщ бб 16 и бонус +1 к Порогу травмы носителя.\n**Дермальная броня II:** Более тяжёлые подкожные пластины работают как Дермальная броня I с базовыми КЗщ дб и КЗщ бб 18. Кроме того, носитель может игнорировать первое проявление Шока в раунде.\n**Дермальная броня III:** Открытые керамические пластины на теле и двойное сетчатое усиление суставов работают как Дермальная броня II, но с базовыми КЗщ дб и КЗщ бб 20 и +2 к Порогу травмы носителя.\n**Импланты «Посейдон»:** Эти импланты позволяют носителю нормально действовать под водой неограниченно долго, добывая нужный кислород и питьевую воду из окружающей солёной или пресной воды. Обычные температурные крайности переносятся без труда, а давление — до глубины одного километра. Зрительные аугментации и датчики градиента давления дают эквивалент нормального зрения до 30 метров даже в лишённой света воде, а миниатюрные вспомогательные сопла позволяют двигаться в трёх измерениях с удвоенной обычной скоростью перемещения носителя.\n**Имплант герметизации:** При срабатывании Мгновенным действием вживлённые щитки разворачиваются, а кожные плетения активируются, отсекая носителя от враждебной внешней среды. Следующие шесть часов носитель действует так, будто носит вакуумный костюм, игнорируя вакуум, контактные яды, не смертельные сразу уровни радиации, токсичные газы, атмосферы низкого и высокого давления и температурные опасности среды, кроме открытого огня. После развёртывания импланту нужно столько же времени на восстановление, прежде чем его можно развернуть снова.\n**Электроды «Акулья кожа»:** Вживлённая под кожу носителя сетка электродов позволяет наносить выводящие из строя разряды тому, кого он держит в захвате, даже если оба плотно одеты. В конце каждого раунда захвата носитель наносит 2d6 нелетального электрического урона всем, кого держит в захвате или кто держит в захвате его. Встроенное в кибернетику экранирование автоматически отменяет нелетальный электрический урон для носителя и вдвое снижает летальные разряды.\n**Мод кожи:** Разные неоновые татуировки, изменения текстуры и цвета кожи и прочие поверхностные физические моды делаются без реальной системной нагрузки — не считая обычной нужды в регулярном обслуживании.\n**Небесное экранирование:** Набор имплантов и обработок кожи для тех, кто проводит долгое время в жёстком вакууме; этот имплант срабатывает Мгновенным действием. При развёртывании носитель получает преимущества Импланта герметизации и микросопла для низкой гравитации, дающие полёт 30 м/раунд в условиях микрогравитации. Небесное экранирование работает до 72 часов, после чего ему нужен час простоя на регенерацию."},
{"n":"3.6.7.4","l":4,"te":"Limb Cyberware","tr":"Кибернетика конечностей","en":"Cyberware                                Cost        Type        Conc.                SysStr\nBody Blades I                                $10K        Limb        Medical        1\nBody Blades II                                $25K        Limb        Sight                2\nCyberlimb                                $10K        Limb        Touch                0.5\nIron Hand Aegis                        $40K        Limb        Touch                1\nLimbgun                                $30K        Limb        Touch                1\nMuscle Fiber Replacement I                $50K        Limb        Touch                1\nMuscle Fiber Replacement II                $200K        Limb        Sight                2\nNeolimb                                $25K        Limb        Sight                1\nOmnihand                                $10K        Limb        Touch                0.25\nShock Fists                                $10K        Limb        Touch                1\nStick Pads                                $15K        Limb        Touch                0.5\nSynthlimb                                $25K        Limb        Medical        0.5\n\n\nBody Blades I: Assorted retractable blades and spikes are implanted in the user’s limbs. Their unarmed attacks do 1d8 damage, Shock of 2/15, Trauma Die 1d8/x3 and can be rolled with either Stab or Punch as the relevant combat skill. The Punch skill does not add damage to Body Blades attacks. When not in use, the blades are perceptible only to a medical scan.\nBody Blades II: As level one, but the user’s body armament includes not only conventional blades, but assorted improvements such as monomolecular edges, cutting vibrations, or thermal augmentation. Their unarmed attacks do 2d6 damage with a Shock of 4/15, and a Trauma Die 1d10/x3. Anyone who sees or touches their arms can detect signs of the cyber, however.\nCyberlimb: A standard medical-grade cyberlimb, albeit one Encumbrance worth of non-weapon equipment or storage can be implanted in each limb and remain Readied without counting against the character’s Encumbrance. Add the equipment cost to the limb. The limb provides power to any electronic equipment implanted.\nIron Hand Aegis: Absorption plates and kinetic ablation units are implanted in the user’s arms and linked with a reactive ballistic calculator. Once per scene, as an Instant action, the user can deflect a successful ranged bullet, arrow, or thrown weapon attack, including burst or suppressive fire. Surprise attacks cannot be deflected this way, nor can melee attacks or explosives.\nLimbgun: A ranged weapon is implanted into an arm, tail, or other significant limb, along with space for two magazines worth of ammunition. A full reload of this space can be accomplished as a Main Action. Limbguns can be used with Gunlink cyber, count as Readied at all times, and can be used even while both hands are occupied, but can be bound up in melee as normal guns can. Limbguns have an intrinsic +1 hit bonus, in addition to whatever bonus the implanted weapon may have. The maximum size of the gun is Encumbrance 1 for legs or neolimb tails, or Encumbrance 2 for arms. The buyer must supply the gun. Different guns can be swapped in as desired during the system’s monthly maintenance, but once implanted, a gun is useless for later conventional use.\nMuscle Fiber Replacement I: Artificial muscle fibers are implanted as replacements for the user’s own flesh. The subject gains a Strength score of 14, or +2 if already 14 or higher.\nMuscle Fiber Replacement II: The subject gains a Strength score of 18, and can smash through standard interior doors or equivalent barriers as a Move action.\nNeolimb: The user gains an additional limb that normal humans lack. Usual choices involve an additional pair of arms or manipulatory mechano-tentacles, though functional prehensile tails are popular too. One installation of the cyber covers paired limbs or a single tail or body-mounted tendril up to 3 meters long. Neolimbs can support up to one Encumbrance point of non-weaponry built-in tech and add two items to the user’s Readied encumbrance allowance. Neolimbs can hold or grip objects, but cannot employ additional shields or grant extra actions.\nOmnihand: A full array of small mechanical and electronic tools are folded into this cybernetic hand. The user is never without the tools for relevant skill checks, and once per day as an Instant action can gain +1 on any skill check involving the omnihand’s tool use. As an improvised weapon, the tools do damage as a knife.\nShock Fists: The user’s hands are implanted with subdermal electrical webbing. As an Instant action, accept one System Strain; for the rest of the scene, the user’s unarmed attacks do an additional 1d8 electrical damage on a successful hit. Unarmed attacks augmented with this mod are non-lethal if desired. This system does not stack with Body Blades.\nStick Pads: Macroscale van der Waals generators allow the user’s hands and feet to stick to vertical or overhanging surfaces, their full weight supported by one arm. They can climb such surfaces at their full movement rate with one free hand.\nSynthlimb: A high-grade cyberlimb that’s indistinguishable from an organic body part by anything short of a medical examination. It functions as a Cyberlimb for purposes of implanted equipment.","ru":"| Кибернетика | Цена | Тип | Скр. | СН | Эффект |\n|---|---|---|---|---|---|\n| Телесные клинки I | $10 тыс. | Конечность | Медосмотр | 1 | Встроенное телесное вооружение |\n| Телесные клинки II | $25 тыс. | Конечность | Взгляд | 2 | Более крупное телесное вооружение |\n| Кибер-конечность | $10 тыс. | Конечность | Касание | 0,5 | Протез с местом под хранение |\n| Эгида «Железная рука» | $40 тыс. | Конечность | Касание | 1 | Отклоняет одно дальнее попадание за сцену |\n| Лимбган | $30 тыс. | Конечность | Касание | 1 | Оружие, вживлённое в конечность |\n| Замена мышечных волокон I | $50 тыс. | Конечность | Касание | 1 | Сил 14 или +2, если выше |\n| Замена мышечных волокон II | $200 тыс. | Конечность | Взгляд | 2 | Сил 18 и экстремальные подвиги |\n| Неоконечность | $25 тыс. | Конечность | Взгляд | 1 | Добавляет новую дополнительную конечность |\n| Омнирука | $10 тыс. | Конечность | Касание | 0,25 | Кисть-инструментарий, +1 к проверке 1/день |\n| Шок-кулаки | $10 тыс. | Конечность | Касание | 1 | Наносит электрический урон кулаками |\n| Липкие подушечки | $15 тыс. | Конечность | Касание | 0,5 | Лазание по гладким и вертикальным поверхностям |\n| Синтконечность | $25 тыс. | Конечность | Медосмотр | 0,5 | Неотличимая искусственная конечность |\n\n\n**Телесные клинки I:** В конечности носителя вживляют разнообразные убирающиеся лезвия и шипы. Его безоружные атаки наносят 1d8 урона, Шок 2/15, Кость травмы 1d8/×3, и бросать их можно как с навыком Клинок, так и с Кулак. Навык Кулак не добавляет урон к атакам Телесными клинками. Когда лезвия не используются, их заметит только медицинское сканирование.\n**Телесные клинки II:** Как первый уровень, но телесное вооружение носителя включает не только обычные лезвия, а и разные улучшения вроде мономолекулярных кромок, режущей вибрации или термической аугментации. Его безоружные атаки наносят 2d6 урона с Шоком 4/15 и Костью травмы 1d10/×3. Впрочем, любой, кто увидит или коснётся его рук, заметит следы кибернетики.\n**Кибер-конечность:** Стандартная кибер-конечность медицинского класса, при этом в каждую конечность можно вживить снаряжение или хранилище на одну Загруженность (кроме оружия), и оно остаётся в готовности, не учитываясь в Загруженности персонажа. Стоимость снаряжения добавляется к цене конечности. Конечность питает любое вживлённое электронное оборудование.\n**Эгида «Железная рука»:** В руки носителя вживляют поглощающие пластины и блоки кинетической абляции, связанные с реактивным баллистическим вычислителем. Раз за сцену Мгновенным действием носитель может отклонить успешную дальнобойную атаку пулей, стрелой или метательным оружием, включая стрельбу очередью и подавляющий огонь. Так нельзя отклонить внезапные атаки, а также атаки в ближнем бою и взрывы.\n**Лимбган:** В руку, хвост или другую крупную конечность вживляется дальнобойное оружие вместе с местом под два магазина патронов. Полная перезарядка этого места делается Основным действием. Лимбганы можно использовать с кибернетикой Ганлинк, они всегда считаются в готовности и работают даже когда обе руки заняты, но их можно связать в ближнем бою так же, как обычное оружие. У лимбганов есть собственный бонус +1 к попаданию, вдобавок к любому бонусу вживлённого оружия. Максимальный размер оружия — Загруженность 1 для ног или хвостов-неоконечностей и Загруженность 2 для рук. Само оружие покупатель предоставляет сам. Разные пушки можно менять по желанию во время месячного обслуживания системы, но после вживления оружие уже не годится для обычного использования.\n**Замена мышечных волокон I:** Искусственные мышечные волокна вживляются вместо собственной плоти носителя. Субъект получает Силу 14 или +2, если она уже 14 или выше.\n**Замена мышечных волокон II:** Субъект получает Силу 18 и может проламывать стандартные внутренние двери и подобные преграды Действием перемещения.\n**Неоконечность:** Носитель получает дополнительную конечность, которой у обычных людей нет. Обычно выбирают дополнительную пару рук или манипуляторные механо-щупальца, хотя популярны и функциональные хватательные хвосты. Одна установка этой кибернетики покрывает парные конечности либо один хвост или телесное щупальце длиной до 3 метров. Неоконечности могут нести до одного пункта Загруженности встроенной техники (кроме оружия) и добавляют два предмета к лимиту снаряжения в готовности носителя. Неоконечности могут держать или сжимать предметы, но не позволяют использовать дополнительные щиты и не дают дополнительных действий.\n**Омнирука:** В эту кибернетическую кисть сложен полный набор небольших механических и электронных инструментов. Носитель никогда не остаётся без инструментов для соответствующих проверок навыков, а раз в день Мгновенным действием может получить +1 на любую проверку навыка, где используются инструменты омнируки. Как импровизированное оружие эти инструменты наносят урон как нож.\n**Шок-кулаки:** В кисти носителя вживляют подкожную электрическую сетку. Мгновенным действием прими один пункт Системной нагрузки; до конца сцены безоружные атаки носителя при успешном попадании наносят дополнительно 1d8 электрического урона. Безоружные атаки, усиленные этим модом, при желании нелетальны. Эта система не складывается с Телесными клинками.\n**Липкие подушечки:** Макромасштабные генераторы ван-дер-ваальсовых сил позволяют кистям и стопам носителя цепляться за вертикальные и нависающие поверхности, удерживая весь его вес на одной руке. По таким поверхностям он может лезть с полной скоростью перемещения и с одной свободной рукой.\n**Синтконечность:** Кибер-конечность высшего класса, неотличимая от органической части тела ничем, кроме медицинского обследования. Для целей вживлённого снаряжения работает как Кибер-конечность."},
{"n":"3.6.7.5","l":4,"te":"Sensory Cyberware","tr":"Сенсорная кибернетика","en":"Cyberware                                Cost        Type                Conc.                SysStr\nActive Sense Processor                $50K        Sensory        Medical        1\nCyberears (pair)                        $10K        Sensory        Touch                0.25\nCybereyes (pair)                        $10K        Sensory        Sight                0.25\nEar Mod/Filter                                $10K        Sensory        Medical        0.5\nEar Mod/Positional Detection                $15K        Sensory        Medical        0.5\nEar Mod/Sonar                        $20K        Sensory        Medical        0.5\nEar Mod/Tracer                        $10K        Sensory        Medical        0.5\nEye Mod/Impostor                        $10K        Sensory        Medical        1\nEye Mod/Infrared Vision                $5K        Sensory        Medical        0.5\nEye Mod/Low Light Vision                $5K        Sensory        Medical        0.5\nEye Mod/Tactical View                $10K        Sensory        Medical        0.5\nEye Mod/Zoom                        $10K        Sensory        Medical        0.5\nGunlink                                $25K        Sensory        Touch                1\nHeadcomm                                $1K        Sensory        Medical        0.25\nSensory Recorder                        $10K        Sensory        Medical        0.5\nSynthears (pair)                        $25K        Sensory        Medical        0.25\nSyntheyes (pair)                        $25K        Sensory        Medical        0.25\n\n\nActive Sense Processor: Augmented sensory processing grants a +1 Wisdom modifier for all skill checks involving sensing or noticing things, up to a +2 modifier maximum.\nCyberears: While normal in appearance, touch reveals the synthetic nature of these ears. Some owners prefer to style them in fanciful or unnatural ways. While the base model provides only normal human hearing, all are equipped with ear protection against loud noises. A pair of cyberears or synthears halves the System Strain cost of ear implants.\nCybereyes: While a single cybernetic eye can be implanted, it is recommended that both be replaced at the same time to improve neural adaptation. These cybereyes are clearly artificial, though most are styled in attractive or striking fashions. They all have perfect 20/20 vision and integral flash protectors, but additional functionality must be implanted separately. A user with a pair of cybereyes or syntheyes halves the System Strain cost of cybernetic eye implants.\nEar Mod/Filter: The user’s sense of hearing is sharpened remarkably, allowing them to follow individual conversations in a noisy crowd, eavesdrop on whispers up to twenty meters distant, and gain a +2 bonus on all hearing-related Notice checks.\nEar Mod/Positional Detection: This ear mod constructs a spatial map of significant surrounding sounds, allowing the user to know the exact location of anything making audible noise. The precise location of distant shooters, the location of targets in visual concealment, and the positions of moving creatures in darkness are all clear.\nEar Mod/Sonar: The user can navigate even in darkness or while blinded by means of ultrasonic sensors, being able to construct a crude map of people and obstacles in front of them out to 20 meters. This sense is the equivalent of vision, though it can’t discern details more subtle than faces.\nEar Mod/Tracer: As an On Turn action, the user can nominate a target within 20 meters. Until they get more than 100 meters away from the user or pass behind a solid barrier, the implant’s hyper-specific hearing can track their motions perfectly and overhear anything they say or that is said to them. The user can listen to one such target at a time.\nEye Mod/Impostor: Aside from allowing free alteration of eye color, this mod allows the user to copy another person’s retinal patterns. Provided they are within two meters, they need only meet the user’s gaze for a few moments to get a good imprint. The eye can store up to a dozen imprints, but it takes a Main Action to shift from one to another. Note that it is a relatively simple procedure to alter a person’s retinal pattern, so an important target alerted to the imposture may end up changing their imprint.\nEye Mod/Infrared Vision: The infrared vision this mod allows permits basic navigation in dark areas and makes the presence of heat sources such as humans, engines, and infrared tripwires very obvious. The user gains a +1 bonus on any Notice checks to detect the presence of thermally-unshielded living creatures.\nEye Mod/Low Light Vision: This mod grants low-light vision, allowing clear sight to normal distances in any light condition better than pitch blackness.\nEye Mod/Tactical View: These eyes can receive text or video transmissions and play them on an inset in the user’s normal vision. Outline and pattern discrimination is enhanced; when specifically looking for things or keeping watch, gain a +1 bonus to any relevant Notice check.\nEye Mod/Zoom: The user’s vision can zoom in on distant targets. The user can see objects within 500 meters as if they were standing next to them. The hit penalty for a ranged weapon’s long range is eliminated.\nGunlink: Hardwired control points interface with the onboard targeting systems of most modern firearms. When using a modern firearm, the PC ignores range penalties and negates up to 2 points of hit penalties for cover, concealment, or prone targets. Once per scene, as an Instant action, they can reroll a missed attack roll with a gun.\nHeadcomm: An implanted phone/short-range radio that can directly communicate within 100 meters or use the phone grid, if it’s available. For cranial security reasons, only text and voice can be transmitted, but conversations can be held without audible vocalization.\nSensory Recorder: The user can record up to 180 minutes of sensory input. If they have a jack line into a transmitter or cyberware capable of transmitting data, they can share these recordings in real time or afterwards.\nSynthears: This model of artificial ear is designed to be indistinguishable from normal ears, though they have all the properties of a normal pair of cyberears.\nSyntheyes: These high-end cybereyes are designed to be indistinguishable from normal eyes under anything short of a medical examination. Any additional mods made to the eyes share this subtlety","ru":"| Кибернетика | Цена | Тип | Скр. | СН | Эффект |\n|---|---|---|---|---|---|\n| Процессор активного восприятия | $50 тыс. | Сенсорика | Медосмотр | 1 | +1 к мод. Мдр на восприятие |\n| Киберуши (пара) | $10 тыс. | Сенсорика | Касание | 0,25 | Синтетические уши с шумофильтром |\n| Киберглаза (пара) | $10 тыс. | Сенсорика | Взгляд | 0,25 | Синтетические глаза с защитой от вспышек |\n| Мод уха/Фильтр | $10 тыс. | Сенсорика | Медосмотр | 0,5 | +2 к проверкам навыка на слух |\n| Мод уха/Определение позиции | $15 тыс. | Сенсорика | Медосмотр | 0,5 | Карта всех источников звука рядом |\n| Мод уха/Сонар | $20 тыс. | Сенсорика | Медосмотр | 0,5 | Чувствует окружение как зрением |\n| Мод уха/Слежение | $10 тыс. | Сенсорика | Медосмотр | 0,5 | Подслушивает конкретные цели |\n| Мод глаза/Самозванец | $10 тыс. | Сенсорика | Медосмотр | 1 | Копирует рисунок сетчатки |\n| Мод глаза/Инфракрасное зрение | $5 тыс. | Сенсорика | Медосмотр | 0,5 | Видит тепловые картины вокруг |\n| Мод глаза/Зрение при слабом свете | $5 тыс. | Сенсорика | Медосмотр | 0,5 | Видит при слабом освещении |\n| Мод глаза/Тактический обзор | $10 тыс. | Сенсорика | Медосмотр | 0,5 | Приём передач, лучший поиск |\n| Мод глаза/Увеличение | $10 тыс. | Сенсорика | Медосмотр | 0,5 | Телескопическое зрение на 500 м |\n| Ганлинк | $25 тыс. | Сенсорика | Касание | 1 | Бонус при стрельбе из огнестрела |\n| Голова-связь | $1 тыс. | Сенсорика | Медосмотр | 0,25 | Беззвучная радио- или телефонная связь |\n| Сенсорный рекордер | $10 тыс. | Сенсорика | Медосмотр | 0,5 | Записывает 3 часа ощущений |\n| Синтуши (пара) | $25 тыс. | Сенсорика | Медосмотр | 0,25 | Неотличимые искусственные уши |\n| Синтглаза (пара) | $25 тыс. | Сенсорика | Медосмотр | 0,25 | Неотличимые искусственные глаза |\n\n\n**Процессор активного восприятия:** Усиленная обработка сигналов от органов чувств даёт +1 к модификатору Мудрости для всех проверок навыков, связанных с восприятием или замечанием чего-либо, но не более чем до модификатора +2.\n**Киберуши:** Выглядят нормально, но на ощупь их синтетическая природа очевидна. Некоторые владельцы предпочитают оформлять их причудливо или неестественно. Базовая модель даёт лишь обычный человеческий слух, но все версии оснащены защитой от громких звуков. Пара киберушей или синтушей вдвое снижает стоимость установки ушных имплантов в Системной нагрузке.\n**Киберглаза:** Можно вживить и один кибернетический глаз, но рекомендуется заменять сразу оба — так лучше идёт нейроадаптация. Эти киберглаза явно искусственные, хотя большинство оформлены привлекательно или броско. Все они дают идеальное зрение 20/20 и встроенную защиту от вспышек, но любую дополнительную функциональность нужно вживлять отдельно. Носитель пары киберглаз или синтглаз вдвое снижает стоимость установки кибернетических глазных имплантов в Системной нагрузке.\n**Мод уха/Фильтр:** Слух пользователя обостряется до предела: он может следить за отдельными разговорами в шумной толпе, подслушивать шёпот на расстоянии до двадцати метров и получает +2 ко всем проверкам Внимания, связанным со слухом.\n**Мод уха/Определение позиции:** Этот ушной мод строит пространственную карту значимых окружающих звуков, позволяя пользователю точно знать местоположение всего, что издаёт слышимый шум. Точное расположение далёких стрелков, положение целей в визуальной маскировке и позиции движущихся существ в темноте — всё это ему ясно.\n**Мод уха/Сонар:** Пользователь может ориентироваться даже в темноте или будучи ослеплённым — ультразвуковые сенсоры позволяют ему строить грубую карту людей и препятствий перед собой на дистанции до 20 метров. Это чувство равноценно зрению, хотя не различает деталей мельче лица.\n**Мод уха/Слежение:** Действием в свой ход пользователь может назначить цель в пределах 20 метров. Пока она не удалится от пользователя более чем на 100 метров или не уйдёт за сплошную преграду, гиперспецифичный слух импланта идеально отслеживает её движения и слышит всё, что она говорит и что говорят ей. Одновременно пользователь может слушать только одну такую цель.\n**Мод глаза/Самозванец:** Помимо свободной смены цвета глаз, этот мод позволяет пользователю копировать рисунок сетчатки другого человека. Достаточно, чтобы тот на пару мгновений встретился с ним взглядом на расстоянии до двух метров — и слепок готов. Глаз хранит до дюжины слепков, но переключение с одного на другой требует Основного действия. Учти: изменить рисунок сетчатки человека довольно просто, так что важная цель, узнавшая о подлоге, может сменить свой слепок.\n**Мод глаза/Инфракрасное зрение:** Инфракрасное зрение позволяет базово ориентироваться в темноте и делает очень заметными источники тепла — людей, двигатели, инфракрасные растяжки. Пользователь получает +1 к любым проверкам Внимания на обнаружение термически незащищённых живых существ.\n**Мод глаза/Зрение при слабом свете:** Этот мод даёт зрение при слабом свете: ясная видимость на обычные дистанции при любом освещении, кроме полной темноты.\n**Мод глаза/Тактический обзор:** Эти глаза могут принимать текстовые или видеопередачи и проигрывать их во вставке в обычном поле зрения пользователя. Различение контуров и рисунков улучшено: когда пользователь специально что-то ищет или несёт наблюдение, он получает +1 к любой соответствующей проверке Внимания.\n**Мод глаза/Увеличение:** Зрение пользователя может приближать далёкие цели. Он видит объекты в пределах 500 метров так, будто стоит рядом с ними. Штраф к попаданию за дальнюю дистанцию оружия снимается.\n**Ганлинк:** Жёстко вшитые точки управления стыкуются с бортовыми системами наведения большинства современных огнестрелов. При стрельбе из современного огнестрельного оружия ПИ игнорирует штрафы за дистанцию и снимает до 2 пунктов штрафа к попаданию за укрытие, маскировку или лежащих целей. Один раз за сцену Мгновенным действием он может перебросить промах в атаке из огнестрельного оружия.\n**Голова-связь:** Вживлённый телефон/коротковолновая рация, способная напрямую связываться в пределах 100 метров или работать через телефонную сеть, если та доступна. Из соображений черепной безопасности передаются только текст и голос, но разговор можно вести без произнесения звуков.\n**Сенсорный рекордер:** Пользователь может записывать до 180 минут своего сенсорного потока. Если у него есть кабельное подключение к передатчику или кибернетика, способная передавать данные, он может делиться этими записями в реальном времени или потом.\n**Синтуши:** Эта модель искусственного уха сделана неотличимой от нормальных ушей, но обладает всеми свойствами обычной пары киберушей.\n**Синтглаза:** Эти киберглаза высшего класса неотличимы от нормальных глаз ничем, кроме медосмотра. Любые дополнительные моды глаз получают ту же скрытность"},
{"n":"3.6.7.6","l":4,"te":"Medical Cyberware","tr":"Медицинская кибернетика","en":"Cyberware                                Cost        Type        Conc.                SysStr\nProsthetic Cyber I                        $5K        None        Sight                1\nProsthetic Cyber II                        $15K        None        Medical        0.25\nRegulated Anagathic Substrate        $200K        None        Medical        1\n\n\nProsthetic Cyber I: One of an array of minimally-adequate and very obvious organ replacements, eye prosthetics, neural patches, and other medical cyber. Prosthetic cyber grants no benefits over ordinary flesh, but can mitigate a Major Injury as explained on page 41. Patients who’ve lost an arm or leg don’t need this cyber; they need a serviceable new limb system such as a Cyberlimb or Synthlimb.\nProsthetic Cyber II: A more sophisticated and expensive version of basic prosthetic cyber, inobvious to anything but a medical scan and far less burdensome on the user’s system.\nRegulated Anagathic Substrate: This whole-body network of chem regulators can prolong human lifespans by up to 1d4+2 decades. Maintenance on this cyber costs $50,000 a month, however, and interruptions have catastrophic consequences. Rumors persist of even more effective models existing among the megacorp ultra-elite.","ru":"| Кибернетика | Цена | Тип | Скр. | СН | Эффект |\n|---|---|---|---|---|---|\n| Протезный кибер I | $5 тыс. | Нет | Взгляд | 1 | Смягчает Серьёзную травму |\n| Протезный кибер II | $15 тыс. | Нет | Медосмотр | 0,25 | Смягчает Серьёзную травму |\n| Регулируемый анагатический субстрат | $200 тыс. | Нет | Медосмотр | 1 | Продлевает человеческую жизнь |\n\n\n**Протезный кибер I:** Один из множества едва-приемлемых и очень заметных заменителей органов, глазных протезов, нейронных заплаток и прочего медицинского кибера. Протезный кибер не даёт никаких преимуществ перед обычной плотью, но может смягчить Серьёзную травму, как описано на стр. 41. Пациентам, потерявшим руку или ногу, этот кибер не нужен — им нужна работоспособная новая конечность вроде Кибер-конечности или Синтконечности.\n**Протезный кибер II:** Более изощрённая и дорогая версия базового протезного кибера, незаметная ни для чего, кроме медицинского сканирования, и куда менее обременительная для организма пользователя.\n**Регулируемый анагатический субстрат:** Эта сеть химических регуляторов по всему телу может продлить человеческую жизнь на 1d4+2 десятилетия. Обслуживание такого кибера стоит $50 000 в месяц, а перебои имеют катастрофические последствия. Упорно ходят слухи, что среди ультра-элиты мегакорпораций есть и куда более эффективные модели."},
{"n":"3.6.7.7","l":4,"te":"Nerve Cyberware","tr":"Нервная кибернетика","en":"Cyberware                                Cost        Type        Conc.                SysStr\nCoordination Augment I                $50K        Nerve        Medical        2\nCoordination Augment II                $200K        Nerve        Touch                3\nEnhanced Reflexes I                        $100K        Nerve        Medical        2\nEnhanced Reflexes II                        $250K        Nerve        Medical        3\nEnhanced Reflexes III                        $750K        Nerve        Touch                4\nReaction Booster I                        $50K        Nerve        Medical        1\nReaction Booster II                        $100K        Nerve        Medical        2\nRemote Control Unit                        $10K        Nerve        Touch                2\nSkillplug Jack I                        $10K        Head        Touch                0.25\nSkillplug Jack II                        $25K        Head        Touch                0.5\nSkillplug Wiring                        $50K        Nerve        Medical        1\nTrajectory Optimization Node                $50K        Nerve        Medical        1\nZombie Wires                                $60K        Nerve        Medical        2\n\n\nCoordination Augment I: The user’s natural mind-body interface is tightened. The subject gains a Dexterity score of 14, or +2 if already 14 or higher.\nCoordination Augment II: As Coordination Augment I, but the subject gains a Dexterity score of 18, and their base Move rate is increased by 10 meters.\nEnhanced Reflexes I: Neural acceleration matrices can be deployed to briefly boost the user’s reaction speed. Once per scene, as an On Turn action, the user gets a bonus non-cyberspace Main Action.\nEnhanced Reflexes II: Once per scene, as an On Turn action, the user gains a bonus non-cyberspace Main Action and Move action. By accepting one System Strain, this ability can be used as an Instant action, potentially interrupting incoming attacks if the user moves out of reach.\nEnhanced Reflexes III: Twice per scene, as an On Turn action up to once per round, the user gains a bonus non-cyberspace Main Action and bonus Move Action. By accepting one System Strain, this ability can be used as an Instant action.\nReaction Booster I: These implants grant a +2 bonus to your Initiative, perhaps making you act before the rest of your team. Once per scene, as an Instant action, ignore Snap Attack hit penalties.\nReaction Booster II: As level one, but the user automatically wins initiative against targets that don’t also automatically win initiative; if both have this ability, initiative is rolled without modifications. The user can act normally during surprise rounds.\nRemote Control Unit: A neurally-integrated control link allows for near-range control of drones or remote-rigged vehicles, as per the drone control rules.\nSkillplug Jack I: A discreet head-mounted plug port allows use of an intellectual skillplug for a skill requiring minimal physical ability, up to level-1. Once slotted, a skillplug takes fifteen minutes to boot up and integrate properly.\nSkillplug Jack II: This improved plug jack allows use of either an intellectual skillplug or one requiring physical expertise, up to level-1.\nSkillplug Wiring: A neural wiring connection improves a skillplug jack’s limits to allow up to level-3 skill usage. One set of wires can support any number of jacks, but at least one is needed.\nTrajectory Optimization Node: This cyber can calculate the optimal path for bypassing defenses and striking a target. Once per scene, as an Instant action, turn a missed hit roll into a success. Melee and unarmed attacks can be used as-is, but using this unit with a ranged attack requires an active Gunlink with the weapon.\nZombie Wires: Functioning only for a user with at least one Body cybersystem to serve as a motor substrate, “zombie wires” allow a user to keep functioning even at zero hit points. As an Instant action at zero hit points, the user can give their body a one-sentence command involving physical action. Their insensate flesh will blindly carry out that action for up to six rounds until it is complete or they take up to one quarter of their maximum hit points in further damage, which will kill them instantly. Time spent under Zombie Wires counts against a user’s stabilization time limit. Triggering this cyber adds 2 System Strain.","ru":"| Кибернетика | Цена | Тип | Скр. | СН | Эффект |\n|---|---|---|---|---|---|\n| Аугментация координации I | $50 тыс. | Нервы | Медосмотр | 2 | Лов 14 или +2, если выше |\n| Аугментация координации II | $200 тыс. | Нервы | Касание | 3 | Лов 18 и +10 м к перемещению |\n| Улучшенные рефлексы I | $100 тыс. | Нервы | Медосмотр | 2 | 1/сцену бонусное Основное действие |\n| Улучшенные рефлексы II | $250 тыс. | Нервы | Медосмотр | 3 | 1/сцену бонусные Основное и перемещение |\n| Улучшенные рефлексы III | $750 тыс. | Нервы | Касание | 4 | 2/сцену бонусные Основное и перемещение |\n| Ускоритель реакции I | $50 тыс. | Нервы | Медосмотр | 1 | +2 к инициативе и бонусы атаки навскидку |\n| Ускоритель реакции II | $100 тыс. | Нервы | Медосмотр | 2 | Автоматически выигрывает инициативу |\n| Блок дистанционного управления | $10 тыс. | Нервы | Касание | 2 | Дистанционное управление дронами и транспортом |\n| Разъём скиллплага I | $10 тыс. | Голова | Касание | 0,25 | Интеллектуальные плаги уровня-1 |\n| Разъём скиллплага II | $25 тыс. | Голова | Касание | 0,5 | Любые плаги уровня-1 |\n| Проводка скиллплага | $50 тыс. | Нервы | Медосмотр | 1 | Поднимает максимум скиллплагов до уровня-3 |\n| Узел оптимизации траектории | $50 тыс. | Нервы | Медосмотр | 1 | 1/сцену превращает промах в попадание |\n| Зомби-провода | $60 тыс. | Нервы | Медосмотр | 2 | Продолжает действовать на нуле ПЗ |\n\n\n**Аугментация координации I:** Естественная связка «разум — тело» пользователя подтягивается. Носитель получает Ловкость 14, или +2, если она уже 14 или выше.\n**Аугментация координации II:** Как Аугментация координации I, но носитель получает Ловкость 18, а его базовая скорость перемещения увеличивается на 10 метров.\n**Улучшенные рефлексы I:** Матрицы нейронного ускорения можно развернуть, чтобы на короткое время поднять скорость реакции пользователя. Один раз за сцену Действием в свой ход пользователь получает бонусное Основное действие вне киберпространства.\n**Улучшенные рефлексы II:** Один раз за сцену Действием в свой ход пользователь получает бонусное Основное действие вне киберпространства и Действие перемещения. Приняв одну Системную нагрузку, эту способность можно использовать как Мгновенное действие, потенциально прерывая входящие атаки, если пользователь выходит из зоны досягаемости.\n**Улучшенные рефлексы III:** Дважды за сцену, Действием в свой ход но не чаще раза в раунд, пользователь получает бонусное Основное действие вне киберпространства и бонусное Действие перемещения. Приняв одну Системную нагрузку, эту способность можно использовать как Мгновенное действие.\n**Ускоритель реакции I:** Эти импланты дают +2 к инициативе — возможно, ты будешь действовать раньше остальной команды. Один раз за сцену Мгновенным действием игнорируй штрафы к попаданию за атаку навскидку.\n**Ускоритель реакции II:** Как уровень один, но пользователь автоматически побеждает в инициативе против целей, которые сами не побеждают в ней автоматически; если этой способностью обладают оба, инициатива бросается без модификаций. Пользователь может действовать нормально в раундах внезапности.\n**Блок дистанционного управления:** Нейроинтегрированный канал управления позволяет управлять дронами или транспортом с дистанционным оснащением на близкой дистанции — по правилам управления дронами.\n**Разъём скиллплага I:** Скрытный порт на голове позволяет использовать интеллектуальный скиллплаг для навыка, требующего минимальных физических способностей, вплоть до уровня-1. После вставки скиллплагу нужно пятнадцать минут, чтобы загрузиться и правильно интегрироваться.\n**Разъём скиллплага II:** Этот улучшенный разъём позволяет использовать как интеллектуальный скиллплаг, так и требующий физического мастерства, вплоть до уровня-1.\n**Проводка скиллплага:** Нейронная проводка поднимает лимит разъёма скиллплага, позволяя использовать навыки вплоть до уровня-3. Один комплект проводки поддерживает любое число разъёмов, но нужен хотя бы один разъём.\n**Узел оптимизации траектории:** Этот кибер способен вычислить оптимальный путь для обхода защиты и поражения цели. Один раз за сцену Мгновенным действием преврати промах в попадание. Атаки в ближнем бою и рукопашные годятся как есть, но для применения с атакой на расстоянии нужен активный Ганлинк с этим оружием.\n**Зомби-провода:** Работая только у пользователя, имеющего хотя бы одну кибер-систему типа Тело в качестве моторного субстрата, «зомби-провода» позволяют пользователю продолжать действовать даже на нуле пунктов здоровья. Мгновенным действием на нуле пунктов здоровья пользователь может отдать своему телу команду в одно предложение, связанную с физическим действием. Его бесчувственная плоть слепо будет выполнять это действие до шести раундов — пока не завершит его или пока не получит ещё урона в размере четверти максимума пунктов здоровья, что убьёт пользователя мгновенно. Время под Зомби-проводами идёт в счёт лимита времени на стабилизацию пользователя. Срабатывание этого кибера добавляет 2 Системной нагрузки."},
{"n":"3.6.8","l":3,"te":"Cyberware Alienation","tr":"Кибер-отчуждение","en":"In the default cyber rules, chrome does not cause dramatic psychological changes in of itself. The new senses, capabilities, and needs of the cyber may have consequences on a user’s thinking, but these changes aren’t reified in game mechanics. This works for many cyberpunk settings, but some GMs prefer to use worlds where replacing half your brain with wiring makes you considerably less human in your thinking.\nIn these settings, cyber causes a progressive distancing of the user from the normal human condition. The constant barrage of synthetic nerve impulses, hormonal modifications, and neural compromises necessary to integrate cold metal with living flesh forces an adaptation process not unlike the creation of psychological scar tissue. The user must adapt to these alterations in ways that are not always rational, productive, or non-homicidal.\nThis adaptation is called Alienation, and it’s counted in points much like System Strain. A user’s total begins at zero and they gain points as they add cybernetics. If these points ever exceed the user’s Wisdom score, they break down entirely and become an NPC, incapable of functioning in a human society.","ru":"По умолчанию в правилах по киберу хром сам по себе не вызывает драматических психологических изменений. Новые чувства, возможности и потребности кибера могут повлиять на мышление пользователя, но эти изменения не отражены в игровой механике. Для многих киберпанк-сеттингов этого достаточно, но некоторые Мастера предпочитают миры, где замена половины мозга проводами делает тебя заметно менее человеком в мышлении.\nВ таких сеттингах кибер вызывает прогрессирующее отдаление пользователя от нормального человеческого состояния. Постоянный обстрел синтетическими нервными импульсами, гормональные правки и нейронные компромиссы, без которых не срастить холодный металл с живой плотью, запускают процесс адаптации, похожий на образование психологической рубцовой ткани. Пользователю приходится приспосабливаться к этим изменениям способами, которые не всегда разумны, продуктивны или неубийственны.\nЭта адаптация называется Отчуждением и считается в пунктах, во многом как Системная нагрузка. Счёт пользователя начинается с нуля и растёт по мере установки кибернетики. Если эти пункты когда-нибудь превысят Мудрость пользователя, он ломается окончательно и становится NPC, не способным существовать в человеческом обществе."},
{"n":"3.6.8.1","l":4,"te":"Gaining and Losing Alienation","tr":"Получение и потеря Отчуждения","en":"Campaigns that involve cybernetic alienation do so under three particular rules.\nWhen a user adds a cybernetic system, they gain permanent Alienation equal to its System Strain cost, rounded up to the nearest whole number. If it’s Nerve cyberware, this total is increased by +2 per system. Mods or Focus abilities that lower the System Strain cost of a mod can also lower its Alienation cost, as the system is made less intrusive or more finely-tuned to the user. Eye or ear mods discounted by cybereyes or cyberears still round up to 1 Alienation each, however.\nUsers can also gain Alienation if they fail an Alienation check as described below. Their failure has aggravated their psychological condition, and they’re forced to deal with the fallout and contain the influence of their chrome on their thinking. This added Alienation might push the total above their maximum, causing an incapacitating cyber-induced psychosis.\nWhen a user fights their chrome syndromes and tries to behave in ways contrary to them, they may be forced to check for Alienation. To do so, the user rolls 1d20; if the result is equal or less than their current Alienation, they gain one point. If this pushes them over their maximum allowed Alienation, they make a Mental save; on success, they pick a new chrome syndrome, and on a failure they immediately suffer CIP.\nTo lose Alienation, the user must spend a week in therapy with a skilled cyberpsychologist or another PC with Talk-1 and Heal-1 skills. NPCs usually charge about $2,000 a week for this service. At the end, the user’s Alienation score drops by one point. It cannot drop below the permanent Alienation induced by their cyberware. Removing cyberware will lower this minimum.","ru":"Кампании с кибернетическим отчуждением работают по трём особым правилам.\nКогда пользователь ставит кибер-систему, он получает постоянное Отчуждение, равное её стоимости в Системной нагрузке, округляя вверх до целого. Если это нервная кибернетика, эта сумма увеличивается на +2 за систему. Моды или способности Фокусов, снижающие стоимость мода в Системной нагрузке, могут снизить и его стоимость в Отчуждении — система становится менее навязчивой или точнее подогнанной под пользователя. Однако моды глаз или ушей, удешевлённые киберглазами или киберушами, всё равно округляются до 1 Отчуждения каждый.\nПользователь также может получить Отчуждение, провалив проверку Отчуждения, описанную ниже. Провал усугубил его психологическое состояние, и ему приходится разбираться с последствиями и сдерживать влияние хрома на своё мышление. Это добавленное Отчуждение может выбить счёт за максимум, вызывая обездвиживающий кибер-психоз.\nКогда пользователь борется со своими хром-синдромами и пытается вести себя вопреки им, ему может потребоваться проверка Отчуждения. Для этого пользователь бросает 1d20; если результат равен или меньше его текущего Отчуждения, он получает один пункт. Если это выводит его за максимально допустимое Отчуждение, он делает Ментальный спасброск: при успехе он выбирает новый хром-синдром, при провале немедленно получает КИП.\nЧтобы потерять Отчуждение, пользователь должен провести неделю в терапии у толкового киберпсихолога или у другого ПИ с навыками Убеждение-1 и Медицина-1. NPC обычно берут за такую услугу около $2 000 в неделю. В конце счёт Отчуждения пользователя падает на один пункт. Он не может упасть ниже постоянного Отчуждения, вызванного его кибернетикой. Удаление кибернетики снижает этот минимум."},
{"n":"3.6.8.2","l":4,"te":"Cyber-Induced Psychosis","tr":"Кибер-психоз","en":"A subject whose Alienation score rises above their Wisdom attribute score breaks down entirely, becoming enslaved to their existing adaptations. They become a GM-controlled NPC who acts solely to fulfill the impulses of any chrome syndromes they may have with no regard for law, morality, or long-term prudence.\nThe only way to rescue a CIP victim is to subdue them and bring them in for cyberpsychological therapy as described above. All cyber must be removed save for medically-necessary prostheses and the therapist must get their Alienation below their Wisdom attribute. If they can do so, the victim makes a Mental saving throw with a bonus equal to the therapist’s best Heal or Talk skill level. On a success, they regain their reason. On a failure, they are hopelessly and permanently compromised.","ru":"Носитель, чей счёт Отчуждения поднимается выше его Мудрости, ломается окончательно и становится рабом своих же адаптаций. Он превращается в NPC под управлением Мастера, который действует исключительно ради удовлетворения импульсов своих хром-синдромов, без всякой оглядки на закон, мораль или дальнюю выгоду.\nЕдинственный способ спасти жертву КИП — усмирить её и доставить на киберпсихологическую терапию, описанную выше. Весь кибер надо снять, кроме медицински необходимых протезов, а терапевт должен опустить Отчуждение ниже Мудрости жертвы. Если у него получится, жертва делает Ментальный спасброск с бонусом, равным лучшему уровню навыка Медицина или Убеждение у терапевта. При успехе она возвращает себе рассудок. При провале она безнадёжно и навсегда сломана."},
{"n":"3.6.8.3","l":4,"te":"Chrome Syndromes","tr":"Хром-синдромы","en":"Very few cyber addicts leap directly to CIP. Most make progressively-larger accommodation to the demands of the cyber in their bodies, dealing with its quirks or demands in various maladaptive ways. These adaptations are referred to as “chrome syndromes”, and have some common typologies.\nA PC can pick one or more chrome syndromes to accept any time they get new cyber. The various syndromes are described in their most common forms, but the GM can allow a PC to pick any syndrome they can reasonably explain as being related to their new cyber; it may be that someone’s new reflex aug feels so good to use that they become Ravenous for street racing, or their dermal armor leaves them feeling half-monstrous and Distant from normal humans.\nEach chrome syndrome increases the user’s effective Alienation maximum by a certain number of points. Thus, a PC who becomes Distant can add 3 points to their allowed maximum Alienation. The same syndrome cannot be picked twice.\nThe only way to get rid of a chrome syndrome is to uninstall the cyber that induced it and get therapy to eliminate any Alienation its installation caused. The user can never re-install that specific cyber system.\nSeveral example chrome syndromes are described below.\n\n\nChrome Syndrome                                +Max Alienation\nBrutal, unable to hold back                        +4\nCandid, unable to keep silent                        +3\nCold, unable to feel love                        +4\nDistant, unable to tolerate people                +3\nExultant, unable to imagine failure                +3\nFearless, unable to feel dread                +4\nHypervigilant, unable to rest                        +3\nMurderous, unable to stop killing                +6\nRavenous, unable to stop feeling                +4\nSavage, unable to retreat                        +5\nSecretive, unable to admit it                        +3\nStressed, unable to endure it                        +5\n\n\nBrutal: Your hardware isn’t meant to be restrained. It hurts to leave the limiters on; the confirmation prompts keep blaring in your brain and it feels like you’re suffocating when you don’t let them work according to spec. Sub-optimal performance feels like something sharp digging in your head. Effect: You cannot engage in non-lethal combat, though you don’t necessarily need to coup de grace downed foes. Check for Alienation each round you attack someone with non-lethal intent.\nCandid: The processors feed you information so quickly and so smoothly that your meat brain barely has time to process it. If you try to slow it down, it hurts, so it’s easier to just let it run. Effect: You instinctively answer any question with at least one sentence of truthful reply. Check for Alienation if you try to remain silent or avert this instinct for a scene.\nCold: The hormonal adjustments are fraying your ability to form emotional bonds with others. You intellectually may know they love you and you may have every reason to love them, but it’s a distant abstraction to you. It’s not a real feeling, like the hate, or lust, or longing that still sometimes sparks in you. You stick with your friends out of habit or rational calculation. Effect: You are unable to feel love or affection for others. Lose your closest Contact.\nDistant: Everything’s so much clearer with the augs. You can see what you need to do, to say, to be, while those around you wallow in weak, fleshly delusion. Dealing with them is so very tiresome. Effect: Take a -1 penalty to all social skill checks.\nExultant: The chrome is perfect. If it breaks, you can just fix it. If you break, you can just get more chrome. You can’t be beaten, not for long, because the metal can do anything. Effect: Your overconfidence causes an automatic, unavoidable skill failure on a natural skill roll of 12.\nFearless: The combat augs are great for suppressing fear. Honestly, it feels so good that you just leave them on all the time. Being able to live your life without worry or anxiety is such a tremendous relief, even if it sometimes makes you overlook some things. Effect: Your maximum HP is decreased by 20%, rounded down, because your survival instincts are dulled. If an NPC, your Morale is 12.\nHypervigilant: Can’t sleep. Wireless push updates will eat me. Effect: Gain one permanent System Strain point due to persistent insomnia.\nMurderous: You were wired to kill, and you can’t turn it off. The longer between kills, the more everything starts looking like a weapon, and everyone starts looking like a throat to cut. When it gets really bad, the wires won’t let you think of anything but your real purpose, what you made yourself to be. Effect: Must personally kill at least one person a week, or check for Alienation for each day beyond without a murder.\nRavenous: These senses are incredible; you’re seeing, or hearing, or feeling things human meat was never meant to experience. You want more, you need more, and you’ll do anything to get it. Effect: Pick a sensory vice. Check for Alienation each time you resist an easy opportunity to indulge it. Pay $100 per total permanent Alienation point per week in feeding it or check for Alienation.\nSavage: Your cyber is telling you to kill. It’s constantly reminding you of active enemies or weak points on targets, and you have to keep rejecting confirmation prompts for killing blows. It’s only letting you think about trajectories and kill counts, about threats and unfinished terminations. You can’t think with a live enemy around. Effect: You can’t run from combat after you’ve suffered hit point damage in it. If you choose to flee, check for Alienation.\nSecretive: Your social protocols know best. They’re telling you not to say that, warning you that you’ll ruin everything if you admit it. You’re supposed to say something better, something more appropriate, and the prompts keep screaming at you if you try to defy them. Effect: You cannot entirely truthfully answer any question that doesn’t relate to common knowledge or your wishes in a business transaction. If you do so, check for Alienation for each topic that’s truthfully discussed in a scene.\nStressed: The hardware is getting in the way of the wetware. The demands are aggravating an already weakened system, and it can’t take the strain. Effect: Your lowest attribute suffers a -1 modifier penalty, to a minimum of -3. If multiple attributes tie, pick one.","ru":"Мало кто из кибер-зависимых прыгает прямиком в КИП. Большинство идут на всё большие уступки требованиям кибера в своём теле, справляясь с его причудами и запросами разными негодными способами. Эти адаптации называют «хром-синдромами», и у них есть общие типологии.\nПИ может выбрать один или несколько хром-синдромов каждый раз, когда получает новый кибер. Синдромы описаны в самых распространённых формах, но Мастер может разрешить ПИ выбрать любой синдром, который он разумно объяснит связью со своим новым кибером: может, новая аугментация рефлексов так приятна в работе, что персонаж становится Ненасытным до уличных гонок, а из-за дермальной брони он ощущает себя полумонстром и Отстранённым от нормальных людей.\nКаждый хром-синдром повышает эффективный максимум Отчуждения пользователя на определённое число пунктов. Так, ПИ, ставший Отстранённым, может добавить 3 пункта к своему допустимому максимуму Отчуждения. Один и тот же синдром нельзя выбрать дважды.\nЕдинственный способ избавиться от хром-синдрома — снять кибер, который его вызвал, и пройти терапию, чтобы убрать всё Отчуждение от его установки. Этот конкретный кибер пользователь уже никогда не сможет поставить снова.\nНиже описаны несколько примеров хром-синдромов.\n\n\n| Хром-синдром | +Макс. Отчуждение |\n|---|---|\n| Зверский, не может сдерживаться | +4 |\n| Откровенный, не может молчать | +3 |\n| Холодный, не может любить | +4 |\n| Отстранённый, не терпит людей | +3 |\n| Ликующий, не представляет провала | +3 |\n| Бесстрашный, не чувствует ужаса | +4 |\n| Сверхбдительный, не может отдыхать | +3 |\n| Убийственный, не может перестать убивать | +6 |\n| Ненасытный, не может перестать ощущать | +4 |\n| Свирепый, не может отступить | +5 |\n| Скрытный, не может признаться | +3 |\n| Надорванный, не выдерживает | +5 |\n\n\n**Зверский:** Твоё железо не создано, чтобы его сдерживали. Держать ограничители включёнными больно — подтверждающие запросы не перестают орать в мозгу, и без работы по спецификации ты будто задыхаешься. Работа вполсилы ощущается как что-то острое, вгрызающееся в голову. Эффект: Ты не можешь вести нелетальный бой, хотя и не обязан обязательно добивать упавших врагов. Проверяй Отчуждение за каждый раунд, в который атакуешь кого-то с нелетальным умыслом.\n**Откровенный:** Процессоры подают тебе информацию так быстро и так гладко, что мясной мозг едва успевает её обрабатывать. Попытка притормозить поток отзывается болью, так что проще дать ему течь. Эффект: Ты инстинктивно отвечаешь на любой вопрос хотя бы одним предложением правды. Проверяй Отчуждение, если пытаешься молчать или обходить этот инстинкт в течение сцены.\n**Холодный:** Гормональные правки разъедают твою способность образовывать эмоциональные связи. Умом ты можешь знать, что тебя любят, и у тебя может быть тысяча причин любить в ответ — но для тебя это дальняя абстракция. Не настоящее чувство, в отличие от ненависти, похоти или тоски, которые всё ещё иногда в тебе вспыхивают. Ты держишься за друзей по привычке или из холодного расчёта. Эффект: Ты не способен чувствовать любовь или привязанность к другим. Потеряй своего самого близкого Контакта.\n**Отстранённый:** С аугментациями всё намного яснее. Ты видишь, что нужно делать, говорить, чем быть, пока окружающие барахтаются в слабом плотском самообмане. Иметь с ними дело до крайности утомительно. Эффект: Получи -1 ко всем проверкам социальных навыков.\n**Ликующий:** Хром идеален. Если он сломается — ты его починишь. Если сломаешься ты — просто добавишь хро
