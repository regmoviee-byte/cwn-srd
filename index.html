{"n":"2.8.2","l":3,"te":"Modifying Gear","tr":"Модификация снаряжения","en":"Crafted or purchased gear can be modified by a skilled tech. The individual gear sections describe example mods that are appropriate.\nTo install mods in gear, a tech needs a suitable workshop capable of fine craftsmanship. Such a shop can be rented for $500 a day in the slums or purchased outright for around $20,000.\nCrafting mods also requires a minimum Fix skill, or both Fix and Heal in the case of some cyberware mods. Without this skill level the tech cannot install the mod or maintain it afterwards.\nCrafting and installing mods has a cost in dollars and in special tech. The latter involves prototype devices, restricted materials, and other advanced components that are not normally available on the open market. Techs must usually either acquire these things through missions, obtain them as mission rewards, or steal them from manufacturers. If they want more than they get through their normal employment, they may need to plan specific missions around obtaining them. These components are generic in nature, so a given special component can be used in any mod, and a salvaged mod can be stripped for special components.\nIt takes one week per minimum skill level of the mod to build and install it. Thus, if the mod requires Fix-1 skill, it takes one week, while one requiring Fix-2 and Heal-1 requires three. If the tech has an assistant with at least Fix-0 skill, this time is halved. If they do nothing but eat, sleep, and work, this time is further halved.\nPre-built existing mods can be removed or installed with a day's work. Mods must be built for specific items or cyberware systems; a tech cannot pull a Customized mod off one gun and plug it into another.","ru":"Изготовленное или купленное снаряжение может переделать умелый техник. В разделах по конкретному снаряжению описаны подходящие примеры модов.\nЧтобы ставить моды в снаряжение, технику нужна подходящая мастерская, позволяющая тонкую работу. Такую можно снять за $500 в день в трущобах или купить целиком примерно за $20 000.\nДля изготовления модов также нужен минимальный уровень навыка Ремонт, а для некоторых модов кибернетики — и Ремонт, и Медицина. Без этого уровня навыка техник не может ни установить мод, ни обслуживать его потом.\nИзготовление и установка модов стоят денег и особой техники. Последняя — это прототипы, ограниченные в обороте материалы и другие экспериментальные компоненты, которых обычно не купить на открытом рынке. Как правило, техникам приходится добывать их на миссиях, получать как награду за миссию или красть у производителей. Если им нужно больше, чем даёт обычная работа, придётся планировать миссии специально ради них. Компоненты эти универсальны: любой такой компонент годится в любой мод, а снятый с трофейной техники мод можно разобрать на экспериментальные компоненты.\nНа сборку и установку мода уходит по неделе за каждый минимальный уровень навыка, требуемый модом. Так, если мод требует навык Ремонт-1, на него уйдёт неделя, а если он требует Ремонт-2 и Медицина-1 — три недели. Если у техника есть помощник с навыком хотя бы Ремонт-0, это время сокращается вдвое. Если техник только ест, спит и работает, время сокращается вдвое ещё раз.\nУже готовые моды можно снять или поставить за день работы. Моды делаются под конкретный предмет или кибер-систему: техник не может снять мод Индивидуальная подгонка с одного ствола и вставить его в другой."},
{"n":"2.8.3","l":3,"te":"Maintaining Mods","tr":"Обслуживание модов","en":"Mods normally require maintenance to keep functioning correctly, and a given tech can maintain only so many mods at once. A tech can only maintain mods they have the requisite skill levels to build; if a tech has Fix-1 and the mod requires Fix-2 to build, they can't maintain it.\nA tech's maximum maintenance score is equal to the total of their Intelligence and Constitution modifiers plus three times their Fix skill level. Thus, a tech with a +1 Intelligence mod, a -1 Constitution mod and Fix-1 could maintain up to three mods at any one time.\nMaintenance is assumed to take place during downtime and does not require any significantly expensive components. If a tech does nothing but maintain mods, they can double their allowed number. Such work assumes sixteen-hour workdays.\nIf a mod goes without maintenance for 24 hours, it stops working. If it goes without maintenance for a week, the item it's attached to stops working. A maintenance backlog on an item can be cleared by an hour's work by a tech capable of maintaining it.","ru":"Обычно моды требуют Обслуживания, чтобы работать как надо, и один техник может обслуживать лишь ограниченное их число за раз. Техник может обслуживать только те моды, на изготовление которых у него хватает уровней навыков: если у техника Ремонт-1, а мод требует для изготовления Ремонт-2, обслуживать его он не может.\nМаксимальное Обслуживание техника равно сумме его модификаторов Интеллекта и Телосложения плюс тройной уровень навыка Ремонт. Так, техник с модификатором Интеллекта +1, модификатором Телосложения -1 и навыком Ремонт-1 может одновременно обслуживать до трёх модов.\nСчитается, что Обслуживание идёт во время простоя и не требует сколько-нибудь дорогих компонентов. Если техник не делает ничего, кроме Обслуживания модов, он может удвоить допустимое число. Такая работа предполагает шестнадцатичасовой рабочий день.\nЕсли мод остаётся без Обслуживания сутки, он перестаёт работать. Если он остаётся без Обслуживания неделю, перестаёт работать и сам предмет, к которому он прикреплён. Накопившийся долг по Обслуживанию предмета снимается часом работы техника, способного этот мод обслуживать."},
{"n":"2.8.4","l":3,"te":"Factory Mods","tr":"Заводские моды","en":"Some corporate brands, product lines, or special prototypes may come with certain mods pre-engineered into the device. Sometimes these mods are flat upgrades, while other times they come with certain disadvantages or weaknesses in the gear to compensate.\nSuch gear usually sells at a premium. The device's cost is usually increased by at least five times the mod's build price, and each unit of special components that are required for its mods doubles the device's total price.\nThese factory mods do not require maintenance. If a tech further mods the gear, however, the delicate balance of engineering in it is disrupted, and the factory mods begin to require maintenance as normal.\nThe availability of factory-modded gear depends on the campaign and the connections of the PCs. Some might be relatively available for those with the money, while other items might require special contacts or private information to obtain.","ru":"У некоторых корпоративных брендов, линеек продукции или особых прототипов часть модов вживлена в устройство ещё на заводе. Иногда такие моды — чистое улучшение, а иногда за них платят определёнными недостатками или уязвимостями снаряжения.\nТакое снаряжение обычно продаётся с наценкой. Цена устройства, как правило, вырастает минимум в пять раз от цены сборки мода, а каждая единица экспериментальных компонентов, нужных для его модов, удваивает итоговую цену устройства.\nЗаводские моды не требуют Обслуживания. Но если техник поставит в снаряжение ещё моды, тонкий инженерный баланс нарушится, и заводские моды начнут требовать Обслуживания как обычные.\nДоступность снаряжения с заводскими модами зависит от кампании и связей ПИ. Что-то может быть относительно доступно любому, у кого есть деньги, а за чем-то придётся идти к особым контактам или добывать закрытую информацию."},
{"n":"2.9.0","l":2,"te":"Encumbrance","tr":"Загруженность","en":"While gear load is seldom as important to cyberpunk operatives as it is to dungeon-crawling adventurers, some limits on the number of guns and amount of ammo any given operator can carry are required.\nGear has encumbrance, measured in points, as exampled in the table below. The more awkward or bulky the object, the greater the encumbrance. The GM adjudicates ambiguous objects.\n\n\nGear                                                Encumbrance\nPortable in a small pocket                        0 (Any reasonable number can be carried)\nPortable in one hand                                1\nRequires two hands to carry or use it                2\nRequires a whole-body effort to haul it        5+\nDragging an unconscious teammate                12\n\n\nGear is either Stowed or Readied. Stowed gear is packed away carefully in pockets, packs, and harnesses. It's easier to carry but harder to quickly access. Using Stowed gear requires that the bearer take a Main Action to pull it out before using it. Readied gear is carried in hands, holsters, quick-access pockets, or other easily-accessible places. It can be used as part of an action without any further preparation.\nA character can carry a total number of Stowed encumbrance points equal to their Strength score. They can carry a number of Readied points equal to half their Strength, rounded down.  Thus, a PC with a Strength score of 11 could carry 11 points of Stowed gear and 5 points of Readied.\nPCs can haul much heavier objects if necessary. If they push their limits for longer terms, they can carry an additional two Ready and four Stowed items. The first time they do this, their Move speed is cut by 30%, from 10m to 7m. The second time, it’s cut by 50%, from 10m to 5m. More weight than this can’t be practically hauled over significant distances.","ru":"Груз снаряжения для киберпанковских оперативников редко значит столько, сколько для искателей приключений в подземельях, но какие-то пределы на число пушек и количество патронов, которые может тащить на себе оператор, всё же нужны.\nУ снаряжения есть Загруженность, измеряемая в пунктах, — примеры в таблице ниже. Чем неудобнее или объёмнее предмет, тем больше его Загруженность. Спорные предметы оценивает Мастер.\n\n\n| Снаряжение | Загруженность |\n|---|---|\n| Носится в небольшом кармане | 0 (можно нести любое разумное количество) |\n| Носится в одной руке | 1 |\n| Требует двух рук, чтобы нести или использовать | 2 |\n| Требует усилий всего тела, чтобы дотащить | 5+ |\n| Волочить товарища без сознания | 12 |\n\n\nСнаряжение бывает либо в укладке, либо в готовности. Снаряжение в укладке аккуратно упаковано по карманам, сумкам и подвесам. Его легче нести, но труднее быстро достать. Чтобы воспользоваться снаряжением в укладке, носитель должен потратить Основное действие на то, чтобы его вытащить. Снаряжение в готовности несут в руках, кобурах, карманах быстрого доступа и других легкодоступных местах. Его можно применить в рамках действия без дополнительной подготовки.\nПерсонаж может нести в укладке суммарно столько пунктов Загруженности, сколько у него значение Силы. В готовности он может нести число пунктов, равное половине его Силы с округлением вниз. Так, ПИ с Силой 11 может нести 11 пунктов снаряжения в укладке и 5 пунктов в готовности.\nПри необходимости ПИ могут тащить и куда более тяжёлые вещи. Если они выходят за свои пределы надолго, они могут нести дополнительно два предмета в готовности и четыре в укладке. В первый раз их скорость перемещения падает на 30% — с 10 м до 7 м. Во второй раз — на 50%, с 10 м до 5 м. Больший вес на значительные расстояния тащить практически невозможно."},
{"n":"2.9.1","l":3,"te":"Bundled Gear","tr":"Комплекты снаряжения","en":"Small, regularly-shaped objects such as grenades, pharmaceuticals, rations, and firearm magazines can be wrapped into bundles for easier portability. Three such items can be tied into a bundle that only counts as one item of encumbrance. Breaking into this bundle takes an extra Main Action, however.","ru":"Небольшие предметы правильной формы — гранаты, фармацевтику, рационы, магазины к огнестрельному оружию — можно связать в комплекты для удобства переноски. Три таких предмета связываются в комплект, который считается всего за один предмет Загруженности. Правда, чтобы вскрыть такой комплект, нужно потратить дополнительное Основное действие."},
{"n":"2.9.2","l":3,"te":"Bulk Weights","tr":"Вес по объёму","en":"Sometimes the PCs need to transport bulk amounts of goods that are measured in kilograms. When it's necessary to convert these weights into encumbrance points, a GM can just assume that twenty-five kilograms is worth about ten points of encumbrance to a PC hauling a pack out on their back.\nWhen judging the ability of a vehicle to carry encumbrance points of cargo, it can be assumed that a car or truck can carry as much as the PCs need it to carry, within reason.","ru":"Иногда ПИ нужно перевезти объёмные грузы, которые измеряются в килограммах. Когда такой вес надо перевести в пункты Загруженности, Мастер может просто считать, что двадцать пять килограммов — это примерно десять пунктов Загруженности для ПИ, тащащего рюкзак на спине.\nОценивая, сколько пунктов Загруженности груза выдержит машина, можно считать, что легковушка или грузовик увезёт столько, сколько ПИ от них нужно, — в пределах разумного."},
{"n":"2.9.3","l":3,"te":"Games Without Encumbrance","tr":"Игра без Загруженности","en":"Because most cyberpunk missions involve rapid strikes and have access to vehicles, long-term tracking of weights and supplies is less important than it is in a game that involves weeks-long expeditions into the unknown with nothing more than a few pack animals to carry gear. Some GMs may prefer to omit encumbrance rules in this case.\nIf the GM so elects, then PCs can carry and Ready whatever amount of gear the GM thinks is reasonable. In such cases the GM should check over character sheets before each mission to make sure reason is not outraged.","ru":"Поскольку большинство киберпанковских миссий — это быстрые набеги при наличии транспорта, долгий учёт веса и припасов здесь важен меньше, чем в игре про многонедельные вылазки в неизвестность, где всё снаряжение тащат пара вьючных животных. В таком случае некоторые Мастера предпочтут вообще опустить правила Загруженности.\nЕсли Мастер так решит, ПИ могут нести и держать в готовности столько снаряжения, сколько Мастер сочтёт разумным. В таких случаях Мастеру стоит просматривать листы персонажей перед каждой миссией, чтобы разум не был окончательно оскорблён."},
{"n":"3.0.0","l":1,"te":"Gear, Vehicles, and Cyberware","tr":"Снаряжение, транспорт и кибернетика","en":"This section provides a selection of example gear appropriate to most cyberpunk campaigns. The GM is naturally expected to add other items that might suit their particular world.","ru":"Этот раздел даёт подборку примеров снаряжения, подходящего для большинства киберпанковых кампаний. Мастер, само собой, вправе добавить другие предметы, которые подойдут именно его миру."},
{"n":"3.1.0","l":2,"te":"Mission Gear","tr":"Снаряжение для миссий","en":"The following items are often useful to operatives. Their prices can be used to extrapolate other costs for other common goods. The prices given assume that the gear is legally available where the PCs are.\nSome gear is meant to be worn. Worn equipment that is being used, such as IR goggles or a gas mask, must be Readied to be employed.\n\n\nGear                                        Cost        Encumbrance\nActive hearing protection                $250        1\nAmmunition, empty magazine        $10        1\nAmmunition, per round                $1        *\nBackpack or gear harness                $25        1~\nBinoculars                                $100        1\nBus pass, monthly                        $50        *\nClimbing kit                                $150        2\nClothing, fashionable                        $500        1~\nClothing, haute couture                $10K        1~\nClothing, ordinary                        $25        1~\nGas mask                                $1K        1\nGoggles, Anti-Flash                        $100        1\nGoggles, IR                                $1K        1\nKit, Basic Tools                        $100        2\nKit, Cyberdoc                                $500        2\nKit, Medkit                                $100        1\nKit, Survival                                $100        2\nLockpicks                                $100        1\nMilitary ration, per day                $20        1\nPortable video camera                $300        1\nRadio, handheld                        $50        1\nRadio, ultralight tab                        $500        0\nSmartphone service plan/month        $10        -\nSmartphone, basic                        $50        *\nSmartphone, fashionable                $2K        *\nVR crown, cheap                        $50        1\nWearable light                                $25        1~\n~: These items have no Encumbrance while worn.\n*: No Encumbrance for any reasonable amount\n\n\nActive Hearing Protection: This headset protects the wearer from disorientation due to loud noises. It passes along conversational-level speech without difficulty.\nAmmunition: Individual rounds are loaded into empty magazines that are specific to individual firearms.\nBackpack: Backpacks, gear harnesses, and other such kit may add some bulk to an operator’s burden, but without them the GM is perfectly justified in asking how a PC is fitting their entire loadout in their jacket pockets.\nBinoculars: Most modern binocs have low-light functionality and magnification sufficient to bring targets as much as a kilometer distant into view.\nBus pass, monthly: A critical mobility resource for the first mission of many operators.\nClimbing kit: Ultralight cord, a grapnel, some grip handholds, and a fast-acting, ultra-strong wall adhesive make up this kit.\nClothing: Clothing has no Encumbrance when worn, but it’s sometimes prudent to have a spare outfit in your pack.\nGas mask: Bulky and uncomfortable, but once Readied it leaves the user immune to most inhaled gases, including tear gas grenades.\nGoggles: Basic anti-flash goggles defuse the visual threat of flashbangs and similar dazzlers. IR goggles include anti-flash tech, but also give the user effective IR vision out to 50 meters in most environments.\nKit: These bundles of gear are carefully packed for minimal weight. Toolkits give a tech the gear they need for basic repairs and construction, while medical kits provide first aid implements. Cyberdoc kits contain everything medical kits do, as well as gear for cyber maintenance or even emergency implantation. Survival kits are for badlands operations, with water filtration, firemaking tools, and other such gear for extended wilderness stays.\nLockpicks: Both manual lockpicks and a selection of useful electronic shims sufficient to threaten most modern locks.\nMilitary rations: This food brick is unappetizing but contains the nutrition necessary for a day of heavy activity. Water can be included for an extra point of Encumbrance per day.\nPortable video camera: Palm-sized and discreet, this camera can record up to twelve hours of high-def video before its internal memory is filled.\nRadio: Both conventional handheld radios and ultra-convenient headset or collar-tab radios can be had. Ranges are one kilometer in the city and six in an open, flat area.\nSmartphone: Corp-approved media devices are cheap and ubiquitous, but few operators trust them with sensitive information.\nVR Crown: A cheap headset for a VR addict or a hacker too poor for a cranial jack.\nWearable Light: These clip-on lights can illuminate up to 30 meters ahead of the wearer.","ru":"Перечисленные ниже предметы часто полезны оперативникам. По их ценам можно прикинуть стоимость других обычных товаров. Указанные цены исходят из того, что снаряжение легально доступно там, где находятся ПИ.\nЧасть снаряжения носится на себе. Носимое оборудование, которое используется — например, ИК-пункты или противогаз, — должно быть в готовности, чтобы работать.\n\n\n| Снаряжение | Цена | Загруженность |\n|---|---|---|\n| Активная защита слуха | $250 | 1 |\n| Патроны, пустой магазин | $10 | 1 |\n| Патроны, за штуку | $1 | * |\n| Рюкзак или разгрузка | $25 | 1~ |\n| Бинокль | $100 | 1 |\n| Проездной на автобус, месячный | $50 | * |\n| Набор для лазания | $150 | 2 |\n| Одежда, модная | $500 | 1~ |\n| Одежда, от кутюр | $10 тыс. | 1~ |\n| Одежда, обычная | $25 | 1~ |\n| Противогаз | $1 тыс. | 1 |\n| Пункты, антивспышка | $100 | 1 |\n| Пункты, ИК | $1 тыс. | 1 |\n| Набор, базовые инструменты | $100 | 2 |\n| Набор, кибердока | $500 | 2 |\n| Набор, медицинский | $100 | 1 |\n| Набор, выживания | $100 | 2 |\n| Отмычки | $100 | 1 |\n| Военный рацион, на день | $20 | 1 |\n| Портативная видеокамера | $300 | 1 |\n| Рация, ручная | $50 | 1 |\n| Рация, сверхлёгкая клипса | $500 | 0 |\n| Тариф связи для смартфона/месяц | $10 | – |\n| Смартфон, базовый | $50 | * |\n| Смартфон, модный | $2 тыс. | * |\n| VR-корона, дешёвая | $50 | 1 |\n| Носимый фонарь | $25 | 1~ |\n\n~: Эти предметы не дают Загруженности, пока надеты.\n*: Нет Загруженности для любого разумного количества\n\n\n**Активная защита слуха:** Эта гарнитура защищает носителя от дезориентации из-за громких звуков. Речь на уровне разговора она пропускает без затруднений.\n**Патроны:** Отдельные патроны заряжаются в пустые магазины, свои для каждого конкретного оружия.\n**Рюкзак:** Рюкзаки, разгрузки и прочая подобная снаряга добавляют оператору объёма, но без них Мастер вполне вправе спросить, как ПИ умещает весь свой набор в карманах куртки.\n**Бинокль:** У большинства современных биноклей есть работа при слабом свете и увеличение, достаточное, чтобы разглядеть цели на километре.\n**Проездной на автобус, месячный:** Критически важный ресурс мобильности для первой миссии многих операторов.\n**Набор для лазания:** Сверхлёгкий шнур, кошка, несколько цепких захватов и быстросхватывающийся сверхпрочный клей для стен — вот и весь набор.\n**Одежда:** Надетая одежда не даёт Загруженности, но иногда разумно держать сменный комплект в рюкзаке.\n**Противогаз:** Громоздкий и неудобный, но в готовности делает носителя неуязвимым к большинству вдыхаемых газов, включая слезоточивые гранаты.\n**Пункты:** Простые пункты-антивспышка снимают визуальную угрозу светошумовых гранат и подобных ослепителей. ИК-пункты включают технику антивспышки, но вдобавок дают рабочее ИК-зрение на 50 метров в большинстве условий.\n**Набор:** Эти комплекты снаряжения тщательно упакованы так, чтобы весить как можно меньше. Наборы инструментов дают технику всё нужное для базового ремонта и сборки, а медицинские наборы — средства первой помощи. Наборы кибердока содержат всё то же, что и медицинские, плюс снаряжение для обслуживания кибера и даже для экстренной имплантации. Наборы выживания рассчитаны на работу в пустошах: фильтрация воды, средства для розжига огня и прочее для долгих вылазок в глушь.\n**Отмычки:** И механические отмычки, и подборка полезных электронных обходников, которых хватит на большинство современных замков.\n**Военные рационы:** Этот пищевой брикет невкусен, но содержит всё нужное для дня тяжёлой работы. Воду можно добавить за дополнительный пункт Загруженности на день.\n**Портативная видеокамера:** Размером с ладонь и незаметная, эта камера пишет до двенадцати часов видео высокой чёткости, пока не забьётся её внутренняя память.\n**Рация:** Есть и обычные ручные рации, и сверхудобные гарнитуры или рации-клипсы на воротник. Дальность — километр в городе и шесть на открытой равнине.\n**Смартфон:** Одобренные корпами медиа-устройства дёшевы и повсеместны, но мало кто из операторов доверяет им чувствительную информацию.\n**VR-корона:** Дешёвая гарнитура для VR-задрота или хакера, которому не по карману черепной разъём.\n**Носимый фонарь:** Эти фонари-клипсы освещают до 30 метров перед носителем."},
{"n":"3.2.0","l":2,"te":"Lifestyles, Wages, and Bribes","tr":"Уровни жизни, заработки и взятки","en":"Certain operating expenses are common among operators, including the ordinary cost of living, the price of employing subcontractors, and bribes paid to local officials.","ru":"У операторов есть свои обычные расходы: рядовая стоимость жизни, плата подрядчикам и взятки местным чиновникам."},
{"n":"3.2.1","l":3,"te":"Lifestyle Costs","tr":"Расходы на уровень жизни","en":"Living costs money. Every operator needs to make room in their budget for rent, soyburgers, and gang protection payments, and failing to find the money for these things will add a load of stress to the PC.\nThe table below describes common lifestyle costs and the maximum System Strain modifiers that apply while a PC is living such a life. These modifiers come into effect as soon as a PC starts paying – or not paying – for a given lifestyle level.\nOperator teams who obtain their own property or headquarters and make their own deals for local support may be able to lower or eliminate these lifestyle costs at the GM’s discretion.\n\n\nCost/\nMonth                Lifestyle\n$0                Squatter life in an abandoned building\n -2 maximum System Strain\n$300                Slum living in a dirty shared apartment\n -1 maximum System Strain\n$1,000                Middle-class corper life in a nice rental\n No System Strain modifier\n$5,000                Fine living in a clean, secure building\n +1 maximum System Strain\n$20,000        Luxury life with all its little pleasures\n +2 maximum System Strain","ru":"Жизнь стоит денег. Каждому оператору нужно оставить в бюджете место под аренду, соебургеры и отчисления банде за защиту, а если денег на это не найдётся — ПИ получит изрядную порцию стресса.\nВ таблице ниже описаны обычные расходы на уровень жизни и модификаторы максимума Системной нагрузки, которые действуют, пока ПИ живёт такой жизнью. Эти модификаторы вступают в силу сразу, как только ПИ начинает платить — или не платить — за данный уровень жизни.\nКоманды операторов, которые обзавелись своей собственностью или базой и сами договорились о местной поддержке, могут снизить или вовсе убрать эти расходы на усмотрение Мастера.\n\n\n| Цена/месяц | Уровень жизни | Максимум Системной нагрузки |\n|---|---|---|\n| $0 | Жизнь сквоттера в заброшенном здании | -2 к максимуму Системной нагрузки |\n| $300 | Житьё в трущобах, в грязной общей квартире | -1 к максимуму Системной нагрузки |\n| $1 000 | Жизнь корпората среднего класса в приличной съёмной квартире | Без модификатора Системной нагрузки |\n| $5 000 | Достойная жизнь в чистом, охраняемом доме | +1 к максимуму Системной нагрузки |\n| $20 000 | Роскошная жизнь со всеми её мелкими удовольствиями | +2 к максимуму Системной нагрузки |"},
{"n":"3.2.2","l":3,"te":"Common Wages","tr":"Обычные заработки","en":"Sometimes the PCs need to hire some extra help, or the GM needs to know what a reasonable wage would be for some NPC. The table below gives the average daily earnings for various types of workers and elites.\nHirelings will carry out their duties with reasonable levels of loyalty, but most won’t risk their lives or face opposition that threatens their destruction. Bodyguards will act to defend their employers, but only the best will stick around in the face of overwhelming opposition. Ordinary street thugs and hired gangers will be willing to commit acts of extreme violence against enemy gangs or helpless civilians, but few of them have any interest in fair fights under other circumstances.\n\n\nWorker                                        Daily Earnings\nUnskilled street laborer                $10\nLow-level ganger or street thug        $15\nCommon streetwalker                        $20\nPetty street stall merchant                $25\nCapable street tech or cyberdoc        $50\nCompetent street bodyguard                $50\nEntry-level corp worker                $30\nLow-level corp lifer                        $40\nStreet cop or skilled corp worker        $100\nProfessional companion                $200\nCorp-employed hacker                $200\nCorp middle manager                        $250\nCorp-sponsored cyberdoc                $250\nElite or well-known bodyguard        $500\nSuccessful gang boss                        $750\nCorp branch office manager                $1,000\nHigh-ranking corp exec                $5,000\nOligarchic elite of a city                $10,000","ru":"Иногда ПИ нужно нанять помощников, а Мастеру — понять, какая плата разумна для того или иного NPC. В таблице ниже даны средние дневные заработки разных работников и элит.\nНаёмные работники выполняют свои обязанности с разумной степенью верности, но большинство не станет рисковать жизнью и не пойдёт против противодействия, грозящего им гибелью. Телохранители будут защищать нанимателя, но лишь лучшие останутся при подавляющем перевесе противника. Обычные уличные хулиганы и наёмные бандиты охотно пойдут на крайнее насилие против враждебных банд или беспомощных гражданских, но мало кому из них интересна честная драка в других обстоятельствах.\n\n\n| Работник | Дневной заработок |\n|---|---|\n| Неквалифицированный уличный работяга | $10 |\n| Бандит низкого пошиба или уличный хулиган | $15 |\n| Обычная уличная проститутка | $20 |\n| Мелкий торговец с уличного лотка | $25 |\n| Толковый уличный техник или кибердок | $50 |\n| Умелый уличный телохранитель | $50 |\n| Корп-работник начального уровня | $30 |\n| Мелкий корп-служака | $40 |\n| Уличный полицейский или квалифицированный корп-работник | $100 |\n| Профессиональный компаньон | $200 |\n| Хакер на корп-зарплате | $200 |\n| Корп-менеджер среднего звена | $250 |\n| Кибердок на корп-содержании | $250 |\n| Элитный или известный телохранитель | $500 |\n| Успешный главарь банды | $750 |\n| Управляющий филиалом корпы | $1 000 |\n| Высокопоставленный корп-руководитель | $5 000 |\n| Олигархическая элита города | $10 000 |"},
{"n":"3.2.3","l":3,"te":"Bribe Costs","tr":"Стоимость взяток","en":"Bribery is a commonplace in any organization of consequence, and it’s widely accepted that anyone with authority will use it to make a certain amount of side profit. While technically forbidden, everyone expects that cash will obtain faster service, forgiveness for minor offenses, or access to restricted areas.\nSerious bribery is for favors beyond that line. Favors that could cause problems for a superior, cost the official their job, or buy them trouble with someone else are going to cost far more, if they’ll do it at all.\nThe bribe costs on the table below are expressed in multiples of the target’s daily wage, as it costs more to bribe a manager than a janitor. Particular like or dislike for the PCs can move the price accordingly.\nFavor                                                Bribe Multiple\nLook the other way at a minor infraction        x2\nPass out information they shouldn’t                x2\nDo a small favor within their authority        x5\nTurn a blind eye when it might make trouble        x14*\nTurn a blind eye when it will make trouble        x60*\nDo a favor that could have minor backlash        x30*\nDo a favor that might get them punished        x90*\nDo a favor that might get them fired                x180*\n* This is a serious risk, and many NPCs will need reasons beyond simple cash to agree to it","ru":"Взяточничество — обыденность в любой организации хоть какого-то веса, и все давно приняли, что всякий, у кого есть власть, будет с её помощью получать некоторый побочный доход. Формально это запрещено, но все ждут, что наличные обеспечат более быстрое обслуживание, прощение мелких проступков или доступ в закрытые зоны.\nСерьёзное взяточничество — это про услуги за этой чертой. Услуги, которые могут создать проблемы начальству, стоить чиновнику работы или навлечь на него неприятности от кого-то ещё, обойдутся куда дороже — если он вообще на них пойдёт.\nСтоимость взяток в таблице ниже выражена в кратных дневному заработку цели: подкупить менеджера дороже, чем уборщика. Особая приязнь или неприязнь к ПИ может сдвинуть цену в ту или другую сторону.\n\n| Услуга | Множитель взятки |\n|---|---|\n| Закрыть глаза на мелкое нарушение | ×2 |\n| Выдать информацию, которую выдавать не должен | ×2 |\n| Оказать небольшую услугу в рамках своих полномочий | ×5 |\n| Не заметить, когда это может создать проблемы | ×14* |\n| Не заметить, когда это точно создаст проблемы | ×60* |\n| Оказать услугу, которая может дать мелкую отдачу | ×30* |\n| Оказать услугу, за которую его могут наказать | ×90* |\n| Оказать услугу, за которую его могут уволить | ×180* |\n\n*: Это серьёзный риск, и многим NPC понадобятся причины помимо простых денег, чтобы согласиться"},
{"n":"3.3.0","l":2,"te":"Armor","tr":"Броня","en":"The table below gives the statistics for various common types of armor.\n                                                \n                        Range Melee        Dmg.                TT\nArmor                        AC        AC        Soak        Enc.        Mod        Obv.                Cost\nOrdinary Clothing        10        10        0        0        0        Subtle                $25        \nReinforced Clothing        13        10        2        0        0        Subtle                $100        \nWar Harness                13        14        5        1        0        Obvious        $200        \nStreet Leathers        13        12        3        0        0        Subtle                $250        \nReinforced Longcoat        15        13        5        1        +1        Subtle                $500        \nArmored Clothing        16        14        5        2        +1        Subtle                $1,000        \nPlated Longcoat        17        15        5        3        +1        Obvious        $2,000        H\nImpact Jacket                12        14        8        1        +1        Obvious        $1,000        \n\n\nSuit Armor                                                                \nLight Armored Suit        16        13        5        2        +2        Obvious        $5,000@        \nMedium Armored Suit        18        14        10        3        +2        Obvious        $10,000@        \nHeavy Armored Suit        20        18        15        3        +3        Obvious        $20,000@ H\n\n\nArmor Accessories                                                                \nRiot Shield                +2        +4        0        2        0        Obvious        $1,000        \nAbsorption Plates        +2        +2        3        1        0        Obvious        $500 H, NS\nJoint Reinforcement        +1        +1        0        0        0        Subtle                $250        H, NS\nObsolete Tech                -1d2        -1d2        -1d4        0        0        -                x50%        \n@: This armor requires a relevant Contact to purchase, or some other special opportunity\nH: The armor or accessory applies a -1 penalty to all Sneak or Exert skill checks. Multiple heavy items stack.\nNS: This accessory cannot be added to suit armor.\n\n\nArmored Clothing: The bulky plates and heavy ballistic weaves of this outfit are disguised as drapes and fashion elements.\nHeavy Armored Suit: A head-to-toe suit of interlocking plates and impact absorption units, these suits are reserved for high-end response teams and military operations.\nImpact Jacket: Built to absorb the impact of various contact sports, extreme athletic pursuits, and unguided vehicle races, these jackets usually come as part of a full-body protective outfit.\nLight Armored Suit: Ordinary law enforcement and security guards will be wearing suits like this, usually brightly emblazoned with their corporate affiliation.\nMedium Armored Suit: Heavy security usually sports armor on this level, including police rapid response teams.\nOrdinary Clothing: Some bold, impoverished, or highly fashionable people still insist on wearing clothing that has no functional use as armor.\nPlated Longcoat: An ankle-length coat, robe, or mantle is used as a substrate for numerous reinforced plates and swaths of ballistic weave. It’s heavy, bulky, and blatant, but it can absorb a lot of punishment.\nReinforced Clothing: Subtle polymer sheets and reinforced weaves are used to provide a modicum of protection in this clothing without sacrificing taste.\nReinforced Longcoat: Long, draping clothing is bolstered with advanced fabrics and discreetly-placed absorption plates, the whole remaining deniable as armor.\nStreet Leathers: Fashionable, aggressive, and often mismatched, “street leathers” seldom have any non-synthetic leather in their makeup, but are light and comfortable enough to wear as a habit.\nWar Harness: An upgraded form of street leathers, these outfits have sacrificed all discretion for whatever spare ballistic plates and advanced polymer weaves its owner can sew or bolt on. It’s usually the best armor that local gangs or common thugs can afford.","ru":"В таблице ниже даны характеристики разных распространённых типов брони.\n\n| Броня | КЗщ дб | КЗщ бб | Погл. урона | Загр. | Мод ПТ | Замет. | Цена |\n|---|---|---|---|---|---|---|---|\n| Обычная одежда | 10 | 10 | 0 | 0 | 0 | Скрытая | $25 |\n| Укреплённая одежда | 13 | 10 | 2 | 0 | 0 | Скрытая | $100 |\n| Боевая сбруя | 13 | 14 | 5 | 1 | 0 | Явная | $200 |\n| Уличная кожа | 13 | 12 | 3 | 0 | 0 | Скрытая | $250 |\n| Укреплённый плащ | 15 | 13 | 5 | 1 | +1 | Скрытая | $500 |\n| Бронированная одежда | 16 | 14 | 5 | 2 | +1 | Скрытая | $1 000 |\n| Плащ с пластинами | 17 | 15 | 5 | 3 | +1 | Явная | $2 000 H |\n| Ударная куртка | 12 | 14 | 8 | 1 | +1 | Явная | $1 000 |\n\n\n| **Бронекостюмы** | | | | | | | |\n|---|---|---|---|---|---|---|---|\n| Лёгкий бронекостюм | 16 | 13 | 5 | 2 | +2 | Явная | $5 000@ |\n| Средний бронекостюм | 18 | 14 | 10 | 3 | +2 | Явная | $10 000@ |\n| Тяжёлый бронекостюм | 20 | 18 | 15 | 3 | +3 | Явная | $20 000@ H |\n\n\n| **Аксессуары брони** | | | | | | | |\n|---|---|---|---|---|---|---|---|\n| Штурмовой щит | +2 | +4 | 0 | 2 | 0 | Явная | $1 000 |\n| Поглощающие пластины | +2 | +2 | 3 | 1 | 0 | Явная | $500 H, NS |\n| Укрепление сочленений | +1 | +1 | 0 | 0 | 0 | Скрытая | $250 H, NS |\n| Устаревшая техника | -1d2 | -1d2 | -1d4 | 0 | 0 | – | ×50% |\n\n@: Эту броню можно купить только через подходящий Контакт или по какой-то другой особой возможности\nH: Броня или аксессуар даёт -1 ко всем проверкам Скрытности и Атлетики. Несколько тяжёлых предметов складываются.\nNS: Этот аксессуар нельзя добавить к бронекостюму.\n\n\n**Бронированная одежда:** Громоздкие пластины и тяжёлые баллистические плетения этого костюма замаскированы под драпировку и элементы моды.\n**Тяжёлый бронекостюм:** Костюм с головы до пят из сцепленных пластин и блоков поглощения удара; такие оставляют для элитных групп реагирования и военных операций.\n**Ударная куртка:** Эти куртки созданы, чтобы держать удары в контактных видах спорта, экстремальном спорте и неуправляемых гонках, и обычно идут как часть полного защитного комплекта.\n**Лёгкий бронекостюм:** Обычные правоохранители и охранники носят именно такие костюмы, как правило с яркой символикой своей корпы.\n**Средний бронекостюм:** Серьёзная охрана обычно щеголяет бронёй этого уровня, включая полицейские группы быстрого реагирования.\n**Обычная одежда:** Некоторые смельчаки, нищие или особо модные люди до сих пор упорно носят одежду, которая как броня не работает вообще.\n**Плащ с пластинами:** Плащ, роба или мантия до пят служит основой для множества укреплённых пластин и полос баллистического плетения. Он тяжёлый, громоздкий и наглядный, но держит очень много.\n**Укреплённая одежда:** Незаметные полимерные листы и укреплённые плетения дают этой одежде минимум защиты, не жертвуя вкусом.\n**Укреплённый плащ:** Длинная свободная одежда усилена продвинутыми тканями и скрытно размещёнными поглощающими пластинами, и всё это по-прежнему можно не признавать бронёй.\n**Уличная кожа:** Модная, агрессивная и часто разномастная «уличная кожа» редко содержит хоть что-то из настоящей кожи, но достаточно легка и удобна, чтобы носить её постоянно.\n**Боевая сбруя:** Улучшенная версия уличной кожи: в таких костюмах отброшена всякая скромность в пользу любых баллистических пластин и продвинутых полимерных плетений, какие хозяин смог пришить или прикрутить. Обычно это лучшая броня, какую могут себе позволить местные банды и обычные бандиты."},
{"n":"3.3.1","l":3,"te":"Armor Terms and Definitions","tr":"Термины и определения брони","en":"Ranged AC: The Armor Class target for ranged attacks against the wearer. Both ranged and melee AC is always modified by the target's Dexterity mod.\nMelee AC:  The Armor Class target for melee attacks against the wearer.\nDamage Soak: The amount of hit point damage the armor can absorb before allowing damage through to the wearer. Damage Soak cannot protect against injury that armor could not normally lessen. Damage Soak ablates during combat and refreshes to full after each fight.\nEncumbrance: The number of encumbrance points the armor adds. Armor must be Readied to be useful.\nTrauma Target Mod: This modifier is added to the wearer's Trauma Target for purposes of determining Traumatic Hits. A normal human's base unarmored Trauma Target is 6.\nObviousness: Subtle armor can pass for ordinary streetwear and can be worn in polite social circumstances without drawing remark. Obvious armor is clearly intended for combat and will make onlookers think the wearer is expecting imminent trouble.\nCost: The usual price for the armor through its normally-accessible channels. Some armor is restricted for public sale and will require an appropriate Contact to buy or some mission-generated opportunity.","ru":"**КЗщ дальнего боя:** Класс защиты — порог для атак на расстоянии против носителя. И КЗщ дальнего боя, и КЗщ ближнего боя всегда меняются на модификатор Ловкости цели.\n**КЗщ ближнего боя:** Класс защиты — порог для атак в ближнем бою против носителя.\n**Поглощение урона:** Сколько урона в пунктах здоровья броня впитывает, прежде чем урон начнёт проходить к носителю. Поглощение урона не защищает от вреда, который броня в принципе не может уменьшить. Поглощение урона расходуется в течение боя и полностью восстанавливается после каждой схватки.\n**Загруженность:** Сколько пунктов загруженности добавляет броня. Броня должна быть в готовности, чтобы от неё был толк.\n**Модификатор Порога травмы:** Этот модификатор добавляется к Порогу травмы носителя при определении Травматичных попаданий. Базовый Порог травмы обычного человека без брони — 6.\n**Заметность:** Скрытую броню можно принять за обычную уличную одежду, и её можно носить в приличном обществе, не вызывая пересудов. Явная броня очевидно предназначена для боя, и окружающие решат, что носитель ждёт неприятностей в любую минуту.\n**Цена:** Обычная цена брони через нормально доступные каналы. Часть брони ограничена в свободной продаже и потребует подходящего Контакта для покупки или какой-то возможности, возникшей на миссии."},
{"n":"3.3.2","l":3,"te":"Armor Accessories","tr":"Аксессуары брони","en":"Some armor can be enhanced with additional protection such as absorption plates or joint reinforcement.  These additions may increase the armor's bulk or obviousness, but they also improve the armor's AC or damage soak. A given accessory can only be applied once to any set of armor. Armor accessories cannot be modded with armor mods.\nThe three types of suit armor listed on the table above are built as cohesive systems, and cannot accept these accessories. A riot shield can still be used while wearing a suit, however.\n\n\nRiot Shield: These bulky, transparent shields are most effective in fending off melee attackers. They must be Readied in one hand; users with multiple cyberarms can benefit from only one shield at a time. A shield negates the first melee Shock damage a bearer takes in a round.\nAbsorption Plates: Additional impact-absorbing buffer plates are added to the armor. Their bulk inflicts a -1 penalty to the user’s Sneak and Exert checks.\nJoint Reinforcement: The weak points around limb joints are reinforced with extra layers of weave. The extra weave hinders movement, and applies a -1 penalty to the wearer’s Sneak and Exert checks.","ru":"Часть брони можно усилить дополнительной защитой — например, поглощающими пластинами или укреплением сочленений. Такие добавки могут увеличить объём или заметность брони, но зато улучшают её КЗщ или поглощение урона. Один и тот же аксессуар можно поставить на комплект брони только один раз. Аксессуары брони нельзя модифицировать модами брони.\nТри типа бронекостюмов из таблицы выше собраны как единые системы и такие аксессуары не принимают. Штурмовым щитом при этом можно пользоваться и в костюме.\n\n\n**Штурмовой щит:** Эти громоздкие прозрачные щиты лучше всего отбивают атакующих в ближнем бою. Их надо держать в готовности в одной руке; тому, у кого несколько кибер-рук, одновременно помогает только один щит. Щит сводит на нет первый Шок-урон в ближнем бою, который носитель получает за раунд.\n**Поглощающие пластины:** К броне добавляются дополнительные буферные пластины, гасящие удар. Их объём даёт -1 к проверкам Скрытности и Атлетики пользователя.\n**Укрепление сочленений:** Слабые места вокруг суставов усилены дополнительными слоями плетения. Лишнее плетение стесняет движения и даёт -1 к проверкам Скрытности и Атлетики носителя."},
{"n":"3.3.3","l":3,"te":"Obsolete Armor Tech","tr":"Устаревшая техника брони","en":"Bargains can be had for last year’s fashions, whether in armor or accessories. Such items cost only half as much as usual, but suffer a 1d2 penalty to both their ranged and Melee ACs, down to a minimum of AC 10. They also absorb 1d4 fewer Damage Soak, to a minimum of 0. These dice are only rolled after the obsolete armor has been purchased, so the buyer won't know exactly what they have until they try to fit it to an outfit.","ru":"Прошлогоднюю моду можно взять по дешёвке — что в броне, что в аксессуарах. Такие вещи стоят вдвое меньше обычного, но получают штраф 1d2 к обоим своим КЗщ, дальнего и ближнего боя, вплоть до минимума КЗщ 10. Ещё они поглощают на 1d4 урона меньше, до минимума 0. Эти кости бросают только после покупки устаревшей брони, так что покупатель не узнает, что именно ему досталось, пока не начнёт подгонять её к костюму."},
{"n":"3.3.4","l":3,"te":"Armor Mods","tr":"Моды брони","en":"The mods listed here can be applied to armor by a tech with the listed skill level at the given costs, as explained in section 2.8.2. Some require a certain number of units of special technology as well as ordinary parts. Unless specified otherwise, a given mod can be applied only once to an item.\n\n\nMod                        Skill        Cost                Special Tech\nAbsorption Pads        Fix-2        $2,000                0\nActive Response        Fix-3        $20,000        2\nBiostabilizing                Fix-1        $2,500                0\nCustomized                Fix-1        $1,000                0\nDiscreet Design        Fix-2        $5,000                1\nFlexible                Fix-2        $10,000        1\nQuickchange                Fix-1        $1,000                0\nSealed                        Fix-1        $2,500                0\nTailored Rig                Fix-1        $2,000                0\nTrauma Dampers        Fix-3        $10,000        1\nWhisperlight                Fix-2        $10,000        1\n\n\nAbsorption Pads: Kinetic padding is added to the armor, granting it 5 more hit points of damage soak per fight.\nActive Response: The armor has hyper-advanced reactive defenses that deflect and mitigate otherwise-critical injuries. Increase the wearer’s Trauma Target by 1. This stacks with any existing Trauma Target bonus the armor may already confer on the wearer.\nBiostabilizing: An integral biostatus monitor triggers emergency trauma drugs when the wearer is Mortally Wounded. As an Instant action, they roll 2d6+2 versus difficulty 8 to stabilize. Only one such attempt can be made before the suit needs an hour to recalibrate.\nCustomized: The armor is tailored to a specific wearer, granting them a +1 bonus to both ranged and melee AC while it’s worn.\nDiscreet Design: The armor is carefully tailored and adjusted to be less imposing. Obvious armor is made Subtle by this mod, though it suffers a -2 penalty to its ranged and melee AC. The armor retains its original bulk, but its lines, drapes, and fabrics now appear to be particularly voluminous fashion couture rather than protective equipment.\nFlexible: Bulky armor is carefully cut and tailored to allow a wearer the optimal range of movement. The Heavy quality of a suit of armor is removed.\nQuickchange: The armor or clothing is designed with chroma-shifting fabrics, bi-facial texture panels, and removable accessories. As a Main Action, the wearer can shift its appearance to that of a different type of clothing or armor with the same level of obviousness. The details of this alternate appearance can be set with an hour of adjustment.\nSealed: The armor is equipped with a concealed filter hood and temporary pressure gaskets. As a Main Action, the user can seal the clothing against the external atmosphere, rendering them immune to gases and contact toxins. The seal and its integral air supply last 30 minutes, after which an hour of cleaning and purging will be needed to refresh the system.\nTailored Rig: Pouches, attachment points, holsters, and other rigging are designed for a particular wearer’s body contours. They gain 1 point of Readied Encumbrance and 2 points of Stowed Encumbrance added to their maximum. These items are clearly visible to others, however, and cannot be concealed.\nTrauma Dampers: This mod can only be installed after Absorption Pads are in place. Once fully engineered, they add 5 additional hit points of damage soak per fight.\nWhisperlight: The armor’s bulk is cut down and conventional materials are replaced with more advanced composites. The armor’s Encumbrance decreases by 1 point.","ru":"Перечисленные здесь моды тех может поставить на броню при указанном уровне навыка и по указанной цене, как описано в разделе 2.8.2. Некоторым нужно ещё определённое число единиц особой техники вдобавок к обычным деталям. Если не сказано иное, каждый мод можно поставить на предмет только один раз.\n\n\n| Мод | Навык | Цена | Особые компоненты |\n|---|---|---|---|\n| Поглощающие накладки | Ремонт-2 | $2 000 | 0 |\n| Активный отклик | Ремонт-3 | $20 000 | 2 |\n| Биостабилизация | Ремонт-1 | $2 500 | 0 |\n| Индивидуальная подгонка | Ремонт-1 | $1 000 | 0 |\n| Незаметный дизайн | Ремонт-2 | $5 000 | 1 |\n| Гибкая | Ремонт-2 | $10 000 | 1 |\n| Быстрая смена | Ремонт-1 | $1 000 | 0 |\n| Герметичная | Ремонт-1 | $2 500 | 0 |\n| Подогнанная оснастка | Ремонт-1 | $2 000 | 0 |\n| Гасители травм | Ремонт-3 | $10 000 | 1 |\n| Шёпот-лёгкость | Ремонт-2 | $10 000 | 1 |\n\n\n**Поглощающие накладки:** К броне добавляется кинетическая набивка, дающая ей ещё 5 пунктов здоровья поглощения урона за схватку.\n**Активный отклик:** У брони есть сверхпродвинутая реактивная защита, которая отводит и смягчает ранения, иначе ставшие бы критическими. Увеличь Порог травмы носителя на 1. Это складывается с любым бонусом к Порогу травмы, который броня уже даёт носителю.\n**Биостабилизация:** Встроенный монитор биосостояния впрыскивает экстренные противотравматические препараты, когда носитель смертельно раненный. Мгновенным действием он бросает 2d6+2 против сложности 8, чтобы стабилизироваться. Такая попытка возможна только одна, дальше костюму нужен час на перекалибровку.\n**Индивидуальная подгонка:** Броня подогнана под конкретного носителя и даёт ему +1 к КЗщ и дальнего, и ближнего боя, пока надета.\n**Незаметный дизайн:** Броня тщательно скроена и подогнана, чтобы выглядеть менее угрожающе. Этот мод делает Явную броню Скрытой, но она получает штраф -2 к своим КЗщ дальнего и ближнего боя. Объём брони не меняется, но её линии, драпировки и ткани теперь выглядят как особо объёмная высокая мода, а не как защитное снаряжение.\n**Гибкая:** Громоздкая броня аккуратно скроена и подогнана, чтобы дать носителю оптимальную свободу движений. Свойство «Тяжёлая» у брони убирается.\n**Быстрая смена:** Броня или одежда сделана из хромосдвигающихся тканей, двусторонних текстурных панелей и съёмных аксессуаров. Основным действием носитель может сменить её вид на вид другого типа одежды или брони с той же заметностью. Детали этого альтернативного облика задаются за час подгонки.\n**Герметичная:** Броня оснащена скрытым фильтрующим капюшоном и временными герметизирующими прокладками. Основным действием пользователь может загерметизировать одежду от внешней атмосферы, став неуязвимым к газам и контактным токсинам. Герметизации и встроенного запаса воздуха хватает на 30 минут, после чего системе нужен час чистки и продувки.\n**Подогнанная оснастка:** Подсумки, точки крепления, кобуры и прочая оснастка сделаны под контуры тела конкретного носителя. Максимум носителя растёт на 1 пункт Загруженности в готовности и на 2 пункта Загруженности в укладке. Правда, такие вещи хорошо заметны окружающим и не скрываются.\n**Гасители травм:** Этот мод можно поставить только после того, как установлены Поглощающие накладки. После полной доводки они дают ещё 5 пунктов здоровья поглощения урона за схватку.\n**Шёпот-лёгкость:** Объём брони урезан, а обычные материалы заменены более продвинутыми композитами. Загруженность брони уменьшается на 1 пункт."},
{"n":"3.4.0","l":2,"te":"Weapons","tr":"Оружие","en":"Operators favor a wide variety of implements of destruction. The ones listed below are only some of the most common.","ru":"Операторы любят самые разные орудия разрушения. Ниже перечислены лишь некоторые из самых распространённых."},
{"n":"3.4.1","l":3,"te":"Weapon Stats and Definitions","tr":"Статы и определения оружия","en":"Dmg is the die it rolls for hit point damage on a successful hit. This damage is always increased by the weapon’s relevant attribute modifier, and it may be further boosted by certain Foci or mods.\nRange is expressed in meters for guns and thrown weapons, with a normal range and an extreme range. Attacks beyond normal range take a -2 hit penalty.\nCost is the average street cost for the weapon.\nShock applies only to melee weapons. If the target’s melee AC is equal or less than the weapon’s Shock rating, the target takes the listed Shock damage even if the attack misses. Shock damage is modified by the weapon’s attribute modifier and any damage bonuses that explicitly add to Shock.\nMag is the number of rounds in a loaded firearm. Each attack costs one round, while using a weapon in burst fire mode costs three. Reloading a weapon is usually a Main Action.\nAttr is the attribute that modifies the weapon’s hit and damage roll. If two attributes are listed, you can use whichever one has the better modifier.\nEncumbrance is the number of items of encumbrance the weapon takes up. Weapons must be Readied to use them; if not, the attacker must spend a Main Action getting them ready for employment.\nTrauma Die is the die rolled when a lethal weapon hits. If it’s equal or higher than the target’s Trauma Target, which is usually 6, the victim takes a Traumatic Hit. Non-lethal weapons and attacks do not roll the Trauma Die.\nTrauma Rating is the multiplier applied to a weapon's total damage when it makes a Traumatic Hit.","ru":"Урон — кость, которую бросают на урон в пунктах здоровья при успешном попадании. К этому урону всегда добавляется модификатор соответствующей характеристики оружия, а некоторые Фокусы и моды могут поднять его ещё выше.\nДистанция для стрелкового и метательного оружия указана в метрах: обычная и дальняя. Атаки дальше обычной дистанции получают -2 к попаданию.\nЦена — средняя уличная цена оружия.\nШок применяется только к оружию ближнего боя. Если КЗщ ближнего боя цели равен значению Шока оружия или меньше, цель получает указанный урон Шока, даже если атака промахнулась. Урон Шока изменяется модификатором характеристики оружия и любыми бонусами к урону, которые явно добавляются к Шоку.\nМаг — количество патронов в заряженном огнестрельном оружии. Каждая атака расходует один патрон, а стрельба очередью — три. Перезарядка оружия обычно требует Основного действия.\nХар. — характеристика, которая изменяет броски попадания и урона оружия. Если указаны две характеристики, используй ту, у которой модификатор лучше.\nЗагруженность — сколько единиц загруженности занимает оружие. Чтобы применить оружие, оно должно быть в готовности; иначе атакующий сначала тратит Основное действие, чтобы привести его в боевое положение.\nКость травмы — кость, которую бросают при попадании летальным оружием. Если результат равен Порогу травмы цели (обычно 6) или выше, жертва получает Травматичное попадание. Нелетальное оружие и нелетальные атаки Кость травмы не бросают.\nМножитель травмы — множитель, который применяют к суммарному урону оружия при Травматичном попадании."},
{"n":"3.4.1.1","l":4,"te":"Burst Firing","tr":"Стрельба очередью","en":"Some firearms can fire in bursts. Such attacks use up three rounds of ammunition and add +2 to the weapon's hit roll and damage die.","ru":"Часть огнестрельного оружия умеет стрелять очередями. Такие атаки расходуют три патрона и дают +2 к броску попадания и к кости урона."},
{"n":"3.4.1.2","l":4,"te":"Suppressive Fire","tr":"Подавляющий огонь","en":"If a weapon can fire to suppress, the wielder may do so as a Main Action. Each round of suppressive fire costs twice the usual ammo.\nThe attacker picks a 90-degree cone and fills it with lead. Any targets within the weapon’s normal range who are not behind hard cover must make an Evasion save or take half the weapon’s damage, rounded up. The attacker rolls the weapon’s Trauma Die individually against each victim struck, and may inflict Traumatic Hits with this damage.","ru":"Если оружие может стрелять на подавление, владелец делает это Основным действием. Каждый раунд подавляющего огня расходует вдвое больше патронов, чем обычно.\nАтакующий выбирает конус в 90 градусов и заливает его свинцом. Все цели в пределах обычной дистанции оружия, которые не сидят за твёрдым укрытием, должны сделать спасброск Уклонения или получить половину урона оружия с округлением вверх. Атакующий бросает Кость травмы оружия отдельно против каждой поражённой жертвы и может нанести этим уроном Травматичные попадания."},
{"n":"3.4.1.3","l":4,"te":"Grenade Weapons","tr":"Гранатное оружие","en":"Grenades may be thrown at a point within range and always target AC 10. On a miss, the grenade bounces 1d10 meters in a random direction before exploding. Most grenades have a 5-meter radius of effect.","ru":"Гранату можно бросить в точку в пределах дистанции, и целью всегда считается КЗщ 10. При промахе граната отскакивает на 1d10 метров в случайном направлении и лишь потом взрывается. У большинства гранат радиус действия 5 метров."},
{"n":"3.4.2","l":3,"te":"Firearms","tr":"Огнестрельное оружие","en":"Firearm                Dmg        Range        Cost                Mag        Attr.        Enc.        TD        TR\nLight Pistol                1d6        10/80        $200                15        Dex        1        1d8        x2\nHeavy Pistol                1d8        10/100        $200                8        Dex        1        1d6        x3\nAdvanced Bow        1d8        30/200        $500                1§        Dex        2        1d8+1        x3\nRifle                        1d10+2 200/400 $1,000        6        Dex        2        1d8        x3\nCombat Rifle                1d12*        100/300 $2,500@        30        Dex        2        1d8        x3\nSubmachine Gun        1d8*        30/100        $2,000@        20        Dex        1        1d6        x2\nShotgun                3d4        10/30        $200                2        Dex        2        1d10        x3\nSemi-Auto Shotgun        3d4        10/30        $1,000                6        Dex        2        1d10        x3\nCombat Shotgun        3d4*        10/30        $3,000@        12        Dex        2        1d10        x3\nSniper Rifle¶                2d8        1,000/2,000 $3,000        1§        Dex        2        1d10        x4\nTaser Pistol                1d8        10/15        $500                2        Dex        1        -        -\nAutomatic Rifle        2d8#        200/400 $10,000@        10        Dex        4        1d10        x3\n*: This weapon may use burst fire when attacking, firing three rounds to gain +2 to hit and damage rolls.\n§: This weapon can be reloaded with a Move action, or an On Turn if the user has at least Shoot-1 skill\n¶: If not fired from a stationary rest, this weapon’s statistics are the same as a regular rifle\n@: This weapon requires an applicable Contact to buy, being generally illegal for open sale\n#: This weapon can fire to suppress if braced against a solid support or the gunner is prone\n\n\nLight and heavy pistols are categorized by the caliber of the bullet they fire. Some operators prefer the low recoil and high mag capacity possible with a low-caliber round, while others like to have a little more certainty in dropping the targets they hit.\nAdvanced bows are used by a few specialists who prefer the near-silence that modern composites provide or the massive blood loss induced by a modern fractal broadhead carried on a fifty-gram arrow.\nRifles and combat rifles are similar semi-automatic tech, though the latter is equipped with a burst-fire selector and usually trades the range of a heavier caliber for the ability to carry more ammunition.\nSubmachine guns are popular for their small form factor and convenient burst fire, though like other burst-fire weaponry the corps frown heavily on civilian possession.\nShotguns of various stripes can be found under the counter of practically every bar and shop in a slum. Simple double-barrel models can be made by any home gunsmith with a pulse, but the finer tolerances and more elaborate machining of a burst-fire capable combat shotgun leaves them as a more selective product. Ranges and damages given are for shot shells; slugs double their normal and extreme ranges but apply a -1 penalty to hit rolls.\nSniper rifles are often nothing more than bolt-action rifles with expensive tuning and optics. If not fired from a rest in a prepared position, a sniper rifle’s statistics are the same as a normal rifle.\nTaser pistols cover a family of ranged non-lethal weapons small and light enough to carry concealed. Most rely on tried-and-true electrical shocks to drop a target; they inflict non-lethal hit point damage and cannot make Traumatic Hits.\nAutomatic rifles include a large range of barely man-portable firearms designed to hurl vast amounts of lead through the air, and unlike smaller firearms, they can use suppressive fire if properly braced. Ammunition for these guns comes in belts or boxes. The mag rating reflects how many rounds the weapon can fire before needing a refill, with each “round” costing $50 worth of ammunition. The compactness of their loaded magazines still only counts as one item, however.","ru":"| Оружие | Урон | Дист. | Цена | Маг | Хар. | Загр. | КТ | МТ |\n|---|---|---|---|---|---|---|---|---|\n| Лёгкий пистолет | 1d6 | 10/80 | $200 | 15 | Лов | 1 | 1d8 | ×2 |\n| Тяжёлый пистолет | 1d8 | 10/100 | $200 | 8 | Лов | 1 | 1d6 | ×3 |\n| Продвинутый лук | 1d8 | 30/200 | $500 | 1§ | Лов | 2 | 1d8+1 | ×3 |\n| Винтовка | 1d10+2 | 200/400 | $1 000 | 6 | Лов | 2 | 1d8 | ×3 |\n| Боевая винтовка | 1d12* | 100/300 | $2 500@ | 30 | Лов | 2 | 1d8 | ×3 |\n| Пистолет-пулемёт | 1d8* | 30/100 | $2 000@ | 20 | Лов | 1 | 1d6 | ×2 |\n| Дробовик | 3d4 | 10/30 | $200 | 2 | Лов | 2 | 1d10 | ×3 |\n| Самозарядный дробовик | 3d4 | 10/30 | $1 000 | 6 | Лов | 2 | 1d10 | ×3 |\n| Боевой дробовик | 3d4* | 10/30 | $3 000@ | 12 | Лов | 2 | 1d10 | ×3 |\n| Снайперская винтовка¶ | 2d8 | 1000/2000 | $3 000 | 1§ | Лов | 2 | 1d10 | ×4 |\n| Тазер-пистолет | 1d8 | 10/15 | $500 | 2 | Лов | 1 | – | – |\n| Автоматическая винтовка | 2d8# | 200/400 | $10 000@ | 10 | Лов | 4 | 1d10 | ×3 |\n\n*: Это оружие может атаковать очередью, выпуская три патрона ради +2 к броскам попадания и урона.\n§: Это оружие перезаряжается Действием перемещения или Действием в свой ход, если у владельца есть навык Стрельба-1 или выше\n¶: Если стрелять не с неподвижной опоры, характеристики этого оружия такие же, как у обычной винтовки\n@: Для покупки этого оружия нужен подходящий Контакт — в открытой продаже оно, как правило, незаконно\n#: Это оружие может стрелять на подавление, если упёрто в твёрдую опору или стрелок лежит\n\n\nЛёгкие и тяжёлые пистолеты различают по калибру патрона. Одни операторы предпочитают слабую отдачу и вместительный магазин, которые даёт малый калибр, другим хочется чуть больше уверенности, что цель, в которую они попали, упадёт.\nПродвинутые луки в ходу у немногих специалистов, которым нужна почти полная тишина современных композитов или обильная кровопотеря от фрактального широкого наконечника на пятидесятиграммовой стреле.\nВинтовки и боевые винтовки — схожая самозарядная техника, только у вторых есть переключатель стрельбы очередью, и они обычно жертвуют дальностью более тяжёлого калибра ради большего запаса патронов.\nПистолеты-пулемёты любят за компактность и удобную стрельбу очередью, хотя, как и на прочее оружие с очередью, корпы смотрят на них крайне косо, если оно в руках гражданского.\nДробовики всех сортов лежат под прилавком практически каждого бара и магазина в трущобах. Простую двустволку соберёт любой домашний оружейник, у которого есть пульс, но точные допуски и сложная обработка боевого дробовика со стрельбой очередью делают его товаром более штучным. Указанные дистанции и урон даны для дробовых патронов; пулевые удваивают обычную и дальнюю дистанции, но дают -1 к броскам попадания.\nСнайперская винтовка часто — не более чем винтовка с ручной перезарядкой, дорогой настройкой и оптикой. Если стрелять не с опоры на подготовленной позиции, характеристики снайперской винтовки такие же, как у обычной винтовки.\nТазер-пистолеты — это целое семейство нелетального дальнобойного оружия, достаточно мелкого и лёгкого, чтобы носить скрытно. Большинство валит цель проверенным электрическим разрядом; они наносят нелетальный урон пунктам здоровья и не могут нанести Травматичное попадание.\nАвтоматические винтовки — обширный класс еле переносимого вручную огнестрела, созданного, чтобы выбрасывать в воздух огромные объёмы свинца, и, в отличие от более мелкого оружия, они могут вести подавляющий огонь, если их правильно упереть. Патроны к ним идут в лентах или коробках. Значение магазина показывает, сколько выстрелов оружие сделает до пополнения, и каждый «выстрел» стоит $50 в патронах. При этом компактность заряженных магазинов всё равно считается лишь за один предмет."},
{"n":"3.4.3","l":3,"te":"Melee and Thrown Weapons","tr":"Оружие ближнего боя и метательное оружие","en":"Virtually every ganger or thug has at least a knife on their person. The quality of such weapons can vary from bits of curb-sharpened metal to the latest monomolecular-edge fighting knives.\n\n\nWeapon                Dmg        Rng.        Cost        Shock                Attr.                Enc.        TD        TR\nUnarmed Attack        1d2^        -        -        -                Str/Dex        -        1d6        x1\nKnife                        1d4        10/20        $20        1/AC 15        Str/Dex        1        1d6        x3\nClub                        1d4^        10/20        N/A        1/AC 18        Str                1        1d6        x2\nSpear                        1d6        10/20        $50        2/AC 13        Str/Dex        1        1d8        x3\nSword                        1d8        -        $200        2/AC 13        Str/Dex        1        1d8        x2\nBig Sword                2d6        -        $500        2/AC 15        Str                2*        1d8        x3\nBig Club                1d10^        -        $100        2/AC 18        Str                2*        1d8        x3\nAdvanced Knife        1d6        10/20        $200        2/AC 15        Str/Dex        1        1d8        x3\nAdvanced Sword        1d10        -        $1,000        3/AC 15        Str/Dex        1        1d8        x3\nAdvanced Big Sword        2d8        -        $2,500        4/AC 15        Str                2*        1d8        x3\nAdvanced Club        1d8^        -        $500        2/AC 18        Str                1        1d8        x3\nGrenade, Flash        Spec.        10/30        $50        None                Dex                1        -        -\nGrenade, Frag                2d6        10/30        $100@        None                Dex                1        1d8        x2\nGrenade, Gas                1d10^        10/30        $50        None                Dex                1        -        -\nGrenade, Smoke        -        10/30        $25        None                Dex                1        -        -\n^: This weapon’s damage is always non-lethal, unless desired otherwise. Non-lethal hits don’t roll the Trauma Die.\n*: This is a two-handed weapon, making it impossible to have a Readied item in the user’s off-hand\n@: This weapon requires an applicable Contact to buy, being generally illegal for open sale\n\n\nKnives, clubs, swords, and other simple melee weapons are available almost anywhere on the street. Particularly impoverished gangers sometimes fashion makeshift machetes and improvised shivs when better can’t be obtained. Such weapons are effectively free, but have a -1 penalty to hit and damage rolls due to their ungainly make.\nAdvanced weapons employ modern polymers, sophisticated metallurgy, fractal edges, electro-stun tech, and a small legion of marketers to sell products that are distinctly superior to the plain steel edges of a prior age. \nFlash grenades force victims without eye and ear protection to make a Physical save; on a failure, the victim loses their next Main Action and takes a -2 penalty to hit rolls and AC for the next 1d6 rounds. Flashbang effects don’t stack, and a target who makes their save cannot be flashbanged again that same round.\nFrag grenades inflict 2d6 damage on all victims in range, plus the chance for a Traumatic Hit. An Evasion save can halve a frag grenade’s damage, and each point of melee AC the target has above 14 reduces the final damage total by one point, possibly down to zero.\nGas grenades create a 10-meter-diameter cloud of opaque, choking, irritating gas that disperses in one round. They inflict non-lethal damage, halved on a successful Physical save, and are useless against targets with breathing protection. They provide full concealment for those within the gas. Smoke grenades are harmless, but provide the same 10-meter dome of concealment where it’s necessary. Gas and smoke aren’t enough to defeat IR or augmented visuals.","ru":"Почти у каждого бандита или хулигана есть при себе хотя бы нож. Качество такого оружия бывает разным: от заточенного о бордюр куска металла до новейших боевых ножей с мономолекулярной кромкой.\n\n\n| Оружие | Урон | Дист. | Цена | Шок | Хар. | Загр. | КТ | МТ |\n|---|---|---|---|---|---|---|---|---|\n| Безоружная атака | 1d2^ | – | – | – | Сил/Лов | – | 1d6 | ×1 |\n| Нож | 1d4 | 10/20 | $20 | 1/КЗщ 15 | Сил/Лов | 1 | 1d6 | ×3 |\n| Дубина | 1d4^ | 10/20 | Н/Д | 1/КЗщ 18 | Сил | 1 | 1d6 | ×2 |\n| Копьё | 1d6 | 10/20 | $50 | 2/КЗщ 13 | Сил/Лов | 1 | 1d8 | ×3 |\n| Меч | 1d8 | – | $200 | 2/КЗщ 13 | Сил/Лов | 1 | 1d8 | ×2 |\n| Большой меч | 2d6 | – | $500 | 2/КЗщ 15 | Сил | 2* | 1d8 | ×3 |\n| Большая дубина | 1d10^ | – | $100 | 2/КЗщ 18 | Сил | 2* | 1d8 | ×3 |\n| Продвинутый нож | 1d6 | 10/20 | $200 | 2/КЗщ 15 | Сил/Лов | 1 | 1d8 | ×3 |\n| Продвинутый меч | 1d10 | – | $1 000 | 3/КЗщ 15 | Сил/Лов | 1 | 1d8 | ×3 |\n| Продвинутый большой меч | 2d8 | – | $2 500 | 4/КЗщ 15 | Сил | 2* | 1d8 | ×3 |\n| Продвинутая дубина | 1d8^ | – | $500 | 2/КЗщ 18 | Сил | 1 | 1d8 | ×3 |\n| Граната, светошумовая | Особ. | 10/30 | $50 | Нет | Лов | 1 | – | – |\n| Граната, осколочная | 2d6 | 10/30 | $100@ | Нет | Лов | 1 | 1d8 | ×2 |\n| Граната, газовая | 1d10^ | 10/30 | $50 | Нет | Лов | 1 | – | – |\n| Граната, дымовая | – | 10/30 | $25 | Нет | Лов | 1 | – | – |\n\n^: Урон этого оружия всегда нелетальный, если владелец не хочет иначе. При нелетальных попаданиях Кость травмы не бросается.\n*: Это двуручное оружие, поэтому держать предмет в готовности в свободной руке невозможно\n@: Для покупки этого оружия нужен подходящий Контакт — в открытой продаже оно, как правило, незаконно\n\n\nНожи, дубины, мечи и другое простое оружие ближнего боя достают почти на любой улице. Совсем нищие бандиты порой мастерят самодельные мачете и заточки, когда лучшего не найти. Такое оружие фактически бесплатно, но из-за неуклюжего исполнения даёт -1 к броскам попадания и урона.\nПродвинутое оружие использует современные полимеры, изощрённую металлургию, фрактальные кромки, электрошоковую технику и небольшой легион маркетологов, чтобы продавать изделия, явно превосходящие простую сталь прошлой эпохи.\nСветошумовые гранаты заставляют жертв без защиты глаз и слуха сделать Физический спасброск; при провале жертва теряет следующее Основное действие и получает -2 к броскам попадания и к КЗщ на следующие 1d6 раундов. Эффекты светошумовых не складываются, а цель, прошедшая спасброск, не может быть оглушена светошумовой снова в том же раунде.\nОсколочные гранаты наносят 2d6 урона всем жертвам в радиусе плюс дают шанс на Травматичное попадание. Спасброск Уклонения уменьшает урон осколочной гранаты вдвое, а каждый пункт КЗщ ближнего боя цели выше 14 снижает итоговый урон на один пункт, возможно, вплоть до нуля.\nГазовые гранаты создают облако непрозрачного, душащего, разъедающего газа диаметром 10 метров, которое рассеивается за один раунд. Они наносят нелетальный урон, уменьшенный вдвое при успешном Физическом спасброске, и бесполезны против целей с защитой дыхания. Тем, кто внутри газа, они дают полную маскировку. Дымовые гранаты безвредны, но дают такой же 10-метровый купол маскировки там, где он нужен. Газа и дыма не хватит, чтобы обмануть ИК или аугментированное зрение."},
{"n":"3.4.4","l":3,"te":"Heavy Weapons","tr":"Тяжёлое оружие","en":"While uncommon, some operators may be unfortunate enough to run into military opposition or antagonists who have no concerns about drawing intolerable heat from the local authorities. These combatants are likely to pack weaponry much heavier than a normal street operative would sport. For operators, using weapons like the ones below on most missions would risk perilously intense reprisals by worried corps and local police.\n\n\nHeavy Weapon        Dmg        Range        Cost                Mag        Attr        Enc        TD        TR\nAnti-Materiel Rifle ¶        3d8!        1K/2K        $8,000@        5        Dex        3        1d12        x3\nGrnd. Launcher        Gren.        150/350 $3,000@        3        Dex        1        -        -\nDemo Charge                3d10!        20/20        $1,000@        -        -        1        1d10        x3\nHvy Machine Gun ¶        3d6#!        500/2K        $10K@        10        Dex        3        1d12        x3\nMortar                        3d6        1K/2K        $5,000@        1        Wis        3        1d12        x3\nRocket Launcher        3d10!        2K/4K        $5,000@        -        Dex        2        1d10        x3\nLand Mine, Anti-Pers.        1d8        -        $150@        -        -        1        1d10        x3\nLand Mine, Anti-Vehc.        3d8!        -        $1,000@        -        -        2        1d20        x3\n@: This weapon requires an applicable Contact to buy, being generally illegal for open sale\n¶: If not fired from a stationary rest, this weapon’s statistics are the same as a regular rifle\n#: This weapon can fire to suppress if fixed to a vehicle or stationary firing position\n!: This weapon’s Trauma Die can inflict Traumatic Hits on drones, vehicles, and other machines.\n\n\nAnti-materiel rifles have encountered something of a renaissance with the ubiquity of armored drones and heavily cybered combatants. While not suitable for downing tanks or other heavily armored vehicles, their 20mm rounds are more than sufficient to punch through lighter armor plating, concrete walls, and full body conversion cyborgs. Use of a secure firing rest is recommended for best results.\nGrenade launchers are accessories that are mounted on rifle-sized firearms, adding 1 Encumbrance to their bulk. These weapons can launch specially-designed grenades to the listed range, targeting them as if they were thrown normally. These special grenades cost and function the same as their regular equivalents but cannot be thrown by hand. When attacking, the user can choose whether to fire the grenade launcher or the weapon it’s mounted to, but both cannot be fired in the same round.\nStand-alone grenade launcher models are available for vehicle or drone mounting, counting as 2 Encumbrance but otherwise having the same cost and statistics.\nDemo charges are shaped explosive charges usually meant to knock human-sized holes in anything short of fortified defensive walls. While ineffective as thrown weapons, when used as part of a trap or ambush they inflict their listed damage in a cone out to normal range, with an Evasion save for half damage. If applied carefully to a vehicle target, the following explosion will inevitably destroy it. Like frag grenades, use of demo charges tends to be very exciting to security forces and can provoke more heat than many operators like to draw.\nHeavy machine guns are old tech, but reliable. Without a fixed firing position or vehicle mount, however, their recoil makes them almost uncontrollable. Due to the mass of lead involved in firing an HMG, each “round” of its ammunition costs $100 and counts as a full item of encumbrance.\nMortars are rare, but have their uses amid the tall buildings of an urban sprawl. They have a minimum range of 20 meters, but can lob indirect fire over buildings and obstacles. Mortars always target AC 20 at first, but each round of fire at the sa
