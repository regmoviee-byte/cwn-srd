 и прочее |\n\n\n**Продвинутые сенсоры:** Машина оснащена приборами ночного видения, инфракрасными сенсорами и радаром малой дальности, берущим до двадцати километров воздушного пространства. Её можно безопасно вести даже в полной темноте.\n**Форсаж:** Раз за сцену, Действием в свой ход, повысь Скорость машины на 1 на пять раундов.\n**Броневые плиты:** Повышают Броню машины на 3 пункта. На средние машины эту оснастку можно поставить дважды, на большие — трижды.\n**Грузовой отсек:** Эту оснастку можно взять несколько раз. Каждый раз она добавляет 50 кг защищённого грузового объёма для малых машин, 500 кг для средних и 2 тонны для больших.\n**Аварийная капсула:** Если машина попадает в аварию, каждый из находящихся внутри может перебросить один провальный спасброск от аварии. Если хоть один спасброск удался, авария не может снизить его ПЗ ниже 1 пункта.\n**Излучатель РЭБ:** При успешной атаке блока «Хедшот», ракетной установки или другого управляемого снаряда большой дальности водитель может сделать встречную проверку Инт или Лов/Вождение против боевого навыка атакующего. При успехе атакующий обязан перебросить атаку и взять худший результат.\n**Маскировка излучений:** Раз в день на один час машина может стать почти невидимой для инфракрасных датчиков и радаров. Маскировка бесполезна, если машину заметили визуально.\n**Повышенная прочность:** Максимум пунктов здоровья машины растёт на 25%, с округлением вверх.\n**Дополнительные места:** Малые машины получают +1 к Экипажу, средние +2, большие +4. Эту оснастку можно взять несколько раз, и все удобства машины — аварийные капсулы, жилой отсек и прочее — распространяются и на этот дополнительный Экипаж.\n**Разборный корпус:** Доступен только малым и средним машинам; позволяет разобрать их на легко переносимые пакеты деталей. Малая машина превращается в 30 предметов Загруженности, средняя — в 150. Разборка занимает 30 минут для малой машины и 3 часа для средней, сборка — вчетверо дольше.\n**Призрачный водитель:** Водитель может приказать машине — напрямую, по радио или по телефону — прибыть в определённые места в определённое время или выполнять другие простые прямые действия по заданному расписанию. Бортовая экспертная система справляется с дорожной обстановкой, но не имеет реального интеллекта для более сложных задач.\n**Опора для подвеса:** Дополнительное питание и усиление конструкции позволяют добавить один подвес.\n**Порт управления через разъём:** Машина проведена так, что ею можно управлять через подключённый черепной разъём, а не только обычным рулём. Пока водитель подключён, ему хватает Действия перемещения, чтобы управлять машиной, вместо Основного действия.\n**Крепление-прилипала:** На машину можно навесить целую вторую машину: средние берут малых паразитов, большие — малых или средних. Крепление для малой машины занимает 3 Массы, для средней — 6. Переделка машины под навеску добавляет 10% к её базовой цене, зато отстрелить её можно даже на ходу носителя. Эти машины-паразиты уничтожаются вместе с носителем; в остальных случаях они получают лишь половину урона, полученного носителем.\n**Жилой отсек:** Базовые тесные помещения для сна, гигиены и готовки на весь экипаж. Постоянная жизнь в машине стоит как трущобный Уровень жизни и считается им, хотя обитатели с Фокусом Ас за рулём или Скиталец могут считать его средним классом за ту же цену.\n**Медотсек:** Хирургические инструменты и медицинская поддержка на одного критически раненого пациента за раз. Медотсек считается пунктом экстренной помощи для лечения Серьёзных травм, если есть кто-то с Медициной-0 или выше, чтобы заниматься пациентом.\n**Внедорожный пакет:** Любая современная машина справится с заброшенными дорогами и более-менее ровной местностью, но этот пакет включает лебёдки, броню на шины, усиление рамы и прочие апгрейды, нужные, чтобы пройти всё, кроме совсем непроходимого.\n**Энергосистемы:** Эта оснастка добавляет Мощность в виде ёмкости батарей и вычислительной поддержки за счёт дополнительной нагрузки на Массу.\n**Герметизация:** До двух часов в день машина может полностью отсечь себя от внешней атмосферы: внутренние баллоны с воздухом и избыточное давление не пускают внутрь внешние токсины. В любое время она поддерживает комфортную температуру внутри в любом климате Земли. Летательным аппаратам эта оснастка не нужна, чтобы нормально работать на большой высоте.\n**Контрабандный тайник:** Эту оснастку можно взять больше одного раза; она добавляет 10 кг скрытого грузового объёма в малых машинах, 100 кг в средних и 400 кг в больших. Обнаружить его можно только разобрав машину или очень внимательным, тщательным осмотром — проверкой Мдр/Внимание или Мдр/Вождение сложностью 12.\n**Пульт наведения:** Единый пульт наведения позволяет одному стрелку управлять до трёх единиц транспортного оружия вместо обычной одной пушки на стрелка.\n**Стойка с инструментами:** Любая машина может везти набор инструментов в багажнике, но эта стойка оснащена сварочными аппаратами, тяжёлым инструментом, лебёдками и местом для запчастей на 40 ПЗ. Ею можно отремонтировать любой транспорт и использовать её как импровизированную мастерскую для сопутствующих работ."},
{"n":"3.9.3","l":3,"te":"Vehicle Weapons","tr":"Транспортное оружие","en":"Vehicles with hardpoints can mount weaponry, provided they have the spare Power and Mass to support the guns.\nA vehicle can mount a number of weapons equal to its hardpoints. Each weapon takes up a certain amount of the vehicle’s Power and Mass, just as a fitting does; the heavier and more computationally-demanding the weapon is, the greater its demands.\nSome weapons also require vehicles of a certain size in order to support them; no one is mounting an autogun on a motorcycle when the recoil alone would be enough to send the bike skidding.\nWhile most professionals prefer to mount heavy weaponry on their rides, it’s also possible to mount smaller guns, such as rifles or shotguns. These weapons make minimal demands on a vehicle’s structure, but still require at least a Medium-sized vehicle to provide a stable firing platform.\nEach mounted weapon can carry one normal magazine’s worth of ammunition. A loader can reload a vehicle weapon’s magazine as a Main Action.\nVehicle weapons each require a gunner, and any attacks made by the weapon are made with the gunner’s attack bonus and Shoot skill.\nShooting at enemy vehicles requires targeting the vehicle’s Armor Class and overcoming its Armor with the weapon’s damage. Armor is subtracted from any damage the weapon inflicts, after multiplying for Traumatic Hits. Shooting at targets on foot requires hitting their usual ranged AC.\nMounted weapons don’t take a hit penalty for firing from a moving vehicle, but passengers who are blazing away out the windows take up to a -4 circumstance penalty to such efforts.","ru":"Машины с подвесами могут нести вооружение, если у них хватает свободных Мощности и Массы на эти пушки.\nМашина несёт столько единиц оружия, сколько у неё подвесов. Каждая единица оружия занимает определённое количество Мощности и Массы машины, точно как оснастка: чем тяжелее и требовательнее к вычислениям оружие, тем больше его запросы.\nНекоторому оружию к тому же нужна машина определённого размера: никто не поставит автопушку на мотоцикл, когда одной отдачи хватит, чтобы байк ушёл в занос.\nБольшинство профессионалов предпочитает вешать на свои тачки Тяжёлое оружие, но можно установить и пушки поменьше — например, винтовки или дробовики. Такое оружие почти не нагружает конструкцию машины, но всё равно требует как минимум средней машины, чтобы дать устойчивую огневую платформу.\nКаждая установленная единица оружия несёт боеприпасы на один обычный магазин. Заряжающий может перезарядить магазин транспортного оружия Основным действием.\nКаждой единице транспортного оружия нужен стрелок, и все атаки этим оружием делаются с бонусом атаки и навыком Стрельба этого стрелка.\nСтрельба по вражеским машинам требует целить в Класс защиты машины и пробить её Броню уроном оружия. Броня вычитается из любого урона оружия — после умножения за Травматичные попадания. Стрельба по пешим целям требует попасть по их обычному КЗщ дальнего боя.\nУстановленное оружие не получает штрафа к атаке за стрельбу с движущейся машины, а вот пассажиры, палящие в окна, получают штраф за обстоятельства до -4 к таким попыткам."},
{"n":"3.9.3.1","l":4,"te":"Vehicle-Only Weaponry","tr":"Только транспортное вооружение","en":"These weapons are too large and bulky to be mounted on anything but vehicles or non-portable drones\n\n\nWeapon                Dmg        Range                Cost                Mag        Attr        Enc.        TD        TR\nDrone Cannon                2d8!        200/1,000        $5,000@        10        Dex        N/A        1d10        x3\nHeadshot Pod                4d6!        1,000/2,000        $20,000@        1        Dex        N/A        1d20        x4\nMain Tank Gun        4d12!        1,000/3,000        $100,000@        1        Dex        N/A        1d20        x4\nMounted Autogun        3d8#!        500/2,000        $15,000@        10        Dex        N/A        1d12        x2\nShrieker Gun                2d6^#        100/400        $10,000@        -        -        N/A        -        -\n@: This weapon requires an applicable Contact to buy, being generally illegal for open sale\n#: This weapon can fire to suppress if fixed to a vehicle or stationary firing position\n^: This weapon’s damage is always non-lethal, unless desired otherwise\n!: This weapon can inflict Traumatic Hits on vehicles and drones\n\n\nDrone cannons are heavy semi-automatic weapons too bulky for human portability. A round of firing costs $100 worth of ammunition.\nHeadshot pods are a family of guided missiles meant for mounted deployment on vehicles or large drones. They always target AC 10 to hit, but require two full consecutive rounds of aiming at a visible target to get a target lock on them and prime for firing on the third round. Any bystanders within 5 meters of the impact take damage as if from a frag grenade. A headshot pod missile costs $2,000.\nMain tank gun attacks always target AC 10, and anyone within 10 meters of impact takes 1d20 damage if not behind heavy cover. They cannot be mounted on aircraft or anything smaller than a tank. Each round costs $1,000.\nMounted autoguns are a drone cannon’s big brother, for larger platforms. Each round of firing costs $100.\nShrieker guns are sonic cannons used for crowd control and non-lethal suppression. While highly effective against unprotected targets, military-grade ear protection or the integral dampers in cyber-ears are sufficient to render the weapon useless.","ru":"Это оружие слишком крупное и громоздкое, чтобы ставить его куда-либо, кроме транспорта или непереносимых дронов\n\n\n| Оружие | Урон | Дист. | Цена | Маг | Хар. | Загр. | КТ | МТ |\n|---|---|---|---|---|---|---|---|---|\n| Дронная пушка | 2d8! | 200/1000 | $5 000@ | 10 | Лов | Н/П | 1d10 | ×3 |\n| Ракетный блок «Хедшот» | 4d6! | 1000/2000 | $20 000@ | 1 | Лов | Н/П | 1d20 | ×4 |\n| Основное танковое орудие | 4d12! | 1000/3000 | $100 000@ | 1 | Лов | Н/П | 1d20 | ×4 |\n| Турельная автопушка | 3d8#! | 500/2000 | $15 000@ | 10 | Лов | Н/П | 1d12 | ×2 |\n| Визгопушка | 2d6^# | 100/400 | $10 000@ | - | - | Н/П | - | - |\n\n@: Это оружие требует подходящего Контакта для покупки — открыто продавать его обычно незаконно\n#: Это оружие может стрелять на подавление, если закреплено на машине или на стационарной огневой позиции\n^: Урон этого оружия всегда нелетальный, если не пожелать иного\n!: Это оружие может наносить Травматичные попадания транспорту и дронам\n\n\nДронные пушки — тяжёлые самозарядные орудия, слишком громоздкие, чтобы человек их носил. Раунд стрельбы съедает боеприпасов на $100.\nБлоки «Хедшот» — семейство управляемых ракет для навесной установки на транспорт или крупных дронов. Они всегда целят в КЗщ 10, но требуют двух полных раундов подряд прицеливания по видимой цели, чтобы взять её в захват и подготовиться к выстрелу на третьем раунде. Все, кто оказался в 5 метрах от точки попадания, получают урон как от осколочной гранаты. Одна ракета блока «Хедшот» стоит $2 000.\nАтаки основного танкового орудия всегда целят в КЗщ 10, и каждый в 10 метрах от точки попадания получает 1d20 урона, если не находится за тяжёлым укрытием. Их нельзя ставить на летательные аппараты и на что-либо меньше танка. Каждый выстрел стоит $1 000.\nТурельные автопушки — старший брат дронной пушки, для крупных платформ. Раунд стрельбы стоит $100.\nВизгопушки — звуковые орудия для контроля толпы и нелетального подавления. Против незащищённых целей они крайне эффективны, но армейских наушников или встроенных гасителей в киберушах достаточно, чтобы оружие стало бесполезным."},
{"n":"3.9.4","l":3,"te":"Vehicle Mods","tr":"Моды транспорта","en":"Vehicle mods generally require both Fix and Drive skills to build, install, and maintain. Vehicle mod costs are expressed as percentages of the vehicle’s base cost, not including any fittings or weapons. Unless specified otherwise, a vehicle mod can be installed only once on any given vehicle.\n\n\nMod                                Skills                Cost        Special Components\nAugmented Armor                Fix-3/Drive-1        25%        1\nDrone Hub                        Fix-1/Drive-0        10%        0\nExtra Seating                        Fix-0/Drive-1        10%        0\nIntegrated Magazines                Fix-1/Drive-0        10%        0\nPersonalized Controls                Fix-1/Drive-2        20%        0\nPower System Upgrade        Fix-2/Drive-2        25%        1\nQ-Cladding                        Fix-1/Drive-2        20%        0\nReactive Defenses                Fix-2/Drive-2        25%        1\nReinforced Chassis                Fix-2/Drive-1        25%        1\nRemote Sensors                Fix-1/Drive-0        10%        0\nSupplementary Tanks                Fix-0/Drive-1        10%        0\nUltralight Components        Fix-2/Drive-1        20%        1\nUpgraded Speed                Fix-2/Drive-3        25%        2\n\n\nAugmented Armor: Increase the vehicle’s Armor rating by 3 points.\nDrone Hub: Install a housing that can hold a portable drone on Small vehicles or a non-portable drone on Medium or larger vehicles. The drone can be deployed while the vehicle is in motion. Onboard signal encryption adds +2 to the difficulty of hacking any drone controlled by someone in or adjacent to this vehicle. This fitting can be installed twice on Large vehicles.\nExtra Seating: Increase the maximum Crew size by 1 for Small vehicles, 2 for Medium, and 4 for Large.\nIntegrated Magazines: Mounted weapons gain one extra built-in magazine for Small vehicles, two for Medium, or four for Large. Reloading one vehicle magazine takes a Main Action.\nPersonalized Controls: The vehicle’s controls are designed for the idiosyncrasies of a specific driver. Once per scene, as an Instant action, they can add +1 to a Drive skill check. Anyone else takes -1 to drive the vehicle.\nPower System Upgrade: Increase the Power rating of the vehicle by 2 points for Small vehicles, 3 for Medium, and 4 for Large.\nQ-Cladding: Disguise the vehicle as another vehicle of the same general type, and hide its mounted weaponry. Replacing the disguise after weapons are deployed takes five minutes.\nReactive Defenses: Increase the vehicle’s Armor Class by 2 points, but subtract 2 points from its Armor, if it has any.\nReinforced Chassis: Increase the vehicle’s maximum HP by 25% of its base, but subtract 2 Mass from its maximum.\nRemote Sensors: The driver’s smartphone or headware can tap the vehicle’s sensors as an On Turn action, getting audio and visual from it if no special sensors are installed. This signal can reach up to two kilometers.\nSupplementary Tanks: The vehicle can operate for up to three days of normal driving without refueling.\nUltralight Components: Increase the vehicle’s maximum Mass by 2 points for Small vehicles, 3 for Medium, or 4 for Large. Its maximum HP decreases by 20% of its base, rounded up.\nUpgraded Speed: Increase the vehicle’s Speed by 1, but lose 20% of its maximum Mass, rounded up.","ru":"Моды транспорта, как правило, требуют навыков Ремонт и Вождение, чтобы их собрать, установить и обслуживать. Цена мода транспорта выражена в процентах от базовой цены машины, без учёта оснастки и оружия. Если не сказано иного, мод транспорта можно установить на конкретную машину только один раз.\n\n\n| Мод | Навыки | Цена | Особые компоненты |\n|---|---|---|---|\n| Усиленная броня | Ремонт-3/Вождение-1 | 25% | 1 |\n| Дронный отсек | Ремонт-1/Вождение-0 | 10% | 0 |\n| Дополнительные посадочные места | Ремонт-0/Вождение-1 | 10% | 0 |\n| Встроенные магазины | Ремонт-1/Вождение-0 | 10% | 0 |\n| Персонализированное управление | Ремонт-1/Вождение-2 | 20% | 0 |\n| Улучшение энергосистемы | Ремонт-2/Вождение-2 | 25% | 1 |\n| Q-обшивка | Ремонт-1/Вождение-2 | 20% | 0 |\n| Реактивная защита | Ремонт-2/Вождение-2 | 25% | 1 |\n| Усиленное шасси | Ремонт-2/Вождение-1 | 25% | 1 |\n| Дистанционные сенсоры | Ремонт-1/Вождение-0 | 10% | 0 |\n| Дополнительные баки | Ремонт-0/Вождение-1 | 10% | 0 |\n| Сверхлёгкие компоненты | Ремонт-2/Вождение-1 | 20% | 1 |\n| Повышенная скорость | Ремонт-2/Вождение-3 | 25% | 2 |\n\n\n**Усиленная броня:** Повышает Броню машины на 3 пункта.\n**Дронный отсек:** Устанавливает гнездо, вмещающее переносимого дрона на малых машинах или непереносимого дрона на средних и крупнее. Дрона можно выпустить на ходу. Бортовое шифрование сигнала добавляет +2 к сложности взлома любого дрона, которым управляет кто-то в этой машине или вплотную к ней. На большие машины эту оснастку можно поставить дважды.\n**Дополнительные посадочные места:** Повышают максимальный размер Экипажа на 1 для малых машин, на 2 для средних и на 4 для больших.\n**Встроенные магазины:** Установленное оружие получает один дополнительный встроенный магазин на малых машинах, два на средних и четыре на больших. Перезарядка одного транспортного магазина занимает Основное действие.\n**Персонализированное управление:** Управление машины подогнано под привычки конкретного водителя. Раз за сцену, Мгновенным действием, он может добавить +1 к проверке навыка Вождение. Все остальные получают -1 на управление этой машиной.\n**Улучшение энергосистемы:** Повышает Мощность машины на 2 пункта для малых машин, на 3 для средних и на 4 для больших.\n**Q-обшивка:** Маскирует машину под другую машину того же общего типа и скрывает установленное на ней оружие. Вернуть маскировку на место после развёртывания оружия — пять минут.\n**Реактивная защита:** Повышает Класс защиты машины на 2 пункта, но вычитает 2 пункта из её Брони, если та есть.\n**Усиленное шасси:** Повышает максимум ПЗ машины на 25% базового значения, но вычитает 2 из её максимума Массы.\n**Дистанционные сенсоры:** Смартфон или головная электроника водителя может подключиться к сенсорам машины Действием в свой ход, получая от неё звук и картинку, если особые сенсоры не установлены. Сигнал добивает до двух километров.\n**Дополнительные баки:** Машина может работать до трёх дней обычной езды без дозаправки.\n**Сверхлёгкие компоненты:** Повышают максимум Массы машины на 2 пункта для малых машин, на 3 для средних и на 4 для больших. Максимум её ПЗ падает на 20% базового значения, с округлением вверх.\n**Повышенная скорость:** Повышает Скорость машины на 1, но теряется 20% её максимума Массы, с округлением вверх."},
{"n":"4.0.0","l":1,"te":"Hacking","tr":"Хакинг","en":"The hacking rules for this game presume a largely hardwired world. Wifi connections are trivially cracked by modern cryptography and cyberdecks have field projection units that can penetrate computer housings or cyberware to reach the wires within. Important installations are kept on isolated local networks and connected to wide-area networks only at pre-arranged and unpredictable intervals. As a consequence, it is necessary for hackers to physically infiltrate most facilities in order to perform their duties.","ru":"Правила хакинга в этой игре исходят из того, что мир в основном проводной. Wi-Fi-соединения современная криптография ломает на раз, а у кибердеки есть блоки полевой проекции, способные пробить корпус компьютера или кибернетику и достать до проводов внутри. Важные объекты держат в изолированных локальных сетях и подключают к глобальным сетям только в заранее согласованные и непредсказуемые моменты. Как следствие, хакеру приходится физически проникать почти на любой объект, чтобы выполнить свою работу."},
{"n":"4.1.0","l":2,"te":"Cyberspace Basics","tr":"Основы киберпространства","en":"Cyberspace exits as a VR-mediated digital world that appears in whatever idiom the system's owner has selected. While a cyberdeck can reinterpret these idioms into a sensory experience more palatable to the user, most hackers prefer to see things \"natively\" when hacking a system due to the lower processing requirements.\nCyberspace exists in nodes, each one mirroring a particular network device or cluster of devices. A single camera might be its own node, or a set of factory machines, or a net-monitored minefield, or any other network “place”. Nodes are where programs and datafiles are kept and where hackers encounter guardian Demons and human watchdogs.\nNodes are linked by connections. To move from one node to another, a hacker needs to cross these connections, defeating any digital barriers that security may have erected. A hacker who jacks in to a security camera on the outside of a building might then hop its connection to the security panel where its output is being monitored. Without this long-distance travel, the hacker would have to physically reach the security panel in order to manipulate it.\nEvery human in cyberspace is represented by their avatar. Hackers tend to go to elaborate lengths to customize their avatars and the visual representations of the programs they use, but most corporate watchdogs are limited to corporation-approved brand icons. Most “civilian” users simply wear whatever digital disguise they’ve bought most recently.","ru":"Киберпространство существует как цифровой мир, опосредованный VR, и выглядит в той идиоме, которую выбрал владелец системы. Кибердека может переиначить эти идиомы в более приятное для пользователя чувственное переживание, но большинство хакеров при взломе предпочитают видеть всё «нативно» — так меньше нагрузка на вычисления.\nКиберпространство состоит из узлов, каждый из которых отражает конкретное сетевое устройство или их кластер. Отдельная камера может быть своим узлом, или набор заводских машин, или подключённое к сети минное поле, или любое другое сетевое «место». В узлах хранятся программы и файлы данных, там же хакер встречает Демонов-охранников и живых сторожей.\nУзлы связаны соединениями. Чтобы перейти из одного узла в другой, хакеру нужно пройти по этим соединениям, преодолев любые цифровые барьеры, которые возвела защита. Хакер, подключившийся к камере наблюдения на внешней стене здания, может затем перескочить по её соединению на пульт охраны, куда идёт картинка. Без такого путешествия на расстоянии хакеру пришлось бы физически добираться до пульта охраны, чтобы им управлять.\nКаждого человека в киберпространстве представляет его аватар. Хакеры идут на изощрённые ухищрения, чтобы настроить свои аватары и внешний вид используемых программ, но большинство корпоративных сторожей ограничены одобренными корпорацией брендовыми иконками. Большинство «гражданских» пользователей просто носят тот цифровой костюм, который купили последним."},
{"n":"4.1.1","l":3,"te":"Time in Cyberspace","tr":"Время в киберпространстве","en":"Cyberspace actions take the same amount of time as physical actions; the code may be fast, but the human mind is only so agile. Hackers must split their available actions between cyberspace and any physical activities they want to perform while jacked in. ","ru":"Действия в киберпространстве занимают столько же времени, сколько физические: код-то быстрый, но человеческий разум не резиновый. Хакер обязан делить доступные ему действия между киберпространством и любой физической активностью, которой он хочет заняться, пока подключён."},
{"n":"4.1.2","l":3,"te":"Connecting to Cyberspace","tr":"Подключение к киберпространству","en":"To connect to a node, a user has two choices.\nPhysically attach a self-adhering field modulation cable from your cyberdeck or cranial jack to the device housing. Even without a convenient plug socket, this will let you hack the device’s internals.\nWirelessly connect to the device with your cyberdeck. The target must be within 30 meters with an unobstructed line of sight. Wireless connections are much more tenuous than physical links; you’ll take a -2 penalty to any cyberspace skill checks you make and your avatar won’t be able to move out of the node.\nIn both cases, it’s assumed that you’re connecting to your cyberdeck with a cranial jack. VR crowns can be used as a makeshift link for those without a cranial jack, but they apply a -1 penalty to all cyberspace skill checks made with them.\nConnections last until someone yanks your cable off the device housing or you voluntarily jack out of the system. Even if unconscious, your avatar remains until you’re jacked out. Crash disconnections are disorienting and will leave a hacker stunned, but sometimes an ally needs to cut the link before some watchdog boils a nerve-locked hacker’s brain.\nWireless connections have no cable to yank, but fail if the target moves out of range; once the link is established, the line of sight need not be unobstructed.\nHackers normally remain aware of their physical surroundings while jacked in. They can act in either the physical or virtual realm as they choose, spending their actions during the round as they wish.","ru":"Чтобы подключиться к узлу, у пользователя есть два варианта.\nФизически прицепить самоклеящийся кабель полевого подключения от своей кибердеки или черепного разъёма к корпусу устройства. Даже без удобного гнезда это позволит тебе взломать внутренности устройства.\nПодключиться к устройству беспроводно с помощью кибердеки. Цель должна быть в пределах 30 м на прямой линии видимости без помех. Беспроводные соединения куда ненадёжнее физических: ты получаешь -2 на любые проверки навыка в киберпространстве, а твой аватар не сможет покинуть узел.\nВ обоих случаях предполагается, что к кибердеке ты подключён черепным разъёмом. Тем, у кого разъёма нет, сойдёт VR-корона как суррогатная связь, но она даёт -1 ко всем проверкам навыка в киберпространстве, сделанным через неё.\nСоединение держится, пока кто-нибудь не сорвёт твой кабель с корпуса устройства или пока ты сам добровольно не отключишься от системы. Даже без сознания твой аватар остаётся на месте, пока тебя не отключат. Аварийные обрывы дезориентируют и оставляют хакера оглушённым, но иногда союзнику нужно перерезать связь до того, как какой-нибудь сторож сварит мозги хакеру, залипшему в нейросвязи.\nУ беспроводного соединения нет кабеля, который можно сорвать, но оно рвётся, если цель выходит из радиуса; после установления связи прямая видимость уже не обязана быть свободной.\nХакеры обычно сохраняют осознание своего физического окружения, пока подключены. Они могут действовать в физическом или виртуальном мире по своему выбору, тратя действия раунда как захотят."},
{"n":"4.1.3","l":3,"te":"Access","tr":"Доступ","en":"Access is the digital currency of control, representing a hacker's array of countermeasures, zero-day hacks, fresh intrusion measures, and unsecured backdoors. It's spent to run programs  on a secured system. Access is a general pool, though sometimes a hacker may acquire specific data that gives them bonus Access against particular networks.\nA hacker’s base Access is equal to their Intelligence modifier plus their Program skill plus their cyberdeck’s Bonus Access rating. To refresh this pool, they need to spend an hour reprogramming their deck and slotting in new exploits. Such a refresh can only happen once a day as it takes time for new security holes to open in newly-updated software.\nHackers can acquire bonus Access to a network through social engineering: inside information, moles, and backdoors they’ve been informed about through Contacts or field work. This information is perishable, and usually becomes useless within a few weeks.","ru":"Доступ — цифровая валюта контроля; он отражает арсенал хакера: средства обхода защиты, уязвимости нулевого дня, свежие методы проникновения и незакрытые бэкдоры. Он тратится на запуск программ в защищённой системе. Доступ — общий запас, хотя иногда хакер может добыть конкретные данные, дающие бонусный Доступ против отдельных сетей.\nБазовый Доступ хакера равен модификатору Интеллекта плюс навык Программирование плюс Бонус Доступа его кибердеки. Чтобы восстановить этот запас, нужно потратить час на перепрограммирование деки и загрузку новых эксплойтов. Такое восстановление возможно только раз в сутки: новым дырам в свежеобновлённом софте нужно время, чтобы открыться.\nХакер может получить бонусный Доступ к сети через социальную инженерию: инсайдерская информация, кроты, бэкдоры, о которых ему рассказали Контакты или которые он нашёл в поле. Такая информация портится и обычно становится бесполезной за несколько недель."},
{"n":"4.1.4","l":3,"te":"Running Programs","tr":"Запуск программ","en":"Once a hacker has jacked into a node, they likely want to do some mischief. This is accomplished by using programs made up of two different kinds of code fragments stored in their deck’s Memory.\nVerbs are what the hacker wants to do to the target: Glitch, Sabotage, Blind, Decrypt, Delude, or some other malfeasance. A full list of the most common Verbs is provided on page 98.\nSubjects are what the hacker wants to do it to: Camera, Turret, Door, Barrier, Avatar, or something else. A hacker needs the right code libraries on hand to work their magic, and if they don’t have the data specs for a target in their deck’s Memory they can’t hit it.\nEach Verb or Subject takes up one unit of Memory in a cyberdeck. The hacker can mix and match these fragments as they wish to create programs. A deck with the Glitch, Blind, Datafile, Camera, and Drone fragments on it could Glitch Drone or Blind Camera or any combination of Verb and Subject the hacker wishes, determined at the time they run the program.\nVerbs are flexible, but each has a limit on what type of Subjects they can use. The Glitch Verb is only usable on Device or Cyber types of Subjects. Drone is a Device Subject, so it’s valid, but Datafile is a Data Subject, so Glitch can’t operate on it.\nMost Verbs require that the hacker beat the target network’s security difficulty with an Int/Program skill check. This difficulty varies with the quality of the network tech, usually ranging from 7 to 12, or even more.\nEach failed execution against network security increases the network’s alertness. Each two failed attempts counts as one Alert the Network action, so no more than four botches will light up the facility. Opposed skill checks, such as in combat, don’t trigger this effect. Even networks without a Demon active can thus end up alerted by a sufficiently inept or unfortunate hacker.","ru":"Как только хакер подключился к узлу, ему наверняка хочется напакостить. Делается это программами, собранными из двух видов фрагментов кода, хранящихся в Памяти деки.\nГлаголы — это то, что хакер хочет сделать с целью: *Сглючить*, *Саботировать*, *Ослепить*, *Расшифровать*, *Обмануть* или иная пакость. Полный список самых распространённых Глаголов приведён на стр. 98.\nОбъекты — это то, с чем он хочет это сделать: *Камера*, *Турель*, *Дверь*, *Барьер*, *Аватар* или что-то ещё. Хакеру нужны под рукой правильные библиотеки кода, и если в Памяти деки нет спецификаций данных на цель — он по ней не ударит.\nКаждый Глагол или Объект занимает одну единицу Памяти в кибердеке. Хакер может смешивать и сочетать эти фрагменты как хочет, создавая программы. Дека с фрагментами *Сглючить*, *Ослепить*, *Файл данных*, *Камера* и *Дрон* может выдать *Сглючить Дрон*, или *Ослепить Камеру*, или любое другое сочетание Глагола и Объекта, какое хакер захочет, — оно определяется в момент запуска программы.\nГлаголы гибкие, но у каждого есть ограничение на типы Объектов, с которыми он работает. Глагол *Сглючить* применим только к Объектам типа Устройство или Кибер. *Дрон* — Объект типа Устройство, так что он подходит, а *Файл данных* — типа Данные, поэтому *Сглючить* с ним не работает.\nБольшинству Глаголов нужно, чтобы хакер превзошёл сложность защиты сети проверкой Инт/Программирование. Эта сложность зависит от качества сетевой техники и обычно колеблется от 7 до 12, а то и выше.\nКаждый неудачный запуск против защиты сети повышает её настороженность. Каждые две неудачные попытки считаются за одно действие «Поднять тревогу в сети», так что и четырёх провалов хватит, чтобы объект встал на уши. Встречные проверки навыка, например в бою, этот эффект не вызывают. Так что даже сеть без активного Демона может оказаться поднятой по тревоге благодаря достаточно неумелому или невезучему хакеру."},
{"n":"4.1.5","l":3,"te":"Cyberspace Combat and Demons","tr":"Бой в киберпространстве и Демоны","en":"While only well-funded networks will have a human “watchdog” jacked into the system to monitor it, all but the poorest network will have at least one Demon program positioned to deter intruders and raise alarms.\nDemons are programs that usually remain stationary in a single node. When an intruder arrives, the Demon will carry out its programming. This usually entails raising a network alert to on-site security and launching Stun Avatar programs at the hacker. A Demon’s particular program loadout and directives will depend on what the network admins granted it.\nCyberspace combat is usually played out via Stun Avatar programs that inflict non-lethal hit point damage to hackers or Demons hit by them. These hit points are subtracted from the actual physical hit points of the hacker; if reduced to zero HP by Stun Avatar, a human goes unconscious, waking up ten minutes later with one hit point. Demons reduced to zero HP are fragged, and won’t reboot for another hour.\nThe specific procedures for cyberspace combat are detailed in a section below.","ru":"Живой «сторож», подключённый к системе для присмотра, есть только у хорошо финансируемых сетей, но хотя бы одна программа-Демон, поставленная отпугивать вторженцев и поднимать тревогу, есть у всех сетей, кроме самых нищих.\nДемоны — это программы, обычно остающиеся неподвижно в одном узле. Когда появляется вторженец, Демон выполняет свою программу. Как правило, это означает поднять сетевую тревогу для охраны на месте и запускать по хакеру программы *Оглушить Аватар*. Конкретный набор программ и директивы Демона зависят от того, что ему выдали админы сети.\nБой в киберпространстве обычно разыгрывается программами *Оглушить Аватар*, наносящими нелетальный урон пунктам здоровья хакерам или Демонам, по которым попали. Эти пункты здоровья вычитаются из настоящих физических пунктов здоровья хакера; если *Оглушить Аватар* сводит человека к нулю ПЗ, он теряет сознание и приходит в себя через десять минут с одним пунктом здоровья. Демоны, сведённые к нулю ПЗ, фрагаются и не перезагрузятся ещё час.\nКонкретные процедуры боя в киберпространстве расписаны в разделе ниже."},
{"n":"4.1.6","l":3,"te":"Noticing Hacking","tr":"Как замечают хакинг","en":"A hacker generally needs to be plugged into their cyberdeck in order to hack, whether with a cranial jack or a VR crown. This is going to be enough to catch the attention of people around them, who may not know what the hacker is doing, but they’ll know that the hacker is prepared to do something. Decks with 0 Enc might be small enough to hide discreetly, if the user is wearing a head covering.\nHacking attempts on cyberware are always obvious to the target unless specified otherwise; the user’s cyberware will naturally ping the user that something is happening, even if the effect may not be obvious. Frisking someone for cyberware via hacking is generally considered a hostile act. A target might put up with it if they’re being checked for weapons as part of a security process, but running a Frisk on the street is likely to convince the target that they’re about to be attacked.\nHacking attempts on other hardware are obvious from within the device’s node, and any hacker, watchdog, or Demon in it is capable of detecting tampering automatically. An outside observer won’t necessarily notice anything wrong unless the device is behaving in some uncharacteristic way.","ru":"Чтобы хакать, хакеру, как правило, нужно быть воткнутым в свою кибердеку — через черепной разъём или VR-корону. Этого хватит, чтобы привлечь внимание окружающих: они могут не знать, что именно делает хакер, но поймут, что он к чему-то готовится. Деки с Загр. 0 могут быть достаточно малы, чтобы спрятать их незаметно, если пользователь носит головной убор.\nПопытки взлома кибернетики всегда очевидны для цели, если не сказано иное: кибернетика пользователя естественным образом сигналит ему, что что-то происходит, даже если сам эффект не очевиден. Обыск человека на кибернетику через взлом обычно считается враждебным действием. Цель может это стерпеть, если её проверяют на оружие в рамках досмотра, но запуск *Обыскать* на улице скорее всего убедит цель, что её собираются атаковать.\nПопытки взлома прочего железа очевидны изнутри узла устройства, и любой хакер, сторож или Демон в нём автоматически способен обнаружить вмешательство. Наблюдатель снаружи не обязательно заметит неладное, если устройство не начнёт вести себя как-то нехарактерно."},
{"n":"4.1.7","l":3,"te":"What Can Be Hacked?","tr":"Что можно взломать?","en":"Software-controlled devices can be hacked, such as drones, most electronic locks, cyberware, cameras, and other program Subjects listed in this section.\nMechanical or strictly electrical devices cannot be hacked. In the default setting, this includes most vehicles, dumb locks, household appliances, thermostats, and anything else that can do its job without talking to a computer. Security-minded corps have no reason to make life any easier for an intruder than they must.","ru":"Взломать можно устройства, управляемые софтом: дроны, большинство электронных замков, кибернетику, камеры и прочие Объекты программ, перечисленные в этом разделе.\nМеханические или чисто электрические устройства взломать нельзя. В сеттинге по умолчанию к таким относятся большинство машин, тупые замки, бытовая техника, термостаты и всё прочее, что делает свою работу, не общаясь с компьютером. У корп с головой на плечах нет причин облегчать жизнь вторженцу больше необходимого."},
{"n":"4.2.0","l":2,"te":"Hacking Mechanics","tr":"Механика хакинга","en":"The following procedures are used for hacking various types of targets and engaging in cyberspace combat.","ru":"Следующие процедуры используются для взлома разных типов целей и для боя в киберпространстве."},
{"n":"4.2.1","l":3,"te":"Hacking a Device or Server","tr":"Взлом устройства или сервера","en":"1. Check your deck’s CPU rating. Do you have a free point of CPU? If not, your deck doesn’t have the horsepower to run another program right now.\n2. As a Move action, take the Jack In action to connect to the device if you aren’t already connected. It’s best to use the self-adhering field manipulation cable of your cyberdeck. Wireless connections are possible within 30 meters of unobstructed line-of-sight, but apply -2 to all cyberspace skill checks while connected that way. If you’re connecting to your deck with a VR crown instead of a cranial jack, take an additional -1 penalty.\n3. As a Main action, run your program. Combine a Verb and a Subject stored in your deck’s Memory, pay any Access the Verb requires, and roll Int/Program versus the target’s Security difficulty, modified by any difficulty modifiers the Verb applies. On a success, the program has its effect. On a failure, you lose any Access you spent for no benefit, the program fails to run, and you potentially alarm the network. Every two failed skill checks against network Security count as one triggering of the Alert the Network action.\n4. Is the program still running? If your program self-terminates after completion, it gives back its CPU slot. If you need to keep it running to maintain its effects or control, it keeps the CPU slot until you terminate it as an Instant action, your connection is cut, or you get knocked unconscious.","ru":"1. Проверь ЦП своей деки. Есть свободный пункт ЦП? Если нет, у деки сейчас не хватит мощности на ещё одну программу.\n2. Действием перемещения выполни действие «Подключиться», чтобы соединиться с устройством, если ты ещё не подключён. Лучше использовать самоклеящийся кабель полевого подключения кибердеки. Беспроводное соединение возможно в пределах 30 м прямой видимости без помех, но даёт -2 на все проверки навыка в киберпространстве, пока ты так подключён. Если ты соединяешься с декой VR-короной, а не черепным разъёмом, получи дополнительно -1.\n3. Основным действием запусти программу. Соедини Глагол и Объект, хранящиеся в Памяти деки, заплати Доступ, которого требует Глагол, и брось Инт/Программирование против сложности защиты цели с учётом модификаторов сложности, которые накладывает Глагол. При успехе программа срабатывает. При провале потраченный Доступ пропадает без всякой пользы, программа не запускается, и ты можешь всполошить сеть. Каждые две проваленные проверки навыка против защиты сети считаются за одно срабатывание действия «Поднять тревогу в сети».\n4. Программа всё ещё работает? Если твоя программа сама завершается после выполнения, она освобождает свой слот ЦП. Если её надо держать запущенной, чтобы сохранять эффект или контроль, она занимает слот ЦП, пока ты не завершишь её мгновенным действием, пока не оборвётся соединение или пока ты не потеряешь сознание."},
{"n":"4.2.2","l":3,"te":"Hacking Cyberware or Drones","tr":"Взлом кибернетики или дронов","en":"1. Check your deck’s CPU rating. Do you have a free point of CPU? If not, your deck doesn’t have the horsepower to run another program right now.\n2. Can you reach them? While in theory you can stick your deck’s field cable on a target, in practice you’re usually going to be attacking wirelessly, with a 30 meter line-of-sight range and a -2 penalty on all cyberspace skill checks. You don’t have to connect to them beforehand with the Jack In action, however; you can launch your programs directly against the target. If you’re connecting to your deck with a VR crown instead of a cranial jack, take an additional -1 penalty to all cyberspace skill checks.\n3. Do you know what cyberware you’re targeting? Cyber with a Sight obviousness rating can be recognized on sight. Otherwise, you need to either know of a cyber system’s existence beforehand, run the Frisk Cyber program, or launch your hack blindly and hope it hits a valid target.\n4. As a Main Action, run your program, combining the desired Verb and applicable Subject from your deck’s Memory and spending the Access the Verb requires. If the target has no cyber, your effort is wasted. If the Subject you’re using doesn’t match any of their cyber, your effort is wasted. If the Subject you’re using matches multiple systems, like the generic Cyber Subject, and you didn’t specify which one beforehand, the GM picks a valid target randomly and tells you what you hit. Most Verbs require a skill check to successfully affect the cyber. The base difficulty for your Int/Program skill check is equal to 7 plus one-third of the target’s or the drone operator’s HD or level, rounded up. Drones without a connected operator are difficulty 8. Remember that you’re probably attacking wirelessly for a -2 penalty on your skill check, plus any roll bonus or penalty the Verb you’re using may apply.\n5. Is the program still running? If your program self-terminates after completion, it gives back its CPU slot. If you need to keep it running to maintain its effects or control, it keeps the CPU slot until you terminate it as an Instant action, your target moves out of range, or you get knocked unconscious. Just moving behind cover is not enough to cut the connection; they need to get more than 30 meters away from you.","ru":"1. Проверь ЦП своей деки. Есть свободный пункт ЦП? Если нет, у деки сейчас не хватит мощности на ещё одну программу.\n2. Достанешь ли ты до них? Теоретически ты можешь прилепить полевой кабель деки на цель, но на практике атаковать обычно приходится беспроводно — радиус 30 м по прямой видимости и -2 на все проверки навыка в киберпространстве. Зато подключаться к ним заранее действием «Подключиться» не нужно: можно запускать программы прямо по цели. Если ты соединяешься с декой VR-короной, а не черепным разъёмом, получи дополнительно -1 ко всем проверкам навыка в киберпространстве.\n3. Знаешь ли ты, какую кибернетику атакуешь? Кибер с уровнем скрытности «Взгляд» можно распознать на глаз. Иначе тебе нужно либо заранее знать о существовании кибер-системы, либо запустить программу *Обыскать Кибер*, либо бить вслепую и надеяться, что попадёшь по существующей цели.\n4. Основным действием запусти программу, соединив нужный Глагол и подходящий Объект из Памяти деки и заплатив Доступ, которого требует Глагол. Если у цели нет кибера, усилия впустую. Если твой Объект не соответствует ни одному из её киберов, усилия впустую. Если твой Объект подходит сразу к нескольким системам — как общий Объект *Кибер* — и ты заранее не указал, какую именно, Мастер случайно выбирает подходящую цель и говорит тебе, во что ты попал. Большинству Глаголов нужна проверка навыка, чтобы успешно подействовать на кибер. Базовая сложность твоей проверки Инт/Программирование равна 7 плюс треть КЗд или уровня цели либо оператора дрона, с округлением вверх. Дроны без подключённого оператора — сложность 8. Помни, что ты, скорее всего, атакуешь беспроводно, а это -2 к проверке, плюс любой бонус или штраф к броску от используемого Глагола.\n5. Программа всё ещё работает? Если твоя программа сама завершается после выполнения, она освобождает свой слот ЦП. Если её надо держать запущенной, чтобы сохранять эффект или контроль, она занимает слот ЦП, пока ты не завершишь её мгновенным действием, пока цель не выйдет из радиуса или пока ты не потеряешь сознание. Просто зайти за укрытие для обрыва связи недостаточно — цели нужно отойти больше чем на 30 м."},
{"n":"4.2.3","l":3,"te":"Cyberspace Combat","tr":"Бой в киберпространстве","en":"1. Be connected. If you lose your connection, you drop out of cyberspace and can’t interact with it.\n2. Be in the same network node. All avatars or Demons involved in the fight have to be in the same network device.\n3. Both sides roll initiative. If you’re already in meatspace combat, keep your original initiative.\n4. Both sides take actions normally. Main or Move actions spent in cyberspace are consumed in meatspace as well; you don’t get two separate sets of actions. Those with the Hacker Edge, however, get a free Main Action each round to spend in cyberspace. Demons get the same Main and Move actions that any others do.\n5. Attacks are usually made with the Stun Verb and the Avatar Subject, though Kill Avatar is used by some particularly vicious defenders. These Verbs inflict normal hit point damage on the target; at zero hit points, they fall unconscious if human or are fragged for an hour if a Demon program, though fragged demons still count for a node’s maximum Demon capacity. Kill Avatar can inflict lethal damage and Traumatic Hits; the victim’s Trauma Target is not modified by armor, but is by cyber or other sources.\n6. Combat continues until one side flees, is disconnected, or otherwise ceases hostilities. Demons will follow their programming, while human watchdogs are more flexible. Both will likely put a high priority on the Alert the Network action, which must be performed twice to activate the network’s intruder alert.","ru":"1. Будь подключён. Потеряв соединение, ты вываливаешься из киберпространства и не можешь с ним взаимодействовать.\n2. Будьте в одном узле сети. Все аватары и Демоны, участвующие в схватке, должны быть в одном сетевом устройстве.\n3. Обе стороны бросают инициативу. Если ты уже в бою в реале, оставь свою исходную инициативу.\n4. Обе стороны действуют как обычно. Основные действия и действия перемещения, потраченные в киберпространстве, тратятся и в реале — двух отдельных наборов действий не бывает. Впрочем, обладатели Козыря *Хакер* получают одно бесплатное основное действие каждый раунд, чтобы потратить его в киберпространстве. У Демонов те же основные действия и действия перемещения, что у всех прочих.\n5. Атаки обычно делаются Глаголом *Оглушить* с Объектом *Аватар*, хотя некоторые особо злобные защитники используют *Убить Аватар*. Эти Глаголы наносят цели обычный урон пунктам здоровья; на нуле пунктов здоровья цель теряет сознание, если это человек, или фрагается на час, если это программа-Демон, — причём фрагнутые демоны всё равно занимают место в максимальной ёмкости узла по Демонам. *Убить Аватар* может нанести летальный урон и Травматичные попадания; Порог травмы жертвы броня не изменяет, а кибер и другие источники — изменяют.\n6. Бой продолжается, пока одна из сторон не сбежит, не будет отключена или иначе не прекратит враждебные действия. Демоны следуют своей программе, живые сторожа гибче. И те, и другие, скорее всего, поставят высокий приоритет действию «Поднять тревогу в сети», которое надо выполнить дважды, чтобы включить сигнал вторжения в сети."},
{"n":"4.2.4","l":3,"te":"Moving in Cyberspace","tr":"Перемещение в киберпространстве","en":"1. Be connected. Your avatar initially manifests in the network node corresponding to the device you connected to.\n2. Look for node connections. Most connections to another node are obvious. Some may be hidden, however, and require a Main Action and a Wis/Program skill check to detect them at the security’s difficulty level. \n3. Is there a barrier on the connection? If so, you need to successfully run the Unlock Barrier program on it to pop it open. Once unlocked, it remains so until the Lock Barrier program is run.\n4. If there is no barrier or it has been unlocked, take a Move action to move to the connecting node. Hostile Demons or watchdogs who are present get to run a free program against you as you flee.","ru":"1. Будь подключён. Твой аватар изначально проявляется в узле сети, соответствующем устройству, к которому ты подключился.\n2. Ищи соединения узла. Большинство соединений с другим узлом очевидны. Некоторые, впрочем, могут быть скрыты и требуют основного действия и проверки Мдр/Программирование, чтобы их обнаружить, — по уровню сложности защиты.\n3. Есть ли на соединении барьер? Если есть, тебе нужно успешно запустить на нём программу *Отпереть Барьер*, чтобы его вскрыть. После отпирания он остаётся открытым, пока не запустят программу *Запереть Барьер*.\n4. Если барьера нет или он отперт, потрать действие перемещения, чтобы перейти в соединённый узел. Враждебные Демоны или сторожа, находящиеся здесь, получают бесплатный запуск одной программы по тебе, пока ты убегаешь."},
{"n":"4.2.5","l":3,"te":"Common Cyberspace Security Levels","tr":"Обычные уровни защиты киберпространства","en":"The levels below represent the usual difficulties for hacking skill checks in a given network. Individual networks may vary based on their importance and the competence of their guardians, however.\n\n\nCommon Security Levels                Diff.\nPrivate home network                        7\nSmall business or minor gang        8\nMinor government office                8\nCorp branch office or major gang        9\nImportant government facility                9\nCorp high-security network                10\nCorp or government black site        12\n\n\nSituation                                        Diff. Mod\nNetwork has been alerted                        +1\nThe device is very important                        +1\nTheir tech or skill is poor or makeshift        -1 to -2\nTheir tech or skill is unusually good                +1 to +2\nHacker has inside security info                -1 to -3","ru":"Приведённые ниже уровни отражают обычные сложности проверок навыка при взломе конкретной сети. Отдельные сети могут отличаться в зависимости от своей важности и компетентности своих охранников.\n\n\n| Обычные уровни защиты | Слож. |\n|---|---|\n| Домашняя частная сеть | 7 |\n| Малый бизнес или мелкая банда | 8 |\n| Мелкая госконтора | 8 |\n| Филиал корпы или крупная банда | 9 |\n| Важный государственный объект | 9 |\n| Сеть корпы с высокой защитой | 10 |\n| Чёрный объект корпы или государства | 12 |\n\n\n| Ситуация | Мод. слож. |\n|---|---|\n| Сеть поднята по тревоге | +1 |\n| Устройство очень важное | +1 |\n| Их техника или умение — дрянь или самоделка | от -1 до -2 |\n| Их техника или умение необычно хороши | от +1 до +2 |\n| У хакера есть инсайдерская информация о защите | от -1 до -3 |"},
{"n":"4.2.6","l":3,"te":"Cyberspace Actions","tr":"Действия в киберпространстве","en":"Cyberspace actions take the same amount of time as meat-space actions. Thus, if the PC takes a Main Action to run a program in cyberspace, they can’t then use that same Main Action to fire a weapon in reality, as the hacker needs to split their available action pool over both realms of being. The following actions are among the most common, but others may be allowed at the GM’s discretion.\n\n\nNetwork Actions\nAlert the Network (Main): An action normally only taken by Demons and human watchdog hackers, this action will alert the whole network that there’s an intruder present in this particular cyberspace node. This action must be taken twice to trigger an alert; one Demon could use it on two different rounds or two Demons could both use it the same round. Up to an hour can elapse between the two uses of this action; if a defeated Demon still gets it off once, another enemy three nodes later can still complete the alert with their own action. These alerts usually are automatically messaged to at least some physical security staff.\nJack In (Move): Attach a cyberdeck’s field manipulation cable to a device or initiate a wireless connection to a device within 30 meters with no significant obstacles to the user’s line of sight. The hacker’s avatar appears in the cyberspace node associated with the target device.\nJack Out (Move): Safely disconnect a wireless connection or remove a cyberdeck’s field manipulation cable. Hostile assailants can do this with no real chance of failure if within melee range. If someone forcibly yanks a physical cable loose while a hacker is jacked in, the hacker is stunned and loses their next Main Action.\nMove Nodes (Move): Assuming there’s no barrier between the hacker’s current network node and an adjacent one, they can move one hop on the network. If they’re being engaged by an enemy Demon or human attacker, however, their foe may choose to run one program against them as a parting shot before they can complete the move.\nSend Message (On Turn): Send a brief message over the network to an avatar or device in a connected node, provided no barriers obstruct the path. Demons, watchdogs, and others with admin privileges can message any known avatar or device on the network regardless of active barriers.\nCrash Shutdown (Main): This action can only be taken by someone with admin privileges, usually the senior human watchdog hacker on duty for a given network. Once triggered, the entire network will shut down in 1d4+4 minutes, deactivating every connected device and booting every user out of the system as if forcibly disconnected. It will take 24 hours to bring the system back up and inflict 10% of the network’s total hardware costs in component damage. Corps reserve this action for dire emergencies, when it seems certain that a cyberspace intruder is soon to do something even worse than this. Impending shutdowns are obvious to everyone in the system.\n\n\nCyberdeck Actions\nCopy File (Move): Make a copy of a datafile located in your current node and store it in your deck’s Memory. The inevitable wrapper of anti-tamper code and log files makes almost all important datafiles take up one point of Memory, however small the actual contents.\nDelete Local File (Move): Erase one datafile, Verb, or Subject on your own cyberdeck, freeing up the Memory it occupied. Deleting files in a server node you don’t have admin rights for requires the Erase Verb, as the local network may not permit such tampering.\nIssue Command (Main): Verbs such as Hijack or Delude seize control of devices or provide some lasting influence over a system. Ordering a controlled target to do something takes a Main Action. A controlled but uncommanded target will continue doing whatever it was last told to do. If that’s impossible or impractical, it will do nothing until it gets a new command.\nRun a Program (Main): Run a program from the hacker’s cyberdeck or the watchdog’s server, combining a Verb with a Target to produce a desired effect.\nTerminate a Program (Instant): Shut down a program the hacker is running, freeing up CPU capacity. Programs are automatically terminated if the hacker gets dumped from the network, their wireless signal is blocked, or they’re otherwise cut off from their intended targets.","ru":"Действия в киберпространстве занимают столько же времени, сколько действия в реале. То есть если ПИ потратил основное действие на запуск программы в киберпространстве, он не может тем же основным действием выстрелить из оружия в реальности: хакеру приходится делить доступный запас действий между двумя планами бытия. Перечисленные ниже действия — самые частые, но Мастер может разрешить и другие.\n\n\n**Действия в сети**\n**Поднять тревогу в сети (Основное):** Действие, которое обычно совершают только Демоны и живые сторожа-хакеры; оно оповещает всю сеть, что в этом конкретном узле киберпространства есть вторженец. Чтобы тревога сработала, действие надо выполнить дважды: один Демон может использовать его в двух разных раундах, или два Демона — оба в один раунд. Между двумя применениями может пройти до часа: если побеждённый Демон успел сделать это один раз, другой враг три узла дальше может добить тревогу своим действием. Такие тревоги обычно автоматически рассылаются хотя бы части физической охраны.\n**Подключиться (Перемещение):** Прицепить кабель полевого подключения кибердеки к устройству или начать беспроводное соединение с устройством в пределах 30 м без значимых препятствий на линии видимости пользователя. Аватар хакера появляется в узле киберпространства, связанном с целевым устройством.\n**Отключиться (Перемещение):** Безопасно разорвать беспроводное соединение или снять кабель полевого подключения кибердеки. Враждебные противники могут сделать это практически без шансов на неудачу, если находятся на дистанции ближнего боя. Если кто-то силой выдирает физический кабель, пока хакер подключён, хакер оглушён и теряет своё следующее основное действие.\n**Смена узла (Перемещение):** Если между текущим узлом сети хакера и соседним нет барьера, он может сделать один прыжок по сети. Однако если его теснит враждебный Демон или живой противник, тот может запустить по нему одну программу на прощание, прежде чем перемещение завершится.\n**Отправить сообщение (В свой ход):** Отправить короткое сообщение по сети аватару или устройству в соединённом узле, если путь не перекрыт барьерами. Демоны, сторожа и прочие с админ-правами могут послать сообщение любому известному аватару или устройству в сети, невзирая на активные барьеры.\n**Аварийное отключение (Основное):** Это действие доступно только тому, у кого есть админ-права, — обычно старшему живому сторожу-хакеру на смене в данной сети. После запуска вся сеть отключится через 1d4+4 минуты, деактивировав каждое подключённое устройство и выкинув каждого пользователя из системы, как при принудительном обрыве. На возврат системы в строй уйдёт 24 часа, а повреждения компонентов составят 10% полной стоимости железа сети. Корпы держат это действие для крайних случаев, когда кажется несомненным, что вторженец в киберпространстве вот-вот сделает что-то ещё худшее. Надвигающееся отключение очевидно всем в системе.\n\n\n**Действия кибердеки**\n**Скопировать файл (Перемещение):** Сделать копию файла данных, находящегося в твоём текущем узле, и сохранить её в Памяти деки. Из-за неизбежной обёртки из антивзломного кода и логов почти любой важный файл данных занимает один пункт Памяти, каким бы малым ни было само содержимое.\n**Удалить локальный файл (Перемещение):** Стереть один файл данных, Глагол или Объект на своём кибердеке, освободив занимаемую им Память. Удаление файлов в узле сервера, где у тебя нет админ-прав, требует Глагола *Стереть*: локальная сеть может не позволить такое вмешательство.\n**Отдать команду (Основное):** Глаголы вроде *Захватить* или *Обмануть* перехватывают контроль над устройствами или дают длительное влияние на систему. Приказ подконтрольной цели что-то сделать занимает основное действие. Подконтрольная, но не получившая приказа цель продолжит делать то, что ей велели последним. Если это невозможно или неосуществимо, она не будет делать ничего, пока не получит новую команду.\n**Запустить программу (Основное):** Запустить программу с кибердеки хакера или с сервера сторожа, соединив Глагол с Объектом для получения нужного эффекта.\n**Завершить программу (Мгновенное):** Выключить запущенную хакером программу, освободив мощность ЦП. Программы автоматически завершаются, если хакера выбросило из сети, если его беспроводной сигнал заблокирован или если он иначе отрезан от намеченных целей."},
{"n":"4.3.0","l":2,"te":"Programs","tr":"Программы","en":"A program is made up of two parts: a Verb and a Subject. A hacker loads a selection of each into the memory of their cyberdeck, and as they need them, they pair any two to create the effects they need. While programs are flexible, they have some limitations.\nPrograms can only be run from cyberspace. If a hacker wants to blind a camera, they’ve got to jack into it first before they can run the Blind Verb with the Camera Subject. Programs with the Cyber, Drone or Transmission Subjects are an exception to this, and can be run directly to attack enemy cyberware or interact with local radio transmissions.\nMost Verbs cost a point of Access to run. Some very subtle Verbs may function without this cost.\nMost programs require a skill check against the Subject’s security difficulty. The more sophisticated and well-hardened the target, the harder it is to hack it, with difficulties given on the table in section 4.2.5. On a failure, the action and Access is wasted. Some Verbs are harder or easier to execute than others, and may apply a modifier to this skill check roll.\nPrograms take up one CPU slot while running. A cyberdeck with a CPU rating of 4, for example, can run no more than 4 programs at a time. Some Verbs auto-terminate after performing their task, while others are ongoing, and continue to have their effect as long as the program runs.\nPrograms terminate once the hacker jacks out or is knocked out. Once the cable gets pulled or the hacker goes unconscious, any program that the hacker was running automatically ends. If they’re connecting wirelessly to the target, as with programs affecting cyber or radio transmissions, their programs only terminate on unconsciousness, the Terminate Program Instant action, or if the target goes out of range.\nEach Verb or Subject takes up one point of deck Memory, and can be combined arbitrarily to make up a program. Programs can be used as often as the user wishes, so long as they have the CPU and Access needed to run them; the same Blind and Camera elements can be used to blind three different cameras at the same time so long as the deck has at least a CPU of 3 and the hacker takes three separate actions to run the program at different targets. Swapping utility choices requires an hour of recompiling.","ru":"Программа состоит из двух частей: Глагола и Объекта. Хакер загружает подборку тех и других в память своей кибердеки и по мере надобности спаривает любые два, создавая нужный эффект. Программы гибкие, но у них есть ограничения.\nПрограммы можно запускать только из киберпространства. Если хакер хочет ослепить камеру, он должен сначала подключиться к ней, и только потом сможет запустить Глагол *Ослепить* с Объектом *Камера*. Программы с Объектами *Кибер*, *Дрон* или *Передача* — исключение: их можно запускать напрямую, чтобы атаковать кибернетику врага или взаимодействовать с местными радиопередачами.\nБольшинство Глаголов стоят один пункт Доступа. Некоторые очень тонкие Глаголы работают и без этой платы.\nБольшинству программ нужна проверка навыка против сложности защиты Объекта. Чем изощрённее и лучше укреплена цель, тем труднее её взломать; сложности приведены в таблице в разделе 4.2.5. При провале действие и Доступ пропадают. Некоторые Глаголы выполнить труднее или легче других, и они могут накладывать модификатор на этот бросок проверки навыка.\nЗапущенная программа занимает один слот ЦП. Кибердека с ЦП 4, например, может держать одновременно не более 4 программ. Некоторые Глаголы автоматически завершаются, выполнив задачу, а другие длящиеся и продолжают действовать, пока программа работает.\nПрограммы завершаются, как только хакер отключается или его вырубают. Стоит выдернуть кабель или хакеру потерять сознание — любая запущенная им программа автоматически прекращается. Если он подключён к цели беспроводно, как в случае программ, действующих на кибер или радиопередачи, его программы завершаются только при потере сознания, мгновенным действием «Завершить программу» или если цель вышла из радиуса.\nКаждый Глагол или Объект занимает один пункт Памяти деки, и их можно сочетать произвольно, собирая программу. Программы можно использовать сколько угодно раз, пока хватает ЦП и Доступа на их запуск: одними и теми же элементами *Ослепить* и *Камера* можно ослепить три разные камеры одновременно, если у деки ЦП не меньше 3 и хакер потратит три отдельных действия на запуск программы по разным целям. Смена набора утилит требует часа перекомпиляции."},
{"n":"4.3.1","l":3,"te":"Acquiring Programs","tr":"Приобретение программ","en":"Getting a new Verb or Subject isn’t as simple as buying it off the rack or copying it from a friend. The programs that hackers use are profoundly illicit, programmed to sneak under corporate security barriers and ignore corporate spyware requirements. Each one is a work of digital art that relies on secret corporate database taps, spoofed security certificates, and unpatched exploit lists. If such a program was simply copied, the doubled hit on those resources would instantly flag both programs as threats and ruin them for any practical use.\nAs such, these programs are painstakingly designed one-by-one by expert criminal codesmiths and sold and traded among the hackers of a city. The prices given on the chart for Verbs and Subjects reflect the usual fees charged for such things; any competent hacker will know where to buy them.","ru":"Раздобыть новый Глагол или Объект не так просто, как купить с полки или скопировать у друга. Программы, которыми пользуются хакеры, глубоко нелегальны: они написаны так, чтобы проползать под корпоративными барьерами защиты и игнорировать корпоративные требования к шпионскому софту. Каждая — произведение цифрового искусства, опирающееся на секретные врезки в корпоративные базы данных, поддельные сертификаты защиты и списки незакрытых эксплойтов. Если такую программу просто скопировать, двойное обращение к этим ресурсам мгновенно помечает обе программы как угрозу и делает их бесполезными на практике.\nПоэтому такие программы кропотливо создают по одной экспертные криминальные кодеры, а затем продают и обменивают среди хакеров города. Цены, приведённые в таблице для Глаголов и Объектов, отражают обычную плату за такое; любой толковый хакер знает, где их купить."},
{"n":"4.3.2","l":3,"te":"Writing Programs","tr":"Написание программ","en":"Crafting a constant stream of usable Verbs and Subjects for sale is impractical for most PCs. The work requires contacts with a host of insider moles in corporate databases, criminal data launderers, and subject-field specialists in hardware security subversion.\nWhile few hackers have the time or resources to write illicit programs as a business, most can manage to keep a few of their most important needs satisfied through their own coding prowess. A sufficiently talented hacker skill can maintain a few usable Verbs and Subjects, keeping them up-to-date and concealed from ubiquitous corporate DRM.\nWriting a Verb or Subject takes at least Program-1 skill and one week, less one day per level of Program skill. Two such programs can be maintained at once per level of Program skill, so a PC with Program-2 can maintain up to four total Verbs and Subjects at once. They might choose to keep Glitch, Blind, Cyber, and Camera available this way, after a few weeks of work to write the code. Code that is abandoned in favor of a new program must be rewritten from scratch if the hacker needs it once again, as entirely new security bypasses must be researched and implemented.\nCharacters with the Hacker Edge gain eight Verbs or Subjects at the start of the game. These do not count against their programming limits and can be re-written if erased at the usual time requirements. They cannot be changed once selected, however.\nHackers can also write specialized or unique Subjects, often in preparation for a mission. If a hacker can find out the exact model of camera or electronic lock their target is using, they can write a unique Subject aimed at that specific device, gaining a +2 bonus on their skill checks to overcome its security difficulty.","ru":"Ставить на поток пригодные к делу Глаголы и Объекты на продажу для большинства ПИ нереально. Работа требует связей с целой оравой инсайдеров-кротов в корпоративных базах данных, криминальных отмывщиков данных и узких специалистов по взлому аппаратной защиты.\nМало у кого из хакеров есть время и ресурсы писать нелегальные программы как бизнес, но большинство способно закрыть несколько самых важных своих нужд собственным умением кодить. Достаточно талантливый хакер может поддерживать несколько рабочих Глаголов и Объектов, держа их в актуальном состоянии и скрытыми от повсеместного корпоративного DRM.\nНаписание Глагола или Объекта требует навыка Программирование-1 как минимум и одной недели, минус один день за уровень навыка Программирование. Одновременно можно поддерживать по две таких программы за уровень навыка Программирование, так что ПИ с Программирование-2 может поддерживать до четырёх Глаголов и Объектов сразу. Он может, скажем, держать так наготове *Сглючить*, *Ослепить*, *Кибер* и *Камера* — после нескольких недель работы над кодом. Код, брошенный в пользу новой программы, придётся писать с нуля, если он снова понадобится хакеру: надо будет исследовать и внедрить полностью новые обходы защиты.\nПерсонажи с Козырём *Хакер* получают восемь Глаголов или Объектов на старте игры. Они не учитываются в его лимите программирования и могут быть переписаны, если их стёрли, за обычное время. Однако после выбора их нельзя поменять.\nХакеры могут также писать специализированные или уникальные Объекты, часто в рамках подготовки к миссии. Если хакер сумеет выяснить точную модель камеры или электронного замка, которые использует его цель, он может написать уникальный Объект под это конкретное устройство, получив +2 на проверки навыка при преодолении его сложности защиты."},
{"n":"4.3.3","l":3,"te":"Program Subjects","tr":"Объекты программ","en":"The Subjects listed below are the ones most often relevant to an operator. Other Subjects do exist, as do more specialized, specific utilities that aim at specific types of devices or particular models of hardware.\n\n\nSubject                Cost        Subject Type\nAvatar                        $500        Avatar\nBarrier                        $1,000        Data\nCamera                $500        Device\nCyber                        $1,000        Cyber\nDatafile                $500        Data\nDoor                        $500        Device\nDrone                        $1,000        Device\nMachine                $500        Device\nProgram                $500        Program\nSensor                        $500        Device\nTransmission                $1,000        Data\nTurret                        $1,000        Device\nSpecialized Subject        x2        -\nUnique Subject        x4        -\n\n\nAvatar: A cyberspace avatar, whether one adopted by a hacker who’s jacked into the network or a Demon program standing guard there.\nBarrier: A network node barrier that blocks avatars from passing through a network connection.\nCamera: Any device that transmits audiovisual information. Some defensive hardware has its own onboard camera, which is susceptible to this target, while others rely on a separate device’s input.\nCyber: A cybernetic system in a visible subject within 30 meters with no significant obstacles to line of sight. Unlike most Subjects, it’s not necessary for a hacker to manifest an avatar inside the target node to affect cyber systems; they can launch their program directly at it, and the system itself need not be visible on the target’s body. Given the difficulty of affecting cyber wirelessly, many hackers prefer to use more specific Subjects for a +1 bonus, such as Nerve Cyber or Limb Cyber.\nDatafile: A datafile stored within a cyberspace location. While individual files may have very little actual data in them, the autoencryption functions and anti-tamper code they’re wrapped in almost always take up a full unit of Memory per file .\nDoor: A physical door, shutter, hatch, or other barrier with an electronic lock or opening mechanism.\nDrone: A remote-controlled drone. The base difficulty is equal to 7 plus the operator’s level or HD/3, rounded up, or 8 if it’s not actively controlled. Like the Cyber Subject, it is not necessary to manifest in a drone’s node to hack it wirelessly.\nMachine: Security panels, factory machinery, electronic minefields, or any other hackable device not covered under an existing Subject. Its generality applies a +1 penalty to the security difficulty.\nProgram: A hostile program, used most often with the Terminate verb to end the effects of an enemy hacker’s programs prematurely.\nSensor: Similar to the Camera element, this code block handles sensors of any kind, regardless of what they are intended to detect. The generality of the element decreases its efficiency, however, and it applies a +1 security difficulty penalty.\nTransmission: Ambient radio transmissions can be affected with this element, most often for the purpose of tampering with local comms. A hacker need not be jacked into a cyberspace node to target local radio transmissions, but the usual -2 check penalty for wireless hacking applies.\nTurret: A security turret, emplaced gun, or other fixed automated weapon.","ru":"Перечисленные ниже Объекты — те, что чаще всего нужны оператору. Существуют и другие Объекты, а также более специализированные, узкие утилиты, нацеленные на конкретные типы устройств или отдельные модели железа.\n\n\n| Объект | Цена | Тип Объекта |\n|---|---|---|\n| Аватар | $500 | Аватар |\n| Барьер | $1 000 | Данные |\n| Камера | $500 | Устройство |\n| Кибер | $1 000 | Кибер |\n| Файл данных | $500 | Данные |\n| Дверь | $500 | Устройство |\n| Дрон | $1 000 | Устройство |\n| Машина | $500 | Устройство |\n| Программа | $500 | Программа |\n| Сенсор | $500 | Устройство |\n| Передача | $1 000 | Данные |\n| Турель | $1 000 | Устройство |\n| Специализированный Объект | ×2 | – |\n| Уникальный Объект | ×4 | – |\n\n\n**Аватар:** Аватар в киберпространстве — как взятый хакером, подключившимся к сети, так и тот, под которым стоит на страже программа-Демон.\n**Барьер:** Барьер узла сети, не пускающий аватары через сетевое соединение.\n**Камера:** Любое устройство, передающее аудиовизуальную информацию. У части защитного железа есть своя встроенная камера, уязвимая для этой цели, а часть полагается на вход с отдельного устройства.\n**Кибер:** Кибернетическая система в видимой цели в пределах 30 м без значимых препятствий на линии видимости. В отличие от большинства Объектов, хакеру не нужно проявлять аватар внутри узла цели, чтобы воздействовать на кибер-системы: он может запустить программу прямо по ней, и сама система не обязана быть видна на теле цели. Учитывая, как трудно действовать на кибер беспроводно, многие хакеры предпочитают более узкие Объекты ради бонуса +1 — например *Нервный кибер* или *Кибер конечности*.\n**Файл данных:** Файл данных, хранящийся в некоем месте киберпространства. Хотя отдельные файлы могут содержать очень мало реальных данных, функции автошифрования и антивзломный код, в которые они обёрнуты, почти всегда занимают полную единицу Памяти на файл.\n**Дверь:** Физическая дверь, ставня, люк или иная преграда с электронным замком или механизмом открывания.\n**Дрон:** Дрон на дистанционном управлении. Базовая сложность равна 7 плюс уровень или КЗд/3 оператора, с округлением вверх, либо 8, если дрон не управляется активно. Как и с Объектом *Кибер*, для беспроводного взлома дрона не обязательно проявляться в его узле.\n**Машина:** Пульты охраны, заводское оборудование, электронные минные поля или любое другое взламываемое устройство, не покрытое существующим Объектом. Из-за своей общности накладывает штраф +1 к сложности защиты.\n**Программа:** Враждебная программа; чаще всего используется с Глаголом *Завершить*, чтобы преждевременно прекратить эффекты программ враждебного хакера.\n**Сенсор:** Похож на элемент *Камера*; этот блок кода работает с сенсорами любого вида, независимо от того, что они должны обнаруживать. Однако общность элемента снижает его эффективность, и он накладывает штраф +1 к сложности защиты.\n**Передача:** Этим элементом можно воздействовать на окружающие радиопередачи, чаще всего чтобы влезть в местную связь. Хакеру не нужно быть подключённым к узлу киберпространства, чтобы взять на прицел местные радиопередачи, но обычный штраф -2 за беспроводной взлом действует.\n**Турель:** Охранная турель, стационарная пушка или другое неподвижное автоматическое оружие."},
