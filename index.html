heir next maintenance interval.\nLevel 2: The quality of your cyber maintenance improves; the System Strain decrease is equal to two points now instead of one. You never fail to install cyberware correctly. Once per patient, you can build and install a cyber modification to a system as described in section 2.8.2 without any cost in money or experimental components, assuming you have the requisite skill levels to build it.\nDeadeye\nYou have a gift with ranged weapons. While this talent most commonly applies to guns, it is also applicable to thrown weapons or other ranged weapons that can be used with the Shoot skill. For thrown weapons, you can’t use the benefits of the Armsmaster Focus at the same time as Deadeye.\nLevel 1: Gain Shoot as a bonus skill. You can Ready a Stowed ranged weapon as an Instant action. You may use a rifle or two-handed ranged weapon even when an enemy is within melee range, albeit at a -4 hit penalty. You may add your Shoot skill level to a ranged weapon’s damage roll.\nLevel 2: You can reload guns, crossbows, or other slow-loading weapons as an On Turn action, provided they don’t take more than a round to reload. You can use ranged weapons of any size in melee without penalty. Once per scene, as an On Turn action when target shooting at an inanimate, non-creature target, you automatically hit unless you roll a 2 on your Shoot skill check or the shot is physically impossible.\nDiplomat\nYou know how to get your way in personal negotiations, and can manipulate the attitudes of those around you. Even so, while smooth words are versatile, they’ll only work if your interlocutor is actually willing to listen to you.\nLevel 1: Gain Talk as a bonus skill. You speak all the languages common to the city and can learn new ones to a workable level in a week, becoming fluent in a month. Reroll 1s on any skill check dice related to negotiation or diplomacy.\nLevel 2: Once per game session, shift an intelligent NPC’s reaction roll one step closer to friendly if you can talk to them for at least thirty seconds.\nDrone Pilot\nWhile anyone can drive a drone under casual circumstances, your knack for it is something unusual.\nLevel 1: Gain Drive and Fix as bonus skills. You acquire or start play with a Remote Control Unit cybersystem and its installation. Through connections, scavenging, and parts repurpose, you have free drones and their weapons and fittings worth no more than the budget given in section 1.6.2. You can repair these drones without needing spare parts, and destroyed drones can be replaced with a week’s work. You always have the equivalent of a drone repair kit on you at no Encumbrance cost.\nLevel 2: You can use the Assume Command drone action once per round as an On Turn action. Once per scene, gain a bonus Main Action to command a drone. Any drones you control gain a +2 bonus to their hit rolls, whether or not you’re personally firing their weaponry.\nExpert Programmer\nA skilled hacker can program their own utilities, but you take this expertise far beyond the norm.\nLevel 1: Gain Program as a bonus skill. You can create and maintain an additional number of program elements equal to your character level+2, split among Verbs and Subjects as you see fit as explained in section 4.3.0. You can change your choices with a week’s work. Once per day, as an On Turn action, you can make an on-the-fly edit to a Subject program element to turn it into any other Subject program element you need. The element remains altered until you change it again.\nLevel 2: Your programs are exceedingly efficient. Any program elements you write take up only half the usual Memory. A cyberdeck you use gains a CPU bonus equal to your Program skill level.\nHealer\nHealing comes naturally to you, and you’re particularly gifted at preventing the quick bleed-out of wounded allies and comrades.\nLevel 1: Gain Heal as a bonus skill. You may attempt to stabilize one mortally-wounded adjacent person per round as an On Turn action. When rolling Heal skill checks, roll 3d6 and drop the lowest die.\nLevel 2: Pharmaceuticals or other technological healing devices applied by you heal twice as many hit points as normal. Using only basic medical supplies, you can heal 1d6+Heal skill hit points of damage to every injured or wounded person in your group with ten minutes of first aid spread among them. Such healing adds no System Strain, but can be applied to a given target only once per day.\nHenchkeeper\nYou have a distinct knack for picking up lost souls who willingly do your bidding. You might induce them with promises of money, power, excitement, sex, or some other prize that you may or may not eventually grant. A henchman obtained with this Focus will serve in loyal fashion until clearly betrayed or placed in unacceptable danger. Henchmen are not “important” people, and are usually marginal sorts, criminals, the desperate, or other persons with few options.\nYou can use more conventional pay or inducements to acquire additional henchmen, but these extra hirelings are no more loyal or competent than your pay and treatment can purchase.\nLevel 1: Gain Lead as a bonus skill. You can acquire henchmen within 24 hours of arriving in a community, assuming anyone is suitable hench material. These henchmen will not fight except to save their own lives, but will go with you on missions and risk great danger to help you. Most corper henchmen will have 5 HP, a +0 attack bonus, and a Morale of 7, plus whatever gear they’re given. Slum-dwellers and other natives of harsh societies will fight as Street Thugs per page 188 if pressed. You can have one henchmen at a time for every three character levels you have, rounded up. You can release henchmen with no hard feelings at any plausible time and pick them back up later should you be without a current henchman.\nLevel 2: Your henchmen are remarkably loyal and determined, and will fight for you against anything but clearly overwhelming odds. Whether through natural competence or their devotion to you, they’re treated as a Basic Corp Security from page 186. You can make faithful henchmen out of skilled and highly-capable NPCs, but this requires that you actually have done them some favor or help that would reasonably earn such fierce loyalty.\nMany Faces\nYou have multiple usable identities registered with corporate and governmental databases. These identities are so deeply embedded in the systems that they’re almost impossible to pry out unless you do something to compromise them.\nLevel 1: Gain Sneak as a bonus skill. You can maintain one alternate identity at a time per three character levels, rounded up. These identities have their own names, backgrounds, criminal records, financial dealings, and bank accounts, and will register as authentic to all normal corporate and governmental checks. If an identity is compromised or you want a different one, you can replace it with a week’s work. False identities cannot be important people or involve corporations you don’t have a Contact in already.\nPop Idol\nWhether a street musician, graffiti artist, underground journalist, cam girl, folk singer, or Robin Hood-esque thief, you have a devoted following of enthusiasts who are willing to help you when you need them.\nLevel 1: Gain Perform as a bonus skill. Once per game week, with an hour or so of messaging, you can mobilize about a hundred of your fans to perform some act of your choice, provided it’s no more than mildly criminal or slightly dangerous. Flash mobs, getaway drivers, scouting reports, tailing people, or instant parties might all qualify as services. Your fans don’t have any special skills, but they’ll do anything ordinary workers or civilians could do. If you mobilize them for donations or merch purchases, you get $1,000 per character level, doubled at fifth level and quadrupled at tenth. You can’t mobilize them to buy your content more than once per month.\nLevel 2: You can mobilize up to a hundred fans per character level, though major mobs are likely to draw a law enforcement response. You’ve cultivated fan leaders who can pass along your wishes deniably, concealing your involvement in the crowd. Your donation and merch earning amounts double. Your Charisma modifier increases by +1, to a maximum of +2.\nRoamer\nYou might be a footloose bum with a knack for stowing aboard cargo shipments, a hard-bitten outlander smuggler, or a restless seeker of the horizon. Either way, you’ve seen more of the world with your own two eyes than any common corper ever will.\nLevel 1: Gain Survive and Drive as bonus skills. You have conversational skill in all common languages spoken in the region or city, and you never get lost. You have “acquired” one or more vehicles worth no more than the budget given in section 1.6.2. You can replace lost or damaged vehicles at a rate of $10,000 per week.\nLevel 2: Once per scene, as an Instant action, you can reroll a failed skill check related to safe traveling or vehicle operation, whether to fix a blown engine or talk down a ganger who doesn’t like strangers crossing his turf.\nSafe Haven\nYou have the contacts and expertise to find safehouses and bolt holes that no one else would think to find. You know how to persuade landlords into helping you for nebulous future advantages.\nLevel 1: Gain Sneak as a bonus skill. If you spend a week in a particular neighborhood, you can find or arrange a secure safe house and the on-call assistance of a local cyberdoc or medic willing to perform emergency care for no more than you can afford to pay. This safe house will always go unnoticed unless you are at Heat 8+ or specifically compromise it; even in that case, it will remain undiscovered for at least 24 hours if you can get to it without being followed. If a safe house is burnt, you can find a new one with another week’s work. A PC can’t have more safe houses active at once than their character level.\nLevel 2: Your safe houses are actively protected by the local authorities, be they gang members, paid-off cops, or cooperative corp security. Provided you don’t make them angry, they’ll defend you from most ordinary degrees of pursuit. You can find safe havens geared with the equivalent of tech workshops or level one cyberclinics.\nShocking Assault\nYou’re extremely dangerous to enemies around you. The ferocity of your melee attacks stresses and distracts enemies even when your blows don’t draw blood.\nLevel 1: Gain Punch or Stab as a bonus skill. The Shock damage of your weapon treats all targets as if they were AC 10, assuming your weapon is capable of harming the target in the first place and the target is not immune to Shock.\nLevel 2: In addition, you gain a +2 bonus to the Shock damage rating of all melee weapons and unarmed attacks that do Shock. As usual, regular hits never do less damage than this Shock would do.\nSniper’s Eye\nYou are an expert at placing a bullet or arrow on an unsuspecting target. These special benefits only apply when making an Execution Attack with a gun, bow, or thrown weapon, as described in section 2.4.7.3.\nLevel 1: Gain Shoot as a bonus skill. When making a skill check for a ranged Execution Attack or target shooting, roll 3d6 and drop the lowest die.\nLevel 2: You don’t miss ranged Execution Attacks. A target hit by one takes a -4 penalty on the Physical saving throw to avoid immediate mortal injury. Even if the save is successful, the target takes double the normal damage inflicted by the attack.\nSpecialist\nYou are remarkably talented at a particular skill. Whether a marvelous cat burglar, a natural athlete, a brilliant engineer, or some other savant, your expertise is extremely reliable. You may take this Focus more than once for different skills.\nLevel 1: Gain a non-combat skill as a bonus. Roll 3d6 and drop the lowest die for all skill checks in this skill.\nLevel 2: Roll 4d6 and drop the two lowest dice for all skill checks in this skill.\nTinker\nYou have a natural talent for modifying and improving equipment, as given in the rules in section 2.8.2.\nLevel 1: Gain Fix as a bonus skill. Your Maintenance score is doubled, allowing you to maintain twice as many mods. Vehicle, cyber, and gear mods cost only half their usual price in dollars, though experimental component requirements remain the same.\nLevel 2: Your Fix skill is treated as one level higher for purposes of building and maintaining mods and calculating your Maintenance score, up to a maximum of Fix-5. Advanced mods require one fewer experimental components to make, down to a minimum of zero.\nUnarmed Combatant\nYour empty hands are more dangerous than knives in the grip of the less gifted. Your unarmed attacks are counted as melee weapons when it comes to binding up opponents wielding pistols, rifles and similar ranged arms, though you need at least one hand free to do so.\nLevel 1: Gain Punch as a bonus skill. Your unarmed attacks become more dangerous as your Punch skill increases. At level-0, they do 1d6 damage. At level-1, they do 1d8 damage. At level-2 they do 1d10, level-3 does 1d12, and level-4 does 1d12+1. At Punch-1 or better, they have the Shock quality equal to your Punch skill against AC 15 or less. While you normally add your Punch skill level to any unarmed damage you inflict, don’t add it twice to Shock damage. If you choose to strike lethally with unarmed attacks, they have a Trauma Die of 1d6 and a Trauma Rating of x2.\nLevel 2: Even on a miss with a Punch attack, you do an unmodified 1d6 damage, plus any Shock that the blow might inflict on the target. Your Trauma Die becomes 1d8 for lethal attacks.\nUnique Gift\nYour PC has a unique piece of cyberware, an exceptional human ability, or some experimental genetic modification that grants them some benefit that isn’t covered under existing options.\nThis benefit shouldn’t be a simple bonus to something you already do; it should be a power or ability that gives you options that you just wouldn’t have otherwise. It also shouldn’t be used to simply optimize an existing character concept, but instead should allow you to make a character who wouldn’t make sense without this special ability.\nIt’s up to the GM to decide what’s reasonable and fair to be covered under this gift, and whatever they allow should be roughly equivalent to the existing Focus options in overall power If an ability is particularly powerful or the cybernetics are especially draining, it might require the user to take System Strain to use it, as described on page 40.\nAs a general rule this ability should be better than a piece of gear the PC could buy. The player is spending a very limited resource when they make this Focus pick, so what they get should be good enough that they can’t just duplicate it with a fat bank account.\nUnregistered\nWhether by unrecorded birth, database corruption, or sheer luck, you simply do not exist in any government or corporate database. If taken with the Many Faces Focus, your own identity is lost, but you can create others for your own uses. If this Focus is taken after character creation, it means your existing records have become hopelessly corrupted and lost.\nLevel 1: You have no government or corporate database records associated with you, and it is almost impossible to add any such records without them ending up corrupted or deleted within a week. Human beings can remember you, but they can’t rely on computerized records to keep track of you or your activities. You can keep money on credit chips or in cash, but banking or formal property ownership is almost impossible for you.\nWhirlwind Assault\nYou are a frenzy of bloody havoc in melee combat, and can hack down numerous lesser foes in close combat… assuming you survive being surrounded.\nLevel 1: Gain Stab or Punch as a bonus skill. Once per scene, as an On Turn action, apply your Shock damage to all foes within melee range, assuming they’re susceptible to your Shock. \nLevel 2: The first time you kill someone in a round with a normal attack, either with its rolled damage on a hit or with the Shock damage it inflicts, instantly gain a second attack on any target within range using any Ready weapon you have.","ru":"#### Ас за рулём\n\nЕсли у этого есть колёса или крылья — ты сможешь этим управлять. Твоё Происхождение может тяготеть к какому-то конкретному типу транспорта, но природный талант позволяет тебе водить любую машину почти инстинктивно. Впрочем, на пилотирование дронов выгоды этого Фокуса не распространяются.\n\n**Уровень 1:** Получи Вождение как бонусный навык. Ты «раздобыл» транспорт на сумму не больше бюджета, указанного в разделе 1.6.2, и можешь возмещать потерянное или уничтоженное снаряжение со скоростью $10 000 в неделю. Раз за сцену, Мгновенным действием, перебрось неудачную проверку навыка, связанную с вождением либо с обслуживанием и ремонтом транспорта.\n\n**Уровень 2:** Получи Ремонт как бонусный навык. Скорость машины, которой ты управляешь, увеличивается на 1 пункт. Один раз на каждую машину ты можешь поставить на неё мод бесплатно, игнорируя затраты денег и экспериментальных компонентов. Эффективно пользоваться этим модом можешь только ты, зато Обслуживания он не требует. Сменить этот бесплатный мод можно за неделю простоя.\n\n#### Бдительный\n\nТы остро воспринимаешь всё вокруг, и застать тебя врасплох практически невозможно. Врождённая быстрота реакции помогает тебе действовать раньше, чем менее осторожные успеют подумать о том, чтобы шевельнуться.\n\n**Уровень 1:** Получи Внимание как бонусный навык. Тебя нельзя застигнуть врасплох, и нельзя применить к тебе Казнящую атаку. Когда твоя группа бросает инициативу, твоя бдительность позволяет ей бросить дважды и взять лучший результат.\n\n**Уровень 2:** В дополнение к выгодам уровня 1 ты всегда действуешь первым в боевом раунде — если только кто-то ещё из участников не так же Бдителен.\n\n#### Всё своё\n\nТвой разум и тело одарены превосходно, но именно это совершенство делает тебя глубоко несовместимым с большинством кибера. Ты не можешь принимать импланты, кроме мелких косметических с немодифицированной стоимостью Системной нагрузки в ноль. Если Мастер смешивает правила из нескольких игр линейки Without Number, этот Фокус не следует разрешать, кроме случаев, когда кибернетика — ожидаемое снаряжение для всех ПИ. Если ты используешь правила магии из делюкс-версии, ПИ с магическими или психическими Козырями вроде Заклинателя, Призывателя или Благословённого не могут взять этот Фокус.\n\n**Уровень 1:** Получи любой навык как бонусный. Выбери характеристику; её модификатор увеличивается на +1, максимум до +3. Ещё один такой выбор характеристики ты можешь сделать на уровнях 3, 5, 7 и 10, беря ту же характеристику или другую. Травматичные попадания ты по-прежнему можешь получать, но серьёзных травм, описанных на стр. 41, ты не получаешь никогда.\n\n#### Оружейный мастер\n\nУ тебя необычная сноровка с метательным оружием и атаками в ближнем бою. Выгоды этого Фокуса не распространяются на безоружные атаки и на стрелковое оружие, которое не метают. Бонусы этого Фокуса также не складываются с Верным глазом и другими Фокусами, которые добавляют уровень навыка к твоему урону или Шоку.\n\n**Уровень 1:** Получи Клинок как бонусный навык. Ты можешь взять в готовность оружие ближнего боя или метательное оружие из укладки Мгновенным действием. Ты можешь добавлять уровень навыка Клинок к броску урона или урону Шока оружия ближнего боя либо метательного — при условии, что они у него вообще есть.\n\n**Уровень 2:** Шок от твоих атак в ближнем бою всегда считает цель так, будто у неё КЗщ 10. Получи бонус +1 к попаданию всеми метательными атаками и атаками в ближнем бою.\n\n#### Убийца\n\nТы наловчился убивать внезапно и обладаешь определёнными преимуществами при выполнении Казнящей атаки по правилам раздела 2.4.7.3.\n\n**Уровень 1:** Получи Скрытность как бонусный навык. Ты можешь спрятать предмет не крупнее ножа или пистолета от всего, что менее навязчиво, чем досмотр с раздеванием, включая обычные детекторы оружия. Ты можешь достать или извлечь этот предмет Действием в свой ход, а твои атаки на расстоянии в упор, сделанные им по застигнутой врасплох цели, не могут промахнуться.\n\n**Уровень 2:** Ты можешь взять Действие перемещения в тот же раунд, в котором делаешь Казнящую атаку, быстро сблизившись с целью перед атакой. Делая Казнящую атаку, ты можешь разделить это Действие перемещения: часть до того, как убьёшь цель, и часть после. Это перемещение происходит слишком быстро, чтобы насторожить жертву или чтобы ему помешали телохранители, не стоящие прямо на твоём пути.\n\n#### Властность\n\nВ тебе есть какая-то нездешняя харизма, из-за которой другие инстинктивно исполняют твои указания и продвигают твои дела. Там, где этот Фокус говорит о последователях, речь об NPC, которые добровольно выбрали служить тебе. ПИ никогда не считаются последователями.\n\n**Уровень 1:** Получи Лидерство как бонусный навык. Раз в день ты можешь обратиться с просьбой к NPC, который не настроен к тебе открыто враждебно, бросив проверку Хар/Лидерство со сложностью, равной значению боевого духа этого NPC. При успехе он выполнит просьбу, если она не вредна для него и не слишком ему несвойственна.\n\n**Уровень 2:** Те, кто идёт за тобой, полны уверенности. Любой NPC под твоим прямым руководством получает бонус к боевому духу и броску попадания, равный твоему навыку Лидерство, и бонус +1 ко всем проверкам навыков. Твои последователи не станут действовать против твоих интересов, кроме как под крайним давлением.\n\n#### Ближний бой\n\nТы слишком много практиковался в схватках вплотную и отчаянной возне с пистолетом или клинком. Ты крайне ловко избегаешь ран в ближнем бою, а на уровне 2 можешь проскочить через свалку, не боясь получить нож на ходу.\n\n**Уровень 1:** Получи любой боевой навык как бонусный. Ты можешь применять оружие дальнего боя размером с пистолет в ближнем бою, не получая штрафов за близость атакующих в ближнем бою. Ты игнорируешь урон Шока от нападающих в ближнем бою, даже если в этот момент ты без брони.\n\n**Уровень 2:** Урон Шока от твоих атак в ближнем бою считает все цели так, будто у них КЗщ 10. Боевое действие Боевой отход считается для тебя Действием в свой ход и выполняется свободно.\n\n#### Кибердок\n\nЛюбой умелый медик может вживлять и обслуживать кибер-системы, но у тебя к этой работе особый талант.\n\n**Уровень 1:** Получи Ремонт и Медицину как бонусные навыки. Ты начинаешь игру с набором кибердока и можешь вживлять кибернетику даже с навыком Медицина уровня-0. Ты получаешь бонус +2 ко всем проверкам навыка при операциях по вживлению кибера. Если ты проводишь кому-то обслуживание кибера, тонкость твоих настроек снижает суммарную стоимость Системной нагрузки его имплантов на один пункт до следующего интервала обслуживания.\n\n**Уровень 2:** Качество твоего кибер-обслуживания растёт: снижение Системной нагрузки теперь равно двум пунктам, а не одному. Ты никогда не ошибаешься при установке кибернетики. Один раз на каждого пациента ты можешь изготовить и установить кибер-модификацию системы, как описано в разделе 2.8.2, без затрат денег и экспериментальных компонентов — при условии, что у тебя есть нужные уровни навыков, чтобы её сделать.\n\n#### Верный глаз\n\nУ тебя дар к оружию дальнего боя. Чаще всего этот талант применяется к огнестрельному оружию, но он годится и для метательного или иного оружия дальнего боя, которое используется с навыком Стрельба. Для метательного оружия ты не можешь пользоваться выгодами Фокуса Оружейный мастер одновременно с Верным глазом.\n\n**Уровень 1:** Получи Стрельба как бонусный навык. Ты можешь взять в готовность оружие дальнего боя из укладки Мгновенным действием. Ты можешь применять винтовку или двуручное оружие дальнего боя, даже когда враг на дистанции ближнего боя, хоть и со штрафом -4 к попаданию. Ты можешь добавлять уровень навыка Стрельба к броску урона оружия дальнего боя.\n\n**Уровень 2:** Ты можешь перезаряжать огнестрельное оружие, арбалеты и другое медленно заряжаемое оружие Действием в свой ход, если на перезарядку уходит не больше раунда. Ты можешь применять оружие дальнего боя любого размера в ближнем бою без штрафа. Раз за сцену, Действием в свой ход, при стрельбе по мишени — неживой, не по существу — ты попадаешь автоматически, если только не выбросил 2 на проверке навыка Стрельба или выстрел не является физически невозможным.\n\n#### Дипломат\n\nТы знаешь, как добиться своего в личных переговорах, и умеешь управлять настроем окружающих. И всё же, хоть гладкие речи и универсальны, работают они лишь тогда, когда собеседник действительно готов тебя слушать.\n\n**Уровень 1:** Получи Убеждение как бонусный навык. Ты говоришь на всех языках, распространённых в городе, и можешь выучить новый до рабочего уровня за неделю, а до беглого — за месяц. Перебрасывай единицы на костях любых проверок навыков, связанных с переговорами или дипломатией.\n\n**Уровень 2:** Раз за игровую сессию сдвинь проверку реакции разумного NPC на один шаг в сторону дружелюбия, если сможешь поговорить с ним хотя бы тридцать секунд.\n#### Пилот дронов\nВодить дрон при спокойной обстановке может любой, но твоё чутьё к этому делу — нечто необычное.\n**Уровень 1:** Получи Вождение и Ремонт как бонусные навыки. Ты приобретаешь или начинаешь игру с кибер-системой Блок дистанционного управления и её установкой. Через связи, поиск по свалкам и переделку запчастей у тебя есть бесплатные дроны, их оружие и оснастка на сумму не больше бюджета, указанного в разделе 1.6.2. Ты можешь ремонтировать эти дроны без запчастей, а уничтоженные дроны заменяются за неделю работы. У тебя всегда при себе есть эквивалент набора для ремонта дронов без затрат Загруженности.\n**Уровень 2:** Ты можешь применять действие дрона «Принять командование» раз в раунд как Действие в свой ход. Раз за сцену получай бонусное Основное действие для команды дрону. Все дроны под твоим управлением получают +2 к своим атакам, независимо от того, стреляешь ли ты сам из их оружия.\n#### Опытный программист\nУмелый хакер может писать себе утилиты, но ты доводишь это мастерство далеко за пределы нормы.\n**Уровень 1:** Получи Программирование как бонусный навык. Ты можешь создавать и поддерживать дополнительное количество элементов программ, равное уровню персонажа+2, распределяя их между Глаголами и Объектами как захочешь — как описано в разделе 4.3.0. Ты можешь изменить свой выбор за неделю работы. Раз в день как Действие в свой ход ты можешь на ходу переписать элемент программы-Объект, превратив его в любой другой нужный тебе Объект. Элемент остаётся изменённым, пока ты не переделаешь его снова.\n**Уровень 2:** Твои программы предельно эффективны. Любые написанные тобой элементы программ занимают лишь половину обычной Памяти. Кибердека, которой ты пользуешься, получает бонус к ЦП, равный твоему уровню навыка Программирование.\n#### Целитель\nЛечение даётся тебе само собой, и особенно хорошо у тебя получается не дать раненым союзникам и товарищам истечь кровью.\n**Уровень 1:** Получи Медицину как бонусный навык. Ты можешь пытаться стабилизировать одного смертельно раненного человека вплотную к тебе за раунд как Действие в свой ход. При проверках навыка Медицина бросай 3d6 и отбрасывай худшую кость.\n**Уровень 2:** Фармацевтика и прочие технологические лечебные средства, применённые тобой, восстанавливают вдвое больше пунктов здоровья, чем обычно. Имея лишь базовые медицинские материалы, ты можешь вылечить 1d6+Медицина пунктов здоровья урона каждому раненому или израненному в твоей группе, потратив десять минут первой помощи, распределённых между ними. Такое лечение не добавляет Системной нагрузки, но применяется к конкретной цели лишь раз в день.\n#### Вожак подручных\nУ тебя особый талант подбирать потерянные души, готовые добровольно исполнять твою волю. Ты можешь завлекать их обещаниями денег, власти, азарта, секса или иной награды, которую в итоге дашь или не дашь. Подручный, полученный этим Фокусом, служит верно, пока его явно не предадут или не поставят под неприемлемую угрозу. Подручные — люди не «важные», обычно это маргиналы, преступники, отчаявшиеся или иные люди с небольшим выбором.\nТы можешь использовать более обычную плату или посулы, чтобы набрать дополнительных подручных, но эти лишние наёмники верны и умелы ровно настолько, насколько это купят твои деньги и обращение.\n**Уровень 1:** Получи Лидерство как бонусный навык. Ты можешь обзавестись подручными в течение 24 часов после прибытия в поселение, если там вообще есть подходящий материал. Эти подручные не станут драться, кроме как спасая свою жизнь, но пойдут с тобой на миссии и пойдут на большой риск, чтобы тебе помочь. У большинства корпоратов-подручных будет 5 ПЗ, бонус атаки +0 и боевой дух 7, плюс то снаряжение, что им выдали. Обитатели трущоб и прочие уроженцы суровых обществ будут драться как Уличные хулиганы со стр. 188, если их припрут к стенке. У тебя может быть один подручный за каждые три уровня персонажа, с округлением вверх. Ты можешь отпустить подручных без обид в любой разумный момент и снова подобрать их позже, если останешься без подручного.\n**Уровень 2:** Твои подручные удивительно верны и решительны, они будут драться за тебя против всего, кроме явно превосходящих сил. Благодаря природной толковости или преданности тебе они считаются Рядовой корп-охраной со стр. 186. Ты можешь сделать верными подручными умелых и очень способных NPC, но для этого нужно, чтобы ты действительно оказал им услугу или помощь, которая разумно заслуживает такой яростной верности.\n#### Много лиц\nУ тебя несколько рабочих личностей, зарегистрированных в корпоративных и государственных базах данных. Эти личности вписаны в системы так глубоко, что выковырять их почти невозможно, если ты сам их не засветишь.\n**Уровень 1:** Получи Скрытность как бонусный навык. Ты можешь поддерживать одну альтернативную личность за каждые три уровня персонажа, с округлением вверх. У этих личностей свои имена, биографии, судимости, финансовые операции и банковские счета, и все обычные корпоративные и государственные проверки признают их подлинными. Если личность засветилась или ты хочешь другую, ты можешь заменить её за неделю работы. Фальшивые личности не могут быть важными людьми и не могут быть связаны с корпорациями, в которых у тебя ещё нет Контакта.\n#### Поп-идол\nУличный музыкант, графитчик, подпольный журналист, кам-герла, народный певец или вор в духе Робин Гуда — кем бы ты ни был, у тебя есть преданная свита энтузиастов, готовых помочь, когда они тебе нужны.\n**Уровень 1:** Получи Выступление как бонусный навык. Раз в игровую неделю, потратив примерно час на рассылку сообщений, ты можешь поднять около сотни своих фанатов на какое-нибудь дело по твоему выбору, если оно не более чем слегка криминально или чуть-чуть опасно. Флешмобы, водители на отходе, разведданные, слежка за людьми или мгновенная вечеринка — всё это подойдёт как услуга. Особых навыков у твоих фанатов нет, но они сделают всё, что могли бы сделать обычные работяги или гражданские. Если поднимешь их на донаты или закупку мерча, ты получишь $1 000 за уровень персонажа, вдвое больше на пятом уровне и вчетверо — на десятом. Поднимать их на покупку твоего контента можно не чаще раза в месяц.\n**Уровень 2:** Ты можешь поднять до сотни фанатов за уровень персонажа, хотя крупные толпы, скорее всего, привлекут реакцию правоохранителей. Ты вырастил лидеров фанатов, которые передают твои пожелания так, что не докажешь, скрывая твою причастность к толпе. Твои доходы с донатов и мерча удваиваются. Твой модификатор Харизмы растёт на +1, максимум до +2.\n#### Скиталец\nМожет, ты неприкаянный бродяга с талантом устраиваться зайцем в грузовых перевозках, может — крепко потрёпанный контрабандист с пустошей, а может, беспокойный искатель горизонта. Так или иначе, ты своими глазами видел больше мира, чем любой обычный корпорат когда-либо увидит.\n**Уровень 1:** Получи Выживание и Вождение как бонусные навыки. Ты можешь говорить на разговорном уровне на всех распространённых языках региона или города и никогда не теряешь дорогу. Ты «приобрёл» один или несколько транспортных средств на сумму не больше бюджета, указанного в разделе 1.6.2. Ты можешь заменять потерянный или повреждённый транспорт со скоростью $10 000 за неделю.\n**Уровень 2:** Раз за сцену как Мгновенное действие ты можешь перебросить провальную проверку навыка, связанную с безопасным путешествием или управлением транспортом, — будь то починка сдохшего движка или уговор бандита, которому не нравятся чужаки на его районе.\n#### Убежище\nУ тебя есть связи и опыт, чтобы находить конспиративные квартиры и норы, о которых больше никто и не подумает. Ты умеешь убеждать домовладельцев помогать тебе за туманные будущие выгоды.\n**Уровень 1:** Получи Скрытность как бонусный навык. Если ты проведёшь неделю в определённом районе, ты можешь найти или устроить надёжное убежище и договориться о вызове местного кибердока или медика, готового оказать срочную помощь не дороже, чем ты можешь заплатить. Это убежище всегда останется незамеченным, если у тебя не Накал 8+ или ты сам его не засветишь; даже в этом случае его не найдут как минимум 24 часа, если ты доберёшься туда без хвоста. Если убежище сгорело, ты можешь найти новое за ещё одну неделю работы. У ПИ не может быть одновременно активных убежищ больше, чем его уровень персонажа.\n**Уровень 2:** Твои убежища активно защищают местные власти — члены банды, купленные копы или сговорчивая корп-охрана. Пока ты их не злишь, они прикроют тебя от большинства обычных видов преследования. Ты можешь находить убежища, оснащённые эквивалентом технических мастерских или киберклиник первого уровня.\n#### Шокирующий натиск\nТы крайне опасен для врагов рядом с тобой. Ярость твоих атак в ближнем бою давит и отвлекает противников, даже когда твои удары не пускают кровь.\n**Уровень 1:** Получи Кулак или Клинок как бонусный навык. Урон Шока от твоего оружия считает все цели как КЗщ 10, при условии, что твоё оружие вообще способно навредить цели и цель не защищена от Шока.\n**Уровень 2:** Вдобавок ты получаешь +2 к значению урона Шока всех оружий ближнего боя и рукопашных атак, которые наносят Шок. Как обычно, обычные попадания никогда не наносят меньше урона, чем нанёс бы этот Шок.\n#### Глаз снайпера\nТы мастер укладывать пулю или стрелу в ничего не подозревающую цель. Эти особые преимущества работают только при Казнящей атаке из огнестрела, лука или метательным оружием, как описано в разделе 2.4.7.3.\n**Уровень 1:** Получи Стрельбу как бонусный навык. При проверке навыка для дальнобойной Казнящей атаки или стрельбы по мишени бросай 3d6 и отбрасывай худшую кость.\n**Уровень 2:** Ты не промахиваешься дальнобойными Казнящими атаками. Цель, поражённая такой атакой, получает -4 на Физический спасброск, чтобы избежать немедленного смертельного ранения. Даже при успешном спасброске цель получает двойной обычный урон от атаки.\n#### Специалист\nТы замечательно талантлив в каком-то одном навыке. Изумительный домушник, природный атлет, блестящий инженер или иной савант — твоё мастерство крайне надёжно. Ты можешь взять этот Фокус несколько раз для разных навыков.\n**Уровень 1:** Получи небоевой навык как бонусный. Бросай 3d6 и отбрасывай худшую кость при всех проверках этого навыка.\n**Уровень 2:** Бросай 4d6 и отбрасывай две худшие кости при всех проверках этого навыка.\n#### Кулибин\nУ тебя природный талант к переделке и улучшению снаряжения, по правилам из раздела 2.8.2.\n**Уровень 1:** Получи Ремонт как бонусный навык. Твоё значение Обслуживания удваивается, позволяя поддерживать вдвое больше модов. Моды транспорта, кибера и снаряжения стоят лишь половину обычной цены в долларах, но требования к экспериментальным компонентам остаются те же.\n**Уровень 2:** Твой навык Ремонт считается на один уровень выше для целей создания и поддержания модов и расчёта значения Обслуживания, максимум до Ремонт-5. Продвинутым модам нужно на один экспериментальный компонент меньше, минимум до нуля.\n#### Рукопашник\nТвои пустые руки опаснее ножей в хвате менее одарённых. Твои рукопашные атаки считаются оружием ближнего боя, когда речь идёт о связывании противников с пистолетами, винтовками и подобным дальнобойным оружием, но для этого нужна хотя бы одна свободная рука.\n**Уровень 1:** Получи Кулак как бонусный навык. Твои рукопашные атаки становятся опаснее с ростом навыка Кулак. На уровне-0 они наносят 1d6 урона. На уровне-1 — 1d8 урона. На уровне-2 — 1d10, уровень-3 даёт 1d12, а уровень-4 — 1d12+1. При Кулак-1 и выше они получают качество Шок, равное твоему навыку Кулак, против КЗщ 15 или меньше. Хотя ты обычно добавляешь уровень навыка Кулак к любому рукопашному урону, не добавляй его дважды к урону Шока. Если ты решишь бить рукопашной атакой на смерть, у неё Кость травмы 1d6 и Множитель травмы ×2.\n**Уровень 2:** Даже при промахе атакой Кулаком ты наносишь немодифицированный 1d6 урона плюс любой Шок, который удар может нанести цели. Твоя Кость травмы становится 1d8 для летальных атак.\n#### Уникальный дар\nУ твоего ПИ есть уникальный кусок кибернетики, исключительная человеческая способность или некая экспериментальная генетическая модификация, дающая ему преимущество, не покрытое существующими вариантами.\nЭто преимущество не должно быть простым бонусом к тому, что ты уже делаешь; это должна быть сила или способность, дающая тебе возможности, которых у тебя иначе просто не было бы. И его не следует использовать, чтобы просто оптимизировать существующую концепцию персонажа, — оно должно позволить сделать персонажа, который без этой особой способности не имел бы смысла.\nМастер решает, что разумно и справедливо покрыть этим даром, и что бы он ни разрешил, оно должно быть примерно равно по общей силе существующим вариантам Фокусов. Если способность особенно сильна или кибернетика особенно изматывает, её применение может требовать от владельца брать Системную нагрузку, как описано на стр. 40.\nКак общее правило, эта способность должна быть лучше снаряжения, которое ПИ мог бы купить. Игрок тратит очень ограниченный ресурс, делая этот выбор Фокуса, так что полученное должно быть достаточно хорошим, чтобы его нельзя было просто продублировать толстым банковским счётом.\n#### Незарегистрированный\nНезаписанное рождение, порча базы данных или чистое везение — так или иначе, тебя просто нет ни в одной государственной или корпоративной базе. Если взять вместе с Фокусом Много лиц, твоя собственная личность потеряна, но ты можешь создавать другие для своих нужд. Если этот Фокус взят после создания персонажа, это значит, что твои существующие записи безнадёжно испорчены и утрачены.\n**Уровень 1:** С тобой не связано никаких государственных или корпоративных записей в базах данных, и добавить такие записи почти невозможно — они окажутся испорчены или удалены в течение недели. Люди могут тебя помнить, но полагаться на компьютерные записи, чтобы отследить тебя или твои дела, они не могут. Ты можешь держать деньги на кредитных чипах или наличными, но банковское обслуживание и официальное владение имуществом для тебя почти невозможны.\n#### Вихревой натиск\nТы — воплощённое кровавое безумие в ближнем бою и можешь косить множество слабых врагов вблизи… если выживешь в окружении.\n**Уровень 1:** Получи Клинок или Кулак как бонусный навык. Раз за сцену как Действие в свой ход нанеси свой урон Шока всем врагам на дистанции ближнего боя, если они уязвимы к твоему Шоку. \n**Уровень 2:** Когда ты в первый раз за раунд убиваешь кого-то обычной атакой — броском урона при попадании или нанесённым ею уроном Шока, — ты мгновенно получаешь вторую атаку по любой цели в пределах досягаемости любым оружием, которое у тебя в готовности."},
{"n":"1.6.2","l":3,"te":"Focus Gear Budgets","tr":"Бюджеты снаряжения Фокусов","en":"Foci such as Ace Driver, Roamer, and Drone Pilot allow a PC to always have a certain amount of vehicle or drone gear available regardless of their financial means, with this budget increasing as they advance in experience level. Characters with Ace Driver or Roamer can use this budget to buy vehicles, vehicle fittings, and vehicle weapons, along with any necessary ammo. Those with Drone Pilot can do the same, except with drones. They are assumed to have stolen, scavenged, or built this gear as needed, and while they can operate it normally the gear is too idiosyncratic to sell or have others operate it long-term. Other PCs can borrow the gear for particular missions, however.\nIf the gear is destroyed or lost, vehicles can be rebuilt at a rate of $10,000 worth per week. Any number of destroyed drones can be entirely rebuilt in a week. This assumes the PC has ordinary access to an urban area or salvage zone from which to acquire parts.\nFocus gear budgets cannot be used to buy vehicles, fittings, or weapons that the PCs could not readily acquire in another way. For example, if they don't have someone willing to sell them a tank, the PC with Ace Driver cannot use their budget to buy a tank.\nIf the PC wants more than their budget allows they can spend their own money to supplement the difference. This additional expense is not covered by their ability to freely rebuild lost or damaged gear, however.\n\n\nPC Level        Vehicle                Drone\n1                $5,000                $1,000\n2                $10,000        $5,000\n3                $15,000        $10,000\n4                $20,000        $15,000\n5                $30,000        $20,000\n6                $40,000        $25,000\n7                $60,000        $35,000\n8                $80,000        $45,000\n9                $100,000        $60,000\n10                $200,000        $80,000","ru":"Фокусы вроде Ас за рулём, Скиталец и Пилот дронов позволяют ПИ всегда иметь под рукой определённое количество транспортного или дронового снаряжения независимо от его финансов, и этот бюджет растёт с уровнем опыта. Персонажи с Асом за рулём или Скитальцем могут тратить этот бюджет на транспорт, транспортную оснастку и транспортное оружие, а также на необходимые боеприпасы. Те, у кого Пилот дронов, делают то же самое, только с дронами. Считается, что они украли, нашли или собрали это снаряжение по мере надобности, и хотя сами они управляются с ним нормально, оно слишком своеобразно, чтобы его продать или надолго передать другим. Впрочем, другие ПИ могут брать его на конкретные миссии.\nЕсли снаряжение уничтожено или потеряно, транспорт можно отстроить со скоростью $10 000 за неделю. Любое количество уничтоженных дронов полностью пересобирается за неделю. Это при условии, что у ПИ есть обычный доступ к городской зоне или свалке, откуда можно брать запчасти.\nБюджеты снаряжения Фокусов нельзя тратить на транспорт, оснастку или оружие, которые ПИ не смогли бы достать иным путём. Например, если никто не готов продать им танк, ПИ с Асом за рулём не может купить танк за свой бюджет.\nЕсли ПИ хочет больше, чем позволяет бюджет, он может доплатить разницу своими деньгами. Но эти дополнительные расходы не покрываются его способностью бесплатно восстанавливать потерянное или повреждённое снаряжение.\n\n\n| Уровень ПИ | Транспорт | Дрон |\n|---|---|---|\n| 1 | $5 000 | $1 000 |\n| 2 | $10 000 | $5 000 |\n| 3 | $15 000 | $10 000 |\n| 4 | $20 000 | $15 000 |\n| 5 | $30 000 | $20 000 |\n| 6 | $40 000 | $25 000 |\n| 7 | $60 000 | $35 000 |\n| 8 | $80 000 | $45 000 |\n| 9 | $100 000 | $60 000 |\n| 10 | $200 000 | $80 000 |"},
{"n":"1.7.0","l":2,"te":"Final Character Creation Steps","tr":"Завершающие шаги создания персонажа","en":"The player now records their character's final statistics and chooses their name and current goal.","ru":"Теперь игрок записывает итоговые характеристики персонажа и выбирает его имя и текущую цель."},
{"n":"1.7.1","l":3,"te":"Record Maximum Hit Points","tr":"Запиши максимум пунктов здоровья","en":"Your character's hit points measure their distance from defeat or death. If your character is reduced to zero hit points, they are either dying or incapacitated based on the nature of the injury.\nA new character rolls 1d6 for their maximum hit points, adding their Constitution modifier to the roll. Even a penalty cannot reduce this roll below 1 point. If they have chosen the Hard to Kill Edge they may add +2 to the roll.\nA character gains hit points as they advance in character level, rerolling their prior levels and taking the new score if it's higher, as explained in section 2.7.1.1.","ru":"Пункты здоровья твоего персонажа измеряют, насколько он далёк от поражения или смерти. Если персонаж падает до нуля пунктов здоровья, он либо умирает, либо обездвижен — смотря какова природа ранения.\nНовый персонаж бросает 1d6 на максимум пунктов здоровья, добавляя к броску модификатор Телосложения. Даже штраф не может опустить результат ниже 1 пункта здоровья. Если он выбрал Козырь Живучий, он может добавить к броску +2.\nПерсонаж получает пункты здоровья с ростом уровня, перебрасывая прежние уровни и беря новый результат, если он выше, — как объяснено в разделе 2.7.1.1."},
{"n":"1.7.2","l":3,"te":"Record Attack Bonus","tr":"Запиши бонус атаки","en":"Your character has a certain degree of basic combat competence based on their character level and Edges. This bonus increases as you advance in character levels and is added to your attack roll.\nA new character's attack bonus is usually +0. If they have the On Target Edge it is +1.","ru":"У твоего персонажа есть некоторая базовая боевая подготовка, зависящая от уровня персонажа и Козырей. Этот бонус растёт с уровнями и добавляется к твоей атаке.\nУ нового персонажа бонус атаки обычно +0. Если у него есть Козырь В цель, то +1."},
{"n":"1.7.3","l":3,"te":"Record Saving Throws","tr":"Запиши спасброски","en":"When faced with unusual dangers such as grenade explosions, toxic darts, pit traps, or cyberware hacks, the character may need to make a saving throw to resist or mitigate the peril. Saving throws are rolled on a d20 and are explained in section 2.2.0.\nPhysical saving throws are used to resist exhaustion, disease, poison, or other biological harms. A new character's Physical save target is equal to 15 minus the better of their Strength or Constitution modifiers.\nEvasion saving throws are used to avoid explosions, traps, or other dangers requiring fast reactions. A new character's Evasion save target is equal to 15 minus the better of their Intelligence or Dexterity modifiers.\nMental saving throws are used to resist cyberware hacks, mind-altering drugs, or other tests of willpower or self-control. A new character's Mental save target is equal to 15 minus the better of their Wisdom or Charisma modifiers.\nLuck saving throws are rolled when facing a danger that only blind chance can spare them from, such as an artillery strike, bridge collapse, or a sniper's random choice of victims. A new character's Luck save target is always 15.\nA character's save targets all decrease by 1 point each time they advance an experience level.","ru":"Столкнувшись с необычными угрозами вроде взрыва гранаты, отравленных дротиков, ям-ловушек или взлома кибернетики, персонаж может быть вынужден сделать спасброск, чтобы устоять или смягчить опасность. Спасброски бросаются на d20 и объясняются в разделе 2.2.0.\nФизические спасброски используются, чтобы устоять против истощения, болезни, яда или иного биологического вреда. У нового персонажа порог Физического спасброска равен 15 минус лучший из модификаторов Силы или Телосложения.\nСпасброски Уклонения используются, чтобы избежать взрывов, ловушек или иных опасностей, требующих быстрой реакции. У нового персонажа порог спасброска Уклонения равен 15 минус лучший из модификаторов Интеллекта или Ловкости.\nМентальные спасброски используются, чтобы устоять против взлома кибернетики, изменяющих сознание препаратов или иных проверок воли и самоконтроля. У нового персонажа порог Ментального спасброска равен 15 минус лучший из модификаторов Мудрости или Харизмы.\nСпасброски Удачи бросаются при опасности, от которой может спасти только слепой случай, — артиллерийский удар, обрушение моста или случайный выбор жертвы снайпером. У нового персонажа порог спасброска Удачи всегда 15.\nВсе пороги спасбросков персонажа снижаются на 1 каждый раз, когда он поднимает уровень опыта."},
{"n":"1.7.4","l":3,"te":"Pick a Free Skill","tr":"Выбери бесплатный навык","en":"Your character has developed some side interest that may be unrelated to your background or Edges. You can pick any one skill of your choice, excepting magical or supernatural skills if your campaign includes them. This skill pick is gained at level-0, or level-1 if it's already level-0. You cannot pick a skill that is already at level-1.","ru":"У твоего персонажа развилось какое-то побочное увлечение, возможно, не связанное с его происхождением или Козырями. Ты можешь выбрать любой навык на свой вкус, кроме магических или сверхъестественных навыков, если они есть в твоей кампании. Этот выбор навыка даётся на уровне-0 или на уровне-1, если навык уже уровня-0. Ты не можешь выбрать навык, который уже уровня-1."},
{"n":"1.7.5","l":3,"te":"Choose Starting Gear","tr":"Выбери стартовое снаряжение","en":"Your PC begins play speaking the lingua franca of the campaign's current city along with their native tongue if it happens to be different. They also have fluency in additional languages based on their Know or Connect skills. Either skill at level-0 grants one extra language, or two extra if it's at level-1. Thus, a PC with both Know-1 and Connect-1 skills could pick four additional languages.\nPCs can learn additional languages to a conversational level by spending a few months immersed in it or studying it diligently during downtime. Obtaining native fluency is at the GM's discretion.\nYour PC begins play with $500 worth of gear, plus one item of their choice that doesn't cost more than $1,000, with price lists given in section 3.0.0. They also have one month of a middle-class lifestyle prepaid. Some GMs may choose to make pre-made gear packages that the players can choose; if this is done, the packages should be worth somewhat more than the usual starting funds to encourage players to avoid lengthy gear-shopping at the start of the game.","ru":"Твой ПИ начинает игру, говоря на лингва франка текущего города кампании и на своём родном языке, если тот отличается. Он также владеет дополнительными языками в зависимости от навыков Знание или Связи. Любой из этих навыков на уровне-0 даёт один дополнительный язык, а на уровне-1 — два. Так, ПИ с навыками Знание-1 и Связи-1 мог бы выбрать четыре дополнительных языка.\nПИ могут учить дополнительные языки до разговорного уровня, проведя несколько месяцев в языковой среде или усердно занимаясь во время простоя. Родное владение — на усмотрение Мастера.\nТвой ПИ начинает игру со снаряжением на $500 плюс один предмет на свой выбор, стоящий не больше $1 000; прайс-листы даны в разделе 3.0.0. Также у него оплачен месяц уровня жизни среднего класса. Некоторые Мастера могут заранее собрать готовые наборы снаряжения на выбор игрокам; если так, наборы должны стоить несколько больше обычных стартовых средств, чтобы игроки не тратили начало игры на долгий шопинг."},
{"n":"1.7.6","l":3,"te":"Choose a Name and Goal","tr":"Выбери имя и цель","en":"As final step, the player should pick a name and initial goal for the PC. This goal can be anything so long as it gives a compelling reason for the PC to be doing dangerous missions and associating with suspicious fellows. The player must make up a good reason for the PC to be associating with the other players; it is not the GM's job to justify the party's existence, and if the player decides that their PC can't reasonably run with the other party members it's up to them to create a new character who can.","ru":"Последним шагом игроку следует выбрать имя и начальную цель для ПИ. Цель может быть любой, лишь бы она давала убедительную причину, зачем ПИ ходит на опасные миссии и водится с подозрительными типами. Игрок обязан придумать хорошую причину, зачем его ПИ держится вместе с другими игроками; оправдывать существование отряда — не работа Мастера, и если игрок решил, что его ПИ не может разумно бегать с остальными членами отряда, то ему самому и создавать нового персонажа, который может."},
{"n":"2.0.0","l":1,"te":"The Rules of the Game","tr":"Правила игры","en":"This section summarizes the rules of the game. They are intended to be functional for the average play group with typical needs; individual GMs may find it useful to alter them based on the specific interests or makeup of their own player group.","ru":"В этом разделе собраны правила игры. Они рассчитаны на среднюю компанию с обычными запросами; отдельным Мастерам может быть полезно изменить их под конкретные интересы или состав своей группы."},
{"n":"2.1.0","l":2,"te":"Scenes, Rounds, and Mission Time","tr":"Сцены, раунды и Время миссии","en":"During play, three special measures of time are used: scenes, rounds, and mission time.","ru":"В игре используются три особые меры времени: сцены, раунды и Время миссии."},
{"n":"2.1.1","l":3,"te":"Scenes","tr":"Сцены","en":"A scene is a time measurement used to determine how often certain abilities or actions can be taken. Some cyber can be triggered only so many times per scene, while some special abilities only work once per scene.\nA scene is one particular fight, event, activity, or effort that usually doesn’t take more than ten or fifteen minutes. A fight is a scene. A chase is a scene. A tense backroom negotiation is a scene. So long as the PCs are doing the same general activity in the same general location, it’s probably one scene. Most scenes don’t last more than fifteen minutes, though a GM can stretch this if it seems logical.\nDuring mission time, as described below, a scene automatically refreshes after every fight or after every ten minutes of mission time.","ru":"Сцена — мера времени, которой определяют, как часто можно использовать те или иные способности или действия. Часть кибера срабатывает лишь ограниченное число раз за сцену, а некоторые особые способности работают только раз за сцену.\nСцена — это один конкретный бой, событие, занятие или усилие, которое обычно не занимает больше десяти-пятнадцати минут. Бой — это сцена. Погоня — это сцена. Напряжённые переговоры в подсобке — это сцена. Пока ПИ занимаются одним и тем же делом в одном и том же месте, это, скорее всего, одна сцена. Большинство сцен не длится дольше пятнадцати минут, но Мастер может растянуть это, если так логичнее.\nВо Время миссии, как описано ниже, сцена автоматически обновляется после каждого боя или каждые десять минут Времени миссии."},
{"n":"2.1.2","l":3,"te":"Rounds","tr":"Раунды","en":"Combat is made up of rounds, each one lasting approximately six seconds. A single combat may involve multiple rounds of action. A round begins with the actions of the side that wins initiative and ends after the actions of the side that lost initiative.","ru":"Бой состоит из раундов, каждый примерно по шесть секунд. Один бой может включать несколько раундов действий. Раунд начинается с действий стороны, победившей в инициативе, и заканчивается после действий стороны, которая инициативу проиграла."},
{"n":"2.1.3","l":3,"te":"Mission Time","tr":"Время миссии","en":"During infiltrations, chases, or other periods of extended action where timekeeping is very important, time is measured in mission time. Mission time begins at minute zero and then ticks over every minute as the PCs infiltrate a facility, flee the corp security, or escape the night club riot. Most activities during mission time are assumed to take one minute, such as searching a desk, picking a lock at normal speed, hotwiring a car, engaging in a fight, or so forth. Some tasks may take longer, such as five minutes to apply first aid to anyone who needs it, or ten minutes to thoroughly search a room. The GM decides how long an activity takes when it's ambiguous.\nThe minute-by-minute tracking of mission time is important because there is a good chance of a team's discovery by patrolling security, or a steadily-escalating response by an alerted facility's guards. The longer the PCs take to do their job, the more likely it is that something will go wrong.","ru":"При проникновениях, погонях и в других затяжных сценах, где счёт времени очень важен, время отмеряется Временем миссии. Время миссии начинается с нулевой минуты и тикает каждую минуту, пока ПИ проникают на объект, убегают от корп-охраны или выбираются из бунта в ночном клубе. Считается, что большинство занятий во Время миссии отнимает одну минуту: обыскать стол, вскрыть замок на обычной скорости, замкнуть провода в машине, вступить в бой и так далее. Некоторые задачи длятся дольше: пять минут — оказать первую помощь всем, кому она нужна, десять минут — тщательно обыскать комнату. Когда время неочевидно, Мастер решает, сколько занимает занятие.\nОтсчёт Времени миссии минута за минутой важен потому, что велик шанс, что команду обнаружит патрульная охрана или что поднятый по тревоге объект начнёт наращивать ответ. Чем дольше ПИ делают своё дело, тем вероятнее, что что-то пойдёт не так."},
{"n":"2.2.0","l":2,"te":"Saving Throws","tr":"Спасброски","en":"Saving throws are rolled to resist some unusual danger or chance hazard. To make a saving throw, a person rolls 1d20 and tries to get equal or higher than their saving throw target. Sometimes a save might have bonuses or penalties applied to the roll, but a natural roll of 1 on the die always fails the save, and a natural roll of 20 is always a success.\nThere are four types of saving throws. Usually it will be obvious which type is most appropriate for a threat, but the GM can decide in marginal situations.\nPhysical saves resist exhaustion, poisons, diseases, or other bodily afflictions. A PC’s Physical saving throw target is equal to 16 minus their character level and the highest of their Strength or Constitution modifiers.\nEvasion saves apply when dodging explosions, avoiding traps, reacting to sudden peril, or other occasions where speed is of the essence. A PC’s Evasion saving throw target is equal to 16 minus their character level and the highest of their Dexterity or Intelligence modifiers.\nMental saves apply when resisting mental cyberware hacks, psychotropic influences, psychological trauma, and other mental hazards. A PC’s Mental saving throw target is equal to 16 minus their character level and the highest of their Wisdom or Charisma modifiers.\nLuck saves are used when only blind chance can save a PC, regardless of their native abilities. A PC’s Luck saving throw target is equal to 16 minus their character level, unmodified by their attributes.","ru":"Спасброски бросают, чтобы устоять против необычной опасности или случайной угрозы. Чтобы сделать спасброск, человек бросает 1d20 и пытается получить результат не ниже своего порога спасброска. Иногда к броску применяются бонусы или штрафы, но натуральная 1 на кости — всегда провал спасброска, а натуральная 20 — всегда успех.\nСпасброски бывают четырёх типов. Обычно очевидно, какой тип подходит для угрозы, но в спорных случаях решает Мастер.\nФизические спасброски противостоят истощению, ядам, болезням и другим телесным напастям. Порог Физического спасброска ПИ равен 16 минус уровень персонажа и минус наибольший из модификаторов Силы или Телосложения.\nСпасброски Уклонения применяются, когда нужно уйти от взрыва, избежать ловушки, отреагировать на внезапную угрозу, и в других случаях, где всё решает скорость. Порог спасброска Уклонения ПИ равен 16 минус уровень персонажа и минус наибольший из модификаторов Ловкости или Интеллекта.\nМентальные спасброски применяются, когда нужно устоять против взломов ментальной кибернетики, психотропных влияний, психологических травм и прочих ментальных угроз. Порог Ментального спасброска ПИ равен 16 минус уровень персонажа и минус наибольший из модификаторов Мудрости или Харизмы.\nСпасброски Удачи используются, когда ПИ может спасти только слепой случай, независимо от его собственных способностей. Порог спасброска Удачи ПИ равен 16 минус уровень персонажа и не изменяется характеристиками."},
{"n":"2.2.1","l":3,"te":"NPC Saving Throws","tr":"Спасброски NPC","en":"NPCs have a single saving throw target equal to 15 minus half their rounded-down hit dice. Thus, an NPC with 3 HD would have a saving throw target of 14+ for any particular hazard. The GM may modify this in special circumstances, but it's usually not worth tracking more closely.","ru":"У NPC один общий порог спасброска, равный 15 минус половина их Костей здоровья с округлением вниз. Так, у NPC с 3 КЗд порог спасброска против любой конкретной угрозы будет 14+. Мастер может изменить его в особых обстоятельствах, но обычно вести учёт точнее не стоит."},
{"n":"2.3.0","l":2,"te":"Skill Checks","tr":"Проверки навыков","en":"Most characters are skilled, competent men and women who are perfectly capable of carrying out the ordinary duties of their role. Sometimes, however, they are faced with a situation or challenge beyond the usual scope of their role and the GM calls for a skill check.\nTo make a skill check, roll 2d6 and add the most relevant skill level and attribute modifier. If the total is equal or higher than the check’s difficulty, the check is a success. On a failure, the PC either can’t accomplish the feat at all, bad luck cheats them, or they achieve it at the cost of some further complication. The GM determines the specific consequence of a failure.\nIf the character doesn’t even have level-0 in the pertinent skill, they suffer a -1 penalty to the roll. In the case of particularly technical or esoteric skills they might not even be able to attempt the skill check at all.\nThe GM is always the one who calls for a skill check, and they do so at their discretion. The player simply describes what their PC is attempting to do, and the GM will tell them what skill and attribute combination to roll. If multiple skills or attributes might plausibly fit the action, the player can pick the one most favorable to them. If the combination is only marginally relevant, but still reasonably plausible, it might suffer a -1 or -2 penalty at the GM's discretion.","ru":"Большинство персонажей — умелые, толковые мужчины и женщины, вполне способные выполнять обычную работу по своей роли. Но иногда они сталкиваются с ситуацией или испытанием за пределами обычных рамок своей роли, и тогда Мастер требует проверку навыка.\nЧтобы сделать проверку навыка, брось 2d6 и прибавь наиболее подходящий уровень навыка и модификатор характеристики. Если сумма равна сложности проверки или выше — проверка успешна. При провале ПИ либо вообще не справляется, либо его подводит неудача, либо он добивается своего ценой дополнительного осложнения. Конкретное следствие провала определяет Мастер.\nЕсли у персонажа нет даже уровня-0 в подходящем навыке, он получает штраф -1 к броску. В случае особо технических или узкоспециальных навыков он может и вовсе не иметь права на проверку.\nПроверку навыка всегда требует Мастер, и делает это по своему усмотрению. Игрок просто описывает, что пытается сделать его ПИ, а Мастер говорит, какую комбинацию навыка и характеристики бросать. Если действию правдоподобно подходят несколько навыков или характеристик, игрок может выбрать самую выгодную для себя. Если комбинация подходит лишь отчасти, но всё же правдоподобна, она может получить штраф -1 или -2 на усмотрение Мастера."},
{"n":"2.3.1","l":3,"te":"Skill Check Difficulties","tr":"Сложности проверок навыков","en":"The following difficulties ratings reflect common challenges.\n\n\nN/A        The task is one the PC would normally perform as part of their background.\n6        A simple challenge that's still enough to challenge a competent practitioner.\n8        A significant challenge to a competent professional.\n10        A challenge even a skilled expert might not manage to overcome.\n12        Only a true master could expect to overcome this challenge.\n14+        Only a true master has any chance of doing this at all.\n\n\nHelpful or hostile circumstances can modify a skill check by -2 to +2. Usually, no combination of situational modifiers should alter the roll by more than this, or else it becomes a near-foregone conclusion. This does not include modifiers applied by gear mods, cyberware, or PC aid.","ru":"Приведённые ниже значения сложности отражают типичные испытания.\n\n| Сложность | Описание |\n|---|---|\n| — | Задача из тех, что ПИ обычно выполняет в рамках своего Происхождения. |\n| 6 | Простое испытание, которого всё же хватает, чтобы бросить вызов толковому специалисту. |\n| 8 | Серьёзное испытание для толкового профессионала. |\n| 10 | Испытание, с которым может не справиться даже умелый эксперт. |\n| 12 | Одолеть такое по силам только настоящему мастеру. |\n| 14+ | Только у настоящего мастера вообще есть шанс это сделать. |\n\nБлагоприятные или враждебные обстоятельства могут изменить проверку навыка на -2…+2. Обычно никакое сочетание ситуативных модификаторов не должно менять бросок сильнее, иначе исход становится почти предопределённым. Сюда не входят модификаторы от модов снаряжения, кибернетики или помощи других ПИ."},
{"n":"2.3.2","l":3,"te":"NPC Skill Checks","tr":"Проверки навыков NPC","en":"When an NPC needs to make a skill check, they roll 2d6 and add their listed skill modifier if their action is something they ought reasonably to be good at. If it isn't, they roll at +0, or even at -1 if it seems like something they'd be particularly bad at doing. If the NPC is special enough to have actual attribute scores and skill levels, they use those instead.","ru":"Когда NPC нужно сделать проверку навыка, он бросает 2d6 и прибавляет свой указанный модификатор навыка, если действие — из тех, в которых он по здравому смыслу должен быть хорош. Если нет, он бросает с +0 или даже с -1, если это что-то, в чём он особенно плох. Если NPC достаточно особенный, чтобы иметь настоящие значения характеристик и уровни навыков, используются они."},
{"n":"2.3.3","l":3,"te":"Aiding a Skill Check","tr":"Помощь в проверке навыка","en":"To aid a comrade's skill check, a player explains what their PC is doing to help. If the GM agrees that it's plausible, they may roll a relevant skill and attribute modifier against the same difficulty as the check they are aiding. If they succeed, their ally gains a +1 on their skill check. If they fail, no harm is done. Multiple PCs can try to aid if their actions are plausible, but the total bonus can't exceed +1.\nAiding a comrade is usually done in ways that let the aiding PC leverage their own special talents or skills. A PC may not have the skills to attempt to Sneak past a vigilant guard, for example, but they might have a good Perform skill they can use to create a distraction that helps their comrade skulk past.","ru":"Чтобы помочь товарищу с проверкой навыка, игрок объясняет, что делает его ПИ. Если Мастер согласен, что это правдоподобно, помогающий может бросить подходящий навык и модификатор характеристики против той же сложности, что и у проверки, которой он помогает. При успехе союзник получает +1 к своей проверке навыка. При провале ничего плохого не происходит. Помогать могут несколько ПИ, если их действия правдоподобны, но суммарный бонус не может превысить +1.\nПомощь товарищу обычно строится так, чтобы помогающий ПИ мог задействовать свои особые таланты или навыки. Например, у ПИ может не быть навыка, чтобы прокрасться Скрытностью мимо бдительного охранника, зато у него хорошее Выступление, которым он создаст отвлекающий манёвр и поможет товарищу проскользнуть."},
{"n":"2.3.4","l":3,"te":"Opposed Skill Checks","tr":"Встречные проверки навыков","en":"When skills oppose each other, each participant makes a skill check and the winner is the one who rolls higher. In cases of ties, the PC wins. Thus, a PC trying to sneak past a guard might roll 2d6 plus their Dex/Sneak against the guard's 2d6 plus their skill modifier. If the guard was significant enough to actually have attributes and skill levels, it might be a Dex/Sneak challenge versus their Wis/Notice.","ru":"Когда навыки противостоят друг другу, каждый участник делает проверку навыка, и побеждает тот, кто выбросил больше. При равенстве побеждает ПИ. Так, ПИ, пытающийся прокрасться мимо охранника, может бросить 2d6 плюс Лов/Скрытность против 2d6 охранника плюс его модификатор навыка. Если охранник достаточно значим, чтобы иметь характеристики и уровни навыков, это может быть состязание Лов/Скрытность против его Мдр/Внимание."},
{"n":"2.4.0","l":2,"te":"Combat","tr":"Бой","en":"Violence is inevitable in most cyberpunk campaigns. The rules below handle its most common manifestations.","ru":"В большинстве киберпанковых кампаний насилие неизбежно. Правила ниже описывают его самые частые проявления."},
{"n":"2.4.1","l":3,"te":"The Combat Sequence","tr":"Последовательность боя","en":"When combat begins, the fight progresses in the following sequence. The sections below explain each step in the process.\nFirst, each participating side rolls for initiative. The side that rolled highest acts first.\nSecond, each member of a side gets to take their actions. Members of a side act in whatever order they wish. NPC sides act in whatever order the GM wishes.\nThird, once every member of a side has acted, the side that rolled next-highest gets to act. If NPCs have taken losses or are facing defeat, they may need to roll a Morale check as explained in section 5.2.0. PCs never check Morale.\nFourth, once every side has acted the process repeats from the top in the same order. Initiative is not re-rolled.","ru":"Когда начинается бой, он идёт в следующей последовательности. Разделы ниже объясняют каждый шаг процесса.\nВо-первых, каждая участвующая сторона бросает инициативу. Сторона с наибольшим результатом действует первой.\nВо-вторых, каждый член стороны совершает свои действия. Члены стороны действуют в любом порядке, какой захотят. Стороны NPC действуют в порядке, который выберет Мастер.\nВ-третьих, когда отыграл каждый член стороны, действует сторона со следующим по величине результатом. Если NPC несут потери или им грозит разгром, им может потребоваться проверка боевого духа, как описано в разделе 5.2.0. ПИ никогда не проверяют боевой дух.\nВ-четвёртых, когда отыграли все стороны, процесс повторяется с начала в том же порядке. Инициатива не перебрасывается."},
{"n":"2.4.2","l":3,"te":"Combat Initiative","tr":"Боевая инициатива","en":"When combat begins, each side involved in it rolls initiative, rolling 1d8 and adding their group's best Dexterity modifier. NPCs usually add nothing. The groups then act in order from highest to lowest rolls, with PC sides winning ties. When the slowest group has acted, the round ends and a new round starts in the same initiative order. Members of a side can act in any order the group agrees upon when it is that side's turn to act, performing their allowed actions as explained in the section below.","ru":"Когда начинается бой, каждая участвующая сторона бросает инициативу: 1d8 плюс лучший модификатор Ловкости в группе. NPC обычно ничего не прибавляют. Затем группы действуют по порядку от высшего результата к низшему, при равенстве побеждают стороны ПИ. Когда отыграла самая медленная группа, раунд заканчивается и начинается новый в том же порядке инициативы. Члены стороны могут действовать в любом порядке, о котором договорится группа, когда приходит очередь их стороны, выполняя доступные им действия, как описано в разделе ниже."},
{"n":"2.4.2.1","l":4,"te":"Individual Initiative","tr":"Индивидуальная инициатива","en":"As an optional rule, the GM may use individual initiative. In this case, each combatant rolls 1d8 individually, adding their Dexterity modifier, and acting in order from highest to lowest with PCs winning ties. This leaves a group less likely to be caught flat-footed by enemies, but makes it harder for a group to coordinate actions.","ru":"Как необязательное правило, Мастер может использовать индивидуальную инициативу. В этом случае каждый участник боя бросает 1d8 отдельно, прибавляя свой модификатор Ловкости, и все действуют по порядку от высшего к низшему, при равенстве побеждают ПИ. Так группу реже застают врасплох враги, но ей труднее согласовывать действия."},
{"n":"2.4.2.2","l":4,"te":"Surprise","tr":"Внезапность","en":"If a group is caught entirely unawares they may suffer surprise, automatically granting their enemies a full free round of action before initiative can be rolled. The GM decides when surprise applies, possibly calling for an opposed Dex/Sneak skill check versus the target's Wis/Notice. Groups cannot be surprised if they are actively anticipating the possibility of combat; at most, they might suffer an initiative penalty at the GM's discretion.","ru":"Если группу застали совершенно неготовой, она может оказаться застигнутой врасплох — тогда её враги автоматически получают целый бесплатный раунд действий до броска инициативы. Мастер решает, когда действует внезапность, и может потребовать встречную проверку Лов/Скрытность против Мдр/Внимание цели. Группу нельзя застать врасплох, если она активно ожидает возможного боя; максимум она получит штраф к инициативе на усмотрение Мастера."},
{"n":"2.4.2.3","l":4,"te":"Automatic Initiative Powers","tr":"Способности автоматической инициативы","en":"A PC with certain Foci or cyberware may be immune to surprise or gain automatic initiative. In such cases they automatically act first during a combat round, even if the rest of their side is slower. If multiple combatants have these powers, they roll initiative normally amongst themselves to see which of them acts first.","ru":"ПИ с определёнными Фокусами или кибернетикой может быть невосприимчив к внезапности или получать автоматическую инициативу. В таком случае он автоматически действует первым в боевом раунде, даже если остальная его сторона медленнее. Если такими способностями обладают несколько участников боя, они бросают инициативу между собой обычным порядком, чтобы определить, кто из них действует первым."},
{"n":"2.4.3","l":3,"te":"Combat Action Types","tr":"Типы боевых действий","en":"Attacks, movement, cyberware triggering, and other combat activities all require one of the following four types of actions.\nMain actions are a character's primary action during a combat round, such as shooting a target, applying first aid to a downed ally, running a cyberware hack, frantically evading gunfire, or something else that takes less than six seconds to do. A combatant gets one Main action per round.\nMove actions involve moving the character's normal movement rate of 10 meters or performing some other relatively brief bodily action, such as getting up from prone. A combatant gets one Move action per round, but can spend their main action to get a second.\nOn Turn actions are brief, simple acts that require only a moment's concentration. Activating most cyberware or speaking a few words might constitute an On Turn action. A character can take as many On Turn actions on their round as the GM finds plausible.\nInstant actions are special, most being provided only by certain powers or certain special actions. Instant actions can be performed even when it's not your turn in the round, even after the dice have already been rolled. The Veteran's Luck Edge provides one such Instant action, allowing the PC to treat a missed attack roll as an automatic hit. A PC can use as many Instant actions in a round as the GM finds plausible. Instant actions performed at the same time are resolved simultaneously, with the GM adjudicating any ambiguities.","ru":"Атаки, перемещение, активация кибернетики и прочие боевые занятия требуют одного из четырёх следующих типов действий.\nОсновные действия — главное действие персонажа в боевом раунде: выстрелить в цель, оказать первую помощь упавшему союзнику, запустить взлом кибернетики, отчаянно уворачиваться от огня или сделать что-то ещё, на что уходит меньше шести секунд. Участник боя получает одно Основное действие за раунд.\nДействия перемещения — это перемещение на обычную скорость персонажа в 10 метров или другое относительно короткое телесное действие, например встать из положения лёжа. Участник боя получает одно Действие перемещения за раунд, но может потратить Основное действие, чтобы получить второе.\nДействия в свой ход — короткие простые поступки, требующие лишь мгновения сосредоточенности. Активация большей части кибернетики или несколько сказанных слов могут считаться Действием в свой ход. Персонаж может совершить за свой раунд столько Действий в свой ход, сколько Мастер сочтёт правдоподобным.\nМгновенные действия — особые: большинство даётся только определёнными способностями или особыми действиями. Мгновенные действия можно выполнять, даже когда сейчас не твой ход в раунде, и даже после того, как кости уже брошены. Козырь «Везение ветерана» даёт одно такое Мгновенное действие, позволяя ПИ считать промах в атаке автоматическим попаданием. ПИ может использовать за раунд столько Мгновенных действий, сколько Мастер сочтёт правдоподобным. Мгновенные действия, выполняемые одновременно, разрешаются одновременно, а неоднозначности разбирает Мастер."},
{"n":"2.4.4","l":3,"te":"Common Combat Actions","tr":"Частые боевые действия","en":"The actions listed below are merely some of the most common taken in combat.\nMake a Melee Attack (Main Action): Attack a target in melee range with an unarmed attack or melee weapon. Such weapons use either the Punch or the Stab skill, depending on the type of attack.\nMake a Ranged Attack (Main Action): Attack a target with a gun, bow, or thrown weapon. The Shoot skill is used for these attacks, though Stab or Exert can optionally be used for thrown weapons. If there is an enemy attacker in melee range, one-handed guns and thrown weapons suffer a -4 penalty to hit, while rifles and two-handed ranged weapons cannot be fired at all.\nMake a Snap Attack (Instant Action): As an Instant action, give up your Main Action and either Make a Melee Attack or Make a Ranged Attack at a -4 penalty to hit. As an Instant action, you can Make a Snap Attack even when it's not your turn, but you must not have taken your Main Action this round yet. Only well-trained and disciplined NPCs have enough focus to Make a Snap Attack.\nMake a Swarm Attack (Main Action): Target an enemy within range of your weapon and take this action until up to four allies have Made a Swarm Attack on that target this round. At that point or any point beforehand, one of these assailants can Make a Melee Attack or Make a Ranged Attack on the target with a +2 bonus to hit and +1 bonus to damage for every other assailant, up to a maximum bonus of +6 to hit and +3 damage. This bonus damage does not add to the attack's Shock and cannot make it do more than its usual maximum damage. Any Shock inflicted by this attack is always applicable, however, even if the target's AC is too high, they're using a shield, or have some power that makes them immune to Shock; the damage a Swarm Attack does isn't really Shock, but a reflection of the inevitable hazards of being swarmed by numerous armed foes.\nCharge (Special Action): Spend both your
