ного разброса Сторожей и их обычного железа.\n\nБольшинство хакеров — никудышные бойцы в реале, но антикибер-специалисты корпоративных групп прорыва могут стать неприятным сюрпризом для сильно захромленных ПИ.\n\nСторожа перечислены вместе с их обычными кибердеками и наборами программ. Вороватым ПИ стоит знать: корпоративные деки настолько нашпигованы шпионским железом, что грабить их почти никогда не выгодно. А вот у фрилансеров может найтись что-то стоящее.\n\nКроме подборки хакеров, для встреч включено несколько примеров пилотов дронов.\n\n\n### Мелкий корпоративный кодовый дрон\n\n**КЗд:** 1 (5 ПЗ) · **Атк:** +0дб/+0бб · **КЗщ:** 10дб/10бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** нет · **Нав:** +1 · **Скор.:** 10 м · **Спас:** 15+ · **Дух:** 7\n\n- Обычная одежда\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- **Черепной разъём:** подключается к снаряжению с разъёмом\n- **Кибердека:** Память 10, Экранирование 10, ЦП 3; Глаголы: *Защитить*, *Парализовать*, *Оглушить*, *Запереть*, *Завершить*; Объекты: *Аватар*, *Барьер*, *Камера*, *Дверь*, *Программа*\n\n\n### Опытный корпоративный Сторож\n\n**КЗд:** 2 (10 ПЗ) · **Атк:** +1дб/+1бб · **КЗщ:** 10дб/10бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** нет · **Нав:** +2 · **Скор.:** 10 м · **Спас:** 14+ · **Дух:** 8\n\n- Обычная одежда\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- **Черепной разъём:** подключается к снаряжению с разъёмом\n- **Кибердека:** Память 14, Экранирование 10, ЦП 3; Глаголы: *Защитить*, *Парализовать*, *Ощутить*, *Заглушить*, *Оглушить*, *Запереть*, *Завершить*; Объекты: *Аватар*, *Барьер*, *Камера*, *Дверь*, *Программа*\n\n\n### Ветеран корпоративной IT-безопасности\n\n**КЗд:** 4 (20 ПЗ) · **Атк:** +2дб/+2бб · **КЗщ:** 10дб/10бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** нет · **Нав:** +2 · **Скор.:** 10 м · **Спас:** 13+ · **Дух:** 8\n\n- Обычная одежда\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- **Черепной разъём:** подключается к снаряжению с разъёмом\n- **Киберглаза (Сенсорика):** встроенная защита от вспышек\n- **Мод глаза/Зрение при слабом свете (Сенсорика):** видит при слабом освещении\n- **Улучшенные рефлексы I (Нервы):** раз за сцену Действием в свой ход получает бонусное Основное действие\n- **Липкие подушечки (Конечность):** лазает по гладким поверхностям со скоростью перемещения.\n- **Кибердека:** Память 15, Экранирование 0, ЦП 5; Глаголы: *Ослепить*, *Деактивировать*, *Обыскать*, *Сглючить*, *Саботировать*, *Ощутить*; Объекты: *Кибер*, *Кибер тела*, *Нервный кибер*, *Кибер конечности*, *Сенсорный кибер*, *Кибер кожи*, *Улучшенные рефлексы I*, *Улучшенные рефлексы II*, *Улучшенные рефлексы III*\n\n\n### Высококлассный корпоративный IT-специалист\n\n**КЗд:** 6 (30 ПЗ) · **Атк:** +2дб/+2бб · **КЗщ:** 10дб/10бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** нет · **Нав:** +5 · **Скор.:** 10 м · **Спас:** 12+ · **Дух:** 8\n\n- Обычная одежда\n- Тяжёлый пистолет (1d8, травма 1d6/×3, 8 маг)\n- **Черепной разъём:** подключается к снаряжению с разъёмом\n- **Нейробуфер:** добавляет +18 ПЗ против урона в киберпространстве\n- **Ускоритель реакции II (Нервы):** автоматически побеждает в инициативе\n- **Кибердека:** Память 17, Экранирование 10, ЦП 4; Глаголы: *Защитить*, *Сглючить*, *Убить*, *Парализовать*, *Ощутить*, *Саботировать*, *Заглушить*, *Оглушить*, *Запереть*, *Завершить*; Объекты: *Аватар*, *Барьер*, *Кибер*, *Камера*, *Дверь*, *Программа*\n- **Хакер (Козырь):** может использовать Козырь «Хакер»\n\n\n### Грозная легенда Сети\n\n**КЗд:** 9 (63 ПЗ) · **Атк:** +12дб/+12бб · **КЗщ:** 20дб/18бб · **Урон:** оружие · **ПТ:** 8+ · **Шок:** 2/15 · **Нав:** +6 · **Скор.:** 10 м · **Спас:** 11+ · **Дух:** 10\n\n- Бронированная одежда с модами\n- Лёгкий пистолет с модами (1d6+4, тр. 1d8/×2, 15 маг)\n- Продвинутый нож (1d6+4, Шок 2/15, тр. 1d8/×3)\n- **Черепной разъём:** подключается к снаряжению с разъёмом\n- **Улучшенные рефлексы III (Нервы):** дважды за сцену Мгновенным действием получает бонусные Основное действие и Действие перемещения\n- **Нейробуфер:** добавляет +27 ПЗ против урона в киберпространстве\n- **Ускоритель реакции II (Нервы):** автоматически побеждает в инициативе\n- **Кибердека:** Память 17, Экранирование 20, ЦП 7; Глаголы: *Защитить*, *Сглючить*, *Убить*, *Парализовать*, *Ощутить*, *Саботировать*, *Заглушить*, *Оглушить*, *Запереть*, *Завершить*; Объекты: *Аватар*, *Барьер*, *Кибер*, *Камера*, *Дверь*, *Нервный кибер*, *Программа*\n- **Хакер (Козырь):** может использовать Козырь «Хакер»\n- **Живучий (Козырь):** +2 ПЗ за КЗд, +1 к Порогу травмы\n\n\n### Пилот дронов банды\n\n**КЗд:** 3 (15 ПЗ+3) · **Атк:** +5дб/+5бб · **КЗщ:** 14дб/13бб · **Урон:** оружие · **ПТ:** 6+ · **Шок:** 2/15 · **Нав:** +2 · **Скор.:** 10 м · **Спас:** 14+ · **Дух:** 8\n\n- Уличная кожа\n- Боевая винтовка (1d12+1, тр. 1d8/×3, 30 маг, очередь)\n- Нож (1d4+1, Шок 2/15, травма 1d6/×3)\n- **Аугментация координации I (Нервы):** +1 к модификатору Лов для КЗщ/попаданий/урона/бросков, связанных с Шоком\n- **Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену — переброс промаха.\n- **Голова-связь (Сенсорика):** встроенная радиосвязь\n- **Блок дистанционного управления (Нервы):** управляет дронами/транспортом\n\n\n### Ветеран корпоративный дрон-жокей\n\n**КЗд:** 4 (20 ПЗ+10) · **Атк:** +7дб/+6бб · **КЗщ:** 19дб/15бб · **Урон:** оружие · **ПТ:** 8+ · **Шок:** 3/15 · **Нав:** +3 · **Скор.:** 10 м · **Спас:** 13+ · **Дух:** 10\n\n- Средний бронекостюм\n- Боевая винтовка (1d12+1, тр. 1d8/×3, 30 маг, очередь)\n- Продвинутый нож (1d6+1, Шок 3/15, тр. 1d8/×3)\n- **Аугментация координации I (Нервы):** +1 к модификатору Лов для КЗщ/попаданий/урона/бросков, связанных с Шоком\n- **Киберглаза (Сенсорика):** встроенная защита от вспышек\n- **Улучшенные рефлексы I (Нервы):** раз за сцену Действием в свой ход получает бонусное Основное действие.\n- **Ганлинк (Сенсорика):** игнорирует штрафы за дистанцию и до -2 от укрытия или маскировки. Раз за сцену — переброс промаха.\n- **Блок дистанционного управления (Нервы):** управляет дронами/транспортом"},
{"n":"6.0.0","l":1,"te":"Magic","tr":"Магия","en":"Some campaigns include magic along with their chrome. While the content below is included in the for-pay version of Cities Without Number, it is included in this document because it is largely mechanical in nature.","ru":"В некоторых кампаниях к хрому добавляется магия. Хотя всё нижеизложенное входит в платную версию «Городов без числа», оно включено и в этот документ, поскольку носит в основном механический характер."},
{"n":"6.1.0","l":2,"te":"Mages and Spellcasting","tr":"Маги и чтение заклинаний","en":"Some campaigns involve spell-flinging PCs. This section covers rules for such characters.\nAll would-be Mages must take the Spellcaster Edge at first level. The education needed to become a mage is usually too intense to pick up later in an operator’s career, and in many settings a certain natural talent is also required to become a sorcerer.\nTaking the Spellcaster Edge grants Cast as a bonus skill and allows the PC to pick four spells from the following list as starting incantations.\nThe Cast skill reflects a caster’s talent at spellcasting and their intellectual mastery of the complex formulas, rituals, and incantations necessary to use their spells. Anyone can learn it as a strictly intellectual exercise, but only those with the Spellcaster Edge can actually use it to cast spells.","ru":"В некоторых кампаниях есть персонажи игроков, швыряющиеся заклинаниями. Этот раздел описывает правила для таких персонажей.\nВсе, кто хочет стать Магом, обязаны взять Козырь Заклинатель на первом уровне. Образование, необходимое магу, обычно слишком тяжёлое, чтобы получить его позже, в середине карьеры оператора, а во многих сеттингах для колдовства нужен ещё и природный талант.\nКозырь Заклинатель даёт Колдовство как бонусный навык и позволяет персонажу игрока выбрать четыре заклинания из списка ниже в качестве начальных инкантаций.\nНавык Колдовство отражает талант заклинателя к чтению заклинаний и его интеллектуальное владение сложными формулами, ритуалами и инкантациями, без которых заклинания не работают. Выучить навык может кто угодно — как чисто умственную дисциплину, — но применять его для чтения заклинаний способны только те, у кого есть Козырь Заклинатель."},
{"n":"6.1.1","l":3,"te":"Mage Effort","tr":"Усилие мага","en":"Spellcasting is powered by a limited resource called Mage Effort. A caster’s maximum Mage Effort is equal to the higher of their Intelligence or Wisdom modifiers plus their Cast skill level, to a minimum of 1 point.\nMage Effort refreshes completely each morning, assuming the caster has gotten eight uninterrupted hours of reasonably comfortable sleep. Casters who are starved, freezing, thirsting, sick, or otherwise physically distracted cannot refresh Mage Effort.\nMage Effort is “Committed” when used to cast spells. There are three different kinds of Commitment for Effort.\nCommitment for the day means the Effort returns only the next morning. These spells are powerful, and make persistent demands on the caster’s energy.\nCommitment for the scene means the Effort returns at the end of the scene. This may be in fifteen minutes under ordinary circumstances, or at the end of each fight or specific activity when operating under mission time.\nCommitment for the duration means that the Effort can be reclaimed whenever the caster wishes as an Instant action, but whatever power it fueled ends as soon as the Effort is returned.\nEach spell indicates how long Effort must be Committed for when the mage casts it.","ru":"Чтение заклинаний питается ограниченным ресурсом — Усилием мага. Максимум Усилия мага равен большему из модификаторов Интеллекта или Мудрости плюс уровень навыка Колдовство, но не меньше 1 пункта.\nУсилие мага полностью восстанавливается каждое утро, если заклинатель проспал восемь часов подряд в более-менее приличных условиях. Заклинатели, которые голодают, мёрзнут, страдают от жажды, болеют или иначе отвлечены физическими нуждами, восстановить Усилие мага не могут.\nУсилие мага «задействуется», когда его тратят на заклинания. Есть три разных вида задействования Усилия.\nЗадействование на день означает, что Усилие вернётся только на следующее утро. Такие заклинания сильны и постоянно тянут из заклинателя энергию.\nЗадействование на сцену означает, что Усилие вернётся в конце сцены. В обычных условиях это может произойти через пятнадцать минут, а при игре по времени миссии — в конце каждой схватки или отдельного дела.\nЗадействование на длительность означает, что заклинатель может вернуть Усилие когда пожелает, Мгновенным действием, но всё, что оно питало, обрывается сразу же, как только Усилие возвращено.\nКаждое заклинание указывает, на какой срок маг должен задействовать Усилие при его чтении."},
{"n":"6.1.2","l":3,"te":"Mages and Cyberware","tr":"Маги и кибернетика","en":"For each cybernetic system implanted in a mage, their Mage Effort maximum decreases by the System Strain of the implant, to a minimum of one point even for trivial cosmetic mods. Thus, a mage who implanted hardware that had System Strain costs of 2, 0, and 0.5 would lose four points of maximum Mage Effort. This Effort can be restored by removing the cyberware.","ru":"За каждую кибер-систему, вживлённую в мага, максимум его Усилия мага снижается на Системную нагрузку этого импланта, но не ниже одного пункта — даже при копеечных косметических модах. Так, маг, вжививший себе железо со стоимостью Системной нагрузки 2, 0 и 0,5, потеряет четыре пункта максимума Усилия мага. Это Усилие можно вернуть, удалив кибернетику."},
{"n":"6.1.3","l":3,"te":"Spells","tr":"Заклинания","en":"A character with the Spellcaster Edge can cast spells. The ones listed below are common to many campaign settings, but others may exist in the hands of private researchers.","ru":"Персонаж с Козырем Заклинатель может читать заклинания. Перечисленные ниже встречаются во многих сеттингах, но в руках частных исследователей могут быть и другие."},
{"n":"6.1.3.1","l":4,"te":"Learning and Preparing Spells","tr":"Изучение и подготовка заклинаний","en":"A character with the Spellcaster Edge starts play knowing four spells from the list below. Mages must otherwise learn their spells from a cooperative tutor or a very expensive enchanted grimoire capable of imparting the multidimensional arcane construct of the spell. Learning a spell requires one week of practice with a grimoire or tutor.\nTutors generally charge $5,000 to teach a spell, though special favors can cut that price substantially. Grimoires can only be obtained through Contacts, and start at $10,000 for the most common spells.\nOnce a spell is learned, it must be prepared for casting. A mage can prepare a number of spells equal to half their level, rounded up, plus their Cast skill. Thus, a first level PC with Cast-1 skill could prepare two different spells. A tenth level master with Cast-4 could have nine on hand at any one time. Prepared spells can be changed when Effort is refreshed in the morning. No special grimoires or spellbooks are required to change prepared spells; just having learned the spell is sufficient.","ru":"Персонаж с Козырем Заклинатель начинает игру, зная четыре заклинания из списка ниже. В остальном маги обязаны учить заклинания у сговорчивого наставника или по очень дорогому зачарованному гримуару, способному вложить в голову многомерную тайную конструкцию заклинания. Изучение заклинания требует недели практики с гримуаром или наставником.\nНаставники обычно берут $5 000 за обучение одному заклинанию, хотя особые услуги могут заметно снизить цену. Гримуары добываются только через Контакты и стоят от $10 000 за самые распространённые заклинания.\nВыученное заклинание надо ещё подготовить к чтению. Маг может подготовить столько заклинаний, сколько равно половине его уровня, округляя вверх, плюс его навык Колдовство. Так, персонаж игрока первого уровня с навыком Колдовство-1 может подготовить два разных заклинания. Мастер десятого уровня с Колдовство-4 может держать под рукой девять. Подготовленные заклинания можно сменить, когда утром восстанавливается Усилие. Никаких особых гримуаров или книг заклинаний для смены подготовленных заклинаний не нужно — достаточно того, что заклинание выучено."},
{"n":"6.1.3.2","l":4,"te":"Casting Spells","tr":"Чтение заклинаний","en":"To cast a spell, a Mage must have at least one hand free and the ability to speak. Spells can be cast even while wearing heavy armor or being partially restrained so long as one arm is free and the caster is not being severely jostled or disturbed.\nMages who have suffered hit point damage, grappling, or other severe distractions in a round cannot cast spells that round. If the mage is struck mid-casting by someone who held their action to do so, the spell is lost and the Effort required is wasted.\nMages can cast only the spells they have prepared, but may do so as often as the spell or their Effort allows them to.\nThe actual spellcasting is a Main Action. The caster must speak at a conversational volume and gesture plainly with one hand. Spells that have a physical effect on the world project beams, glows, or other signs that clearly indicate the mage who cast the spell. Spells that have only mental effects, such as Stun or Stunwave, have no such obvious tracers. Most professionals in a magical cyberpunk world will know enough about spellcasting to recognize it if the caster is being observed.\nUnless specified otherwise, spells only require one point of Effort to be Committed in order to trigger them.","ru":"Чтобы прочесть заклинание, у Мага должна быть свободна хотя бы одна рука и возможность говорить. Заклинания можно читать даже в тяжёлой броне или будучи частично связанным, пока свободна одна рука, а самого заклинателя не трясут и не сбивают всерьёз.\nМаг, получивший в этом раунде урон по пунктам здоровья, попавший в захват или иначе серьёзно сбитый с толку, в этом раунде читать заклинания не может. Если мага ударили посреди чтения — кто-то отложил для этого действие, — заклинание срывается, а потраченное Усилие уходит впустую.\nМаг может читать только подготовленные заклинания, но делать это столько раз, сколько позволяет само заклинание или его Усилие.\nСамо чтение заклинания — Основное действие. Заклинатель должен говорить в полный разговорный голос и открыто жестикулировать одной рукой. Заклинания, дающие физический эффект, испускают луч, свечение или иные знаки, ясно указывающие на того, кто их прочёл. Заклинания с чисто ментальным эффектом — например, Оглушение или Волна оглушения — таких следов не оставляют. Большинство профессионалов в магическом киберпанковом мире достаточно знают о колдовстве, чтобы распознать его, если за заклинателем наблюдают.\nЕсли не указано иное, для срабатывания заклинания достаточно задействовать один пункт Усилия."},
{"n":"6.1.3.3","l":4,"te":"Overcasting","tr":"Перенапряжение","en":"If forced to cast beyond their Effort capacities, a mage can perform overcasting. A mage declares overcasting as an On Turn action. The next spell they cast that same round has no Effort cost, but after the spell is cast the mage then rolls on the overcasting table below, adding their Cast skill and Constitution modifier to the die, and subtracting 2 if the spell requires Committing Effort for the day. Spells with a Commit-for-duration Effort cost last for one scene when overcast.\nIf the System Strain inflicted by overcasting would put the mage above their maximum, they fall unconscious for an hour before waking up with 1 hit point.\n\n\nD20        Overcasting Consequence\n1-        Instant and unavoidable death\n2-4        Mortally wounded and at zero HP\n5-8        Gain 4 System Strain, fall unconscious for one minute\n9-15        Gain 2 System Strain, stunned and unable to act for the next round\n16-19        Gain 1 System Strain, lose your next round’s Main Action\n20+        Gain 1 System Strain","ru":"Если мага вынудили колдовать сверх запаса Усилия, он может пойти на перенапряжение. Маг объявляет перенапряжение Действием в свой ход. Следующее заклинание, прочитанное им в этом же раунде, не стоит Усилия, но после его прочтения маг бросает по таблице перенапряжения ниже, прибавляя к костям свой навык Колдовство и модификатор Телосложения и вычитая 2, если заклинание требует задействовать Усилие на день. Заклинания со стоимостью «задействование на длительность» при перенапряжении длятся одну сцену.\nЕсли Системная нагрузка от перенапряжения выведет мага за его максимум, он падает без сознания на час, а затем приходит в себя с 1 пунктом здоровья.\n\n\n| D20 | Последствие перенапряжения |\n|---|---|\n| 1 и меньше | Мгновенная и неотвратимая смерть |\n| 2–4 | Смертельно раненный и на нуле ПЗ |\n| 5–8 | Получи 4 Системной нагрузки, падаешь без сознания на одну минуту |\n| 9–15 | Получи 2 Системной нагрузки, оглушён и не можешь действовать следующий раунд |\n| 16–19 | Получи 1 Системной нагрузки, теряешь Основное действие следующего раунда |\n| 20 и больше | Получи 1 Системной нагрузки |"},
{"n":"6.1.3.4","l":4,"te":"Spell Targets and Per Level Effects","tr":"Цели заклинаний и эффекты за уровень","en":"Some spells specify a “visible target”. Unless noted otherwise, this constitutes a point or creature within 200 meters that the caster can clearly identify. A target hiding behind a door would not be a suitable target, but one ducked behind a drape or other light concealment could be targeted if their location was known.\nCybernetic or gear-augmented sight does not help when determining visibility; only natural, normal human senses can channel arcane energies.\nWhere effects are “per level”, they always refer to the caster’s character level or hit dice, with a maximum of 10 levels or hit dice of effect.\nUnless specified otherwise, spells do not roll a Trauma Die and cannot inflict Traumatic Hits, even if they do lethal damage.","ru":"Некоторые заклинания указывают «видимую цель». Если не указано иное, это точка или существо в пределах 200 метров, которое заклинатель может ясно опознать. Цель, спрятавшаяся за дверью, не подходит, а вот та, что пригнулась за шторой или иной лёгкой маскировкой, целью быть может, если её местоположение известно.\nКибернетическое или усиленное снаряжением зрение при определении видимости не помогает: тайные энергии проводят только естественные, обычные человеческие чувства.\nТам, где эффекты идут «за уровень», всегда имеется в виду уровень персонажа заклинателя или его Кости здоровья, максимум до 10 уровней или Костей здоровья эффекта.\nЕсли не указано иное, заклинания не бросают Кость травмы и не могут наносить Травматичные попадания, даже если наносят летальный урон."},
{"n":"6.1.3.5","l":4,"te":"Spell List","tr":"Список заклинаний","en":"Spell                        Effort                Duration\nArson                        Day                Instant\nBlast                        Day                Instant\nBlastwave                Day                Instant\nBless                        Scene                Scene\nCleanse Toxin                Day                Instant\nCloak                        Day                Scene\nCombat Precognition        Day                Scene\nCompulsion                Scene                Scene\nCurse                        Scene                1 round/level\nDetect Target                Scene                Scene\nDispel                        Day                Instant\nDisrupt                        Day                Instant\nEmotion                Scene/Day        Scene\nFar Senses                Day                Concentration\nGlide                        Scene                Instant\nHaste                        Day                Scene\nHeal Injury                Day                Instant\nIllumination                None                Scene\nMirage                        Scene                Scene\nMuffle                        Scene                Scene\nParalysis                Day                Scene\nPsychic Interrogation        Day                Instant\nSlow                        Day                1 round/level\nSoul Link                Scene                Scene\nStun                        Scene/Day        Instant\nStunwave                Day                Instant\nTriage                        Scene/Day        Instant\n\n\nArson: Target a visible creature or flammable object. If a creature, roll a Shoot attack to hit it, adding your Cast skill as a bonus to the hit roll. If the spell hits, the target is wreathed in flames, suffering 1d8 fire damage per level. Flammable objects continue to burn normally. A target can be hit by Arson only once per scene.\nBlast: A single visible target, whether a creature or object, takes 1d6 damage per level in concussive impact. Creatures can make a Physical save for half damage. Each use of this spell after the first in a scene adds one System Strain to the caster.\nBlastwave: Select a visible target, whether creature or object; it and everything within five meters of it takes 1d6 damage per level in concussive impact. Creatures can make a Physical save to halve the damage. Each time you cast this spell, gain one System Strain, and it cannot be used more than once per scene unless you overcast it.\nBless: Target a visible creature. They gain a +1 bonus to all hit rolls and damage, including Shock, for one round per caster level. Only one Bless effect can be on a target at once.\nCleanse Toxin: You touch an ally who has been poisoned; the effects of the poison immediately end, though the damage it’s already done is not cured.\nCloak: Target up to one visible creature per two caster levels, rounded up. The creature becomes nearly transparent for the rest of the scene, gaining a +2 bonus on all Sneak checks and giving most creatures no chance to spot them at all unless they are specifically vigilant for intruders or the cloaked target gets within five meters of them. The effect ends instantly if the cloaked creature moves quickly, such as by running, fighting, or casting.\nCombat Precognition: A single visible target is given a brief glimpse of the future while in combat, the effect lasting the rest of the scene. This precognition is enough to allow them to reroll a missed hit roll or low damage roll as an Instant action, taking the better of the two rolls. A roll may be rerolled only once, and after each use of the power the target gains System Strain equal to the number of times they’ve used it that same day.\nCompulsion: Target a visible intelligent creature and give them a one-sentence telepathic command that isn’t extremely contrary to their wishes. They must make a Mental save or spend their next round’s actions performing your command to the best of their ability, unaware of your mental influence. If used against a target that is not in combat or feeling threatened, they might continue to obey for up to a scene if not alarmed. Victims will not realize they have been mentally attacked unless they make their saving throw. Once a save is made, a creature is immune to Compulsion for the rest of the scene.\nCurse: Target a visible creature. They suffer a -1 penalty to all hit rolls and damage, including Shock, for one round per caster level. They can make a Mental save at the end of each round to throw off the effect. This penalty increases to -2 at level 5, and -3 at level 9. Only one Curse can be active on a creature at once.\nDetect Target: When preparing this spell, choose a type of target from this list: a species of living creature, a specific person you’ve met, a general class of object, intelligent creatures that currently mean to physically harm you, or enchanted objects. When cast, for the rest of the scene you can take a Move action to sense the selected target within five meters per level, gaining a basic sense of their presence and location. You may prepare this spell more than once for different targets.\nDispel: Target a visible spell effect or creature. Any spell effects on the creature or targeted area are immediately ended. If the original caster had an equal or higher Cast skill, the dispeller must succeed in an opposed Int/Cast spell check against them to dispel their magic. This spell only functions against spell effects, and not standing magical effects created by items or other methods.\nDisrupt: The next time you touch a creature or object, inflict normal unarmed damage plus 1d8 per level. Creatures can make a Physical save to negate this bonus damage. A Punch attack is necessary to touch a target in combat, but the mage may add their Cast skill to the hit roll. Only one charge of this spell may be active at once, and it dissipates if not used by the end of the scene.\nEmotion: Target a visible creature, choose an emotion, and optionally pick a target or subject for that emotion. The victim must make a Mental save or immediately feel that emotion for the rest of the scene, optionally directed toward that target. This emotion is strong enough to get them to act to the limit of their normal character and rationality. In combat, a powerful fear may be enough to force a Morale check. If this spell is cast with Effort for the day instead of the scene, the target and all creatures within five meters must save or be affected, all sharing an emotion and target.\nFar Senses: Pick a location within ten meters per character level. Unless the area is shielded against magical intrusion, your unaided human senses focus on the location as if you were standing there. You maintain this clairvoyance as long as you do nothing but concentrate, up to a scene in duration.\nGlide: Target a number of visible creatures equal to your character level plus three. For the rest of the scene, these creatures are immune to falling damage. When leaping from a height, they can land at any point within 5 meters for each meter of height they have, gliding at a rate of 40 meters per round.\nHaste: Target a visible ally. For the next 1d4+1 rounds, once per round, as an On Turn action, they can perform an extra Main Action. This bonus action cannot involve spellcasting, summoning, or activating magical items. Using this bonus action adds 0 System Strain to the user for the first use per day, 1 for the second that same day, 2 for the third, and so forth.\nHeal Injury: You touch an ally, curing 1d6 damage per three caster levels, rounded up, plus your Heal skill. This healing adds one System Strain to the target but removes any Frailty they may be suffering. It cannot repair Major Injuries, but can stabilize those downed by them.\nIllumination: Such a minor spell that it doesn’t even require Effort, this incantation causes a touched object to glow as you wish, illuminating up to 10 meters around it for up to an hour. Only one Illumination can be active at a time.\nMirage: Pick a visible target location. You can create a visual and audible illusion within ten meters of that location. This illusion cannot turn objects invisible, but can conceal them behind opaque phantasms. The illusion can involve motion and activity, but once programmed, it cannot be changed, nor can it move out of the target radius. The illusion is intangible and cannot inflict damage, and those aware of its falsity can see through it with a successful Mental save taken as a Main Action. Only one Mirage can be summoned at a time.\nMuffle: Pick a visible target location and a radius of up to ten meters. For the rest of the scene, no sound made within this zone will be audible outside the zone.\nParalysis: Target a visible creature and roll 1d8 per level. If the total is greater than the target’s current hit points, they must make a Mental save or become paralyzed and helpless for the rest of the scene. On a successful save, they still lose their next Main Action. The spell can target a given creature only once per scene.\nPsychic Interrogation: Target a visible intelligent creature that is cooperative or restrained. Ask them one question of no more than two sentences. They may make a Mental save; on a success, they give you three telepathic sentences of their choice. On a failure, those three sentences are a truthful and candid answer to your question. The target is then immune to this spell for a week. A target’s saving throw result is not obvious to you.\nSlow: Target a visible creature. For one round per level thereafter, each round they must either lose their Main Action or take 1d6 psychic damage per two caster levels, rounded up, with a Mental save for half damage. This damage can leave them unconscious, but not kill them. At the end of each of their rounds, they can make a Mental save to end the spell early. A creature can be affected by Slow only once per scene.\nSoul Link: You connect your mind to that of a willing visible intelligent target. For the rest of the scene, you can communicate telepathically no matter the distance between you, and each know each other’s location and physical status at all times. Once during the spell, the two of you may agree to share a skill, both using it at the same level for one round per caster level. Only one Soul Link can be active at a time.\nStun: A single visible creature takes 1d6 damage per level in psychic shock, with a Mental save to take only one point of damage per level instead. This damage can strike a creature unconscious, but it awakens ten minutes later with one hit point. A creature targeted by this spell is thereafter immune to it and Stunwave for the rest of the scene. Using this spell more than once a scene requires committing Effort for the day instead of the scene.\nStunwave: Target a visible point; every living target within five meters takes 1d6 damage per level in psychic shock, with a Mental save to take only one point of damage per level instead. This damage can strike a creature unconscious, but it awakes ten minutes later with one hit point. A creature targeted by this spell is thereafter immune to it and Stun for the rest of the scene. This spell cannot be used more than once per scene unless you overcast it.\nTriage: You touch an adjacent living creature that is Mortally Wounded, stabilizing them immediately. This process adds one System Strain to the target, though you can avoid this by Committing Effort for the day when casting it instead of for the scene.","ru":"| Заклинание | Усилие | Длительность | Эффект |\n|---|---|---|---|\n| Поджог | День | Мгновенно | Огонь по цели, 1d8 урона/уровень при попадании |\n| Удар | День | Мгновенно | Физический удар, 1d6 урона/уровень, спасбросок — половина |\n| Ударная волна | День | Мгновенно | Как Удар, но с областью 5 метров |\n| Благословение | Сцена | Сцена | Союзнику +1 к попаданию/урону/Шоку на сцену |\n| Очищение от яда | День | Мгновенно | Снять яд с цели касанием |\n| Покров | День | Сцена | 1 существо/2 уровня становится почти прозрачным |\n| Боевое предвидение | День | Сцена | Союзнику перебросы атак за Системную нагрузку |\n| Принуждение | Сцена | Сцена | Раунд принуждения, не противного цели |\n| Проклятие | Сцена | 1 раунд/уровень | Врагу растущий штраф к попаданию/урону/Шоку |\n| Обнаружение цели | Сцена | Сцена | Готовится на тип цели; чует её в 5 м/уровень |\n| Развеивание | День | Мгновенно | Развеять действующий эффект заклинания |\n| Разрушение | День | Мгновенно | Удачная атака Кулаком: +1d8 урона/уровень |\n| Эмоция | Сцена/День | Сцена | Наполнить цель нужной сильной эмоцией |\n| Дальние чувства | День | Концентрация | Наблюдать область в пределах 10 м/уровень |\n| Скольжение | Сцена | Мгновенно | Уровень+3 цели безопасно скользят вниз |\n| Спешка | День | Сцена | Союзнику лишние действия за Системную нагрузку |\n| Исцеление раны | День | Мгновенно | Лечит 1d6/3 уровня + навык Медицина; цель получает СН |\n| Освещение | Нет | Сцена | Предмет ярко светит в радиусе 10 м |\n| Мираж | Сцена | Сцена | Неосязаемая аудиовизуальная иллюзия в области |\n| Глушение | Сцена | Сцена | Область до 10 м; звук не выходит наружу |\n| Паралич | День | Сцена | 1d8/уровень выше пунктов здоровья цели — спасбросок или паралич |\n| Психический допрос | День | Мгновенно | Короткий телепатический ответ от беспомощной цели |\n| Замедление | День | 1 раунд/уровень | Цель теряет Основное действие или получает урон |\n| Связь душ | Сцена | Сцена | Телепатическая связь; один раз поделиться навыком |\n| Оглушение | Сцена/День | Мгновенно | 1d6/уровень психического урона, спасбросок снижает |\n| Волна оглушения | День | Мгновенно | Как Оглушение, но с радиусом 5 метров |\n| Сортировка | Сцена/День | Мгновенно | Стабилизировать смертельно раненного союзника |\n\n\n**Поджог:** Выбери целью видимое существо или горючий предмет. Если это существо, сделай бросок атаки Стрельбы, добавив к нему свой навык Колдовство как бонус. Если заклинание попало, цель охватывает пламя, нанося 1d8 урона огнём за уровень. Горючие предметы продолжают гореть обычным образом. Одну цель Поджог может задеть только раз за сцену.\n**Удар:** Одна видимая цель — существо или предмет — получает 1d6 урона за уровень сокрушительным ударом. Существа могут сделать Физический спасброск, чтобы уполовинить урон. Каждое применение этого заклинания в сцене после первого добавляет заклинателю одну Системную нагрузку.\n**Ударная волна:** Выбери видимую цель, существо или предмет; она и всё в пяти метрах от неё получает 1d6 урона за уровень сокрушительным ударом. Существа могут сделать Физический спасброск, чтобы уполовинить урон. Каждый раз, читая это заклинание, ты получаешь одну Системную нагрузку, и его нельзя применять чаще раза за сцену, если только не идёшь на перенапряжение.\n**Благословение:** Выбери целью видимое существо. Оно получает бонус +1 ко всем броскам атаки и урону, включая Шок, на один раунд за уровень заклинателя. На одной цели может быть только один эффект Благословения.\n**Очищение от яда:** Ты касаешься отравленного союзника; действие яда немедленно прекращается, хотя уже нанесённый им урон не излечивается.\n**Покров:** Выбери целью до одного видимого существа за два уровня заклинателя, округляя вверх. Существо становится почти прозрачным до конца сцены, получая бонус +2 ко всем проверкам Скрытности; большинство существ вообще не имеют шансов его заметить, если только не выискивают нарушителей нарочно или укрытая цель не подошла к ним ближе пяти метров. Эффект мгновенно прекращается, если укрытое существо двигается быстро — бежит, сражается или колдует.\n**Боевое предвидение:** Одна видимая цель получает краткий проблеск будущего, пока идёт бой; эффект держится до конца сцены. Этого предвидения хватает, чтобы Мгновенным действием перебросить промах или слабый бросок урона, взяв лучший из двух результатов. Один бросок можно перебросить только один раз, и после каждого применения силы цель получает Системную нагрузку, равную количеству использований за этот же день.\n**Принуждение:** Выбери целью видимое разумное существо и дай ему телепатический приказ в одно предложение, не идущий совсем уж вразрез с его желаниями. Оно должно сделать Ментальный спасброск, иначе потратит действия следующего раунда на исполнение приказа со всем возможным старанием, не сознавая твоего мысленного влияния. Если заклинание применено к цели, которая не в бою и не чувствует угрозы, она может продолжать подчиняться до конца сцены, если ничто её не встревожит. Жертвы не поймут, что их атаковали мысленно, если не преуспеют в спасброске. Как только спасброск удался, существо невосприимчиво к Принуждению до конца сцены.\n**Проклятие:** Выбери целью видимое существо. Оно получает штраф -1 ко всем броскам атаки и урону, включая Шок, на один раунд за уровень заклинателя. В конце каждого раунда оно может сделать Ментальный спасброск, чтобы сбросить эффект. Штраф растёт до -2 на 5-м уровне и до -3 на 9-м. На одном существе может действовать только одно Проклятие.\n**Обнаружение цели:** Готовя это заклинание, выбери тип цели из списка: вид живых существ, конкретный человек, с которым ты встречался, общий класс предметов, разумные существа, которые прямо сейчас намерены нанести тебе физический вред, или зачарованные предметы. После прочтения, до конца сцены, ты можешь Действием перемещения ощущать выбранную цель в пределах пяти метров за уровень, получая базовое чувство её присутствия и местоположения. Это заклинание можно подготовить несколько раз для разных целей.\n**Развеивание:** Выбери целью видимый эффект заклинания или существо. Любые эффекты заклинаний на этом существе или в указанной области немедленно прекращаются. Если у первоначального заклинателя навык Колдовство равен твоему или выше, развеивающий должен преуспеть во встречной проверке Инт/Колдовство против него, чтобы развеять его магию. Заклинание работает только против эффектов заклинаний, но не против постоянных магических эффектов, созданных предметами или иными способами.\n**Разрушение:** В следующий раз, когда ты коснёшься существа или предмета, нанеси обычный урон без оружия плюс 1d8 за уровень. Существа могут сделать Физический спасброск, чтобы избежать этого дополнительного урона. Чтобы коснуться цели в бою, нужна атака Кулаком, но маг может добавить к броску атаки свой навык Колдовство. Одновременно может быть активен только один заряд этого заклинания, и он рассеивается, если не использован до конца сцены.\n**Эмоция:** Выбери целью видимое существо, выбери эмоцию и при желании укажи объект или предмет этой эмоции. Жертва должна сделать Ментальный спасброск, иначе немедленно ощутит эту эмоцию до конца сцены, при желании направленную на указанный объект. Эмоция достаточно сильна, чтобы заставить действовать в пределах обычного характера и здравомыслия жертвы. В бою мощный страх может вынудить проверку боевого духа. Если это заклинание прочитано с задействованием Усилия на день вместо сцены, спасброск делают цель и все существа в пяти метрах от неё, и все подпадают под одну и ту же эмоцию с одним и тем же объектом.\n**Дальние чувства:** Выбери место в пределах десяти метров за уровень персонажа. Если область не защищена от магического проникновения, твои собственные человеческие чувства сосредотачиваются на этом месте так, будто ты стоишь там. Ты держишь это ясновидение, пока не делаешь ничего, кроме сосредоточения, максимум одну сцену.\n**Скольжение:** Выбери целью столько видимых существ, сколько равно твоему уровню персонажа плюс три. До конца сцены эти существа невосприимчивы к урону от падения. Прыгая с высоты, они могут приземлиться в любой точке в пределах 5 метров на каждый метр своей высоты, скользя со скоростью 40 метров в раунд.\n**Спешка:** Выбери целью видимого союзника. Следующие 1d4+1 раундов он может раз в раунд, Действием в свой ход, совершить дополнительное Основное действие. Это бонусное действие не может включать чтение заклинаний, призыв или активацию магических предметов. Использование бонусного действия добавляет 0 Системной нагрузки за первое применение в день, 1 за второе в тот же день, 2 за третье и так далее.\n**Исцеление раны:** Ты касаешься союзника, излечивая 1d6 урона за три уровня заклинателя, округляя вверх, плюс свой навык Медицина. Это лечение добавляет цели одну Системную нагрузку, но снимает любую Хилость, которой она страдает. Оно не восстанавливает Серьёзные травмы, но может стабилизировать сваленных ими.\n**Освещение:** Заклинание настолько мелкое, что не требует даже Усилия: эта инкантация заставляет тронутый предмет светиться так, как ты пожелаешь, освещая до 10 метров вокруг себя на срок до часа. Одновременно может быть активно только одно Освещение.\n**Мираж:** Выбери видимое целевое место. Ты можешь создать зрительную и слышимую иллюзию в пределах десяти метров от него. Эта иллюзия не делает предметы невидимыми, но может спрятать их за непрозрачными фантазмами. Иллюзия может включать движение и действие, но, будучи задана, уже не меняется и не может выйти за пределы целевого радиуса. Иллюзия неосязаема и не может наносить урон, а те, кто знает о её ложности, могут видеть сквозь неё при успешном Ментальном спасброске, сделанном Основным действием. Одновременно может быть вызван только один Мираж.\n**Глушение:** Выбери видимое целевое место и радиус до десяти метров. До конца сцены ни один звук, изданный в этой зоне, не будет слышен снаружи.\n**Паралич:** Выбери целью видимое существо и брось 1d8 за уровень. Если сумма больше текущих пунктов здоровья цели, она должна сделать Ментальный спасброск, иначе окажется парализована и беспомощна до конца сцены. При успешном спасброске она всё равно теряет следующее Основное действие. Одно и то же существо заклинание может выбрать целью только раз за сцену.\n**Психический допрос:** Выбери целью видимое разумное существо, которое настроено сотрудничать или связано. Задай ему один вопрос не длиннее двух предложений. Оно может сделать Ментальный спасброск; при успехе оно даёт тебе три телепатических предложения на свой выбор. При провале эти три предложения — правдивый и откровенный ответ на твой вопрос. После этого цель невосприимчива к этому заклинанию на неделю. Результат спасброска цели тебе не очевиден.\n**Замедление:** Выбери целью видимое существо. На один раунд за уровень после этого оно каждый раунд должно либо потерять Основное действие, либо получить 1d6 психического урона за два уровня заклинателя, округляя вверх, с Ментальным спасброском для уполовинивания урона. Этот урон может оставить его без сознания, но не убивает. В конце каждого своего раунда оно может сделать Ментальный спасброск, чтобы прекратить заклинание раньше срока. Существо может попасть под Замедление только раз за сцену.\n**Связь душ:** Ты соединяешь свой разум с разумом согласной видимой разумной цели. До конца сцены вы можете общаться телепатически на любом расстоянии и всё время знаете местоположение и физическое состояние друг друга. Один раз за время действия заклинания вы двое можете договориться поделиться навыком, оба применяя его на одном уровне в течение одного раунда за уровень заклинателя. Одновременно может быть активна только одна Связь душ.\n**Оглушение:** Одно видимое существо получает 1d6 урона за уровень психическим шоком, с Ментальным спасброском, чтобы получить вместо этого лишь один пункт урона за уровень. Этот урон может свалить существо без сознания, но оно приходит в себя через десять минут с одним пунктом здоровья. Существо, выбранное целью этого заклинания, после этого невосприимчиво к нему и к Волне оглушения до конца сцены. Применение этого заклинания чаще раза за сцену требует задействовать Усилие на день вместо сцены.\n**Волна оглушения:** Выбери целью видимую точку; каждая живая цель в пяти метрах получает 1d6 урона за уровень психическим шоком, с Ментальным спасброском, чтобы получить вместо этого лишь один пункт урона за уровень. Этот урон может свалить существо без сознания, но оно приходит в себя через десять минут с одним пунктом здоровья. Существо, выбранное целью этого заклинания, после этого невосприимчиво к нему и к Оглушению до конца сцены. Это заклинание нельзя применять чаще раза за сцену, если только не идёшь на перенапряжение.\n**Сортировка:** Ты касаешься смертельно раненного живого существа, стоящего вплотную, и немедленно стабилизируешь его. Этот процесс добавляет цели одну Системную нагрузку, но ты можешь этого избежать, задействовав при чтении Усилие на день вместо сцены."},
{"n":"6.2.0","l":2,"te":"Summoners and Summoning","tr":"Призыватели и призыв","en":"Those who would beckon the spirits must take the Summoner Edge at first level, as the Edge is too demanding to be taken later on in a PC’s career. Taking the Summoner Edge grants Summon as a bonus skill.\nThe Summon skill reflects the summoner’s knowledge of spiritual entities and the rigors of their training in channeling the otherworldly energies of the spirits. Anyone can learn it as a purely intellectual study, but only those with the Summoner Edge can actually use it to beckon or banish spirits.","ru":"Кто хочет звать духов, должен взять Козырь Призыватель на первом уровне — этот Козырь слишком требователен, чтобы брать его позже, в ходе карьеры ПИ. Козырь Призыватель даёт Призыв как бонусный навык.\nНавык Призыв отражает знания призывателя о духовных сущностях и суровую выучку в направлении их иномирных энергий. Выучить его как чистую теорию может кто угодно, но звать и изгонять духов с его помощью способны только владельцы Козыря Призыватель."},
{"n":"6.2.1","l":3,"te":"Summoner Effort","tr":"Усилие Призывателя","en":"Much as mages have Mage Effort, summoners have Summoner Effort, and someone who has both the Spellcaster Edge and the Summoner Edge has both pools. Summoner Effort is equal to the higher of their Constitution or Charisma modifiers plus their Summon skill level, to a minimum of 1 point.\nSummoner Effort refreshes completely each morning in the same way as Mage Effort, but Effort bound up in summoned spirits cannot be reclaimed until the morning after the spirits are dispelled. Those that are merely dismissed still act as a drain on the summoner’s energies. In all other regards, Summoner Effort works the same way as Mage Effort. As usual, the pools cannot be mixed; a spellcaster who has exhausted their Mage Effort can’t borrow from their Summoner Effort to hurl one more spell.","ru":"Как у магов есть Усилие Мага, так у призывателей есть Усилие Призывателя, а у того, кто взял и Козырь Заклинатель, и Козырь Призыватель, есть оба запаса. Усилие Призывателя равно большему из модификаторов Телосложения или Харизмы плюс уровень навыка Призыв, минимум 1 пункт.\nУсилие Призывателя полностью восстанавливается каждое утро — так же, как Усилие Мага, — но Усилие, связанное в призванных духах, нельзя вернуть раньше утра после того дня, когда духи были рассеяны. Просто отпущенные духи по-прежнему тянут силы призывателя. Во всём остальном Усилие Призывателя работает как Усилие Мага. Как обычно, запасы не смешиваются: заклинатель, истративший Усилие Мага, не может занять из Усилия Призывателя ради ещё одного заклинания."},
{"n":"6.2.2","l":3,"te":"Summoners and Cyberware","tr":"Призыватели и кибернетика","en":"For each cybernetic system implanted in a summoner, their Summoner Effort maximum decreases by the System Strain of the implant, to a minimum of one point even for trivial cosmetic mods. Thus, a summoner who implanted hardware that had System Strain costs of 2, 0, and 0.5 would lose four points of maximum Summoner Effort. This Effort can be restored by removing the cyberware.","ru":"За каждую кибер-систему, вживлённую призывателю, его максимум Усилия Призывателя уменьшается на Системную нагрузку импланта, но не ниже одного пункта — даже при пустяковых косметических модах. Так, призыватель, вжививший себе железо с Системной нагрузкой 2, 0 и 0,5, потеряет четыре пункта максимума Усилия Призывателя. Это Усилие можно вернуть, удалив кибернетику."},
{"n":"6.2.3","l":3,"te":"Calling and Dismissing Spirits","tr":"Призыв и отпускание духов","en":"A ritually summoned spirit is in attendance on its summoner, but it does not always have to be immediately present. As a Main Action, the summoner can dismiss a spirit they command within 30 meters, causing it to vanish. As another Main Action, the summoner can call it, causing the vanished spirit to reappear within 5 meters, provided there is no obstacle between them and the summoner too big for the spirit to fit through. Dismissed spirits leave behind any objects they were carrying or wearing. Time passes normally for dismissed spirits, so persistent effects on them continue to tick over. Spirits beckoned with immediate summoning cannot be called or dismissed, and remain present until they are destroyed or dispelled.","ru":"Ритуально призванный дух состоит при своём призывателе, но не обязан всё время быть рядом. Основным действием призыватель может отпустить подчинённого духа в пределах 30 м, и тот исчезает. Другим Основным действием призыватель может позвать его, и исчезнувший дух возникает в пределах 5 м — при условии, что между ним и призывателем нет преграды, слишком большой, чтобы дух смог её обойти или пройти. Отпущенные духи оставляют на месте все предметы, которые несли или носили. Для отпущенных духов время идёт как обычно, так что длящиеся на них эффекты продолжают отсчёт. Духов, вызванных мгновенным призывом, нельзя позвать или отпустить: они остаются здесь, пока не будут уничтожены или рассеяны."},
{"n":"6.2.3.1","l":4,"te":"Ritual Spirit Summoning","tr":"Ритуальный призыв духа","en":"Ritually-summoned spirits require less Effort and can be called and dismissed, but take more time to summon. To ritually summon a spirit, follow the steps below.\n1. Spend two hours in a complex ritual. No special magical components or facilities are required for this rite, but you cannot be disturbed during it or it will fail.\n2. Choose a nature for your summons. Pick a single noun describing the basic type of spirit you’re calling: Fire, Water, Streets, Trees, Night, or some other term. All the powers you choose for the spirit must be somehow related to its nature. The spirit’s skill bonus applies to all skill checks pertinent to its nature, which may be very few of them for the more esoteric concepts.\n3. Choose a physical or spirit form for your summons. Pick either a Physical Form or Spirit Form to manifest your spirit. At first level, you can only pick Physical Form I or Spirit Form I. At 5th level you can pick the second level of those forms, and at 9th, you can choose the third level. You can’t have more total hit dice of spirits summoned at once than your character level.\n4. Choose an appearance for your summons. Spirits can appear in any shape no larger than a rabbit and no smaller than a draft horse, but they appear unnatural without a Mortal Disguise.\n5. Choose powers for your summons. You can freely pick as many powers as you wish, each one adding one point of cost to the spirit. Some powers require a minimum character level to add them.\n6. Commit Effort to summon the spirit. You must Commit Summoner Effort for the day equal to the spirit’s cost minus one. This cost is also decreased by your Summon skill. No spirit can cost less than one point of Effort to summon. You cannot recover this Effort until the morning after the spirit is dispelled or destroyed.\n7. The spirit will manifest at the end of the ritual and will obediently serve you until it is destroyed or dispelled. It may be dismissed or called freely while it remains summoned. Spirits are dispelled instantly if the summoner dies.","ru":"Ритуально призванные духи требуют меньше Усилия, их можно звать и отпускать, но на призыв уходит больше времени. Чтобы призвать духа ритуально, выполни шаги ниже.\n1. Проведи два часа в сложном ритуале. Особые магические компоненты или помещения для обряда не нужны, но тебя нельзя беспокоить во время него, иначе ритуал сорвётся.\n2. Выбери природу призываемого. Возьми одно существительное, описывающее базовый тип духа, которого зовёшь: Огонь, Вода, Улицы, Деревья, Ночь или иное понятие. Все выбранные для духа силы должны быть как-то связаны с его природой. Бонус навыка духа применяется ко всем проверкам навыков, относящимся к его природе, — а для особо эзотерических понятий таких проверок может быть совсем немного.\n3. Выбери физическую или духовную форму призываемого. Возьми либо Физическую форму, либо Духовную форму для воплощения духа. На первом уровне доступны только Физическая форма I или Духовная форма I. На 5-м уровне можно взять второй уровень этих форм, на 9-м — третий. Суммарное число Костей здоровья одновременно призванных духов не может превышать твой уровень персонажа.\n4. Выбери облик призываемого. Дух может выглядеть как угодно, но не мельче кролика и не крупнее тяжеловоза; без Смертной личины он выглядит неестественно.\n5. Выбери силы для призываемого. Ты свободно берёшь сколько сил хочешь, каждая добавляет один пункт к стоимости духа. Некоторые силы требуют минимального уровня персонажа.\n6. Задействуй Усилие, чтобы призвать духа. Нужно задействовать Усилие Призывателя на день в объёме стоимости духа минус один. Эта стоимость также уменьшается на твой уровень навыка Призыв. Ни один дух не может стоить меньше одного пункта Усилия. Это Усилие нельзя вернуть раньше утра после того, как дух будет рассеян или уничтожен.\n7. Дух воплощается в конце ритуала и покорно служит тебе, пока не будет уничтожен или рассеян. Пока он призван, его можно свободно отпускать и звать. Духи рассеиваются мгновенно, если призыватель погибает."},
{"n":"6.2.3.2","l":4,"te":"Immediate Spirit Summonings","tr":"Мгновенный призыв духов","en":"Immediate summonings can be made with no more than a Main Action, but they cannot be called and dismissed and they require slightly more Effort to raise.\n1. Spend a Main Action to quickly call a spirit. This calling cannot be disrupted by physical harm the way spellcasting can be disrupted.\n2. Choose a nature for your summons. Pick a single noun describing the basic type of spirit you’re calling: Fire, Water, Streets, Trees, Night, or some other term. All the powers you choose for the spirit must be somehow related to its nature. The spirit’s skill bonus applies to all skill checks pertinent to its nature, which may be very few of them for the more esoteric concepts.\n3. Choose a physical or spirit form for your summons. Pick either a Physical Form or Spirit Form to manifest your spirit. At first level, you can only pick Physical Form I or Spirit Form I. At 5th level you can pick the second level of those forms, and at 9th, you can choose the third level. You can’t have more total hit dice of spirits summoned at once than your character level.\n4. Choose an appearance for your summons. Spirits can appear in any shape no larger than a rabbit and no smaller than a draft horse, but unless the Mortal Disguise power is taken they will always look uncanny and unnatural.\n5. Choose powers for your summons. You can freely pick as many powers as you wish, each one adding one point of cost to the spirit. Some powers require that you have a minimum character level to select them.\n6. Commit Effort to summon the spirit. You must Commit Summoner Effort for the day equal to the spirit’s cost. This cost is also decreased by your Summon skill. No spirit can cost less than one point of Effort to summon, and the total summoning cost increases by 1 Effort point for each successive immediate summons within the same scene.\n7. The spirit instantly appears within 5 meters of the summoner, and will serve them for up to an hour before vanishing. The spirit begins taking actions on the next round after being summoned, acting on its summoner’s initiative. Spirits summoned this way cannot be called or dismissed; they always remain present in this world until they are destroyed or dispelled. Spirits are dispelled instantly if the summoner dies.","ru":"Мгновенный призыв укладывается в одно Основное действие, но таких духов нельзя звать и отпускать, и на их поднятие уходит чуть больше Усилия.\n1. Потрать Основное действие, чтобы быстро позвать духа. Этот зов нельзя сорвать физическим вредом, как срывают чтение заклинаний.\n2. Выбери природу призываемого. Возьми одно существительное, описывающее базовый тип духа, которого зовёшь: Огонь, Вода, Улицы, Деревья, Ночь или иное понятие. Все выбранные для духа силы должны быть как-то связаны с его природой. Бонус навыка духа применяется ко всем проверкам навыков, относящимся к его природе, — а для особо эзотерических понятий таких проверок может быть совсем немного.\n3. Выбери физическую или духовную форму призываемого. Возьми либо Физическую форму, либо Духовную форму для воплощения духа. На первом уровне доступны только Физическая форма I или Духовная форма I. На 5-м уровне можно взять второй уровень этих форм, на 9-м — третий. Суммарное число Костей здоровья одновременно призванных духов не может превышать твой уровень персонажа.\n4. Выбери облик призываемого. Дух может выглядеть как угодно, но не мельче кролика и не крупнее тяжеловоза; и если не взята сила Смертная личина, он всегда будет выглядеть жутковато и неестественно.\n5. Выбери силы для призываемого. Ты свободно берёшь сколько сил хочешь, каждая добавляет один пункт к стоимости духа. Некоторые силы требуют, чтобы у тебя был минимальный уровень персонажа.\n6. Задействуй Усилие, чтобы призвать духа. Нужно задействовать Усилие Призывателя на день в объёме стоимости духа. Эта стоимость также уменьшается на твой уровень навыка Призыв. Ни один дух не может стоить меньше одного пункта Усилия, а общая стоимость призыва растёт на 1 пункт Усилия за каждый следующий мгновенный призыв в той же сцене.\n7. Дух мгновенно появляется в пределах 5 м от призывателя и служит ему до часа, после чего исчезает. Дух начинает действовать на следующем раунде после призыва, на инициативе своего призывателя. Призванных так духов нельзя звать или отпускать: они всегда остаются в этом мире, пока не будут уничтожены или рассеяны. Духи рассеиваются мгновенно, если призыватель погибает."},
{"n":"6.2.4","l":3,"te":"Destroying and Banishing Spirits","tr":"Уничтожение и изгнание духов","en":"Spirits are destroyed by reducing their hit points to zero, whereupon they immediately vanish. A specific destroyed spirit with the Namebearer power can be summoned again by the summoner, but nameless spirits cannot be specifically beckoned back once destroyed. A visible spirit within thirty meters may also be dispelled by their summoner as a Main Action, sending them back from whence they came and allowing any Effort invested in their summoning to be restored the following morning.\nA summoner may also banish spirits offensively, even those they did not summon. Each banishment attempt requires a Main Action and that they Commit Summoner Effort for the day and target a visible spirit within 30 meters. They then make an opposed Cha/Summon skill check against the spirit’s summoner, or against the spirit’s skill bonus +2 if the spirit is uncontrolled. On a success, they inflict 1d8 damage per Summon skill level to the spirit.","ru":"Дух уничтожается, когда его пункты здоровья доходят до нуля, — после чего он немедленно исчезает. Уничтоженного духа с силой Носитель имени призыватель может призвать снова, а вот безымянных духов после уничтожения позвать обратно уже нельзя. Видимого духа в пределах тридцати метров призыватель также может рассеять Основным действием, отправив его туда, откуда тот пришёл, и позволив вернуть на следующее утро всё Усилие, вложенное в его призыв.\nПризыватель может и наступательно изгонять духов — даже тех, которых не призывал сам. Каждая попытка изгнания требует Основного действия и того, чтобы он задействовал Усилие Призывателя на день и выбрал целью видимого духа в пределах 30 м. Затем он делает встречную проверку Хар/Призыв против призывателя духа — или против бонуса навыка духа +2, если дух неподконтрольный. При успехе он наносит духу 1d8 урона за каждый уровень навыка Призыв."},
{"n":"6.2.5","l":3,"te":"Spirit Abilities and Limits","tr":"Способности и ограничения духов","en":"Every summoned spirit shares a few basic qualities. Spirits can:\n* Think with human intelligence and carry out verbal orders reasonably and intelligently.\n* Exist without food, water, or air, and resist all mundane toxins, diseases, and radiation.\n* Speak, read, and write any languages known to their summoner.\n* Gain their skill bonus when performing skill checks related to their nature.\n* Ignore Morale checks, being solely subject to their summoner’s commands within the limits of their nature.\nAlong with these abilities, there are some things that spirits simply can’t do.\n* Use weapons or armor, as spirits can use only such things as are part of their own being.\n* Operate human technology beyond pushing a single button. They understand the uses of such devices, but simply cannot conceive of using them personally.\n* Attack or directly harm humans, creatures, or other spirits without the Violent Will power. Only spirits in physical form can take this power.\n* Act directly contrary to their nature or accept a suicidal order without attempting to resist it.\nSome of these limits can be at least partially circumvented with the right spirit powers.","ru":"У всех призванных духов есть несколько общих свойств. Духи могут:\n* Мыслить с человеческим интеллектом и разумно, толково выполнять словесные приказы.\n* Существовать без еды, воды и воздуха и сопротивляться всем обычным токсинам, болезням и радиации.\n* Говорить, читать и писать на любых языках, известных их призывателю.\n* Получать свой бонус навыка при проверках навыков, связанных с их природой.\n* Игнорировать проверки боевого духа: они подчинены только приказам призывателя в пределах своей природы.\nНаряду с этими способностями есть и то, чего духи просто не могут.\n* Пользоваться оружием или бронёй: духи могут применять только то, что является частью их собственного существа.\n* Управляться с человеческой техникой сложнее нажатия одной кнопки. Они понимают, зачем нужны такие устройства, но попросту не в состоянии помыслить о том, чтобы пользоваться ими самим.\n* Атаковать или напрямую вредить людям, существам и другим духам без силы Яростная воля. Эту силу могут взять только духи в физической форме.\n* Действовать прямо против своей природы или принять самоубийственный приказ, не попытавшись сопротивляться.\nЧасть этих ограничений можно хотя бы отчасти обойти правильными силами духов."},
{"n":"6.2.5.1","l":4,"te":"Physical and Spirit Forms","tr":"Физические и духовные формы","en":"Every spirit must be summoned with a manifestation, either a physical or spiritual one. These manifestations do not count as a power when it comes to calculating a spirit’s cost.\nPhysical forms must be no smaller than a rabbit but not larger than a draft horse. They can be humanoid, but invariably appear uncanny and unnatural. They have ordinary human degrees of strength, speed, and other physical qualities when those are relevant.\nSpirit forms must be of the same size, but are visible, intangible and unable to directly affect the mundane world except through their powers. They cannot pass through living creatures large enough to see, as their spiritual energies are impermeable. They also cannot pass through walls, closed doors, barriers, or the earth, as all these things have a psychic significance of obstruction that ordinary inanimate matter does not. They can pass through liquids. They can be harmed by spells, magic weapons, fire, other immaterial energies, and the psychic force of unarmed attacks, not including cyberclaws or other inanimate add-ons.","ru":"Каждый дух призывается с воплощением — физическим или духовным. Эти воплощения не считаются силой при расчёте стоимости духа.\nФизические формы должны быть не мельче кролика и не крупнее тяжеловоза. Они могут быть человекоподобными, но неизменно выглядят жутковато и неестественно. Их сила, скорость и прочие физические качества — на обычном человеческом уровне, когда это важно.\nДуховные формы должны быть того же размера, но они видимы, неосязаемы и не могут напрямую влиять на обычный мир иначе как через свои силы. Они не могут проходить через живых существ, достаточно крупных, чтобы их было видно, — их духовные энергии непроницаемы. Они также не могут проходить через стены, закрытые двери, барьеры и землю: всё это несёт психическую значимость преграды, которой нет у обычной неживой материи. Через жидкости они проходить могут. Им можно повредить заклинаниями, магическим оружием, огнём, иными нематериальными энергиями и психической силой рукопашных атак — но не киберкогтями и прочими неживыми накладками."},
{"n":"6.2.6","l":3,"te":"Commanding Spirits","tr":"Управление духами","en":"Spirits will intelligently obey their summoner’s verbal commands to the limit of their abilities under most cases. In combat or other time-sensitive situations, spirits act independently on the same initiative as their summoner. They’ll carry out orders intelligently, albeit their actions are usually colored by the spirit’s own nature. Provided their master does not demand anything too contrary to their nature or their interests, a spirit can be relied upon to be an incorruptible servant.\nIf a spirit is ordered to do something opposed or repugnant to its nature or is commanded to do something that it thinks certain to end in its destruction, it will resist the order. The summoner can either accept its refusal or try to force it into obedience.\nCompelling a spirit requires that the summoner Commit Effort for the scene and make a successful Cha/Summon skill check at a difficulty ranging from 8, for a deeply distasteful command, to 11, for a suicidal order, to 13, for an act that is directly contrary to the spirit’s basic nature. On a success, the spirit grudgingly obeys.\nOn a failure, the spirit breaks free from the summoner’s control. The good news is that the Effort required to summon it can now be recovered the following morning. The bad news is that the spirit now is entirely outside the command of the summoner, and is likely very angry with them. Some spirits will flee, while others may attack or bedevil the summoner. These uncontrolled spirits can persist for as long as they can continue to find some source of sympathetic energy to fuel them, and over time they can grow to be quite dangerously powerful. Most uncontrolled spirits fail to find such a source and fade away in a few days, but “most” is small comfort when that renegade fire spirit gets into the aluminum foundry or the spirit of battle finds a gang war to join.\nIntentionally freeing a spirit is theoretically possible, but such forced rejection tends to cause unpredictable negative consequences to the summoner's abilities.","ru":"В большинстве случаев духи разумно подчиняются словесным приказам призывателя в пределах своих возможностей. В бою и других ситуациях, где важно время, духи действуют самостоятельно на той же инициативе, что и призыватель. Приказы они выполняют толково, хотя их действия обычно окрашены собственной природой духа. Пока хозяин не требует чего-то слишком противного их природе или интересам, на духа можно полагаться как на неподкупного слугу.\nЕсли духу приказано сделать что-то противное или отвратительное его природе либо то, что, по его мнению, наверняка закончится его уничтожением, он будет сопротивляться приказу. Призыватель может либо принять отказ, либо попытаться заставить духа подчиниться.\nЧтобы принудить духа, призыватель должен задействовать Усилие на сцену и успешно сделать проверку Хар/Призыв со сложностью от 8 — за глубоко неприятный приказ, до 11 — за самоубийственный, и до 13 — за действие, прямо противоречащее базовой природе духа. При успехе дух нехотя подчиняется.\nПри провале дух срывается с поводка призывателя. Хорошая новость: Усилие, потраченное на его призыв, теперь можно вернуть на следующее утро. Плохая новость: дух полностью выходит из-под команды призывателя и, скорее всего, очень на него злится. Одни духи убегут, другие могут напасть на призывателя или начать его донимать. Такие неподконтрольные духи держатся столько, сколько могут находить источник созвучной им энергии для подпитки, и со временем способны вырасти в весьма опасную силу. Большинство неподконтрольных духов такого источника не находят и угасают за несколько дней, но «большинство» — слабое утешение, когда тот беглый дух огня забирается в алюминиевую плавильню, а дух битвы находит себе войну банд.\nНамеренно освободить духа теоретически возможно, но такое насильственное отторжение обычно приводит к непредсказуемым негативным последствиям для способностей призывателя."},
{"n":"6.2.7","l":3,"te":"Spirit Manifestations","tr":"Воплощения духов","en":"The statistics below are provided for the various manifestation powers used to embody a spirit.\n\n\n                                                                                                Min.\nManifestation        HD        HP        AC        TT        Atk.        Dmg.        Shock        Move        Skill        Save        Lvl\nSpirit Form I        1        5        10*        6        None        None        None        10m        +1        15+        1\nSpirit Form II        3        15        13*        6        None        None        None        15m        +1        14+        5\nSpirit Form III        5        25        15*        6        None        None        None        20m        +2        13+        9\nPhys. Form I         1        5        12        6        +2@        1d10        None        10m        +0        15+        1\nPhys. Form II         4        20        15        6        +5@  1d10+2        2/15         10m        +1        13+        5\nPhys. Form III         8        40        18        6        +8@  1d10+4        4/15         10m        +2        11+        9\n*: Spirit Forms can only be harmed by unarmed attacks, spells, magical weapons, fire, or other energies\n@: Only Physical Forms with Violent Will can fight. Spirit Forms cannot directly harm creatures.","ru":"Ниже приведены статы для разных сил воплощения, которыми облекают духа.\n\n\n| Воплощение | КЗд | ПЗ | КЗщ | ПТ | Атк. | Урон | Шок | Скор. | Нав | Спас | Мин. ур. |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| Духовная форма I | 1 | 5 | 10* | 6 | Нет | Нет | Нет | 10 м | +1 | 15+ | 1 |\n| Духовная форма II | 3 | 15 | 13* | 6 | Нет | Нет | Нет | 15 м | +1 | 14+ | 5 |\n| Духовная форма III | 5 | 25 | 15* | 6 | Нет | Нет | Нет | 20 м | +2 | 13+ | 9 |\n| Физ. форма I | 1 | 5 | 12 | 6 | +2@ | 1d10 | Нет | 10 м | +0 | 15+ | 1 |\n| Физ. форма II | 4 | 20 | 15 | 6 | +5@ | 1d10+2 | 2/15 | 10 м | +1 | 13+ | 5 |\n| Физ. форма III | 8 | 40 | 18 | 6 | +8@ | 1d10+4 | 4/15 | 10 м | +2 | 11+ | 9 |\n*: Духовным формам можно повредить только рукопашными атаками, заклинаниями, магическим оружием, огнём или иными энергиями\n@: Драться могут только Физические формы с Яростной волей. Духовные формы не могут напрямую вредить существам."},
{"n":"6.2.8","l":3,"te":"Spirit Powers","tr":"Силы духов","en":"The powers listed here are simply the most common among summoned spirits. A given power can only be taken once by any given spirit. Rarer abilities are said to be possessed by some entities, and some magical traditions are thought to teach the knowledge of special arts to their initiates.\n\n\nAiry Steps: The spirit can fly at its usual movement rate, though it cannot attack while flying. Physical spirits can carry up to 25 kilograms, or up to 500 if they have a Mighty Form.\nArtifice-Wise: A spirit is capable of using daily human technology such as telephones, cars, and other common devices at an ordinary human level of skill. They are still unable to use human weapons or armor, however, including grenades, and they cannot function as hackers, technicians, or other tech-skilled professions regardless of their other powers.\nAura of Destruction: The spirit is mantled in toxic gases, bitter cold, leaping flames, crushing depression, or some other aura that causes harm to those who get too close. If the spirit can make melee attacks, it gains a damage bonus equal to half its hit dice, rounded up. If someone makes a melee attack against it, they must make an appropriate save or suffer the spirit’s hit dice+2 in damage before the attack can be made. The save type will depend on the nature of the aura. Non-lethal auras can strike a victim unconscious but will not kill them. The spirit cannot “turn off” this aura.\nCurse: As a Main Action, the spirit can blight a visible creature’s luck, forcing a -1 to all skill checks and a -2 to all hit and damage rolls for the scene. At 7th level these penalties double. A creature can bear only one curse at a time, and the spirit can’t curse more people in a single day than its hit dice.\nEnsnare: The spirit can trap human-sized targets as a Main Action, provided they’re within 30 meters and fail an Evasion save. If snared, it’s two Main Actions for an ally to cut them free, or one successful Str/Exert check against difficulty 10. Ensnared enemies can still act, but cannot move from their location until the snare fades in five minutes. The spirit can’t have more targets snared at once than its hit dice. Only spirits in physical form can take this power.\nFavor: As a Main Action, the spirit graces a target’s luck in a particular activity related to its nature, giving them a +1 to all related skill checks for a scene. If a combat blessing is given, the subject gets a +2 to hit and damage rolls. At 7th level, these benefits double. It’s up to the GM to decide whether or not a particular activity is related to the spirit. A creature can bear only one favor at a time and a spirit cannot favor more people in a day than its hit dice.\nFeral Pact: Animals of the same general type as the spirit obey its commands, provided its commands are not contrary to their nature. This power is useless to spirits without an animal nature.\nFinned Swiftness: The spirit gains a swimming movement rate equal to twice its normal Move.\nFlesh of Clay: The spirit is not subject to Traumatic Hits, rather than having the usual Trauma Target of 6.\nGhostly Presence: The spirit is invisible to sight, including IR and similar exotic senses, until it takes a violent action, makes a disturbance, or uses a power on a target that allows a saving throw. Once this invisibility is lost, it cannot be regained for ten minutes.\nHideous Talons: The melee attack of Violent Will is improved. Its Shock now affects any AC and both damage and Shock are increased by +2. These benefits do not apply to any ranged attacks the spirit may make. Spirits summoned with this power always look dangerous or vicious, and cannot be disguised as something harmless.\nIron Eidolon: A Physical Form spirit is now immune to non-magical weapons that aren’t Heavy. The psychic force inherent in unarmed attacks can still harm it, however, even if the assailant isn’t magically-gifted.\nMerciful Hands: The spirit can expend its power to heal an injured victim. As a Main Action, it can heal 1d8 HP to an adjacent ally. Each use of this power inflicts 1d8 damage to the spirit and adds one System Strain to the target. A spirit with this power will willingly use it even if it faces destruction by doing so.\nMighty Form: Requiring a physical form, this power enhances the spirit’s strength. While this strength is too slowly-deployed to be useful in combat, with a Main Action the spirit can smash down an interior wall or standard exterior door, lift and carry up to five hundred kilograms, or otherwise perform similar feats of raw strength. If used against a helpless or immobile target, the spirit must have the Violent Will power. If so, the spirit’s melee attacks against the helpless are an automatic Traumatic Hit and can cause harm even to vehicles.\nMislead: Once per round, as an Instant action, the spirit can target a moving person. If the target fails a Mental save, the spirit controls their intended movement, directing it in any direction that is not obviously dangerous out to the maximum of their normal Move action. If the victim is not aware of the spirit’s interference, they will think their course was somehow their own idea and try to rationalize why they did it.\nMisty Form: The spirit can flow through any barrier that isn’t watertight without impeding its movement. Even entities in Spirit Form can use this to seep through holes in barriers their manifested shape would otherwise be unable to pass.\nMortal Disguise: The spirit appears to be a normal human being on casual inspection, with the appearance and clothing the summoner wishes. Specific humans cannot be duplicated by this power, and close, careful inspection of the spirit will reveal its uncanny nature.\nMyrmidon’s Shield: As an Instant action, when the spirit’s summoner takes a Traumatic Hit while the spirit is within 10 meters, the spirit can change the hit to a regular one. The spirit, however, then takes the Traumatic Hit. This damage affects the spirit even if it is otherwise immune to the weapon or to Traumatic Hits. A spirit with this power will willingly use it even if it faces destruction by doing so.\nNamebearer: The spirit is named by the summoner. Even if destroyed, this specific spirit can be summoned again with all the knowledge and experiences it had before its destruction. While this preserves its personality and experiences, this also means that you must summon it with the same physical or spiritual manifestation and can only ever add powers to it; once you imbue it with Hideous Talons, for example, every future summoning of it must also have that power. Namebearers are slightly more durable, gaining +2 hit points per hit die. They’re also more willful, adding +2 to the difficulty of imposing an unnatural command on them.\nNatural Immunity: The spirit is impervious to some substance appropriate to its nature: a fire spirit could be immune to fire, a storm spirit to electricity, or so forth. This imperviousness cannot render it immune to normal weapons or attacks, and the GM rules on edge cases.\nPoltergeist: As a Main Action, the spirit can telekinetically manipulate unattended objects within 20 meters as if with two unseen hands. This manipulation can lift no more than 20 kilograms and is too imprecise to deliver effective attacks or impede a resisting subject. Actions taken with this power do not disrupt Ghostly Presence, even if they cause a disturbance.\nSkilled: The spirit is talented at a particular non-combat skill, gaining an additional +2 bonus to all rolls related to its use. \nSpiderlegs: The spirit can stand or walk on sheer or overhanging surfaces as if they were flat ground.\nSpirit of War: A spirit with a Violent Will has the power enhanced, granting it a tremendous zeal for bloodshed. It gains a bonus to its hit roll equal to your Summon skill and no longer resists commands to engage in suicidal battles. It is incapable of inflicting no
