me target grants a +1 hit bonus if there’s a forward spotter to adjust the aim. Mortar rounds act as frag grenades on the target point, but do 3d6 damage at base with a 10-meter radius. Armor doesn’t lessen harm from mortar rounds.\nRelatively simple as they are, a mortar round costs $50 and counts as one item of encumbrance.\nRocket launchers include a wide variety of single-shot disposable launchers. Their general imprecision forces a -4 hit penalty against human-sized targets, but they inflict frag grenade damage on any target within 5 meters of the rocket’s landing point. Specialized anti-armor warheads lose this frag grenade bonus, but do double damage to vehicles or obstacles. Operators who intend to take down enemy vehicles favor them for their effectiveness in that role.\nLand mines come in anti-personnel and anti-vehicle flavors. The first activates on any human-sized approach within 1 meter, inflicting damage in a 2-meter radius with an Evasion save for half. Anti-vehicle mines can only be activated by vehicular levels of ground pressure or vehicle-sized proximate metal masses, but do their damage in a 5-meter radius. Humans get an Evasion save for half damage in either case.","ru":"Такое встречается нечасто, но кому-то из операторов может не повезти столкнуться с военными или с противниками, которым плевать на невыносимый Накал от местных властей. У таких бойцов, скорее всего, оружие куда тяжелее того, что таскает обычный уличный оператор. Самим же операторам применение оружия вроде описанного ниже в большинстве миссий грозит опасно жёсткой ответкой от встревоженных корп и местной полиции.\n\n\n| Тяжёлое оружие | Урон | Дист. | Цена | Маг | Хар. | Загр. | КТ | МТ |\n|---|---|---|---|---|---|---|---|---|\n| Противоматериальная винтовка ¶ | 3d8! | 1 тыс./2 тыс. | $8 000@ | 5 | Лов | 3 | 1d12 | ×3 |\n| Гранатомёт | Гран. | 150/350 | $3 000@ | 3 | Лов | 1 | – | – |\n| Подрывной заряд | 3d10! | 20/20 | $1 000@ | – | – | 1 | 1d10 | ×3 |\n| Тяж. пулемёт ¶ | 3d6#! | 500/2 тыс. | $10 тыс.@ | 10 | Лов | 3 | 1d12 | ×3 |\n| Миномёт | 3d6 | 1 тыс./2 тыс. | $5 000@ | 1 | Мдр | 3 | 1d12 | ×3 |\n| Ракетомёт | 3d10! | 2 тыс./4 тыс. | $5 000@ | – | Лов | 2 | 1d10 | ×3 |\n| Мина, противопехотная | 1d8 | – | $150@ | – | – | 1 | 1d10 | ×3 |\n| Мина, противотранспортная | 3d8! | – | $1 000@ | – | – | 2 | 1d20 | ×3 |\n\n@: Для покупки этого оружия нужен подходящий Контакт — в открытой продаже оно, как правило, незаконно\n¶: Если стрелять не с неподвижной опоры, характеристики этого оружия такие же, как у обычной винтовки\n#: Это оружие может стрелять на подавление, если закреплено на транспорте или на стационарной огневой позиции\n!: Кость травмы этого оружия может наносить Травматичные попадания дронам, транспорту и другим машинам.\n\n\nПротивоматериальные винтовки переживают своего рода возрождение: бронированные дроны и напичканные кибером бойцы теперь на каждом углу. Танк или другой тяжелобронированный транспорт ими не свалить, но их 20-мм патронов более чем достаточно, чтобы пробить лёгкие бронеплиты, бетонные стены и киборгов с полной конверсией тела. Для лучшего результата стоит стрелять с надёжной опоры.\nГранатомёты — это навесное оборудование для огнестрела размером с винтовку, добавляющее 1 к его Загруженности. Они выбрасывают специально сделанные гранаты на указанную дистанцию, наводя их так же, как при обычном броске. Эти особые гранаты стоят столько же и работают так же, как их обычные аналоги, но метать их рукой нельзя. Атакуя, владелец выбирает, стрелять из гранатомёта или из оружия, на которое тот установлен, но в одном раунде выстрелить и из того и из другого не получится.\nЕсть и отдельные модели гранатомётов для установки на транспорт или дрон: они считаются за 2 Загруженности, но в остальном имеют ту же цену и характеристики.\nПодрывные заряды — это кумулятивные заряды, обычно рассчитанные пробивать дыры размером с человека в чём угодно, кроме укреплённых защитных стен. Как метательное оружие они бесполезны, но при использовании в ловушке или засаде наносят указанный урон в конусе до обычной дистанции, со спасброском Уклонения на половину урона. Если аккуратно приложить такой заряд к транспорту, взрыв неминуемо его уничтожит. Как и осколочные гранаты, подрывные заряды сильно возбуждают силы безопасности и могут поднять больше Накала, чем многие операторы хотят на себя навлечь.\nТяжёлые пулемёты — старая техника, но надёжная. Правда, без стационарной огневой позиции или крепления на транспорте отдача делает их почти неуправляемыми. Из-за массы свинца, которую выбрасывает тяжёлый пулемёт, каждый «выстрел» его боезапаса стоит $100 и считается за целый предмет загруженности.\nМиномёты редки, но среди высоких зданий мегаполиса им есть применение. У них минимальная дистанция 20 метров, зато они кидают навесной огонь через здания и препятствия. Миномёт всегда сперва целится в КЗщ 20, но каждый следующий раунд стрельбы по той же цели даёт +1 к попаданию, если есть передовой наблюдатель, который корректирует прицел. Миномётные мины работают в точке попадания как осколочные гранаты, но наносят базово 3d6 урона в радиусе 10 метров. Броня не снижает вред от миномётных мин.\nПри всей своей относительной простоте миномётная мина стоит $50 и считается за один предмет загруженности.\nРакетомёты — это широкий набор одноразовых пусковых устройств на один выстрел. Общая неточность даёт -4 к попаданию по целям размером с человека, но они наносят урон осколочной гранаты любой цели в 5 метрах от точки падения ракеты. Специализированные противобронные боеголовки теряют этот бонус осколочной гранаты, зато наносят двойной урон транспорту и препятствиям. Операторы, которые собираются валить вражеский транспорт, ценят их именно за это.\nМины бывают противопехотные и противотранспортные. Первые срабатывают на любое приближение объекта размером с человека в пределах 1 метра и наносят урон в радиусе 2 метров, со спасброском Уклонения на половину. Противотранспортные мины срабатывают только от давления на грунт транспортного уровня или от близкой металлической массы размером с машину, зато наносят урон в радиусе 5 метров. Люди в обоих случаях получают спасброск Уклонения на половину урона."},
{"n":"3.4.5","l":3,"te":"Weapon Mods","tr":"Моды оружия","en":"The mods listed here can be applied to weapons by a tech with the listed skill level at the given costs, as explained in section 2.8.2. Some require a certain number of units of special technology as well as ordinary parts. Unless specified otherwise, a given mod can be applied only once to an item.\n\n\nMod                        Skill        Cost                Special Components\nAutotargeting                Fix-1        $5,000                0\nConcealed                Fix-2        $5,000                1\nCustomized                Fix-1        $1,000                0\nExtended Mag                Fix-1        $1,000                0\nHeavy Sabot                Fix-1        $2,000                0\nIntegral Toxins                Fix-2        $10,000        1\nOnboard Gunlink        Fix-2        $10,000        1\nPredictive Guidance        Fix-3        $15,000        2\nReel Wires                Fix-1        $2,500                0\nSavage Impact        Fix-1        $5,000                0\nShock Burst                Fix-2        $5,000                0\nStun Rounds                Fix-2        $5,000                0\nThermal Charge        Fix-2        $7,500                0\n\n\nAutotargeting: The weapon has kinetic sensors embedded in it that synchronize with onboard targeting chips. The user gains a +1 bonus to all hit rolls with the weapon, but needs to connect with it via either a Gunlink or a Cranial Jack.\nConcealed: Materials are replaced, outlines are altered, and appearances are adjusted. Pistol-sized and smaller weapons now cannot be detected without a full minute of patting down the bearer, while anything no larger than a rifle can be concealed as if it were a pistol, unfolding to full size upon use.\nCustomized: The weapon’s balance and form are tailored to a specific user. That user gains a +1 bonus to all hit rolls with the weapon.\nExtended Magazine: Caliber adjustments, feed assists, and magazine dimension alterations double a gun’s reliable magazine capacity.\nHeavy Sabot: Applicable only to projectile weapons, the gun is modified to fire heavy AP rounds that can plausibly land Traumatic Hits even on armored vehicles or heavy drones.\nIntegral Toxins: A melee or thrown weapon is impregnated with numerous microcells of an advanced hemotoxin, the cells rupturing on impact with a target. The weapon does +2 damage and Shock to subjects not immune to poison.\nOnboard Gunlink: Usable only on firearms, the weapon’s onboard targeting hardware emulates the effects of the Gunlink cyber-system. The user must have a Cranial Jack system to plug it in.\nPredictive Guidance: An entire onboard computing core is augmented by advanced materials and cutting-edge kinetic analysis to increase the odds of landing a lethal blow. The weapon gains a +1 bonus to hit rolls, damage, and Shock. The user must be connected via a Gunlink or a Cranial Jack cybersystem.\nReel Wires: A thrown weapon is linked to a wrist spool with retractable wires that allow its retrieval as an On Turn action. The wires can be cut by a properly-timed attack with a sharp weapon, but are too thin and sharp to be easily grabbed. The wires can drag up to 20 kilos of mass when retracting. Replacing broken wires takes fifteen minutes.\nSavage Impact: Usable only on melee weapons, powered impact plates, vibrating serrations, or other after-market adjustments increase its damage and Shock by +1.\nShock Burst: Once per fight, as an On Turn action, the weapon can imbue itself or a round of ammunition with an electrical charge, inflicting an additional 2d6 damage on a hit, or +2 damage to melee Shock on the next attack. This damage is not affected by the +3 cap to mod hit and damage.\nStun Rounds: Usable only on firearms, the weapon’s barrel and firing mechanism is altered to accept soft, electrically-charged stun rounds. The firearm’s range is halved, it takes a -2 penalty to damage, and it loses its Trauma Die, but all damage it inflicts is treated as non-lethal. Stun rounds do no significant harm to inanimate objects.\nThermal Charge: Usable only on melee or thrown weapons, the mod adds a bank of heat cells to the weapon. The weapon then inflicts +2 damage and Shock to all creatures not impervious to heat. The cells are activated as an On Turn action, but last for only two fights before requiring an hour to swap batteries and let the elements cool.","ru":"Перечисленные здесь моды техник с указанным уровнем навыка может установить на оружие за указанную цену, как описано в разделе 2.8.2. Некоторым, помимо обычных деталей, нужно ещё определённое число единиц особой технологии. Если не сказано иное, конкретный мод устанавливается на предмет только один раз.\n\n\n| Мод | Навык | Цена | Особые компоненты |\n|---|---|---|---|\n| Автонаведение | Ремонт-1 | $5 000 | 0 |\n| Скрытое исполнение | Ремонт-2 | $5 000 | 1 |\n| Индивидуальная подгонка | Ремонт-1 | $1 000 | 0 |\n| Увеличенный магазин | Ремонт-1 | $1 000 | 0 |\n| Тяжёлый подкалиберный | Ремонт-1 | $2 000 | 0 |\n| Встроенные токсины | Ремонт-2 | $10 000 | 1 |\n| Встроенный Ганлинк | Ремонт-2 | $10 000 | 1 |\n| Предиктивное наведение | Ремонт-3 | $15 000 | 2 |\n| Возвратные тросы | Ремонт-1 | $2 500 | 0 |\n| Свирепый удар | Ремонт-1 | $5 000 | 0 |\n| Шоковый разряд | Ремонт-2 | $5 000 | 0 |\n| Оглушающие патроны | Ремонт-2 | $5 000 | 0 |\n| Термозаряд | Ремонт-2 | $7 500 | 0 |\n\n\n**Автонаведение:** в оружие встроены кинетические сенсоры, синхронизированные с бортовыми чипами наведения. Владелец получает +1 ко всем броскам попадания этим оружием, но должен подключиться к нему через Ганлинк или Черепной разъём.\n**Скрытое исполнение:** материалы заменены, контуры изменены, внешний вид подправлен. Оружие размером с пистолет и меньше теперь не найти без целой минуты обыска носителя, а всё, что не больше винтовки, скрывается так же, как пистолет, и раскладывается до полного размера при использовании.\n**Индивидуальная подгонка:** баланс и форма оружия подогнаны под конкретного владельца. Этот владелец получает +1 ко всем броскам попадания этим оружием.\n**Увеличенный магазин:** правки калибра, механизмы подачи и изменённые габариты магазина удваивают надёжную вместимость магазина.\n**Тяжёлый подкалиберный:** годится только для оружия, стреляющего снарядами. Ствол переделан под тяжёлые бронебойные патроны, которые вполне могут нанести Травматичное попадание даже бронированному транспорту или тяжёлым дронам.\n**Встроенные токсины:** оружие ближнего боя или метательное пропитано множеством микрокапсул продвинутого гемотоксина, и капсулы лопаются при попадании в цель. Оружие наносит +2 урона и Шока тем, у кого нет неуязвимости к яду.\n**Встроенный Ганлинк:** годится только для огнестрела. Бортовая аппаратура наведения оружия эмулирует работу кибер-системы Ганлинк. Чтобы её подключить, у владельца должна быть система Черепной разъём.\n**Предиктивное наведение:** целое бортовое вычислительное ядро усилено продвинутыми материалами и передовым кинетическим анализом, чтобы поднять шансы нанести смертельный удар. Оружие получает +1 к броскам попадания, урону и Шоку. Владелец должен быть подключён через кибер-систему Ганлинк или Черепной разъём.\n**Возвратные тросы:** метательное оружие связано с наручной катушкой убирающимися тросами, которые позволяют вернуть его Действием в свой ход. Тросы можно перерубить точно рассчитанной атакой острым оружием, но они слишком тонкие и острые, чтобы их легко было схватить. При возврате тросы вытягивают до 20 кило массы. Замена оборванных тросов занимает пятнадцать минут.\n**Свирепый удар:** годится только для оружия ближнего боя. Силовые ударные пластины, вибрирующие зубцы или другие доработки поднимают его урон и Шок на +1.\n**Шоковый разряд:** раз за бой, Действием в свой ход, оружие может наполнить себя или патрон электрическим зарядом, нанося при попадании дополнительные 2d6 урона либо +2 к урону Шока в ближнем бою при следующей атаке. На этот урон не действует ограничение +3 на бонусы модов к попаданию и урону.\n**Оглушающие патроны:** годится только для огнестрела. Ствол и механизм подачи переделаны под мягкие электрически заряженные оглушающие патроны. Дистанция оружия уменьшается вдвое, оно получает -2 к урону и теряет Кость травмы, зато весь наносимый им урон считается нелетальным. Оглушающие патроны не причиняют существенного вреда неодушевлённым предметам.\n**Термозаряд:** годится только для оружия ближнего боя и метательного. Мод добавляет к оружию блок тепловых ячеек. После этого оружие наносит +2 урона и Шока всем существам, не защищённым от жара. Ячейки активируются Действием в свой ход, но хватает их лишь на два боя, после чего нужен час, чтобы поменять батареи и дать элементам остыть."},
{"n":"3.5.0","l":2,"te":"Pharmaceuticals and Street Drugs","tr":"Фармацевтика и уличная дурь","en":"Injecting or ingesting a drug requires a Main Action. Some drugs require medical expertise to administer safely. The table gives the minimum Heal skill required to apply a drug, or “None” for those so user-friendly that anyone could shoot it up.\nSome drugs inflict System Strain on use. If the total would exceed the user's maximum System Strain they get no benefit from the chem but suffer any negative effects normally.\nSome drugs grant bonuses or combat benefits. In the case that multiple drugs are taken at once, only the highest bonus applies\n\n\nChem                        Cost                Min. Heal\nAvalanche                $100                0\nBoneshaker                $10                None\nChokeout                $50                None\nControl-Delete                $25                None\nHellbender                $100                None\nLurch                        $25                0\nMadeleine                $100                None\nMedical prescription        $20                None\nOlympus                $100                0\nPanacea                $200                1\nPillow                        $10                0\nPsycho                $10                None\nReset                        $1,000@        None\nSand                        $2                None\nTrauma Patch                $50                None\nWindow                $200                1\n@: This chem is rare enough to require a Contact or other connection to obtain it on the street.\n\n\nAvalanche: A somewhat pricey combat drug favored by shock troops and those first out of the trenches, Avalanche numbs sensations of pain or exhaustion for one hour, granting the user an effective +10 to their current hit points, even if it takes them above their maximum. This numbness tends to make it harder to notice serious harms, however, and the d12 roll for any Major Injury suffered while under its effects takes a -1 penalty.\nBoneshaker: A filthy mix of jailbroken corp industrial chems and amphetamine scrapings, Boneshaker is a popular combat drug among the most impoverished or savage street gangs. On application, the subject is filled with blind aggression, gaining a +2 Morale bonus and a +2 bonus to hit rolls, damage, and Shock. The recklessness induced by Boneshaker leaves them wide open, however, and all attacks against them add +2 to any Trauma Die rolls. Boneshaker lasts for one scene and adds 2 System Strain at the end of it.\nChokeout: A chem that briefly induces severe swelling of the mucous membranes, Chokeout is odorless and tasteless, but must be consumed in food or drink and naturally degrades after twelve hours. A subject who consumes a dose of Chokeout must make a Physical save; on a failure, they are strangled to unconsciousness for an hour, waking up with one hit point at the end. On a success, they take 1d10 non-lethal damage as they struggle to breathe. On a natural saving throw of 1, the victim chokes to death.\nControl-Delete: A chemical that temporarily destroys a person’s ability to form long-term memories, Control-Delete must be ingested in food or drink. Toxin-filtering cyber can fend it off, but it otherwise grants no saving throw. Once affected, the target will continue to act normally, but anything that happens to them between then and their next sleep or unconsciousness will be completely forgotten by the time they awake.\nHellbender: A watery black toxin that must be administered through food or direct injection, Hellbender causes the victim to convulse with bone-cracking force shortly after consumption. A dose of Hellbender has a distinct acrid taste, but if the victim consumes it they must make a Physical saving throw or begin convulsing helplessly for 1d6 rounds, suffering 1d10 damage each round unless restrained by at least two associates. This damage can kill an unfortunate victim.\nLurch: An emergency stimulant meant to shock a downed ally back into mobility, Lurch heals 1d10 damage plus the physician’s Heal skill on application, adding one System Strain to the target. Each dose of Lurch after the first each day increases the required Heal skill by one, so the third dose requires Heal-2 to successfully administer. Lurch only works on conscious and stabilized targets; the shock will kill a Mortally Wounded subject that hasn’t been made stable.\nMadeleine: A chem that intensely stimulates a subject’s memory centers, Madeleine has its dangers. Users normally focus on a particular memory before injecting the drug; for the next 1d6 hours, they relive some portion of that memory with perfect fidelity while remaining oblivious to their physical surroundings. Psychological addiction is a considerable risk for long-term users, as well as choosing a less pleasant memory to recall.\nMedical Prescription: One of a thousand different medical drugs, a prescription like this is often necessary to treat some chronic condition or keep a medical problem from growing worse. Corp employees get their drugs for a pittance, but less fortunate souls need to source their drugs from extortionate corp pharmacies or street docs. Lucky users only need a dose a few times a week, but others must have a daily supply or suffer potentially lethal complications.\nOlympus: A “respectable” combat chem used by certain units of corporate security, Olympus numbs pain, sharpens mental focus, and slows down instinctive panic or rush instincts, allowing a calm observation of the battlefield. Users can reroll their first failed Morale check in a fight and gain a +2 bonus to hit rolls. One dose of Olympus lasts for one scene, and adds one System Strain at its end.\nPanacea: Not so much a single drug as a pharmaceutical suite in a single injection system, this chem requires a skilled physician to adjust its mix. When used as part of a first aid attempt, this drug doubles the amount of hit points recovered by the attempt, with a minimum healing rate of 6 HP. Rumors of a drastically increased rate of bone cancers among regular users are, of course, mere slander against its manufacturer.\nPillow: A powerful sedative that requires medical expertise to administer properly, Pillow must be injected into a restrained or helpless subject, as vigorous physical action can disrupt the effects. Once injected, the subject falls into a torpor indistinguishable from death that lasts for 24 hours. They require only trace amounts of oxygen while in their trance, and can be identified as alive only through careful medical examination. If Pillow is administered with less than a 24-hour gap between doses, the victim must make a Physical save or die sometime before the dose ends.\nPsycho: Ingesting one of these small pills rapidly flattens a user’s capacity for emotional distress while heavily increasing their aggressiveness. For roughly one hour, users gain a +2 bonus to Morale checks and experience no immediate emotional trauma from performing even the most heinous and violent actions. The drug is a favorite pre-fight dose among gangers, and used as self-medication among many of them who would otherwise be incapacitated by the emotional scars of what they’ve done.\n\n\nReset: A rare drug of desperation, Reset is a combination injector patch and wireless cyber override key. When applied to a willing subject with at least one Body or Nerve cyber system, it deluges the user’s system with safety override commands and neurotransmitter stimulants. They lose all accumulated System Strain in excess of their permanent minimum. Five minutes later, their System Strain is maximized and they must make a Physical saving throw at a penalty equal to the number of System Strain they’ve gained since the drug was taken. On a success, they drop to 1 hit point. On a failure, they become Mortally Wounded. If their adjusted roll is 1 or less, they must make a second modified Physical save or instantly and unavoidably die. Using Reset more than once a week is invariably fatal.\nSand: A gritty powder trafficked to those addicts too poor to afford anything better, a snorted dose of Sand will put its user into a euphoric haze for as long as an hour, depending on tolerance. Beautiful visions and dreamy contentment give way to shooting pains and intense light sensitivity afterwards, with most heavy users dying within six to twelve months of picking up the habit.\nTrauma Patch: A theoretically foolproof cocktail of coagulants, stimulants, and painkillers, a trauma patch can be applied to a Mortally Wounded ally to stabilize them on a successful Int or Dex/Heal skill check against difficulty 6, with a +1 difficulty penalty for each full round since the subject went down. The patch is useless after six rounds.\nTrauma patches cannot revive victims downed by poisons or diseases, or those dismembered by explosives or heavy weapons.\nWindow: A neurobooster favored among hackers and knowledge workers, Window augments the user’s focus and mental reaction speed at the cost of distracting them from their terrestrial surroundings. A Window user can trade their Move action to gain a bonus Main Action that can only be used for cyberspace actions. Each time this is done in a scene, however, the user gains one System Strain. One dose lasts for one scene.","ru":"Вколоть или проглотить препарат — Основное действие. Некоторые препараты требуют медицинских знаний, чтобы применить их безопасно. В таблице указан минимальный уровень навыка Медицина, нужный для применения препарата, или «Нет» — для тех, что настолько дружелюбны к пользователю, что вколоть их себе может кто угодно.\nНекоторые препараты дают Системную нагрузку при приёме. Если итог превысил бы максимум Системной нагрузки пользователя, он не получает от химии никакой пользы, но страдает от всех негативных эффектов как обычно.\nНекоторые препараты дают бонусы или боевые преимущества. Если принято сразу несколько препаратов, применяется только наибольший бонус\n\n\n| Химия | Цена | Мин. Медицина |\n|---|---|---|\n| Лавина | $100 | 0 |\n| Костотряс | $10 | Нет |\n| Удушка | $50 | Нет |\n| Контрол-Делит | $25 | Нет |\n| Адолом | $100 | Нет |\n| Встряска | $25 | 0 |\n| Мадлен | $100 | Нет |\n| Медицинский рецепт | $20 | Нет |\n| Олимп | $100 | 0 |\n| Панацея | $200 | 1 |\n| Подушка | $10 | 0 |\n| Психо | $10 | Нет |\n| Сброс | $1 000@ | Нет |\n| Песок | $2 | Нет |\n| Травм-пластырь | $50 | Нет |\n| Окно | $200 | 1 |\n\n@: Эта химия достаточно редка, чтобы для покупки её на улице потребовался Контакт или иная связь.\n\n\n**Лавина:** Недешёвый боевой препарат, любимый штурмовиками и теми, кто первым лезет из окопа. Лавина на час притупляет боль и усталость, давая пользователю эффективные +10 к текущим пунктам здоровья, даже если это выводит его выше максимума. Правда, из-за этой бесчувственности сложнее заметить серьёзные повреждения: бросок d12 на любую Серьёзную травму, полученную под действием препарата, получает штраф -1.\n**Костотряс:** Мерзкая смесь взломанной корповской промышленной химии и амфетаминовых опилок. Костотряс — популярный боевой препарат в самых нищих и диких уличных банд. При применении субъект наполняется слепой агрессией, получая бонус +2 к боевому духу и бонус +2 к атакам, урону и Шоку. Но безрассудность, которую вызывает Костотряс, оставляет его совершенно открытым: все атаки по нему добавляют +2 к любым броскам Кости травмы. Костотряс действует одну сцену и добавляет 2 Системной нагрузки по её окончании.\n**Удушка:** Химия, вызывающая кратковременный тяжёлый отёк слизистых. Удушка не имеет запаха и вкуса, но должна быть принята с едой или питьём и естественным образом распадается через двенадцать часов. Субъект, проглотивший дозу Удушки, должен сделать Физический спасброск; при провале его душит до потери сознания на час, и он приходит в себя с одним пунктом здоровья. При успехе он получает 1d10 нелетального урона, пока борется за дыхание. При натуральной 1 на спасброске жертва задыхается насмерть.\n**Контрол-Делит:** Химикат, временно уничтожающий способность человека формировать долговременную память. Контрол-Делит нужно принять с едой или питьём. Кибер с фильтрацией токсинов может его отбить, но в остальных случаях спасброска не даётся. Попав под действие, цель продолжает вести себя как обычно, но всё, что случится с ней до следующего сна или потери сознания, будет полностью забыто к моменту пробуждения.\n**Адолом:** Водянистый чёрный токсин, который вводят с едой или напрямую инъекцией. Адолом заставляет жертву биться в судорогах с костоломной силой вскоре после приёма. У дозы Адолома отчётливый едкий вкус, но если жертва его проглотит, она должна сделать Физический спасброск, иначе беспомощно бьётся в конвульсиях 1d6 раундов, получая по 1d10 урона каждый раунд, если её не удерживают минимум двое товарищей. Этот урон может убить несчастную жертву.\n**Встряска:** Экстренный стимулятор, призванный шоком вернуть павшего союзника в строй. Встряска при применении лечит 1d10 урона плюс уровень навыка Медицина врача и добавляет цели одну Системную нагрузку. Каждая доза Встряски после первой за день увеличивает требуемый уровень Медицины на единицу, так что третья доза требует Медицина-2 для успешного применения. Встряска работает только на сознательных и стабилизированных целях: шок убьёт смертельно раненного субъекта, которого не стабилизировали.\n**Мадлен:** Химия, интенсивно стимулирующая центры памяти, и у Мадлен есть свои опасности. Пользователи обычно сосредотачиваются на конкретном воспоминании перед инъекцией; следующие 1d6 часов они переживают часть этого воспоминания с идеальной точностью, полностью не замечая физического окружения. Психологическая зависимость — серьёзный риск для тех, кто употребляет долго, как и выбор менее приятного воспоминания.\n**Медицинский рецепт:** Один из тысячи разных медицинских препаратов. Такой рецепт часто необходим, чтобы лечить хроническую болезнь или не дать медицинской проблеме разрастись. Сотрудники корп получают свои лекарства за копейки, но менее удачливым душам приходится добывать препараты в грабительских корповских аптеках или у уличных докторов. Везучим нужна доза лишь несколько раз в неделю, но остальным необходим ежедневный запас, иначе их ждут потенциально смертельные осложнения.\n**Олимп:** «Респектабельная» боевая химия, которой пользуются некоторые подразделения корпоративной безопасности. Олимп притупляет боль, обостряет умственную концентрацию и притормаживает инстинктивную панику или порывы броситься вперёд, позволяя спокойно наблюдать за полем боя. Пользователи могут перебросить первую проваленную проверку боевого духа в бою и получают бонус +2 к атакам. Одна доза Олимпа действует одну сцену и добавляет одну Системную нагрузку по её окончании.\n**Панацея:** Не столько отдельный препарат, сколько целый фармацевтический набор в одной инъекционной системе; эта химия требует умелого врача, чтобы настроить состав. При использовании в рамках попытки первой помощи препарат удваивает количество восстановленных пунктов здоровья, с минимумом 6 ПЗ исцеления. Слухи о резко возросшей частоте рака костей среди постоянных пользователей — разумеется, всего лишь клевета на производителя.\n**Подушка:** Мощное успокоительное, требующее медицинских знаний для правильного применения. Подушку нужно вводить связанному или беспомощному субъекту, поскольку активные физические действия могут нарушить эффект. После инъекции субъект впадает в состояние оцепенения, неотличимое от смерти, которое длится 24 часа. В этом трансе ему нужны лишь следовые количества кислорода, и опознать его как живого можно только тщательным медицинским осмотром. Если Подушку вводят с интервалом меньше 24 часов между дозами, жертва должна сделать Физический спасброск или умереть до окончания действия дозы.\n**Психо:** Проглатывание одной из этих маленьких таблеток быстро сглаживает способность пользователя к эмоциональному страданию, резко повышая при этом агрессивность. Примерно на час пользователи получают бонус +2 к проверкам боевого духа и не испытывают немедленной эмоциональной травмы от самых чудовищных и жестоких действий. Препарат — излюбленная доза бандитов перед драками, а многие из них используют его как самолечение: иначе эмоциональные шрамы от содеянного вывели бы их из строя.\n\n\n**Сброс:** Редкий препарат отчаяния. Сброс — это комбинация инъекционного пластыря и беспроводного ключа-обхода для кибера. При применении к добровольному субъекту, у которого есть хотя бы одна кибер-система типа Тело или Нервы, он заливает систему пользователя командами обхода защиты и стимуляторами нейротрансмиттеров. Пользователь теряет всю накопленную Системную нагрузку сверх своего постоянного минимума. Пять минут спустя его Системная нагрузка максимизируется, и он должен сделать Физический спасброск со штрафом, равным количеству Системной нагрузки, полученной с момента приёма препарата. При успехе он падает до 1 пункта здоровья. При провале становится смертельно раненным. Если результат с учётом модификаторов равен 1 или меньше, он должен сделать второй модифицированный Физический спасброск или мгновенно и неизбежно умереть. Использовать Сброс чаще раза в неделю всегда смертельно.\n**Песок:** Зернистый порошок, который сбывают тем зависимым, кто слишком беден для чего-то получше. Вдохнутая доза Песка погружает пользователя в эйфорический дурман на время до часа, в зависимости от привычки. Прекрасные видения и мечтательное блаженство сменяются потом стреляющей болью и сильной светочувствительностью, и большинство тяжёлых потребителей умирает через шесть-двенадцать месяцев после того, как подсело.\n**Травм-пластырь:** Теоретически безотказный коктейль из коагулянтов, стимуляторов и обезболивающих. Травм-пластырь можно наложить на смертельно раненного союзника, чтобы стабилизировать его при успешной проверке Инт или Лов/Медицина против сложности 6, со штрафом +1 к сложности за каждый полный раунд с момента, когда субъект упал. После шести раундов пластырь бесполезен.\nТравм-пластыри не могут вернуть к жизни тех, кого свалили яды или болезни, а также разорванных взрывчаткой или тяжёлым оружием.\n**Окно:** Нейробустер, любимый хакерами и работниками умственного труда. Окно усиливает концентрацию и скорость умственной реакции пользователя за счёт того, что отвлекает его от земного окружения. Пользователь Окна может обменять своё Действие перемещения на бонусное Основное действие, которое можно использовать только для действий в киберпространстве. Однако каждый раз, когда он это делает в сцене, он получает одну Системную нагрузку. Одна доза действует одну сцену."},
{"n":"3.6.0","l":2,"te":"Cyberware","tr":"Кибернетика","en":"Implanted cybernetic hardware is a staple of the cyberpunk genre. This section discusses the rules for its implantation, maintenance, and use.","ru":"Вживлённое кибернетическое железо — краеугольный камень киберпанка. В этом разделе разбираются правила его вживления, обслуживания и использования."},
{"n":"3.6.1","l":3,"te":"Installing Cyberware","tr":"Установка кибернетики","en":"Cyberware must be implanted by a physician with at least Heal-1 skill or an NPC with at least a +1 skill bonus at medical matters. The average street doc will have a +2 skill total, with the better having +3 and the elite having +4 or even +5. Access to such high-grade medical care often requires a Contact or mission.\nPaired systems such as cybereyes or cyberears are implanted together as a single operation. Add-ons to such tech, such as an eye flechette system, require a separate operation.\nThe implantation surgery itself takes a short time but comes at a cost and skill check difficulty as given in the table below. If the surgeon donates their work, the installation cost is halved.\n\n\nCyberware                                Recovery\nSystem Strain                Cost                Time                Difficulty\n0                        $100                1 Hour                7\n0.1 — 0.5                $500                1 Day                8\n0.6 — 1                $2,500                4 Days                10\n1.1 — 3                $12,500        2 Weeks        11\n3.1 or More                $50,000        1 Month        12\n\n\nOnce the surgery is complete, the doc makes an Int/Heal or Dex/Heal skill check against the installation difficulty, modified by the table below.\n\n\nMod        Circumstance\n-1        Only has a cyberdoc kit\n+0        Has level 1 surgical theater equipment\n+1        Has level 2 surgical theater equipment\n+2        Has level 3 surgical theater equipment\n-1        Lacks a dedicated surgical room\n+0        Has a dedicated, clean room to work in\n+1        Has a sterile medical operating room\n+2        Has an entire medical clinic worth of space\n+1        The cyber is new and unused\n\n\nIf they fail by more than two points, the surgery is unsuccessful, the target’s System Strain is maximized, and the target is reduced to 1 hit point. The cyber survives, but now counts as used cyber for future implant purposes.\nIf they fail by one or two points, the surgery is successful, but the user suffers a random implant complication from the table in section 3.6.1.1. This glitch isn’t obvious until after the surgery is complete. A user who wants a second try at installing a particular system will need to remove the original cyber, spend a month undergoing therapeutic medical treatment at a cost equal to the offending cyber’s original installation cost, and then try again. Such additional attempts have a cumulative -1 penalty on all installation attempts after the original, including any penalty for re-implanting used cyber.\nIf it succeeds, the cyber is implanted successfully. The system immediately adds its System Strain value as permanent System Strain to the user. A subject cannot accept cyber if it would put their System Strain above their maximum score.\nWhether successful or not, the subject needs a certain amount of time for recovery before they can return to action, whether an hour for the most superficial cyber or a full month for full-body invasive surgery. During this time they must rest and follow the appropriate anti-rejection medication regime. Failure to do so risks implant complications at best and fatal system rejection at the worst.","ru":"Кибернетику должен вживлять врач с навыком минимум Медицина-1 или NPC с бонусом навыка минимум +1 в медицинских делах. У среднего уличного доктора итоговый бонус будет +2, у хорошего +3, у элитного +4 или даже +5. Доступ к такой медицине высшего класса часто требует Контакта или миссии.\nПарные системы вроде киберглаз или киберушей вживляются вместе, как одна операция. Дополнения к такой технике, например система флешетт для глаз, требуют отдельной операции.\nСама операция по вживлению занимает немного времени, но требует затрат и проверки навыка со сложностью, указанными в таблице ниже. Если хирург дарит свою работу, стоимость установки уменьшается вдвое.\n\n\n| Системная нагрузка кибернетики | Цена | Время восстановления | Сложность |\n|---|---|---|---|\n| 0 | $100 | 1 час | 7 |\n| 0,1 — 0,5 | $500 | 1 день | 8 |\n| 0,6 — 1 | $2 500 | 4 дня | 10 |\n| 1,1 — 3 | $12 500 | 2 недели | 11 |\n| 3,1 и больше | $50 000 | 1 месяц | 12 |\n\n\nКогда операция закончена, док делает проверку Инт/Медицина или Лов/Медицина против сложности установки, изменённой по таблице ниже.\n\n\n| Мод | Обстоятельство |\n|---|---|\n| -1 | Есть только набор кибердока |\n| +0 | Есть оборудование операционной уровня 1 |\n| +1 | Есть оборудование операционной уровня 2 |\n| +2 | Есть оборудование операционной уровня 3 |\n| -1 | Нет выделенной операционной комнаты |\n| +0 | Есть выделенная чистая комната для работы |\n| +1 | Есть стерильная медицинская операционная |\n| +2 | Есть целая медицинская клиника |\n| +1 | Кибер новый и неиспользованный |\n\n\nЕсли док провалил проверку больше чем на два пункта, операция неудачна, Системная нагрузка цели максимизируется, а сама цель падает до 1 пункта здоровья. Кибер уцелел, но теперь считается использованным для будущих вживлений.\nЕсли док провалил на одно-два пункта, операция удачна, но пользователь получает случайное осложнение вживления из таблицы в разделе 3.6.1.1. Этот глюк не проявляется, пока операция не завершена. Тому, кто хочет попробовать установить конкретную систему второй раз, придётся удалить исходный кибер, потратить месяц на терапевтическое медицинское лечение стоимостью, равной изначальной стоимости установки этого кибера, и только потом пробовать снова. Такие дополнительные попытки получают накапливающийся штраф -1 на все попытки установки после первой, включая любой штраф за повторное вживление использованного кибера.\nПри успехе кибер вживлён удачно. Система немедленно добавляет пользователю своё значение Системной нагрузки как постоянную Системную нагрузку. Персонаж не может принять кибер, если тот поднял бы его Системную нагрузку выше максимума.\nУспешно или нет, но субъекту нужно определённое время на восстановление, прежде чем он вернётся в дело: от часа для самого поверхностного кибера до целого месяца для инвазивной операции на всём теле. В это время он должен отдыхать и соблюдать соответствующий режим препаратов против отторжения. Если этого не делать, в лучшем случае рискуешь осложнениями вживления, в худшем — смертельным отторжением системы."},
{"n":"3.6.1.1","l":4,"te":"Implant Complications","tr":"Осложнения вживления","en":"If a surgery results in a complication or cyberware removal damages the tech, the following table is used. If the resulting complication somehow does not apply to the cyber, it counts as a result of 12.\n\n\nd12        Complication\n1        Unreliable: The first time each day that it's important that the system function, roll 1d6; on a 1, it's nonfunctional until it receives maintenance.\n2        Inefficient: The ware incurs an additional 0.5 System Strain cost.\n3        Loud: When the system is operating, it's loud enough to be heard clearly five meters away, making stealth impossible. Systems that are always on make this noise constantly.\n4        Fussy: The required interval between maintenance is halved.\n5        Bad Connection: Each time the cyberware is triggered, there's a 1 in 6 chance it fails to activate and the action is wasted. Cyberware that is always on is not hindered by this.\n6        Blatant: Cyberware that normally requires Medical or Touch detection now becomes obvious on sight, perhaps due to excessive scarring or required surface-mount support.\n7        Debilitating: Pick an attribute in some way relevant to the cyber. The attribute suffers a 1d2 point penalty to its base score that persists as long as the system remains implanted.\n8        Uncooperative: Add 1 System Strain if this isn’t the only implant of the same category, such as Limb/Nerve/Body.\n9        Complicated: The complexity of the installation increases the minimum skill level required to maintain it to either Fix-1 or Heal-1.\n10        Exhausting: Maintenance on the system is exceptionally taxing. After it's done, the user needs to spend 24 hours of downtime resting; if they omit this, they gain 2 System Strain immediately.\n11        Power Hungry: The user needs to supplement the system by plugging into an urban power grid or vehicle power port for a half-hour each day. Without this, the system goes inert until re-powered.\n12        Petty Annoyance: It has some small quirk or deficiency of fit that causes no real problem in its functionality.","ru":"Если операция привела к осложнению или если удаление кибернетики повредило технику, используется следующая таблица. Если полученное осложнение по каким-то причинам не применимо к этому киберу, считай, что выпало 12.\n\n\n| d12 | Осложнение |\n|---|---|\n| 1 | **Ненадёжность:** Первый раз за день, когда работа системы действительно важна, брось 1d6; на 1 она не функционирует, пока не получит обслуживание. |\n| 2 | **Неэффективность:** Железо берёт дополнительные 0,5 Системной нагрузки. |\n| 3 | **Шумность:** Когда система работает, её отчётливо слышно в пяти метрах, что делает скрытность невозможной. Системы, работающие постоянно, шумят непрерывно. |\n| 4 | **Капризность:** Требуемый интервал между обслуживаниями уменьшается вдвое. |\n| 5 | **Плохой контакт:** Каждый раз при срабатывании кибернетики есть шанс 1 к 6, что она не активируется, и действие потрачено зря. Постоянно работающую кибернетику это не затрагивает. |\n| 6 | **Явность:** Кибер, который обычно требует обнаружения на уровне Медосмотра или Касания, теперь очевиден на Взгляд — возможно, из-за чрезмерных шрамов или необходимых наружных крепежей. |\n| 7 | **Изнурение:** Выбери характеристику, как-то связанную с этим кибером. Характеристика получает штраф 1d2 пункта к базовому значению, который держится, пока система вживлена. |\n| 8 | **Несовместимость:** Добавь 1 Системной нагрузки, если это не единственный имплант той же категории, например Конечность/Нервы/Тело. |\n| 9 | **Усложнённость:** Сложность установки повышает минимальный уровень навыка, нужный для обслуживания, до Ремонт-1 или Медицина-1. |\n| 10 | **Изматывающее обслуживание:** Обслуживание системы исключительно утомительно. После него пользователю нужно потратить 24 часа простоя на отдых; если он этого не сделает, то немедленно получает 2 Системной нагрузки. |\n| 11 | **Жажда питания:** Пользователю нужно подпитывать систему, подключаясь к городской энергосети или силовому порту машины на полчаса каждый день. Без этого система отключается, пока её не запитают снова. |\n| 12 | **Мелкая досада:** У системы есть небольшая причуда или огрех посадки, которые не создают реальных проблем в работе. |"},
{"n":"3.6.1.2","l":4,"te":"Cyberdoc Tools","tr":"Инструменты кибердока","en":"The following gear is often useful in installing cyberware.\n\n\nTool                                        Enc.        Cost\nCyberdoc Kit                                2        $500\nMaintenance Supplies                1        Varies\nManufacturer’s Installation Kit        1        $10,000\nSurgical Theater Tools / Level 1        10        $10,000\nSurgical Theater Tools / Level 2        N/A        $500K\nSurgical Theater Tools / Level 3        N/A        $5M\n\n\nCyberdoc Kit: A portable kit with all the tools needed for maintaining cyberware, albeit the maintenance supplies cost extra. In a pinch, this kit can be used to implant or remove cyberware, though few would want to risk using such rudimentary tools. The kit can serve as a medkit at need.\nMaintenance Supplies: A collection of consumable parts, lubricants, medications, faked subscription keys, and pirated firmware updates. Any reasonable dollar value of supplies can be carried as 1 point of Encumbrance.\nManufacturer’s Installation Kit: These tools and technical resources are usually restricted to licensed installation vendors of a given cyberware company. They grant a +1 skill check bonus when installing or removing cyberware made by that manufacturer. They are closely tracked, and it can be difficult to find a corp doc willing to sell them under the table.\nSurgical Theater/Level 1: A basic collection of medical tools, pharmaceuticals, scanners, technical manuals, and software subscriptions. Most ordinary street docs command this level of hardware. Laying it out for use requires at least a semi-clean room’s worth of working space.\nSurgical Theater/Level 2: A more sophisticated, extensive, and advanced operating theater than the level 1 version. High-grade street docs and standard corporate employee clinics would use this tech, which requires the same amount of space as the level 1 array.\nSurgical Theater/Level 3: Some of the most advanced medical tech commonly available on the market, this grade of surgical assistance is usually found only in corporate clinics for high-level employees or in the private clinics of top-end street docs. It requires a half-dozen rooms to support all its functionality.","ru":"Следующее снаряжение часто полезно при установке кибернетики.\n\n\n| Инструмент | Загр. | Цена |\n|---|---|---|\n| Набор кибердока | 2 | $500 |\n| Расходники для обслуживания | 1 | По-разному |\n| Заводской набор для установки | 1 | $10 000 |\n| Инструменты операционной / Уровень 1 | 10 | $10 000 |\n| Инструменты операционной / Уровень 2 | N/A | $500 тыс. |\n| Инструменты операционной / Уровень 3 | N/A | $5 млн |\n\n\n**Набор кибердока:** Портативный набор со всеми инструментами, нужными для обслуживания кибернетики, хотя расходники обходятся отдельно. В крайнем случае этим набором можно вживить или удалить кибернетику, хотя мало кто захочет рисковать со столь примитивными инструментами. При необходимости набор работает как медицинский набор.\n**Расходники для обслуживания:** Набор одноразовых деталей, смазок, лекарств, поддельных ключей подписки и пиратских прошивок. Любой разумный объём расходников по деньгам переносится как 1 пункт Загруженности.\n**Заводской набор для установки:** Эти инструменты и техническая документация обычно доступны только лицензированным установщикам конкретной кибернетической компании. Они дают бонус +1 к проверке навыка при установке или удалении кибернетики этого производителя. Их строго отслеживают, и найти корповского дока, готового продать такой набор из-под полы, бывает непросто.\n**Операционная/Уровень 1:** Базовый набор медицинских инструментов, препаратов, сканеров, техдокументации и программных подписок. Большинство обычных уличных докторов располагает железом этого уровня. Чтобы всё разложить для работы, нужно как минимум условно чистое помещение.\n**Операционная/Уровень 2:** Более изощрённая, обширная и продвинутая операционная, чем версия уровня 1. Такую технику используют уличные доки высокого класса и стандартные корпоративные клиники для сотрудников; места ей нужно столько же, сколько набору уровня 1.\n**Операционная/Уровень 3:** Одна из самых продвинутых медицинских технологий, доступных на рынке. Такой уровень хирургической поддержки обычно встречается только в корпоративных клиниках для высокопоставленных сотрудников или в частных клиниках топовых уличных докторов. Ей нужно с полдюжины помещений, чтобы обеспечить всю функциональность."},
{"n":"3.6.2","l":3,"te":"Removing Cyberware","tr":"Удаление кибернетики","en":"Street docs can attempt to safely remove cyber at the same difficulty rating as it took to implant it, with the surgery taking one hour. On a success, the implant is removed intact and can be re-used. On a failure, the implant is ruined, but the patient remains healthy. In both cases, the permanent System Strain inflicted by the implant is lost immediately.\nIf the doc has no interest in the health or survival of the subject, the system removal is automatically successful and takes only ten minutes. The subject of this ungentle disassembly almost always dies on the table unless the system removed was minimally invasive.\nRemoving cyber is safest for the implant when the subject is alive during the removal, as death runs the risk of ruining delicate elements of the hardware. If the subject is dead when the doc goes to salvage their implants, an Int or Dex/Heal skill check is needed against difficulty 10. On a success, the implant is recovered intact, while failure means that it’s ruined. Subjects dead for more than 24 hours are unsalvageable.\nOnce the cyber’s out, the doc makes an Int or Dex/Heal skill check against difficulty 10. On a success, the cyber is used, but still perfectly functional. On a failure, it now counts as “secondhand cyber”, with a randomly-determined implantation complication that can’t be avoided.","ru":"Уличные доки могут попытаться безопасно удалить кибер с той же сложностью, что и при вживлении, и операция занимает один час. При успехе имплант извлекают целым, и его можно использовать снова. При провале имплант испорчен, но пациент остаётся здоров. В обоих случаях постоянная Системная нагрузка от импланта немедленно теряется.\nЕсли дока не интересует здоровье или выживание субъекта, удаление системы автоматически успешно и занимает всего десять минут. Объект такой нежной разборки почти всегда умирает на столе, если только удалённая система не была минимально инвазивной.\nДля импланта безопаснее всего, когда субъект во время удаления жив, поскольку смерть создаёт риск испортить тонкие элементы железа. Если субъект мёртв, когда док приходит вытаскивать имплант, нужна проверка Инт или Лов/Медицина против сложности 10. При успехе имплант извлечён целым, при провале — испорчен. Субъекты, мёртвые больше 24 часов, непригодны для извлечения.\nКогда кибер вынут, док делает проверку Инт или Лов/Медицина против сложности 10. При успехе кибер считается использованным, но по-прежнему полностью работоспособен. При провале он теперь считается «кибером с чужого плеча», со случайно определённым осложнением вживления, которого не избежать."},
{"n":"3.6.3","l":3,"te":"Concealing and Detecting Cyber","tr":"Сокрытие и обнаружение кибера","en":"Most conventional cyber has one of three different levels of blatancy. Its signatures are usually restricted to the body part augmented, but obvious neural or internal organ work is usually plain on the user’s skin.\nMedical-rated cyber is completely concealed from surface-level inspection, and cannot be detected without a cyber scanner or a medical examination.\nTouch-rated cyber is inobvious to mere visual examination, but a person who touches the augmented limb, skin, or other organ will immediately recognize the signs of cybernetic modification.\nSight-rated cyber is so blatant that anyone who looks at the affected body part can see that some form of augmentation has been done. Baggy clothing may suffice to conceal it, but even the most perfunctory patdown will detect it.\nOrdinary investigators may not recognize the specific cyber, but experienced operators and other cyber-versed examiners can usually get a good idea of what’s under a person’s skin, often recognizing the specific model of cyber by its signature telltales.\nCyber that produces obvious bodily changes is likewise obvious when it is being used.","ru":"У большинства обычного кибера один из трёх уровней вызывающей заметности. Его признаки обычно ограничены той частью тела, которую он усиливает, но явная работа по нервам или внутренним органам обычно видна на коже пользователя.\nКибер уровня Медосмотр полностью скрыт от поверхностного осмотра, и обнаружить его нельзя без кибер-сканера или медицинского обследования.\nКибер уровня Касание незаметен при простом визуальном осмотре, но человек, коснувшийся усиленной конечности, кожи или иного органа, сразу распознает признаки кибернетической модификации.\nКибер уровня Взгляд настолько вызывающ, что любой, кто посмотрит на затронутую часть тела, увидит, что тут работали над усилением. Мешковатая одежда, может, и скроет его, но даже самый небрежный обыск его выявит.\nОбычные дознаватели могут и не распознать конкретный кибер, но опытные операторы и другие сведущие в кибере люди обычно неплохо понимают, что у человека под кожей, и нередко узнают конкретную модель кибера по её характерным приметам.\nКибер, который вызывает явные изменения тела, точно так же явно заметен и когда его используют."},
{"n":"3.6.4","l":3,"te":"Cyberware Maintenance","tr":"Обслуживание кибернетики","en":"A cyberware system's maintenance and subscription expenses add up to 5% of the cyberware’s base cost due monthly, not including any cyberware mods or implant surgery expenses. The maintenance work itself takes a number of hours equal to the System Strain of the system, to a minimum of fifteen minutes, and must be performed by someone with at least Fix-0 or Heal-0. Maintenance supplies can be purchased almost anywhere cyberware is available, and any reasonable dollar amount of them can be carried as 1 Encumbrance item.\nIf a system goes more than a month without upkeep, it starts to malfunction. The GM rolls or picks an implant complication and applies it to the system until it receives maintenance. Very extended lack of maintenance can provoke chronic illnesses or death. Some ultra-high-end bespoke ware may absolutely require timely maintenance if their complex systems are not to stop operating entirely.","ru":"Расходы на обслуживание и подписки кибер-системы складываются в 5% от базовой стоимости кибернетики ежемесячно, не считая никаких модов кибернетики и расходов на операцию по вживлению. Сама работа по обслуживанию занимает столько часов, сколько составляет Системная нагрузка системы, но не меньше пятнадцати минут, и должна выполняться кем-то с навыком минимум Ремонт-0 или Медицина-0. Расходники для обслуживания можно купить почти везде, где доступна кибернетика, и любой разумный объём их по деньгам переносится как 1 предмет Загруженности.\nЕсли система больше месяца остаётся без ухода, она начинает сбоить. Мастер бросает или выбирает осложнение вживления и применяет его к системе, пока она не получит обслуживание. Очень долгое отсутствие обслуживания может вызвать хронические болезни или смерть. Некоторое сверхдорогое железо ручной работы может требовать своевременного обслуживания абсолютно обязательно, иначе его сложные системы полностью откажут."},
{"n":"3.6.5","l":3,"te":"Skillplugs","tr":"Скиллплаги","en":"Commonly-available skillplugs can be found for any skill at level-0 or level-1. A basic Skillplug Jack I system can only interface with intellectual skills that require only modest physical expertise; Know, Fix, or Heal could qualify for this, but Shoot, Exert, or most forms of Perform would not. Such physical skills require an upgraded Skillplug Jack II unit.\nSomeone with a plug jack and the Skillplug Wires implant can make use of rare, costly level-2 skillplugs, or the vanishingly rare level-3 plugs. Level-3 plugs are normally only available through special missions to obtain them.\nWhenever the user rolls a natural 2 on a skillplug-augmented skill check, or a natural 1 on a skillplug-augmented attack roll, the check or roll is an automatic failure that no reroll ability can save. The skillplug jack itself then locks up uselessly for the scene.\nWhile it is possible to implant multiple plug jacks and use multiple skillplugs at once, the increased neural crosstalk invariably increases the chance of severe error. Each additional skillplug run after the first increases the automatic failure roll range by one point.\n\n\nCost                Skillplug\n$1,000                Level-0 mental skill or conversational language mastery\n$10,000        Level-1 mental skill or fluent language\n$50,000        Level-2 mental skill\nN/A                Level-3 mental skill\nX2                Physical-based skill","ru":"Общедоступные скиллплаги можно найти для любого навыка уровня-0 или уровня-1. Базовая система Разъём скиллплага I может работать только с интеллектуальными навыками, требующими лишь скромной физической подготовки: Знание, Ремонт или Медицина подойдут, а Стрельба, Атлетика или большинство видов Выступления — нет. Такие физические навыки требуют улучшенного блока Разъём скиллплага II.\nТот, у кого есть разъём и имплант Проводка скиллплага, может использовать редкие и дорогие скиллплаги уровня-2 или же исчезающе редкие плаги уровня-3. Плаги уровня-3 обычно можно добыть только через особые миссии.\nКаждый раз, когда пользователь выбрасывает натуральную 2 на проверке навыка, усиленной скиллплагом, или натуральную 1 на броске атаки, усиленном скиллплагом, проверка или бросок автоматически провалены, и никакая способность переброса тут не спасёт. Сам скиллплаг-разъём после этого бесполезно блокируется на сцену.\nХотя вживить несколько разъёмов и использовать несколько скиллплагов одновременно возможно, возросшие нервные помехи неизбежно повышают шанс серьёзной ошибки. Каждый скиллплаг после первого расширяет диапазон автоматического провала на один пункт.\n\n\n| Цена | Скиллплаг |\n|---|---|\n| $1 000 | Ментальный навык уровня-0 или разговорное владение языком |\n| $10 000 | Ментальный навык уровня-1 или свободное владение языком |\n| $50 000 | Ментальный навык уровня-2 |\n| N/A | Ментальный навык уровня-3 |\n| ×2 | Навык на физической основе |"},
{"n":"3.6.6","l":3,"te":"Cyberware Mods","tr":"Моды кибернетики","en":"As with weapons, armor, drones, and many other varieties of gear, cyberware can also be modded by a sufficiently talented medic. Creating and installing these mods usually requires both Fix and Heal skill. No implant surgery is required as part of installation.\nUnless specified otherwise, a given cyberware mod can only be installed once on any given system. The same mod may be installed on multiple different cyber systems, however, if a tech is willing to manage the Maintenance they will require.\nCyberware mod costs are expressed as a percentage cost of the system they’re installed on\n\n\nMod                        Fix/Heal        Cost        Special Components\nBiocapacitors                1/2                30%        1\nDurable System        1/1                20%        0\nFirewalled                1/1                20%        0\nHardened Weave        2/1                30%        0\nLow Maintenance        2/2                10%        1\nMonoblade                2/1                20%        0\nProfile Adjustment        1/2                20%        0\nQuick Detach                2/2                30%        0\nTailored Interface        1/3                30%        1\nTargeting Processor        2/1                30%        0\n\n\nBiocapacitors: The first System Strain cost that the cyber would normally exact in a day is ignored. Thus, the first time an Enhanced Reflexes system is triggered, it would not add System Strain to the modded user.\nDurable System: A limb or eye system is up-armored to resist injury. The next Major Injury directed at the modded limb is treated as if it were just a flesh wound roll of 12. It destroys this mod instead.\nFirewalled: The modded system is much harder to hack, inflicting a -2 penalty on any related skill checks.\nHardened Weave: Skin cyber that grants an improved base armor class such as Dermal Armor has any AC it grants improved by +2. The additional armor makes the system Obvious, regardless of its original subtlety, and counts as one item of Readied encumbrance that cannot be dropped.\nLow Maintenance: The modded system no longer requires any significant maintenance. This mod does not work on systems with special maintenance costs or consequences, such as a Full Body Conversion or a Regulated Anagathic Substrate.\nMonoblade: A bladed cyber system has advanced monomolecular cutting elements installed. The edge is difficult to maintain but inflicts horrific injuries when it strikes cleanly. The weapon’s Trauma Die gets a +1 bonus, but its base damage die and Shock is decreased by -2.\nProfile Adjustment: The system’s obviousness is lowered by one step, from Sight to Touch, or Touch to Medical. It has no benefit for a system that is already at a Medical grade of concealment.\nQuick Detach: Usable only on limb cyber, eyes, or other parts that could conceivably be removed, this mod allows the user to attach or detach the system with five minutes of work, and replace it with any other Quick Detach-modded system that would fit in the same place.\nTailored Interface: A demanding cyber system is adjusted to specifically match the biochemistry of the user rather than using a factory-set best approximation. This mod only functions on cyber that inflicts 2+ points of permanent System Strain, but lowers the strain cost by 1 point.\nTargeting Processor: This mod must be installed in Gunlink, or in a weapon system such as Body Blades or Eye Mod/Flechette. Improved targeting calculations grant a +1 bonus to hit with the cyber-weapon or with guns aimed with the Gunlink system. An attack can only ever benefit from one instance of this mod.","ru":"Как и оружие, броню, дронов и многие другие виды снаряжения, кибернетику тоже может модить достаточно талантливый медик. Создание и установка этих модов обычно требует и навыка Ремонт, и навыка Медицина. Операция по вживлению для установки не нужна.\nЕсли не сказано иное, конкретный мод кибернетики можно установить на одну систему только один раз. Один и тот же мод можно установить на несколько разных кибер-систем, если техник готов управляться с Обслуживанием, которого они потребуют.\nСтоимость модов кибернетики выражается в процентах от стоимости системы, на которую они ставятся\n\n\n| Мод | Ремонт/Медицина | Цена | Особые компоненты |\n|---|---|---|---|\n| Биоконденсаторы | 1/2 | 30% | 1 |\n| Прочная система | 1/1 | 20% | 0 |\n| Под фаерволом | 1/1 | 20% | 0 |\n| Укреплённое плетение | 2/1 | 30% | 0 |\n| Малое обслуживание | 2/2 | 10% | 1 |\n| Моноклинок | 2/1 | 20% | 0 |\n| Коррекция профиля | 1/2 | 20% | 0 |\n| Быстрый съём | 2/2 | 30% | 0 |\n| Подогнанный интерфейс | 1/3 | 30% | 1 |\n| Процессор наведения | 2/1 | 30% | 0 |\n\n\n**Биоконденсаторы:** Первая Системная нагрузка, которую кибер обычно взял бы за день, игнорируется. Так, при первом срабатывании системы Улучшенные рефлексы она не добавит Системной нагрузки моднутому пользователю.\n**Прочная система:** Система конечности или глаза дополнительно бронируется для защиты от повреждений. Следующая Серьёзная травма, нацеленная на моднутую конечность, считается броском 12 — просто царапина. Вместо этого она уничтожает этот мод.\n**Под фаерволом:** Моднутую систему намного сложнее взломать: все связанные проверки навыка получают штраф -2.\n**Укреплённое плетение:** Кожный кибер, дающий улучшенный базовый класс защиты, например Дермальная броня, получает +2 к любому КЗщ, который он даёт. Дополнительная броня делает систему Явной, независимо от её изначальной скрытности, и считается одним предметом Загруженности в готовности, который нельзя выбросить.\n**Малое обслуживание:** Моднутая система больше не требует значимого обслуживания. Этот мод не работает на системах с особыми расходами или последствиями обслуживания, таких как Полная конверсия тела или Регулируемый анагатический субстрат.\n**Моноклинок:** В клинковую кибер-систему устанавливаются продвинутые мономолекулярные режущие элементы. Такую кромку трудно поддерживать, но при чистом попадании она наносит чудовищные раны. Кость травмы оружия получает бонус +1, но его базовая кость урона и Шок уменьшаются на -2.\n**Коррекция профиля:** Заметность системы понижается на одну ступень: со Взгляда на Касание или с Касания на Медосмотр. Для системы, которая уже имеет уровень скрытности Медосмотр, пользы нет.\n**Быстрый съём:** Применим только к киберу конечностей, глазам или другим частям, которые в принципе можно снять. Этот мод позволяет пользователю прикрепить или отсоединить систему за пять минут работы и заменить её любой другой системой с модом Быстрый съём, которая подошла бы на то же место.\n**Подогнанный интерфейс:** Требовательная кибер-система настраивается конкретно под биохимию пользователя, а не под заводское усреднённое приближение. Этот мод работает только на кибере, дающем 2 или больше пунктов постоянной Системной нагрузки, но снижает эту нагрузку на 1 пункт.\n**Процессор наведения:** Этот мод нужно устанавливать в Ганлинк или в систему-оружие вроде Телесных клинков или Мода глаза/Флешетта. Улучшенные расчёты наведения дают бонус +1 к атаке кибер-оружием или из пушек, наводимых системой Ганлинк. Одна атака никогда не может получить пользу больше чем от одного такого мода."},
{"n":"3.6.7","l":3,"te":"Cyberware Systems","tr":"Кибер-системы","en":"The systems below are some of the more common ones available. Each one is listed with their price, type, concealment level, and the permanent System Strain they add.\nCyber systems are divided by type, indicating what general part of the body they affect. This may be relevant if a Major Injury destroys all cyber of a particular type in a limb of torso.","ru":"Ниже — некоторые из самых распространённых доступных систем. Для каждой указаны цена, тип, уровень скрытности и постоянная Системная нагрузка, которую она добавляет.\nКибер-системы делятся по типу, показывающему, какую часть тела они в целом затрагивают. Это может быть важно, если Серьёзная травма уничтожает всю кибернетику определённого типа в конечности или торсе."},
{"n":"3.6.7.1","l":4,"te":"Body Cyberware","tr":"Кибернетика тела","en":"Cyberware                                Cost        Type        Conc.                SysStr\nAesthetic Augmentation Suite        $50K        Body        Sight                2\nAssisted Glide System                $50K        Body        Touch                2\nBanshee Module                        $30K        Body        Medical        1\nCybernetic Infrastructure Baseline        $20K        Body        Medical        0\nDeadman Circuit                        $10K        Body        Sight                0.25\nDermal Armor/Trauma Shielding        $100K        Body        Medical        1\nEmergency Stabilization Factor        $30K        Body        Medical        1\nFleshmod                                $20K        Body        Medical        1\nFull Body Conversion                        $6M        Body        Sight                0\nHemosynthetic Filter System                $25K        Body        Medical        1\nHoldout Cavity                                $10K        Body        Medical        1\nMedical Support Readout                $10K        Body        Medical        0.25\nRecovery Support Unit                $30K        Body        Medical        1\nRedundant Systems                        $15K        Body        Medical        1\nRetribution Shield                        $50K        Body        Touch                1\nTherapeutic Control Dampers        $25K        Body        Medical        1\nTitan Gun System                        $100K        Body        Sight                1\nViper Sting                                $25K        Body        Medical        0.5\n\n\nAesthetic Augmentation Suite: Any standard fleshmod can supply beauty, but an aesthetic augmentation suite provides not only a fleshmod’s versatility, but tailored pheromones, vocal harmonizers, social cue triggers, and an absolutely inhuman visual perfection. Subjects gain a Charisma score of 14, or a +2 score bonus if already 14 or greater, up to a maximum of 18.\nAssisted Glide System: Retractable nanofiber wings and integral boost jets allow a limited degree of flight for the user of this implant. When leaping from a high place, they gain a flight Move speed of 30m for up to two kilometers before being forced to land. Gaining altitude requires a Dex/Exert skill check against difficulty 10, however, with failure forcing a landing, and the wings can’t carry them more than twice as high as the height they jumped from. By deploying the boost jets and wings as an Instant action, the user can ignore up to a hundred meters of falling damage.\nBanshee Module: Resonant cavities are designed into the user’s torso, along with an advanced amplification system. They can reproduce any sound or voice they have heard before, and at maximum volume can be heard clearly up to five hundred meters away. Once per day, as a Main Action, this sound can be used to shatter normal glass in a ten-meter line in front of the user; creatures without ear protection in this area must make a Physical save or take 2d6 non-lethal damage.\nCybernetic Infrastructure Baseline: A set of standardized support implants provide a baseline degree of cyber-compatibility to a subject. They can ignore System Strain from cyber implants equal to 12 minus their Constitution score- so a PC with a Constitution of 9 could ignore three points worth of System Strain from cyber implants. PCs with a Con of 12 or more have no use for this system.\nDeadman Circuit: A common corporate implant to discourage kidnapping and warelegging. Any attempt to remove any of the user’s cyber without the right access codes will fry that hardware unless a difficulty 13 Int/Heal skill check is made.\nDermal Armor/Trauma Shielding: A system that can only be installed on a user with at least one level of Dermal Armor, the trauma shielding addition adds +1 to the user’s Trauma Target. This benefit stacks with any existing Dermal Armor bonus to the roll.\nEmergency Stabilization Factor: When brought to zero hit points by an injury that does not instantly kill them, the user automatically stabilizes, gaining one System Strain, and will regain consciousness at the end of the scene with 1 hit point. If they are already at maximum strain, this cyberware does not function.\nFleshmod: Careful surgery and support implants allow for a complete physical remolding within generally humanoid lines, including alterations of sex, height, cosmetic limbs such as tails or decorative ears, and overall weight. Reproductive ability is not conferred, but rumors persist of experimental mods that can grant even that.\nFull Body Conversion: The user’s brain and central nervous system are transplanted into a cutting-edge synthetic shell at a cost and difficulty as if this cyber took 4 System Strain. Once converted, the subject has an effective Constitution of 20 for System Strain purpose, but cannot be healed by conventional first aid or medical drugs, requiring ten minutes of repair work with a toolkit to repair any amount of damage, and $250 worth of parts for each hit point to be restored. A full conversion borg no longer requires food, water, air, or sleep, but each day without the latter adds one System Strain due to the mental stress. The conversion requires twelve hours of maintenance every two weeks, and missing it will result in the user’s death in 2d6 days unless the omitted maintenance is performed. Current full-body conversion tech is unstable; after 1d4 years, the subject has a cumulative 5% death chance each year. Borgs do not take Major Injuries and gain a +6 bonus to their Trauma Target that stacks with existing bonuses.\nHemosynthetic Filter System: A wide-spectrum array of blood scrubbers, intake filters, and microbial barriers grants the user effective immunity to most natural diseases and non-synthetic toxins. Weaponized toxins and certain exotic natural afflictions can still affect the user, but they get a +2 bonus on all saving throws against them. The system automatically alerts the user if they have been exposed to a recognized disease or toxin, whether or not it affects them.\nHoldout Cavity: A biosculpted torso pocket allows for the air-tight, climate-controlled concealment of 2 Encumbrance worth of items inside the user’s body and their easy access with a Main Action. Any given object stored can’t be larger than a pistol or a tightly-folded suit of clothing, and the pocket’s contents don’t count against the user’s Encumbrance limit. The pocket’s signature is disguised against conventional scanning technology, and it cannot be detected without a manual strip search by a trained examiner.\nMedical Support Readout: A diagnostic system is interfaced with the user’s biological processes, allowing a realtime analysis of their current health and any significant injuries. Aside from immediately alerting the user when they are poisoned, diseased, or injured, it grants any healing or medical support skill check a +2 bonus thanks to the diagnostic information and increases first aid or drug healing by +2 HP per application.\nRecovery Support Unit: A number of support systems and blood purification filters are installed. The user can absorb up to four points of System Strain incurred from healing or wound stabilization effects; this is a separate pool that recovers one point every night at the same time as the user’s natural System Strain recovers.\nRedundant Systems: Several pieces of prosthetic support cyber are preemptively installed to mitigate future trauma. When the user takes a Major Injury, they may instead choose to have the Redundant Systems critically damaged instead of accepting the major injury roll result. Redundant Systems can be installed more than once, but the System Strain inflicted increases by one point each time.\nRetribution Shield: Numerous small projectile launchers are embedded under synthetic skin. When triggered as an On Turn action, the user gains one System Strain to launch a cloud of shrapnel around them, acting as ground zero of a frag grenade explosion. The user has enough targeting control to avoid hitting allies in range. If grappling or grappled at the time, their opponent automatically takes maximum damage. Reloading the Retribution Shield takes five minutes, and the system will not function if the user is wearing suit-grade armor. Lesser armor can usually be tailored to expose adequate amounts of skin.\nTherapeutic Control Dampers: A set of customized medical and therapeutic implants are used to control the side-effects of a partially-successful cyberware implant. For each implantation of this system, the user can choose to ignore one implant side-effect they currently suffer. The skill check to implant this system can fail, but it never induces any side effects on its own.\nTitan Gun System: Usable only by full body conversion cyborgs or subjects with a Strength score of 18, this mount allows the installation of any man-portable Heavy weapon such as those given in the Weapons section. The user counts as a stable firing rest, and the weapon has two integral magazines of ammo, though it can be loaded by hand as well. The specific weapon mounted can be swapped during maintenance.\nViper Sting: A tool of assassins, a Viper Sting is a fang, fingernail needle, palm injector, or more exotic implement for injecting an unsuspecting target with a drug of the user’s choice. A Viper Sting can be loaded with up to four doses of pharmaceuticals, dispensed as the user wishes. If loaded with a toxin, it does 1d12 damage with a 1d10/x3 Trauma Die. If a tranquilizer is used, the damage is the same, but unconsciousness will result instead of death. A Viper Sting can only be effectively used as part of an Execution Attack, as an alert opponent can avoid it easily. This cyber inflicts a -2 penalty on any check to detect its presence.","ru":"| Кибернетика | Цена | Тип | Скр. | СН | Эффект |\n|---|---|---|---|---|---|\n| Комплекс эстетической аугментации | $50 тыс. | Тело | Взгляд | 2 | Скульптура тела и бонус к Хар. |\n| Система вспомогательного планирования | $50 тыс. | Тело | Касание | 2 | Планирование с высоких точек прыжка |\n| Модуль «Банши» | $30 тыс. | Тело | Медосмотр | 1 | Копирует голоса и оглушает врагов |\n| Базовая кибернетическая инфраструктура | $20 тыс. | Тело | Медосмотр | 0 | Тел 12 для целей кибернетики |\n| Контур мертвеца | $10 тыс. | Тело | Взгляд | 0,25 | Сжигает кибер без кодов доступа |\n| Дермальная броня/Травматическое экранирование | $100 тыс. | Тело | Медосмотр | 1 | +1 к Порогу травмы носителя |\n| Фактор экстренной стабилизации | $30 тыс. | Тело | Медосмотр | 1 | Автоматическая стабилизация |\n| Мод плоти | $20 тыс. | Тело | Медосмотр | 1 | Полностью перелепить своё тело |\n| Полная конверсия тела | $6 млн | Тело | Взгляд | 0 | Стать боргом полной конверсии |\n| Гемосинтетическая система фильтрации | $25 тыс. | Тело | Медосмотр | 1 | Неуязвим к обычным болезням и токсинам |\n| Тайная полость | $10 тыс. | Тело | Медосмотр | 1 | 2 Загруженности скрытого места в теле |\n| Медицинский диагностический монитор | $10 тыс. | Тело | Медосмотр | 0,25 | +2 к проверкам Медицины на тебе |\n| Блок поддержки восстановления | $30 тыс. | Тело | Медосмотр | 1 | 4 пункта Системной нагрузки под лечение |\n| Дублирующие системы | $15 тыс. | Тело | Медосмотр | 1 | Пожертвовать, чтобы избежать Серьёзной травмы |\n| Щит расплаты | $50 тыс. | Тело | Касание | 1 | Взрыв бьёт по целям в ближнем бою |\n| Терапевтические демпферы контроля | $25 тыс. | Тело | Медосмотр | 1 | Подавляет один побочный эффект импланта |\n| Оружейная система «Титан» | $100 тыс. | Тело | Взгляд | 1 | Установить Тяжёлое оружие |\n| Жало гадюки | $25 тыс. | Тело | Медосмотр | 0,5 | Скрытая система инъекции препаратов |\n\n\n**Комплекс эстетической аугментации:** Красоту даст любой обычный мод плоти, но комплекс эстетической аугментации даёт не только гибкость мода плоти, а ещё и подобранные феромоны, голос
