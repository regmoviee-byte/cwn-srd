ма. Тебя нельзя победить, во всяком случае надолго, потому что металл может всё. Эффект: Твоя самоуверенность вызывает автоматический, неотменяемый провал навыка при натуральном броске навыка 12.\n**Бесстрашный:** Боевые аугментации отлично подавляют страх. Честно говоря, это так приятно, что ты просто держишь их включёнными постоянно. Жить без тревоги и беспокойства — колоссальное облегчение, даже если из-за этого ты иногда чего-то не замечаешь. Эффект: Твой максимум ПЗ снижается на 20%, с округлением вниз, потому что инстинкт самосохранения притуплён. Если ты NPC, твой боевой дух равен 12.\n**Сверхбдительный:** Не могу спать. Беспроводные пуш-обновления меня съедят. Эффект: Получи один постоянный пункт Системной нагрузки из-за стойкой бессонницы.\n**Убийственный:** Тебя прошили убивать, и это не выключается. Чем дольше без убийства, тем больше всё вокруг начинает выглядеть оружием, а все вокруг — горлом, которое надо перерезать. Когда становится совсем плохо, провода не дают думать ни о чём, кроме твоего настоящего предназначения, того, чем ты сам себя сделал. Эффект: Ты должен лично убивать хотя бы одного человека в неделю, иначе проверяй Отчуждение за каждый день сверх срока без убийства.\n**Ненасытный:** Эти чувства невероятны: ты видишь, слышишь или ощущаешь то, для чего человеческое мясо не предназначалось. Тебе хочется больше, тебе нужно больше, и ты пойдёшь на что угодно, чтобы это получить. Эффект: Выбери сенсорный порок. Проверяй Отчуждение каждый раз, когда сопротивляешься простой возможности ему поддаться. Плати $100 за каждый пункт постоянного Отчуждения в неделю на его подпитку — или проверяй Отчуждение.\n**Свирепый:** Твой кибер велит убивать. Он без остановки напоминает тебе об активных врагах или слабых точках на целях, и тебе приходится всё время отклонять подтверждающие запросы на смертельные удары. Он позволяет думать только о траекториях и счёте убитых, об угрозах и незавершённых ликвидациях. Ты не можешь думать, пока рядом живой враг. Эффект: Ты не можешь бежать из боя после того, как получил в нём урон по пунктам здоровья. Если решаешь бежать — проверяй Отчуждение.\n**Скрытный:** Твои социальные протоколы знают лучше. Они говорят тебе этого не произносить, предупреждают, что ты всё испортишь, если признаешься. Тебе положено сказать что-то получше, что-то более подобающее, и подсказки не перестают орать, если ты пытаешься их ослушаться. Эффект: Ты не можешь до конца честно ответить на любой вопрос, не относящийся к общеизвестному или к твоим пожеланиям в деловой сделке. Если всё же ответишь — проверяй Отчуждение за каждую тему, обсуждённую в сцене честно.\n**Надорванный:** Железо мешает мясу. Нагрузка усугубляет и без того ослабленную систему, и та не выдерживает. Эффект: Твоя самая низкая характеристика получает штраф -1 к модификатору, но не ниже -3. Если несколько характеристик равны — выбери одну."},
{"n":"3.7.0","l":2,"te":"Cyberdecks","tr":"Кибердеки","en":"These laptop-sized computers range from scrap-built makeshifts to cutting edge hardware stolen from the very best corps. All of them have certain important qualities.\nBonus Access reflects the onboard intrusion hardware integral to the deck. It augments the user’s base Access score, which is equal to their Intelligence modifier plus their Program skill plus this bonus Access.\nMemory is the number of memory units standard to the deck. Most programs and paydata files take up one unit of memory. Erasing a program from memory is an Instant action, but loading it off a program chip takes fifteen minutes to complete all its linkages.\nShielding is the amount of buffer circuitry and hardwired signal damping the deck can use to lessen incoming damage to the user. Hit point losses inflicted by the Stun or Kill program Verbs deplete the deck’s Shielding before affecting the user. Shielding regenerates after fifteen minutes of calm.\nCPU indicates the number of programs the deck can run at once. Some programs are Immediate, and self-terminate right after executing, while others are Ongoing, and take up a CPU slot until terminated as an Instant action.\n\n\n                Bonus\nCyberdeck                        Cost                Access                 Mem.        Shield.        CPU        Enc.\nCranial Jack Only                As cyber        0                0        0        1        N/A\nScrap Deck                        $500                1                8        5        2        1\nTanto                                $5,000                1                10        10        3        1\nIcepick                                $15,000        2                10        10        3        1\nSynapse                        $30,000        2                11        5        4        1\nBeowulf                        $60,000        2                13        10        4        1\nTizona                                $100,000        3                11        10        5        1\nTaifu                                $250,000        3                13        15        6        1","ru":"Эти компьютеры размером с ноутбук бывают всякими — от самоделок из хлама до передовой техники, украденной у самых лучших корп. У всех них есть несколько важных характеристик.\nБонус Доступа отражает встроенное в деку оборудование для взлома. Он добавляется к базовому Доступу пользователя, который равен модификатору Интеллекта плюс навык Программирование плюс этот бонус Доступа.\nПамять — количество единиц памяти, штатных для деки. Большинство программ и файлов ценных данных занимают одну единицу памяти. Стереть программу из памяти — Мгновенное действие, а загрузка её с чипа программы занимает пятнадцать минут: столько нужно, чтобы собрать все связки.\nЭкранирование — объём буферных схем и аппаратного гашения сигнала, которой дека ослабляет входящий урон по пользователю. Потери пунктов здоровья от программных Глаголов *Оглушить* или *Убить* сначала выедают Экранирование деки и только потом бьют по пользователю. Экранирование восстанавливается после пятнадцати минут покоя.\nЦП показывает, сколько программ дека может держать запущенными одновременно. Часть программ — Немедленные: они самозавершаются сразу после срабатывания. Другие — Постоянные: они занимают слот ЦП, пока их не завершат Мгновенным действием.\n\n\n| Кибердека | Цена | Бонус Доступа | Пам. | Экран. | ЦП | Загр. |\n|---|---|---|---|---|---|---|\n| Только черепной разъём | Как кибер | 0 | 0 | 0 | 1 | — |\n| Хламовая дека | $500 | 1 | 8 | 5 | 2 | 1 |\n| Танто | $5 000 | 1 | 10 | 10 | 3 | 1 |\n| Ледоруб | $15 000 | 2 | 10 | 10 | 3 | 1 |\n| Синапс | $30 000 | 2 | 11 | 5 | 4 | 1 |\n| Беовульф | $60 000 | 2 | 13 | 10 | 4 | 1 |\n| Тисона | $100 000 | 3 | 11 | 10 | 5 | 1 |\n| Тайфу | $250 000 | 3 | 13 | 15 | 6 | 1 |"},
{"n":"3.7.1","l":3,"te":"Cyberdeck Mods","tr":"Моды кибердек","en":"Cyberdeck mods use the same modding rules as given in section 2.8.2, with each deck mod counting against the tech’s Maintenance score.\nPrices are given as percentages of the original deck’s unmodified cost; the more sophisticated the deck, the more expensive it is to improve it. Unless specified otherwise, a deck mod can be applied only once to a given deck.\n\n\nBespoke Code Optimization (Fix-1): Pick one Verb and one Subject when installing this mod; those utilities occupy no Memory and one instance of that Verb-Subject program doesn’t count against its CPU burden. Costs 20% of the base deck cost.\nBuffer Circuits (Fix-1): Add 5 points to the deck’s Shielding rating. Costs 20% of the base deck cost.\nCPU Overclocking (Fix-2): Add one to the deck’s CPU rating. Costs 30% of the base deck cost.\nMemory Expansion (Fix-1): Add four units of Memory to the deck. Costs 20% of the base deck cost.\nPolymorphic Intrusion Algorithms (Fix-1): Add one to the unit’s Bonus Access but subtract one from its CPU rating. Costs 10% of the base deck cost.\nSkeletal Case (Fix-1): The deck’s Encumbrance value is decreased by 1, but its Memory suffers a -2 penalty. Costs 10% of the base deck cost.\nThermal Exhaust Case (Fix-2): The deck’s Encumbrance value is increased by 1, but its CPU value increases by 1 as well. Costs 30% of the base deck cost.","ru":"Моды кибердек работают по тем же правилам модификации, что даны в разделе 2.8.2, и каждый мод деки учитывается в Обслуживании техника.\nЦены даны в процентах от исходной стоимости немодифицированной деки: чем сложнее дека, тем дороже её улучшать. Если не сказано иначе, мод деки можно поставить на конкретную деку только один раз.\n\n\n**Индивидуальная оптимизация кода (Ремонт-1):** Выбери один Глагол и один Объект, когда ставишь этот мод; эти утилиты не занимают Памяти, а одна копия программы из этой пары Глагол-Объект не учитывается в нагрузке на ЦП. Стоит 20% базовой цены деки.\n**Буферные схемы (Ремонт-1):** Добавляет 5 пунктов к Экранированию деки. Стоит 20% базовой цены деки.\n**Разгон ЦП (Ремонт-2):** Добавляет единицу к ЦП деки. Стоит 30% базовой цены деки.\n**Расширение Памяти (Ремонт-1):** Добавляет деке четыре единицы Памяти. Стоит 20% базовой цены деки.\n**Полиморфные алгоритмы взлома (Ремонт-1):** Добавляет единицу к Бонусу Доступа устройства, но отнимает единицу от её ЦП. Стоит 10% базовой цены деки.\n**Скелетный корпус (Ремонт-1):** Загруженность деки уменьшается на 1, но её Память получает штраф -2. Стоит 10% базовой цены деки.\n**Корпус с теплоотводом (Ремонт-2):** Загруженность деки увеличивается на 1, но и её ЦП тоже растёт на 1. Стоит 30% базовой цены деки."},
{"n":"3.8.0","l":2,"te":"Drones","tr":"Дроны","en":"Small wheeled, rotored, or even aquajet-driven drones are common tools for modern operatives.\nMost operators rely on man-portable drones that can be carried in packs or specially-designed harnesses. These portable drones require a Main Action to unpack and deploy before they can be commanded, in addition to any action necessary to get at a Stowed item.\nOnce a drone has been deployed, the user must bring it online and ready for command using a control board or a Remote Control Unit cybersystem. This takes both a Main and a Move action on the user’s part. Once it’s been brought up, the drone can be commanded until it’s packed again, which requires a Main Action.\nA controlled drone automatically relays audiovisual sensor data back to the control board or Remote Control Unit cyber being used to control it. A pilot can see and hear what their drones see and hear. Default sensors are as acute as normal human senses.\nFlying drones operate by means of rotors and directed thrust and can hover in place. Ground-based drones can navigate stairs and other obstacles that human legs could manage. The noise made during operation is no louder than speech.\nFlying drones have an operational altitude maximum of 1,000 meters, and all drones have a safe default control range of 1,000 meters. Beyond this range, control signal latency leaves them critically vulnerable to modern signal hijacking tech; all wireless hack or jamming attempts against them are automatically successful. Their theoretical maximum control range is 8,000 meters.\nDrones operate for one hour on a full battery charge. They do not have swappable batteries, and require one hour of charging per Encumbrance, or six hours at most.","ru":"Небольшие дроны — колёсные, винтовые или даже на водомётной тяге — обычный инструмент современного оперативника.\nБольшинство операторов полагаются на переносные дроны, которые можно нести в рюкзаке или в специальной подвесной системе. Такому переносному дрону нужно Основное действие, чтобы распаковать и развернуть его перед тем, как им можно будет командовать, — плюс любое действие, необходимое, чтобы достать предмет из укладки.\nКак только дрон развёрнут, пользователь должен вывести его в рабочий режим и подготовить к приёму команд с помощью пульта управления или кибер-системы Блок дистанционного управления. Это отнимает у пользователя и Основное действие, и Действие перемещения. Как только дрон поднят, им можно командовать, пока его снова не упакуют, — на это нужно Основное действие.\nУправляемый дрон автоматически передаёт аудиовизуальные данные сенсоров на пульт управления или на кибер Блок дистанционного управления, которым его ведут. Пилот видит и слышит то, что видят и слышат его дроны. Штатные сенсоры не острее обычных человеческих чувств.\nЛетающие дроны держатся на винтах и направленной тяге и умеют висеть на месте. Наземные дроны проходят лестницы и другие препятствия, посильные человеческим ногам. Шум при работе — не громче обычной речи.\nУ летающих дронов максимальная рабочая высота — 1000 метров, и у всех дронов безопасная стандартная дальность управления — 1000 метров. Дальше задержка сигнала управления делает их критически уязвимыми для современной техники перехвата: любые попытки беспроводного взлома или подавления против них автоматически успешны. Их теоретический максимум дальности управления — 8000 метров.\nДрон работает один час на полном заряде батареи. Батареи у них несменные, а заряжать нужно по часу на каждую единицу Загруженности, но не больше шести часов."},
{"n":"3.8.1","l":3,"te":"Common Drones","tr":"Обычные дроны","en":"Most drone statistics are self-explanatory; they have an Armor Class against both ranged and melee attacks, a Trauma Target against weapons capable of inflicting Traumatic Hits on it, a Move rate that is either ground-based, flying, or swimming, and a hit point total that can be depleted to destroy them.\nFittings indicates the maximum number of drone fittings that can be mounted on the drone.\nHardpoints are the number of ranged weapons that can be mounted on the drone. Drones with a base, unmodified Encumbrance of 3 or less can mount only pistol-sized weapons, while larger man-portable drones can mount rifle-sized ones. Non-portable drones can mount heavy weapons that the GM finds plausible. Melee weapons cannot be practically mounted on a drone, and swapping weapons takes a day in the shop.\nWeapons mounted on a hardpoint include one magazine of ammo. If more is needed, the Ammo Supply fitting is required.\n\n\nDrone                Cost                AC        TT        HP        Fit.        Move                Hrd.        Enc.\nMouse                $500                13        6        1        0        5m ground        0        1\nRoach                $1,000                13        6        8        3        10m ground        0        3\nHummingbird        $2,000                15        6        5        2        10m fly                0        3\nSunfish        $1,000                15        6        8        3        10m swim        0        3\nPitbull                $5,000                15        8        15        5        20m ground        1        5\nJavelin                $10,000        16        6        12        5        20m fly                1        6\nKerberos        $15,000        18        8        25        6        20m ground        3        -\nKraken                $10,000        16        8        20        5        15m swim        2        -\nShrike                $25,000        18        8        20        6        30m fly                2        -","ru":"Большинство характеристик дрона понятны без пояснений: у него есть Класс защиты против дальних и ближних атак, Порог травмы против оружия, способного нанести ему Травматичное попадание, скорость перемещения — по земле, в полёте или вплавь — и запас пунктов здоровья, который можно выбить, чтобы его уничтожить.\nОснастка показывает максимальное число единиц оснастки, которые можно смонтировать на дрон.\nПодвесы — количество единиц дальнобойного оружия, которое можно смонтировать на дрон. Дроны с базовой, немодифицированной Загруженностью 3 и меньше несут только оружие размером с пистолет, а более крупные переносные дроны — размером с винтовку. Непереносные дроны могут нести тяжёлое оружие, если Мастер считает это правдоподобным. Оружие ближнего боя на дрон толком не поставить, а смена оружия занимает день в мастерской.\nОружие на подвесе идёт с одним магазином патронов. Если нужно больше, потребуется оснастка Подача патронов.\n\n\n| Дрон | Цена | КЗщ | ПТ | ПЗ | Осн. | Скор. | Подв. | Загр. |\n|---|---|---|---|---|---|---|---|---|\n| Мышь | $500 | 13 | 6 | 1 | 0 | 5 м, земля | 0 | 1 |\n| Таракан | $1 000 | 13 | 6 | 8 | 3 | 10 м, земля | 0 | 3 |\n| Колибри | $2 000 | 15 | 6 | 5 | 2 | 10 м, полёт | 0 | 3 |\n| Луна-рыба | $1 000 | 15 | 6 | 8 | 3 | 10 м, вплавь | 0 | 3 |\n| Питбуль | $5 000 | 15 | 8 | 15 | 5 | 20 м, земля | 1 | 5 |\n| Дротик | $10 000 | 16 | 6 | 12 | 5 | 20 м, полёт | 1 | 6 |\n| Кербер | $15 000 | 18 | 8 | 25 | 6 | 20 м, земля | 3 | — |\n| Кракен | $10 000 | 16 | 8 | 20 | 5 | 15 м, вплавь | 2 | — |\n| Сорокопут | $25 000 | 18 | 8 | 20 | 6 | 30 м, полёт | 2 | — |"},
{"n":"3.8.2","l":3,"te":"Drone Mods","tr":"Моды дронов","en":"These mods require that the tinkerer have both Fix and Drive skill, as the adjustments require a keen understanding of their practical consequences on handling and operation.\nMods require upkeep and count against the tech’s Maintenance total. Unless specified otherwise, a given mod can only be applied once. Drone mods don’t need special components.\n\n\nAdditional Fitting (Fix-1 & Drive-1): Careful optimization of power lines and chassis reinforcement allows for adding an additional fitting to the drone. Man-portable drones add one point of Encumbrance, though this doesn’t affect their maximum hardpoint weapon size. The cost is 50% of the drone’s base cost.\nAdditional Hardpoint (Fix-1 & Drive-1): By rearranging wiring, adding mass, and overriding safety protocols, an additional hardpoint can be added to a drone. This mod adds one point of Encumbrance to portable drones, though this doesn’t affect their maximum weapon size. The cost is 50% of the drone’s base cost plus the weapon.\nBattery Swapping (Fix-1 & Drive-1): Replacing proprietary battery systems with off-the-shelf models allows man-portable drones to have their battery swapped with a minute of work. Backup batteries cost 10% of the drone’s base cost and count as Enc 1 items, and this mod itself costs 10% of the drone’s base cost.\nBoosted Engine (Fix-1 & Drive-2): The drone’s engines are tuned to optimize speed, increasing its Move rate by 10m. It costs 25% of the drone’s base cost.\nHeavy Plating (Fix-1 & Drive-2): Strategic armor reinforcement improves its base AC by 2, but decreases its Move rate by 5m. It also increases its effective Encumbrance by 1 if it’s man-portable. The cost is 25% of the drone’s base cost.\nQuick Launch (Fix-1 & Drive-2): A packed man-portable drone is modified to deploy itself as an On Turn action by its controller instead of a Main Action, even if it’s currently Stowed. The cost is 10% of the drone’s base cost.\nRedundant Systems (Fix-2 & Drive-2): Careful duplication of critical systems increases the drone’s hit points by 25% of its unmodified base score, rounded up. The extra mass increases the Encumbrance of man-portable drones by 1. The cost is 50% of the drone’s base cost.\nStripped Fittings (Fix-2 & Drive-1): Mass and power allocated to a man-portable drone’s fittings are removed. The drone’s maximum fitting total is decreased by 1 and its Encumbrance rating is reduced by 1, to a minimum of 1. The cost is 10% of the drone’s base cost.","ru":"Эти моды требуют, чтобы у умельца были и навык Ремонт, и навык Вождение: правки требуют ясного понимания того, как они скажутся на управляемости и работе аппарата.\nМоды требуют обслуживания и учитываются в Обслуживании техника. Если не сказано иначе, конкретный мод можно поставить только один раз. Модам дронов не нужны особые компоненты.\n\n\n**Дополнительная оснастка (Ремонт-1 и Вождение-1):** Аккуратная оптимизация силовых линий и усиление шасси позволяют добавить дрону ещё одну единицу оснастки. Переносные дроны получают один пункт Загруженности, но на максимальный размер оружия на подвесе это не влияет. Цена — 50% базовой стоимости дрона.\n**Дополнительный подвес (Ремонт-1 и Вождение-1):** Перекладка проводки, добавленная масса и отключённые протоколы безопасности позволяют добавить дрону ещё один подвес. Этот мод добавляет переносным дронам один пункт Загруженности, но на максимальный размер оружия это не влияет. Цена — 50% базовой стоимости дрона плюс само оружие.\n**Сменные батареи (Ремонт-1 и Вождение-1):** Замена проприетарных батарейных систем на ширпотребные позволяет менять батарею переносного дрона за минуту работы. Запасные батареи стоят 10% базовой цены дрона и считаются предметами с Загруженностью 1, а сам мод стоит 10% базовой цены дрона.\n**Форсированный двигатель (Ремонт-1 и Вождение-2):** Двигатели дрона настраивают на скорость, увеличивая его скорость перемещения на 10 м. Стоит 25% базовой цены дрона.\n**Тяжёлая обшивка (Ремонт-1 и Вождение-2):** Продуманное усиление брони поднимает базовый КЗщ на 2, но снижает скорость перемещения на 5 м. Ещё она увеличивает фактическую Загруженность на 1, если дрон переносной. Цена — 25% базовой стоимости дрона.\n**Быстрый запуск (Ремонт-1 и Вождение-2):** Упакованный переносной дрон переделывают так, чтобы он разворачивался сам по Действию в свой ход своего оператора, а не по Основному действию, — даже если лежит в укладке. Цена — 10% базовой стоимости дрона.\n**Дублирующие системы (Ремонт-2 и Вождение-2):** Аккуратное дублирование критичных систем повышает пункты здоровья дрона на 25% от немодифицированного базового значения, с округлением вверх. Лишняя масса увеличивает Загруженность переносных дронов на 1. Цена — 50% базовой стоимости дрона.\n**Урезанная оснастка (Ремонт-2 и Вождение-1):** С переносного дрона снимают массу и питание, отведённые под оснастку. Максимальное число единиц оснастки дрона уменьшается на 1, а его Загруженность снижается на 1, но не ниже 1. Цена — 10% базовой стоимости дрона."},
{"n":"3.8.3","l":3,"te":"Drone Fittings","tr":"Оснастка дронов","en":"Each of the fittings below counts as one choice against a given drone model’s maximum fittings. Prices for adding a fitting are given as a percentage of the drone's base cost. Most of these fittings can be installed only once on any given drone, though a few specifically allow multiple installations.\nDrone Fitting                        Cost\nAblative Code Buffer                10%\nAltitude Boost Unit                10%\nAmmo Caddy                        10%\nAmmo Supply                        10%\nAssisted Boost Burner        10%\nCargo Space                        20%\nCommand Deck/Follow        10%\nCommand Deck/Kill                25%\nCommand Deck/Patrol        10%\nCommand Deck/Watch        10%\nEmergency Evac Litter        25%\nEmissions Shielding                20%\nEnhanced Structure                25%\nExtended Range                25%\nGlider Grips                        20%\nImproved Armor                25%\nImproved Targeting Logic        20%\nLaser Comms        10%\nManipulator Tendrils                20%\nMemory Banks                10%\nNo Touch Web                        10%\nSleep Mode                        10%\nStealth Package                25%\nSuicide Charge                25%\nTelescopic Optics                20%\nThermal Optics                20%\nTrauma Response Suite        25%\nVoice Broadcast                10%\nWallcrawler                        20%\nWeapon Hardpoint                25%\n\n\nAblative Code Buffer: Numerous self-correcting backup circuits are wired in to delay any hostile hacking intrusions. The drone automatically succeeds on the first opposed skill check made against a hostile hacker in a given scene.\nAltitude Boost Unit: Most flying drones have an effective ceiling of 1,000 meters if there are no scramblers to lessen the effective control range. This unit increases a flying drone’s maximum altitude to 5,000 meters, making most effectively invisible to ordinary sight. Such height does, however, make it extremely conspicuous to aerial scanners used by city law enforcement and high-security corp buildings. The speed of their response will depend on the drone’s apparent threat.\nAmmo Caddy: A specialized form of cargo space, this drone is able to carry and dispense substantial amounts of ammunition to adjacent allies. It can hold up to 6 fully-loaded magazines in quick-release clips that can be grabbed as On Turn actions by an ally. The clips remain locked for strangers. This fitting can be taken up to once per two points of the drone’s Encumbrance, rounded up.\nAmmo Supply: An automated ammo feeder is added to the drone. Two full magazines are added to one mounted weapon’s allotment, or one magazine to two weapons. This fitting can be added more than once.\nAssisted Boost Burner: The drone is equipped with reactive chemical booster that can be ignited to give it a very brief burst of tremendous speed. When activated as a Move action, the burner launches the drone up to 500 meters in a straight line. The boost is not precise enough to use as an aimed weapon, but solid obstacles in front of the drone will suffer half the drone’s HP in damage and inflict all of theirs on the drone. The burner functions only once before it require a scene to regenerate its charge.\nCargo Space: Most drones are designed to carry only their own weight. This fitting upgrades engines and adds cargo mounts to the drone’s exterior; it can carry up to 3 points of Encumbrance now, but the drone’s own Encumbrance value is increased by one. Any additional cargo it carries is added to this burden, of course. Carried cargo is sealed within the drone and requires a Main Action to dig out.\nCommand Deck/Follow: The drone is equipped with minimal autonomous pursuit capabilities. As a Main Action, the drone can be ordered to follow a particular visible target at a given distance at either half or full speed. If half speed, it will use its Move action to follow, and full speed will use both Move and Main Actions. Following can be ended as an On Turn command.\nCommand Deck/Kill: The drone has autonomous attack routines wired into it. As a Main Action, it can be ordered to kill one specific visible target. If the target is in range of its weapons, it will use its Main Action to attack; if no additional fittings are added, its autonomous attacks have a total hit bonus of +2. The drone will not automatically move to follow or engage its target or otherwise position itself tactically unless directly piloted to do so or operating under the Follow command.\nCommand Deck/Patrol: As a Main Action, the drone can be ordered to autonomously move to one or more waypoints on whatever schedule the pilot wishes. The drone can also be ordered to loiter at a particular location until it gets an On Turn command to proceed to the next location.\nCommand Deck/Watch: The drone is equipped to monitor its surroundings autonomously and alert its pilot when something of interest is noticed. Its onboard intelligence is limited, however, and it can only handle about a sentence’s worth of specific orders or subjects to be watchful for. Putting a drone in Watch mode is a command that takes a Main Action.\nEmergency Evac Litter: Functioning only for ground-based drones of Enc 3 or greater, the drone is equipped with a retractable litter that can fit one human patient, along with manipulators sufficient to get a prone victim onto the litter with a Main Action. Onboard meds allow for remote Heal skill checks to stabilize a Mortally Wounded target, with one attempt allowed as part of the loading action. A loaded patient can’t be harmed until the drone is destroyed or opens the litter, but if the drone dies, the patient does too. As a Main Action, the drone can be ordered to autonomously take the patient to a particular location. As an On Turn action, an onboard transmitter can also place a call for medical assistance to a pre-arranged number.\nEmissions Shielding: The drone is designed to minimize its electromagnetic emissions and thermal signature. Skill checks to spot it with such sensors suffer a -2 penalty.\nEnhanced Structure: The drone’s maximum hit points increase by 25% of its unmodified base, rounded up. As with Improved Armor, this fitting is ineffective on drones that aren’t man-portable.\nExtended Range: The drone can now operate for two hours on a full battery charge.\nGlider Grips: Usable only by flying drones of Enc 3 size or greater, this fitting allows a human-sized mass to use the drone as a form of parachute-glider. As a Main Action, a user can leap off a high place after grabbing the drone and descend safely to the ground at a distance as far from the initial point as that point was above the ground. Similar weights can be sent safely to the ground in the same way.\nImproved Armor: The drone’s AC improves by 2, to a maximum of 18, but its Encumbrance rating increases by one. This fitting is ineffective on drones too big to have an Encumbrance rating; they need vehicle-grade armor upgrades.\nImproved Targeting Logic: This unit allows a skilled drone pilot to tweak the combat logic of its onboard weaponry. The drone’s attack gains a hit bonus equal to the pilot’s Drive or Program skill level when firing autonomously; no bonus is given if the pilot is in direct control.\nLaser Comms: This fitting provides both a set of universal transceiver plug-ins and a laser comm hub for the drone. Provided the PCs are in line of sight of the drone, normal radio-wave based comms can be switched to lasers, providing uncrackable, electromagnetically-inaudible communications within the group. Radio comms can still be used as needed.\nManipulator Tendrils: One set of manipulators is added to the drone, whether a mechanical claw, an articulated metal tendril, or some other device. With a Main Action command from the pilot, it can function as a single human hand with an effective Strength of 12, but it cannot effectively be used for an attack or to lift anything heavier than the drone itself. The fitting can carry things for short distances, but to haul weight any real distance the Cargo Space fitting is required. This fitting can be added more than once if a pair of “hands” are needed.\nMemory Banks: The drone has two units of cyberdeck Memory added to it. While this Memory can be used to store hacker programs or datafiles, it also has room to record up to a week of audiovisual data per unit used. This fitting can be added more than once.\nNo Touch Web: Most commonly installed on small ground drones, this web can be armed as a Main Action by the pilot. Until disarmed, any attempt to grab or pick up the drone automatically inflicts 2d6 non-lethal electrical damage on the grabber. This shock continues each round as long as the drone is held, with up to 5 discharges total before the battery must be recharged. The firm contact required makes it impractical to use the web as an offensive weapon.\nSleep Mode: Sleep mode can be enabled with a Main Action command or ended with an On Turn command. While in sleep mode, a drone cannot fly, move, or perform actions, but it will continue to communicate with the pilot and observe its surroundings. A day of sleep mode counts as ten minutes of ordinary operation for battery drain purposes.\nStealth Package: Usable only on drones of Enc 3 or smaller, this fitting adds color-changing drone sheathing, noise damping, and thermal sealing to the unit. It gains an effective Sneak-1 skill when operating autonomously, or a +2 bonus to Sneak checks when being directly piloted.\nSuicide Charge: With a Main Action command to detonate, the drone will explode, doing 3d6 damage to anyone within ten meters, with an Evasion save for half. Subjects behind solid cover further halve the damage. Drones reduced to zero hit points are too badly damaged to respond to detonation commands.\nTelescopic Optics: The drone can focus on objects up to one kilometer away with a visual acuity sufficient to read a newspaper. Integral low-light sensors allow it to see in all but total darkness.\nThermal Optics: The drone is equipped with IR optics that can see heat patterns. The drone can function adequately even in complete darkness and grants the pilot a +1 bonus to Notice skill checks where thermal imaging might be useful.\nTrauma Response Suite: An array of injectors, scalpels, sutures, and trauma chems are built into the drone, allowing it to function as a medkit and make Heal skill checks for a medically-competent pilot or an on-site doc in need of a kit. Such medical efforts require a Main Action from the pilot as usual, and flying drones apply a -2 penalty to the skill check due to their innate instability. Up to six pharmaceutical doses of the pilot’s choice can be loaded into the drone.\nVoice Broadcast: The pilot can speak through the drone or cause it to emit other noises at a volume loud enough to be heard clearly a hundred meters away.\nWallcrawler: Usable only on ground-based drones of Enc 3 or less, this fitting allows the drone to climb sheer surfaces at its normal movement rate, assuming the surface is sturdy enough to bear its weight. Most high-security buildings are constructed with veneers that defeat this fitting, but ordinary structures seldom have such measures.\nWeapon Hardpoint: Drones that are not factory-equipped with weapon hardpoints can have one worked in as an aftermarket addition. The usual hardpoint limits on maximum allowed weapon size still apply, however, and this fitting counts as two for purposes of the drone’s maximum fittings.","ru":"Каждая из перечисленных ниже единиц оснастки занимает один слот из максимума оснастки для конкретной модели дрона. Цены за установку оснастки даны в процентах от базовой стоимости дрона. Большинство этих единиц оснастки ставятся на один дрон только один раз, хотя некоторые прямо разрешают несколько установок.\n| Оснастка дрона | Цена |\n|---|---|\n| Абляционный кодовый буфер | 10% |\n| Блок набора высоты | 10% |\n| Патронный раздатчик | 10% |\n| Подача патронов | 10% |\n| Вспомогательный ускоритель | 10% |\n| Грузовой отсек | 20% |\n| Командный блок/Преследование | 10% |\n| Командный блок/Убить | 25% |\n| Командный блок/Патруль | 10% |\n| Командный блок/Наблюдение | 10% |\n| Носилки для экстренной эвакуации | 25% |\n| Экранирование излучений | 20% |\n| Усиленная конструкция | 25% |\n| Увеличенный запас хода | 25% |\n| Планерные рукояти | 20% |\n| Улучшенная броня | 25% |\n| Улучшенная логика прицеливания | 20% |\n| Лазерная связь | 10% |\n| Манипуляторные щупальца | 20% |\n| Банки Памяти | 10% |\n| Паутина неприкосновения | 10% |\n| Спящий режим | 10% |\n| Пакет скрытности | 25% |\n| Заряд самоуничтожения | 25% |\n| Телескопическая оптика | 20% |\n| Термооптика | 20% |\n| Комплекс травматологической помощи | 25% |\n| Голосовое вещание | 10% |\n| Ползущий по стенам | 20% |\n| Оружейный подвес | 25% |\n\n\n**Абляционный кодовый буфер:** В дрон вшито множество самокорректирующихся резервных схем, чтобы задержать любое враждебное хакерское вторжение. Дрон автоматически преуспевает в первой встречной проверке навыка против враждебного хакера в сцене.\n**Блок набора высоты:** У большинства летающих дронов рабочий потолок — 1000 метров, если нет глушилок, урезающих фактическую дальность управления. Этот блок поднимает максимальную высоту летающего дрона до 5000 метров, из-за чего большинство таких дронов становятся практически невидимыми для обычного глаза. Однако такая высота делает дрон крайне заметным для воздушных сканеров городских правоохранителей и корп-зданий с высокой охраной. Скорость их реакции зависит от того, насколько опасным выглядит дрон.\n**Патронный раздатчик:** Особая разновидность грузового отсека: дрон способен носить и выдавать стоящим вплотную союзникам солидный запас патронов. Он вмещает до 6 полностью снаряжённых магазинов в быстросъёмных зацепах, которые союзник может схватить Действием в свой ход. Для посторонних зацепы остаются запертыми. Эту оснастку можно взять один раз на каждые два пункта Загруженности дрона, с округлением вверх.\n**Подача патронов:** На дрон ставят автоматический податчик патронов. Одному смонтированному оружию добавляются два полных магазина, либо по одному магазину двум орудиям. Эту оснастку можно ставить больше одного раза.\n**Вспомогательный ускоритель:** Дрон оснащён реактивным химическим ускорителем, который можно поджечь, чтобы получить очень короткий рывок на огромной скорости. Активированный Действием перемещения, ускоритель швыряет дрон по прямой на дистанцию до 500 метров. Разгон недостаточно точен, чтобы бить им как прицельным оружием, но твёрдые препятствия перед дроном получат урон, равный половине его пунктов здоровья, и нанесут дрону весь свой. Ускоритель срабатывает лишь один раз, после чего ему нужна сцена, чтобы восстановить заряд.\n**Грузовой отсек:** Большинство дронов рассчитаны нести только собственный вес. Эта оснастка усиливает двигатели и добавляет на корпус грузовые крепления: теперь дрон несёт до 3 пунктов Загруженности, но его собственная Загруженность растёт на единицу. Любой перевозимый груз, разумеется, прибавляется к этой ноше. Груз запечатан внутри дрона, и чтобы его выковырять, нужно Основное действие.\n**Командный блок/Преследование:** Дрон оснащён минимальными возможностями автономного преследования. Основным действием дрону можно приказать следовать за конкретной видимой целью на заданной дистанции — на половинной или на полной скорости. На половинной он тратит на слежку своё Действие перемещения, на полной — и Действие перемещения, и Основное действие. Преследование можно прекратить командой в свой ход.\n**Командный блок/Убить:** В дрон вшиты автономные боевые процедуры. Основным действием ему можно приказать убить одну конкретную видимую цель. Если цель в пределах досягаемости его оружия, он тратит на атаку своё Основное действие; если дополнительной оснастки нет, суммарный бонус его автономных атак — +2. Дрон не станет сам двигаться за целью, сближаться с ней или иначе выгодно занимать позицию, если им не управляют напрямую или он не работает под командой Преследование.\n**Командный блок/Патруль:** Основным действием дрону можно приказать самостоятельно двигаться по одной или нескольким путевым точкам по любому расписанию, какое захочет пилот. Ещё дрону можно велеть болтаться в определённом месте, пока он не получит команду в свой ход двигаться к следующей точке.\n**Командный блок/Наблюдение:** Дрон оснащён так, чтобы самостоятельно следить за окружением и предупреждать пилота, когда заметит что-то интересное. Но бортовые мозги слабые: он держит примерно одно предложение конкретных приказов или объектов, за которыми нужно смотреть. Перевод дрона в режим Наблюдения — команда на Основное действие.\n**Носилки для экстренной эвакуации:** Работают только на наземных дронах с Загруженностью 3 и больше. Дрон оснащён складными носилками на одного человека и манипуляторами, которых хватает, чтобы Основным действием затащить на носилки лежащего пострадавшего. Бортовые медикаменты позволяют делать дистанционные проверки Медицины, чтобы стабилизировать смертельно раненного, и одна попытка входит в само действие погрузки. Погруженному пациенту нельзя навредить, пока дрон не уничтожат или он не откроет носилки, но если дрон погибнет — погибнет и пациент. Основным действием дрону можно приказать самостоятельно отвезти пациента в конкретное место. Действием в свой ход бортовой передатчик может ещё и вызвать медицинскую помощь по заранее оговорённому номеру.\n**Экранирование излучений:** Дрон сделан так, чтобы свести к минимуму электромагнитное излучение и тепловой след. Проверки навыка, чтобы засечь его такими сенсорами, получают штраф -2.\n**Усиленная конструкция:** Максимум пунктов здоровья дрона растёт на 25% от немодифицированного базового значения, с округлением вверх. Как и Улучшенная броня, эта оснастка бесполезна на дронах, которые не переносные.\n**Увеличенный запас хода:** Теперь дрон работает два часа на полном заряде батареи.\n**Планерные рукояти:** Доступны только летающим дронам с Загруженностью 3 и больше. Эта оснастка позволяет массе размером с человека использовать дрон как парашют-планер. Основным действием пользователь может, ухватившись за дрон, прыгнуть с высоты и благополучно спуститься на землю, отлетев от точки прыжка настолько же, насколько эта точка была над землёй. Похожие по весу грузы можно так же безопасно спускать вниз.\n**Улучшенная броня:** КЗщ дрона растёт на 2, максимум до 18, но его Загруженность увеличивается на единицу. Эта оснастка бесполезна на дронах, слишком больших, чтобы иметь Загруженность: им нужны броневые улучшения транспортного класса.\n**Улучшенная логика прицеливания:** Этот блок позволяет умелому пилоту подкрутить боевую логику бортового оружия. Атака дрона получает бонус к попаданию, равный уровню навыка Вождение или Программирование пилота, когда дрон стреляет автономно; при прямом управлении пилота бонуса нет.\n**Лазерная связь:** Эта оснастка даёт дрону и набор универсальных вставок-трансиверов, и лазерный узел связи. Если ПИ в прямой видимости дрона, обычную радиосвязь можно переключить на лазеры и получить внутри группы невзламываемую, электромагнитно неслышимую связь. Радиосвязью при нужде можно пользоваться и дальше.\n**Манипуляторные щупальца:** На дрон добавляют один набор манипуляторов — механическую клешню, сочленённое металлическое щупальце или другое устройство. По команде пилота Основным действием он работает как одна человеческая рука с фактической Силой 12, но им нельзя толком атаковать или поднять что-то тяжелее самого дрона. Эта оснастка может носить вещи на короткие расстояния, но чтобы тащить вес на сколько-нибудь серьёзное расстояние, нужен Грузовой отсек. Её можно ставить больше одного раза, если нужна пара «рук».\n**Банки Памяти:** Дрону добавляют две единицы Памяти кибердеки. Эта Память годится для хранения хакерских программ или файлов данных, но в ней же хватает места, чтобы записать до недели аудиовизуальных данных на каждую использованную единицу. Эту оснастку можно ставить больше одного раза.\n**Паутина неприкосновения:** Чаще всего её ставят на мелких наземных дронов. Пилот может активировать паутину Основным действием. Пока её не отключат, любая попытка схватить дрон или поднять его автоматически наносит хватающему 2d6 нелетального электрического урона. Разряд бьёт каждый раунд, пока дрон держат, всего до 5 разрядов, после чего батарею нужно перезарядить. Из-за необходимости плотного контакта использовать паутину как оружие нападения непрактично.\n**Спящий режим:** Спящий режим включают командой на Основное действие, а выключают командой в свой ход. В спящем режиме дрон не может летать, двигаться или совершать действия, но продолжает держать связь с пилотом и наблюдать за окружением. День в спящем режиме считается за десять минут обычной работы по расходу батареи.\n**Пакет скрытности:** Доступен только дронам с Загруженностью 3 и меньше. Эта оснастка добавляет аппарату меняющую цвет обшивку, гашение шума и тепловую изоляцию. Дрон получает фактический навык Скрытность-1 при автономной работе или +2 к проверкам Скрытности при прямом управлении.\n**Заряд самоуничтожения:** По команде на детонацию Основным действием дрон взрывается, нанося 3d6 урона всем в десяти метрах, со спасброском Уклонения на половину. Те, кто за твёрдым укрытием, делят урон ещё пополам. Дроны, сведённые до нуля пунктов здоровья, слишком разбиты, чтобы отзываться на команду детонации.\n**Телескопическая оптика:** Дрон способен наводиться на объекты в километре от него с остротой зрения, достаточной, чтобы прочитать газету. Встроенные сенсоры слабого света позволяют ему видеть везде, кроме полной темноты.\n**Термооптика:** Дрон оснащён ИК-оптикой, видящей тепловые картины. Дрон нормально работает даже в полной темноте и даёт пилоту +1 к проверкам Внимания там, где тепловизор может пригодиться.\n**Комплекс травматологической помощи:** В дрон встроен набор инъекторов, скальпелей, шовных материалов и противошоковой химии, позволяющий ему работать как медицинский набор и делать проверки Медицины за медицински грамотного пилота или за врача на месте, которому нужен набор. Такая медицина, как обычно, требует от пилота Основного действия, а летающие дроны дают штраф -2 к проверке навыка из-за врождённой неустойчивости. В дрон можно загрузить до шести доз фармацевтики на выбор пилота.\n**Голосовое вещание:** Пилот может говорить через дрон или заставить его издавать другие звуки на громкости, которую отчётливо слышно за сотню метров.\n**Ползущий по стенам:** Доступен только наземным дронам с Загруженностью 3 и меньше. Эта оснастка позволяет дрону лазить по гладким вертикальным поверхностям с обычной скоростью перемещения, если поверхность достаточно крепкая, чтобы держать его вес. Большинство зданий с высокой охраной облицованы так, что эта оснастка на них не работает, но у обычных строений таких мер почти никогда нет.\n**Оружейный подвес:** Дронам, не оснащённым оружейными подвесами с завода, можно врезать один задним числом. Обычные ограничения подвеса на максимальный размер оружия при этом сохраняются, а сама эта оснастка занимает два слота из максимума оснастки дрона."},
{"n":"3.8.4","l":3,"te":"Drone Operation","tr":"Управление дронами","en":"Operating a drone can be done either with the control board that comes with the drone or with a specialized Remote Control Unit cyber system. In both cases, at least Drive-0 skill is needed to operate drones effectively.\nA control board can command one drone at a time. The user suffers a -2 penalty on all hit rolls and skill checks made by the drone. If the user has a cranial jack and plugs into the board, this penalty is eliminated. A control board takes up 1 Encumbrance and must be Readied to use.\nA Remote Control Unit can command a number of drones at once equal to one plus the user’s Drive skill. It grants the user a bonus Move action each round that can only be used to command drones. If the user pushes the system and accepts a System Strain point, this bonus Move action is upgraded to a Main Action.\nDrones can be operated relatively securely at a distance of up to 1,000 meters, with flying drones having a maximum altitude of 1,000 meters as well. Beyond one kilometer, signal latency makes it trivially easy to hijack the control signal with modern wifi sniffers. Any hack or jamming attempt on a drone beyond this range is automatically successful. If the operator is willing to risk this, drones can function at a maximum range of 8,000 meters.","ru":"Управлять дроном можно либо пультом управления, который идёт с дроном, либо специализированной кибер-системой Блок дистанционного управления. В обоих случаях, чтобы толково управлять дронами, нужен хотя бы навык Вождение-0.\nПульт управления командует одним дроном за раз. Пользователь получает штраф -2 на все броски атаки и проверки навыков, которые делает дрон. Если у пользователя есть черепной разъём и он подключается к пульту, этот штраф снимается. Пульт управления занимает 1 Загруженности и должен быть в готовности, чтобы им пользоваться.\nБлок дистанционного управления командует одновременно числом дронов, равным единице плюс навык Вождение пользователя. Он даёт пользователю бонусное Действие перемещения каждый раунд, которое можно тратить только на команды дронам. Если пользователь продавит систему и примет пункт Системной нагрузки, это бонусное Действие перемещения повышается до Основного действия.\nДроны работают относительно безопасно на дистанции до 1000 метров, а летающие дроны — и на максимальной высоте 1000 метров. Дальше километра задержка сигнала делает перехват управляющего сигнала современными wifi-снифферами до смешного простым. Любая попытка взлома или подавления дрона за этой дистанцией автоматически успешна. Если оператор готов рискнуть, дроны работают на максимальной дистанции 8000 метров."},
{"n":"3.8.4.1","l":4,"te":"Controlling Drones","tr":"Пилотирование дронов","en":"Pilots use their own actions to drive their drones. If the pilot wants the drone to take a Move action, they need to spend a Move action piloting it in the desired direction. If they want it to fire its guns, they need to spend their own Main Action performing the attack.\nA drone under autonomous command, such as with the Command Deck/Kill fitting, can perform a maximum of one Main and one Move action per round, and will use those actions to carry out its last command. In case of conflicting autonomous imperatives, the latest one overrides earlier ones.\nAny attacks the drone makes are performed with the operator’s hit bonus plus the better of their Drive or Program skills, modified by Int or Dex. If the drone is autonomous, it usually has a native +2 bonus.\nAny skill checks the drone makes are performed with the operator’s skill level, up to a maximum of the pilot’s Drive skill. They may be a master infiltrator with Sneak-4, but if they’ve only got Drive-0 skill they can exert only Sneak-0 through the drone.\nDrones cut off from control by jamming or operator abandonment or incapacitation do nothing, not even performing autonomous commands. Flying drones automatically land where they are.","ru":"Пилоты тратят на управление своими дронами собственные действия. Если пилот хочет, чтобы дрон совершил Действие перемещения, ему нужно потратить своё Действие перемещения, ведя дрон в нужную сторону. Если он хочет, чтобы дрон стрелял, ему нужно потратить своё Основное действие на атаку.\nДрон под автономной командой — например, с оснасткой Командный блок/Убить — может совершать не больше одного Основного действия и одного Действия перемещения за раунд и потратит их на выполнение последней полученной команды. Если автономные приказы противоречат друг другу, поздний перекрывает ранние.\nЛюбые атаки дрона выполняются с бонусом атаки оператора плюс лучший из его навыков Вождение или Программирование, с модификатором от Инт или Лов. Если дрон автономен, у него обычно свой бонус +2.\nЛюбые проверки навыков дрон делает с уровнем навыка оператора, но не выше уровня навыка Вождение пилота. Пусть он мастер проникновения со Скрытностью-4 — если у него только Вождение-0, через дрон он выдаст лишь Скрытность-0.\nДроны, отрезанные от управления подавлением, брошенные оператором или оставшиеся без него из-за того, что он обездвижен, не делают ничего — даже автономные команды не выполняют. Летающие дроны автоматически садятся там, где были."},
{"n":"3.8.4.2","l":4,"te":"Common Drone Actions","tr":"Обычные действия дронов","en":"When in doubt, a GM can simply assign a drone action the same cost as they would the same action performed by a PC. However, some common actions have special cases for drones and are listed as such below.\nAttack (Main Action): The drone fires all of its onboard weapons, selecting targets for each individually. The pilot may direct one attack, adding their base attack bonus modified by Int or Dex and the better of their Drive or Program skills; all others fire at the drone’s usual attack bonus of +2.\nMove (Move Action): The drone moves its normal movement rate. Flying drones can hover, and ground drones can navigate rough terrain just as a human would, moving at half their usual rate. Prudent placement may grant a drone the benefits of cover or concealment, but they can’t go Prone.\nAssume Command (Main and Move Actions): A pilot who needs to assume command of one of their newly-deployed drones can do so by taking both a Main and Move action to shift the signal. Uncommanded drones remain inert and will not act autonomously. Dropping control to free up the pilot’s attention is an On Turn action.\nHalt Autonomous Mode (On Turn): An active autonomous command such as Kill or Follow can be stopped with this action, the drone doing nothing until a new command is issued.\nGrab a Drone (Main Action): Man-portable drones can be grabbed by assailants in melee range. This counts as a grappling attempt with a hit roll required, but the drone automatically fails any Exert skill checks to resist. A grappled drone is helpless while the grip is maintained.","ru":"Если есть сомнения, Мастер может просто назначить действию дрона ту же цену, что и такому же действию ПИ. Но у некоторых частых действий есть особые случаи для дронов, и они перечислены ниже.\n**Атака (Основное действие):** Дрон стреляет из всего бортового оружия, выбирая цель для каждого ствола отдельно. Пилот может лично направить одну атаку, добавляя свой базовый бонус атаки с модификатором от Инт или Лов и лучший из навыков Вождение или Программирование; все остальные стволы бьют с обычным бонусом атаки дрона +2.\n**Перемещение (Действие перемещения):** Дрон перемещается на свою обычную скорость. Летающие дроны могут висеть на месте, а наземные проходят пересечённую местность так же, как человек, — на половине обычной скорости. Разумная расстановка может дать дрону выгоду укрытия или маскировки, но лечь он не может.\n**Принять командование (Основное действие и Действие перемещения):** Пилот, которому нужно принять командование одним из своих только что развёрнутых дронов, делает это, потратив и Основное действие, и Действие перемещения на перевод сигнала. Дроны без команды остаются недвижимы и автономно действовать не будут. Сбросить управление, чтобы освободить внимание пилота, — Действие в свой ход.\n**Прервать автономный режим (Действие в свой ход):** Активную автономную команду вроде Убить или Преследование можно остановить этим действием, и дрон не делает ничего, пока не получит новую команду.\n**Схватить дрон (Основное действие):** Переносные дроны противник может схватить на дистанции ближнего боя. Это считается попыткой захвата с броском атаки, но дрон автоматически проваливает любые проверки Атлетики на сопротивление. Дрон в захвате беспомощен, пока хватку держат."},
{"n":"3.8.4.3","l":4,"te":"Drone Damage and Repair","tr":"Повреждения и ремонт дронов","en":"A drone reduced to zero hit points has been destroyed, and cannot be repaired. Any cargo it might have been carrying has almost certainly been smashed as well.\nRepairing a portable drone requires a suitable toolkit, Fix-0 skill, and a supply of spare parts. Non-portable drones require a full workshop. Repairs take one hour of work.\nSpare parts for a drone cost 25% of the drone’s base cost. As manufacturers make a point of not building cross-compatible components, each model of drone requires its own supply of parts. These parts are sufficient to repair any reasonable amount of damage, though more than one or two full rebuilds may cause the GM to rule that they’ve run out.\nSpare parts for a portable drone take up 3 Encumbrance. Parts for a non-portable drone are too bulky to be reasonably man-portable.","ru":"Дрон, сведённый до нуля пунктов здоровья, уничтожен и ремонту не подлежит. Любой груз, который он вёз, почти наверняка разбит вместе с ним.\nРемонт переносного дрона требует подходящего набора инструментов, навыка Ремонт-0 и запаса запчастей. Непереносным дронам нужна полноценная мастерская. Ремонт занимает час работы.\nЗапчасти для дрона стоят 25% базовой цены дрона. Производители старательно не делают детали совместимыми между моделями, так что каждой модели дрона нужен свой запас запчастей. Этих запчастей хватает на ремонт любого разумного объёма повреждений, хотя после одной-двух полных сборок с нуля Мастер может решить, что они вышли.\nЗапчасти для переносного дрона занимают 3 Загруженности. Запчасти для непереносного дрона слишком громоздки, чтобы их разумно нести на себе."},
{"n":"3.9.0","l":2,"te":"Vehicles","tr":"Транспорт","en":"A fast set of wheels is necessary for many missions. The vehicles below are a selection of some of the more common options in a city.\nA vehicle’s qualities are measured by certain statistics. Some are self-explanatory, such as the Hit Points of damage it can take before being rendered inoperable or the Armor Class that must be hit with a melee or ranged weapon in order to damage it.\nSpeed is a combination of the vehicle’s overall speed, maneuverability, and capability for handling bad terrain. It’s added to any vehicle-related skill checks the driver might make with it.\nArmor indicates the vehicle’s general toughness and resistance to damage, as explained in the vehicle combat rules.\nTrauma Target is the vehicle’s target number for Trauma Die rolls by weapons capable of inflicting Traumatic Hits on such a vehicle.\nCrew is the maximum number of people the vehicle is intended to carry, including the driver. More might be wedged into a truck bed or strapped to a roof rack, but they are very likely to be thrown free during sharp maneuvers.\nPower and Mass measure the amount of additional fittings that can be mounted on the vehicle. Added hardware takes up electrical and computing Power, and it can’t be fitted without enough free Mass.\nSize is the general size class of the vehicle, whether small-sized like a motorcycle, medium like a car, small helicopter, or SUV, or large like a flatbed truck or tank. Some vehicle fittings can only be installed on vehicles of a certain size or larger.\nHardpoints are the number of Heavy weapons the vehicle can mount in its factory configuration. Vehicle combat is detailed in its own section, but every gun requires a gunner, and even a jacked-in driver is hard-pressed to shoot and drive at the same time.\n\n\nVehicle                Cost        Spd        Arm.        TT        AC        HP        Crew        Pow.        Mass        Size        Hrd.\nMotorcycle        $1K        1        4        10        13        10        1        1        3        S        0\nMicro Flyer        $3K        0        0        6        13        10        1        1        4        S        0\nCar                $5K        0        6        12        11        30        5        3        7        M        1\nTruck                $7.5K        0        6        12        11        35        2        3        14        L        1\nHelicopter        $50K        3        6        10        14        20        6        4        9        M        1\nTank                $500K@ 0        **        12        18        40        3        8        15        L        3\nAPC                $60K@ -1        *        10        16        30        16        5        14        L        1\nGEV                $100K@ 1        *        10        16        30        3        6        10        L        2\nCASRA        $200K@ 2        10        10        18        35        2        7        10        L        2\nDropcraft        $1M@        3        12        12        16        40        13        8        12        L        2\n@: This vehicle cannot be obtained without a suitable Contact or related adventure\n*: This vehicle is immune to anything short of a Heavy weapon or one that can inflict Traumatic Hits on vehicles.\n**: This vehicle is immune to anything the GM thinks could not reasonably harm the tank in question. It can suffer Traumatic Hits from a weapon if the GM thinks it reasonable for the weapon and circumstances.\n\n\nMotorcycle: Fast, cheap, and nimble, both gangers and operators find these vehicles handy for making escapes down alleys and over terrain that larger vehicles can’t navigate.\nMicrolight Flyer: One of a class of featherlight aircraft, a flyer is woven of the lightest, thinnest, strongest materials available at its price point, and can provide cheap aerial recon or transit over rough terrain for its single occupant. Such flyers are light enough to be broken down into components that can be easily transported by a pickup truck.\nCar: An urban luxury, private cars are for the middle class and better, or those rough-edged slum entrepreneurs who are clever enough to keep some salvaged hulk running. This vehicle class also includes small pickup trucks and SUVs.\nTruck: More commonly found among corp employees, these flatbed trucks, delivery vans, panel vans, and other large work vehicles earn their keep in a hundred ways each day.\nHelicopter: A typical civilian helicopter, used for elite transit between city districts or the quick dispatch of personnel to some hotspot. Their ability to weave through the obstacles of urban high-rises is sometimes valuable when evading hostile pursuit.\nTank: A military classic, this model is relatively low-tech but more than enough to deal with any civilian vehicle. Tanks are seldom found in urban areas without a protective screen of infantry to keep hostiles with demo charges or rocket launchers from getting uncomfortable close.\nAPC: Armored personnel carriers are often custom-built for city law enforcement, the better to dump a squad of cops where they’re most needed. The mounted weapon on most of them helps pacify a hot zone before the occupants dismount.\nGEV: Ground effect vehicles have evolved considerably from their 20th-century ancestors, and their armored pneumatic skirts and high-efficiency engines can send them over terrain that might defeat a tracked tank. The sacrifice in armor weight is generally deemed acceptable, given the usual opposition these vehicles face.\nCASRA: The “Close Air Support Rotorwing Aircraft” of corporate R&D comes in a half-dozen different configurations, from multirotor helicopters to rotor-in-wing strike craft. Light and vicious, they’re favored by city SWAT teams who need military-grade firepower capable of maneuvering through city airspace. When a CASRA shows up, minigun rounds are seldom far behind.\nDropcraft: One of a family of armored military air transports, dropcraft are used when a squad needs to be inserted under heavy fire. Thick armor, a heavy gun, and VTOL engines combine with considerable loitering ability to make an excellent tool for pacifying corporate enemies.","ru":"Для многих миссий нужны быстрые колёса. Ниже — подборка самых распространённых в городе вариантов.\nКачества машины описываются набором показателей. Часть из них говорит сама за себя: например, пункты здоровья — урон, который машина держит, прежде чем выйти из строя, или Класс защиты — то, что надо превысить атакой в ближнем бою или на расстоянии, чтобы её повредить.\nСкорость объединяет общую быстроту машины, её управляемость и способность идти по плохой местности. Она добавляется к любым проверкам навыков, связанным с транспортом, которые делает водитель.\nБроня показывает общую крепость машины и её сопротивление урону — как описано в правилах транспортного боя.\nПорог травмы — это порог машины для броска Кости травмы оружием, способным наносить Травматичные попадания такому транспорту.\nЭкипаж — максимальное число людей, на которое рассчитана машина, включая водителя. Можно втиснуть ещё кого-то в кузов грузовика или пристегнуть к багажнику на крыше, но на резких манёврах их почти наверняка вышвырнет.\nМощность и Масса показывают, сколько дополнительной оснастки можно поставить на машину. Навешенное железо жрёт электрическую и вычислительную Мощность, и его нельзя установить, если не хватает свободной Массы.\nРазмер — общий класс габаритов машины: малый, как мотоцикл, средний, как автомобиль, малый вертолёт или внедорожник, или большой, как бортовой грузовик или танк. Часть транспортной оснастки ставится только на машины определённого размера или крупнее.\nПодвесы — число единиц Тяжёлого оружия, которое машина несёт в заводской конфигурации. Транспортному бою отведён отдельный раздел, но каждой пушке нужен стрелок, и даже подключённому водителю тяжело одновременно стрелять и вести машину.\n\n\n| Транспорт | Цена | Скор. | Броня | ПТ | КЗщ | ПЗ | Экипаж | Мощн. | Масса | Разм. | Подв. |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| Мотоцикл | $1 тыс. | 1 | 4 | 10 | 13 | 10 | 1 | 1 | 3 | Мал. | 0 |\n| Микролёт | $3 тыс. | 0 | 0 | 6 | 13 | 10 | 1 | 1 | 4 | Мал. | 0 |\n| Автомобиль | $5 тыс. | 0 | 6 | 12 | 11 | 30 | 5 | 3 | 7 | Сред. | 1 |\n| Грузовик | $7,5 тыс. | 0 | 6 | 12 | 11 | 35 | 2 | 3 | 14 | Бол. | 1 |\n| Вертолёт | $50 тыс. | 3 | 6 | 10 | 14 | 20 | 6 | 4 | 9 | Сред. | 1 |\n| Танк | $500 тыс.@ | 0 | ** | 12 | 18 | 40 | 3 | 8 | 15 | Бол. | 3 |\n| БТР | $60 тыс.@ | -1 | * | 10 | 16 | 30 | 16 | 5 | 14 | Бол. | 1 |\n| АВП | $100 тыс.@ | 1 | * | 10 | 16 | 30 | 3 | 6 | 10 | Бол. | 2 |\n| ВШНП | $200 тыс.@ | 2 | 10 | 10 | 18 | 35 | 2 | 7 | 10 | Бол. | 2 |\n| Десантолёт | $1 млн@ | 3 | 12 | 12 | 16 | 40 | 13 | 8 | 12 | Бол. | 2 |\n\n@: Эту машину не достать без подходящего Контакта или связанного с ней приключения\n*: Эта машина неуязвима для всего, кроме Тяжёлого оружия или оружия, способного наносить Травматичные попадания транспорту.\n**: Эта машина неуязвима для всего, что, по мнению Мастера, не могло бы разумно повредить данному танку. Она может получить Травматичное попадание от оружия, если Мастер считает это разумным для такого оружия и таких обстоятельств.\n\n\n**Мотоцикл:** Быстрый, дешёвый и вёрткий — и бандиты, и операторы находят такие машины удобными, чтобы уходить по подворотням и по местности, где крупному транспорту не пройти.\n**Микролёт:** Один из класса сверхлёгких летательных аппаратов: сплетён из самых лёгких, тонких и прочных материалов, какие доступны за эти деньги, и обеспечивает единственному пассажиру дешёвую воздушную разведку или перелёт над трудной местностью. Такие аппараты достаточно легки, чтобы разобрать их на части и без труда перевезти в пикапе.\n**Автомобиль:** Городская роскошь: личные машины — для среднего класса и выше или для тех шершавых предпринимателей из трущоб, кто достаточно ловок, чтобы поддерживать в рабочем состоянии какой-нибудь выкопанный из свалки корпус. К этому классу относятся также малые пикапы и внедорожники.\n**Грузовик:** Чаще встречается у корп-сотрудников: бортовые грузовики, развозные фургоны, панельные фургоны и прочий крупный рабочий транспорт сотней способов в день отрабатывают своё содержание.\n**Вертолёт:** Типичная гражданская вертушка, используется для элитных перелётов между районами города или быстрой отправки людей в какую-нибудь горячую точку. Умение петлять между препятствиями городских высоток иногда очень пригождается при уходе от погони.\n**Танк:** Военная классика: модель относительно низкотехнологичная, но с лихвой достаточная, чтобы разобраться с любым гражданским транспортом. Танки редко появляются в городе без прикрытия пехоты, которая не даёт врагам с подрывными зарядами или ракетными установками подойти неприятно близко.\n**БТР:** Бронетранспортёры часто строят на заказ для городских правоохранителей — так удобнее вывалить отряд копов там, где они нужнее всего. Установленное на большинстве из них оружие помогает утихомирить горячую зону до того, как десант высадится.\n**АВП:** Аппараты на воздушной подушке заметно ушли вперёд от своих предков из XX века: их бронированные пневматические юбки и высокоэффективные двигатели проносят их по местности, которая застопорила бы гусеничный танк. Жертвой становится вес брони, но это обычно считают приемлемым, учитывая, против кого такие машины обычно работают.\n**ВШНП:** «Винтокрылый штурмовик непосредственной поддержки» из корпоративных лабораторий выпускается в полудюжине конфигураций — от многовинтовых вертолётов до штурмовиков с винтом в крыле. Лёгкие и злые, они в почёте у городских спецназов, которым нужна огневая мощь армейского уровня, способная маневрировать в городском воздушном пространстве. Если появился ВШНП, минигунные очереди обычно не заставляют себя ждать.\n**Десантолёт:** Один из семейства бронированных военных воздушных транспортов; десантолёты применяют, когда отряд надо высадить под плотным огнём. Толстая броня, тяжёлая пушка и двигатели вертикального взлёта вместе с солидным запасом времени барражирования делают из него отличный инструмент для усмирения врагов корпорации."},
{"n":"3.9.1","l":3,"te":"Repairing and Running Vehicles","tr":"Ремонт и содержание транспорта","en":"Fixing a vehicle requires a Tool Rack fitting or a suitable workshop. A bike might be repaired on a sidewalk, but an APC is going to need heavier equipment.\nVehicles that have been reduced to zero hit points have been totaled and cannot be cost-effectively repaired. Lesser damage can be repaired at a rate of 1 point per day, plus the technician’s Fix skill and Drive skill. A would-be repairman must have at least Fix-0 or Drive-1 skill to repair a damaged vehicle.\nAn Ace Driver or Roamer pays nothing to repair vehicles, being able to scrounge free parts here and there. Others need to pay $200 per vehicle hit point repaired.\nA vehicle’s fuel and maintenance costs are generally minor, and can usually be ignored. If the PCs are going to be spending long periods of time away from gas stations, however, a GM is justified in making them take some measures to ensure a fuel supply","ru":"Чтобы починить машину, нужна оснастка «Стойка с инструментами» или подходящая мастерская. Байк можно отремонтировать и на тротуаре, а вот БТР потребует техники посерьёзнее.\nМашина, сведённая до нуля пунктов здоровья, разбита в утиль и не может быть отремонтирована с разумными затратами. Меньший урон восстанавливается со скоростью 1 пункт в день плюс уровни навыков Ремонт и Вождение техника. Чтобы ремонтировать повреждённый транспорт, нужен как минимум Ремонт-0 или Вождение-1.\nАс за рулём или Скиталец не платят за ремонт машин ничего — они умеют выцарапывать бесплатные запчасти там и тут. Остальным надо платить $200 за каждый восстановленный пункт здоровья транспорта.\nРасходы на топливо и обслуживание машины обычно незначительны, и их можно не учитывать. Но если ПИ надолго уезжают туда, где нет заправок, Мастер вправе заставить их как-то позаботиться о запасе горючего"},
{"n":"3.9.2","l":3,"te":"Vehicle Fittings","tr":"Оснастка транспорта","en":"To add a fitting, the vehicle must have enough free Power and Mass to support it; a bike with 1 Power and 3 Mass can’t mount more than 1 total Power and 3 total Mass of fittings. It must also be of an adequate minimum size to support the fitting.\nInstalling or removing a fitting usually takes a day or two of work in a suitably-equipped shop. The price for such work is included in the fitting cost. A given fitting can normally be added only once.\n\n\nFitting                                Cost                Pow.        Mass        Min. Size\nAdvanced Sensors                $8,000                1        0        S\nAfterburners                        $5,000                1        2        S\nArmor Plating                        $5,000                0        3        S\nCargo Space                        None                0        1        S\nCrash Pod                        $2,500                0        2        M\nECM Emitter                        $10,000        2        0        M\nEmissions Cloaking                $10,000        1        2        S\nExtra Durability                $5,000                0        4        M\nExtra Passengers                $2,500                0        2        S\nField Portable                        $1,000                0        2        S\nGhost Driver                        $2,500                1        1        S\nHardpoint Support                $5,000                1        1        M\nJack Control Port                $5,000                2        0        S\nLimpet Mount                        $5K/$10K        0        3 or 6        M\nLiving Quarters                $8,000                0        4        L\nMedbay                        $10,000        1        2        M\nOffroad Package                $5,000                1        3        L\nPower System, Small                $1,000                +2        2        S\nPower System, Medium        $5,000                +4        3        M\nPower System, Large                $10,000        +8        5        L\nSealed Atmosphere                $5,000                1        1        M\nSmuggler’s Hold                $1,000                0        1        S\nTargeting Board                $2,500                1        1        M\nTool Rack                        $2,500                0        2        M\n\n\nAdvanced Sensors: The vehicle is equipped with night vision, infrared sensors, and short-range radar good up to twenty kilometers of airspace. It can be driven safely even in pitch darkness.\nAfterburners: Once per scene, as an On Turn action, boost the vehicle’s Speed by 1 for five rounds.\nArmor Plating: Increase the vehicle’s Armor rating by 3 points. Medium vehicles can apply this fitting twice, and Large ones can apply it three times.\nCargo Space: This fitting can be taken multiple times. Each time it adds 50 kg of protected cargo space for Small vehicles, 500 kg for Medium ones, and 2 metric tons for Large ones.\nCrash Pod: If the vehicle crashes, the occupants can each reroll one failed crash save. If they make any of their saves, their HP can’t be reduced below 1 point by the crash.\nECM Emitter: On a successful hit roll by a headshot pod, rocket launcher, or other long-range guided projectile, the driver can make an opposed Int or Dex/Drive skill check against the attacker’s combat skill. On a success, the attacker must reroll their hit roll and take the worst result.\nEmissions Cloaking: Once per day, for one hour, the vehicle can become almost invisible to infrared or radar. This cloak becomes useless if the vehicle is visually spotted by defenders.\nExtra Durability: The vehicle’s maximum hit points increase by 25%, rounded up.\nExtra Passengers: Small vehicles add 1 Crew, Medium ones add 2, and Large ones add 4. This fitting can be taken multiple times, and any vehicle amenities such as crash pods or living quarters extend to these additional Crew as well.\nField Portable: Only Small or Medium vehicles can take this option, allowing them to be broken down into easily-portable parts packages. Small vehicles turn into 30 items of Encumbrance and Medium ones into 150. Disassembly takes 30 minutes for a Small vehicle and 3 hours for a Medium one, with reassembly taking four times as long.\nGhost Driver: The driver can order the vehicle directly or by radio or phone to go to particular places at particular times or perform other simple, direct actions on a given schedule. The onboard expert system can handle traffic-related challenges, but has no real intelligence to process more complicated problems.\nHardpoint Support: Additional power and structural support enable the addition of a hardpoint.\nJack Control Port: The vehicle is wired to be controlled through a plugged-in cranial jack as well as a conventional wheel. While jacked in, the driver need only use a Move Action to control the vehicle rather than a Main Action.\nLimpet Mount: An entire second vehicle can be mounted with this fitting, Medium vehicles taking Small parasites and Large ones taking Small or Medium. Adding a mount for a Small vehicle takes up 3 Mass while a Medium one takes 6. Modifying a vehicle to be mounted adds 10% to its base cost, but it can be launched even while the parent vehicle is underway. These parasite vehicles are destroyed if the parent is; otherwise, they take only half the damage the parent takes.\nLiving Quarters: Basic, cramped quarters are provided for sleeping, sanitation, and cooking for all crew. Permanent living in a vehicle costs and counts as a slum lifestyle, though occupants with the Ace Driver or Roamer Focus can treat it as middle-class for the same price.\nMedbay: Surgical tools and medical support are provided for up to one critically-injured patient at a time. A medbay counts as an emergency clinic for purposes of treating Major Injuries, if someone with at least Heal-0 is available to tend to the patient.\nOffroad Package: While any modern vehicle can handle abandoned roads and mostly-flat terrain, this package includes winches, tire armor, chassis reinforcement, and other upgrades needed to go through all but the most impassible terrain.\nPower Systems: These fittings add extra Power in battery capacity and computing support at the cost of an additional Mass burden.\nSealed Atmosphere: For up to two hours per day the vehicle can seal itself entirely from the outside atmosphere, with internal air tanks and positive pressure to keep out external toxins. At all times it can maintain a comfortable interior temperature in any terrestrial climate. Aircraft do not need this fitting to function normally at high altitudes.\nSmuggler’s Hold: This fitting can be taken more than once, and adds 10 kg of concealed cargo space in Small vehicles, 100 kg in Medium ones, and 400 kg in Large ones. It can be detected only by taking the vehicle apart or by an acute, careful inspection with a difficulty 12 Wis/Notice or Wis/Drive skill check.\nTargeting Board: A single unified targeting board allows one gunner to manage up to three vehicle weapons instead of the one gun per gunner that would usually be allowed.\nTool Rack: Any vehicle can carry a toolkit in the trunk, but this rack is equipped with welders, heavy tooling, winches, and room for up 40 HP worth of spare parts. It can repair any vehicle and can be used as a makeshift workshop for related efforts.","ru":"Чтобы добавить оснастку, у машины должно хватать свободных Мощности и Массы: байк с 1 Мощности и 3 Массы не унесёт больше чем 1 суммарной Мощности и 3 суммарной Массы оснастки. Кроме того, машина должна быть не меньше минимального размера для этой оснастки.\nУстановка или снятие оснастки обычно занимает день-два работы в подходяще оборудованной мастерской. Стоимость этой работы уже включена в цену оснастки. Одну и ту же оснастку обычно можно поставить только один раз.\n\n\n| Оснастка | Цена | Мощн. | Масса | Мин. разм. | Эффект |\n|---|---|---|---|---|---|\n| Продвинутые сенсоры | $8 000 | 1 | 0 | Мал. | Ночное видение и не только |\n| Форсаж | $5 000 | 1 | 2 | Мал. | Кратко поднимает Скорость в бою |\n| Броневые плиты | $5 000 | 0 | 3 | Мал. | Добавляет машине броню |\n| Грузовой отсек | Нет | 0 | 1 | Мал. | Защищённое место под груз |\n| Аварийная капсула | $2 500 | 0 | 2 | Сред. | Защищает при аварии |\n| Излучатель РЭБ | $10 000 | 2 | 0 | Сред. | Глушит подлетающие ракеты |\n| Маскировка излучений | $10 000 | 1 | 2 | Мал. | Почти невидим для радара и термооптики |\n| Повышенная прочность | $5 000 | 0 | 4 | Сред. | Увеличивает максимум пунктов здоровья на 25% |\n| Дополнительные места | $2 500 | 0 | 2 | Мал. | Добавляет места в Экипаже |\n| Разборный корпус | $1 000 | 0 | 2 | Мал. | Разбирается на переносимые части |\n| Призрачный водитель | $2 500 | 1 | 1 | Мал. | Ограниченный ИИ-автопилот |\n| Опора для подвеса | $5 000 | 1 | 1 | Сред. | Добавляет ещё один подвес |\n| Порт управления через разъём | $5 000 | 2 | 0 | Мал. | Вождение через черепной разъём |\n| Крепление-прилипала | $5 тыс./$10 тыс. | 0 | 3 или 6 | Сред. | Несёт на себе машину поменьше |\n| Жилой отсек | $8 000 | 0 | 4 | Бол. | Тесное, но пригодное жильё |\n| Медотсек | $10 000 | 1 | 2 | Сред. | Экстренный отсек на одного пациента |\n| Внедорожный пакет | $5 000 | 1 | 3 | Бол. | Позволяет работать в глухой дикости |\n| Энергосистема, малая | $1 000 | +2 | 2 | Мал. | Добавляет Мощность за счёт Массы |\n| Энергосистема, средняя | $5 000 | +4 | 3 | Сред. | Добавляет Мощность за счёт Массы |\n| Энергосистема, большая | $10 000 | +8 | 5 | Бол. | Добавляет Мощность за счёт Массы |\n| Герметизация | $5 000 | 1 | 1 | Сред. | Салон под давлением, с контролем температуры |\n| Контрабандный тайник | $1 000 | 0 | 1 | Мал. | Скрытое место под груз |\n| Пульт наведения | $2 500 | 1 | 1 | Сред. | Один стрелок ведёт до трёх орудий |\n| Стойка с инструментами | $2 500 | 0 | 2 | Сред. | Позволяет ремонтировать машину
